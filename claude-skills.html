<!DOCTYPE html>
<html lang="en">
<head>

    <title>Claude Skills Hub | Amr Sabry</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>

        @keyframes scanBeam { 0% { top: -4px; opacity: 0; } 5% { opacity: 1; } 95% { opacity: 1; } 100% { top: 100%; opacity: 0; } }
        .tick { position: fixed; z-index: 10; width: 14px; height: 14px; pointer-events: none; }
        .tick::before, .tick::after { content: ''; position: absolute; background: rgba(255,107,0,0.3); }
        .tick-tl { top: 18px; left: 18px; } .tick-tl::before { width: 100%; height: 1px; } .tick-tl::after { width: 1px; height: 100%; }
        .tick-br { bottom: 18px; right: 18px; } .tick-br::before { bottom: 0; right: 0; width: 100%; height: 1px; } .tick-br::after { bottom: 0; right: 0; width: 1px; height: 100%; }

        /* ── LOGIN SCREEN ── */
        #login-screen { position: fixed; inset: 0; z-index: 200; background: #06060e; display: flex; align-items: center; justify-content: center; transition: opacity 0.5s, visibility 0.5s; }
        #login-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .login-box { width: 380px; padding: 48px 36px; border: 1px solid rgba(255,107,0,0.15); border-radius: 16px; background: rgba(255,255,255,0.02); backdrop-filter: blur(20px); text-align: center; position: relative; overflow: hidden; }
        .login-box::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, #FF6B00, transparent); }
        .login-logo { font-family: 'Orbitron', sans-serif; font-size: 1.6rem; font-weight: 900; letter-spacing: 4px; color: #FF6B00; text-shadow: 0 0 30px rgba(255,107,0,0.3); margin-bottom: 6px; }
        .login-sub { font-size: 0.6rem; letter-spacing: 3px; opacity: 0.35; text-transform: uppercase; margin-bottom: 36px; }
        .login-field { width: 100%; padding: 14px 16px; margin-bottom: 14px; border: 1px solid rgba(255,107,0,0.15); border-radius: 8px; background: rgba(255,255,255,0.03); color: #c8c8e0; font-family: 'Space Mono', monospace; font-size: 0.8rem; outline: none; transition: border-color 0.3s; }
        .login-field:focus { border-color: rgba(255,107,0,0.4); }
        .login-field::placeholder { color: rgba(200,200,224,0.25); }
        .login-btn { width: 100%; padding: 14px; margin-top: 8px; border: 1px solid rgba(255,107,0,0.3); border-radius: 8px; background: rgba(255,107,0,0.1); color: #FF6B00; font-family: 'Orbitron', sans-serif; font-size: 0.75rem; letter-spacing: 3px; cursor: pointer; transition: all 0.3s; text-transform: uppercase; }
        .login-btn:hover { background: rgba(255,107,0,0.2); box-shadow: 0 0 30px rgba(255,107,0,0.15); }
        .login-error { color: #ff4444; font-size: 0.7rem; margin-top: 12px; opacity: 0; transition: opacity 0.3s; }
        .login-error.show { opacity: 1; }
        @keyframes shake { 0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-8px); } 40%,80% { transform: translateX(8px); } }
        .shake { animation: shake 0.4s ease; }

        /* ── MAIN APP (hidden until login) ── */
        #app { display: none; }
        #app.visible { display: block; }

        /* ── HEADER ── */
        .header { padding: 20px 32px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 40; background: rgba(6,6,14,0.9); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,107,0,0.1); }
        .brand-name { font-family: 'Orbitron', sans-serif; font-size: 1rem; font-weight: 900; letter-spacing: 5px; text-transform: uppercase; color: #FF6B00; text-shadow: 0 0 18px rgba(255,107,0,0.35); text-decoration: none; }
        .brand-name:hover { opacity: 0.8; }
        .header-right { display: flex; align-items: center; gap: 16px; }
        .header-badge { font-family: 'Orbitron', sans-serif; font-size: 0.55rem; letter-spacing: 3px; color: rgba(255,107,0,0.5); text-transform: uppercase; }
        .logout-btn { background: none; border: 1px solid rgba(255,107,0,0.2); border-radius: 6px; color: rgba(255,107,0,0.4); font-size: 0.6rem; padding: 5px 10px; cursor: pointer; font-family: 'Space Mono', monospace; transition: all 0.3s; }
        .logout-btn:hover { border-color: rgba(255,107,0,0.5); color: #FF6B00; }

        /* ── HERO + FILTER BAR ── */
        .hero { text-align: center; padding: 50px 24px 20px; }
        .hero h1 { font-family: 'Orbitron', sans-serif; font-size: 2.2rem; font-weight: 900; letter-spacing: 4px; color: #FF6B00; text-shadow: 0 0 30px rgba(255,107,0,0.3); margin-bottom: 10px; }
        .hero p { font-size: 0.8rem; opacity: 0.45; max-width: 500px; margin: 0 auto; line-height: 1.6; }
        .filter-bar { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding: 24px 32px 12px; max-width: 900px; margin: 0 auto; }
        .filter-btn { font-family: 'Orbitron', sans-serif; font-size: 0.55rem; letter-spacing: 2px; padding: 7px 14px; border: 1px solid rgba(255,107,0,0.12); border-radius: 20px; background: rgba(255,255,255,0.02); color: rgba(255,107,0,0.45); cursor: pointer; transition: all 0.3s; text-transform: uppercase; display: inline-flex; align-items: center; gap: 6px; }
        .filter-btn:hover { border-color: rgba(255,107,0,0.3); color: rgba(255,107,0,0.7); }
        .filter-btn.active { background: rgba(255,107,0,0.12); border-color: rgba(255,107,0,0.4); color: #FF6B00; }
        .filter-btn svg { width: 12px; height: 12px; }
        .skill-count { font-family: 'Orbitron', sans-serif; font-size: 0.6rem; text-align: center; color: rgba(255,107,0,0.4); letter-spacing: 3px; padding: 12px 0 8px; }

        /* ── GRID ── */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; padding: 12px 32px 60px; max-width: 1200px; margin: 0 auto; }

        /* ── CARD ── */
        .card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,107,0,0.12); border-radius: 12px; padding: 24px; backdrop-filter: blur(10px); transition: all 0.3s ease; position: relative; overflow: hidden; cursor: pointer; }

        .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
        .card-icon { width: 36px; height: 36px; border-radius: 10px; background: rgba(255,107,0,0.08); border: 1px solid rgba(255,107,0,0.15); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .card-icon svg { width: 18px; height: 18px; stroke: #FF6B00; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
        .card-actions { display: flex; gap: 6px; }
        .card-act-btn { width: 30px; height: 30px; border-radius: 8px; border: 1px solid rgba(255,107,0,0.1); background: rgba(255,255,255,0.02); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.3s; }
        .card-act-btn:hover { border-color: rgba(255,107,0,0.4); background: rgba(255,107,0,0.08); }

        .card-act-btn:hover svg { stroke: #FF6B00; }
        .card-name { font-family: 'Orbitron', sans-serif; font-size: 0.75rem; font-weight: 700; letter-spacing: 2px; color: #FF6B00; margin: 14px 0 8px; }
        .card-desc { font-size: 0.72rem; line-height: 1.6; opacity: 0.5; margin-bottom: 14px; min-height: 42px; }
        .card-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
        .tag { font-size: 0.55rem; letter-spacing: 1px; padding: 3px 8px; border-radius: 4px; background: rgba(255,107,0,0.06); color: rgba(255,107,0,0.55); border: 1px solid rgba(255,107,0,0.08); }
        .card-meta { display: flex; justify-content: space-between; align-items: center; }
        .card-size { font-size: 0.6rem; opacity: 0.3; }
        .card-category-badge { font-family: 'Orbitron', sans-serif; font-size: 0.5rem; letter-spacing: 1.5px; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; }
        .cat-web { background: rgba(59,130,246,0.1); color: rgba(59,130,246,0.7); border: 1px solid rgba(59,130,246,0.15); }
        .cat-pdf { background: rgba(239,68,68,0.1); color: rgba(239,68,68,0.7); border: 1px solid rgba(239,68,68,0.15); }
        .cat-media { background: rgba(168,85,247,0.1); color: rgba(168,85,247,0.7); border: 1px solid rgba(168,85,247,0.15); }
        .cat-design { background: rgba(236,72,153,0.1); color: rgba(236,72,153,0.7); border: 1px solid rgba(236,72,153,0.15); }
        .cat-3d { background: rgba(20,184,166,0.1); color: rgba(20,184,166,0.7); border: 1px solid rgba(20,184,166,0.15); }
        .cat-dev { background: rgba(250,204,21,0.1); color: rgba(250,204,21,0.7); border: 1px solid rgba(250,204,21,0.15); }
        .cat-ai { background: rgba(34,197,94,0.1); color: rgba(34,197,94,0.7); border: 1px solid rgba(34,197,94,0.15); }

        /* ── PROFILE MODAL ── */
        .modal-overlay { position: fixed; inset: 0; z-index: 100; background: rgba(6,6,14,0.85); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; opacity: 0; visibility: hidden; transition: all 0.3s; }
        .modal-overlay.open { opacity: 1; visibility: visible; }
        .modal { width: 560px; max-width: 92vw; max-height: 85vh; overflow-y: auto; background: #0c0c18; border: 1px solid rgba(255,107,0,0.15); border-radius: 16px; padding: 0; position: relative; }
        .modal::-webkit-scrollbar { width: 4px; } .modal::-webkit-scrollbar-track { background: transparent; } .modal::-webkit-scrollbar-thumb { background: rgba(255,107,0,0.2); border-radius: 2px; }
        .modal-banner { height: 6px; background: linear-gradient(90deg, transparent, #FF6B00, transparent); }
        .modal-body { padding: 32px; }
        .modal-close { position: absolute; top: 16px; right: 16px; width: 32px; height: 32px; border-radius: 8px; border: 1px solid rgba(255,107,0,0.15); background: rgba(6,6,14,0.8); display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 2; transition: all 0.3s; }
        .modal-close:hover { border-color: rgba(255,107,0,0.4); }
        .modal-close svg { width: 14px; height: 14px; stroke: rgba(255,107,0,0.5); fill: none; stroke-width: 2; }
        .modal-icon { width: 52px; height: 52px; border-radius: 14px; background: rgba(255,107,0,0.08); border: 1px solid rgba(255,107,0,0.15); display: flex; align-items: center; justify-content: center; margin-bottom: 16px; }
        .modal-icon svg { width: 26px; height: 26px; stroke: #FF6B00; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
        .modal-title { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; font-weight: 700; letter-spacing: 3px; color: #FF6B00; margin-bottom: 6px; }
        .modal-cat { font-size: 0.6rem; letter-spacing: 2px; opacity: 0.4; text-transform: uppercase; margin-bottom: 20px; }
        .modal-section { margin-bottom: 20px; }
        .modal-label { font-family: 'Orbitron', sans-serif; font-size: 0.6rem; letter-spacing: 2px; color: rgba(255,107,0,0.5); margin-bottom: 8px; text-transform: uppercase; }
        .modal-text { font-size: 0.78rem; line-height: 1.7; opacity: 0.6; }
        .modal-tags { display: flex; flex-wrap: wrap; gap: 6px; }
        .modal-info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .modal-info-item { padding: 12px; border-radius: 8px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,107,0,0.08); }
        .modal-info-val { font-family: 'Orbitron', sans-serif; font-size: 0.85rem; color: #FF6B00; margin-bottom: 2px; }
        .modal-info-lbl { font-size: 0.55rem; opacity: 0.3; letter-spacing: 1px; text-transform: uppercase; }

        .modal-dl-btn:hover { background: rgba(255,107,0,0.2); box-shadow: 0 0 30px rgba(255,107,0,0.15); }

        .modal-share-btn:hover { border-color: rgba(255,107,0,0.4); background: rgba(255,107,0,0.08); }
        .modal-share-btn svg { width: 16px; height: 16px; stroke: rgba(255,107,0,0.5); fill: none; stroke-width: 2; }

        /* ── TOAST ── */
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(80px); z-index: 300; padding: 12px 24px; border-radius: 10px; background: rgba(255,107,0,0.15); border: 1px solid rgba(255,107,0,0.3); color: #FF6B00; font-size: 0.7rem; letter-spacing: 1px; backdrop-filter: blur(10px); transition: transform 0.4s ease; pointer-events: none; }
        .toast.show { transform: translateX(-50%) translateY(0); }

        .footer { text-align: center; padding: 40px 24px; font-size: 0.6rem; opacity: 0.2; border-top: 1px solid rgba(255,107,0,0.06); }

        @media (max-width: 600px) {
            .hero h1 { font-size: 1.4rem; }
            .grid { grid-template-columns: 1fr; padding: 12px 16px; }
            .header { padding: 16px; }
            .brand-name { font-size: 0.8rem; letter-spacing: 3px; }
            .login-box { width: 92vw; padding: 36px 24px; }
            .modal { max-width: 96vw; }
            .modal-info-grid { grid-template-columns: 1fr; }
            .filter-bar { padding: 16px 16px 8px; }
        }
    </style>
</head>

<div class="tick tick-br"></div>

<!-- ── LOGIN ── -->
<div id="login-screen">
    <div class="login-box" id="login-box">
        <div class="login-logo">SKILLS HUB</div>
        <div class="login-sub">Authorized Access Only</div>
        <input type="text" class="login-field" id="login-user" placeholder="Username" autocomplete="off" spellcheck="false">
        <input type="password" class="login-field" id="login-pass" placeholder="Password">
        <button class="login-btn" id="login-btn" onclick="doLogin()">ACCESS</button>
        <div class="login-error" id="login-error">Invalid credentials. Try again.</div>
    </div>
</div>

<!-- ── APP ── -->
<div id="app">
    <div class="header">
        <a href="/" class="brand-name">Amr Sabry</a>
        <div class="header-right">
            <span class="header-badge">Skills Hub</span>
            <button class="logout-btn" onclick="doLogout()">Logout</button>
        </div>
    </div>

    <div class="hero">
        <h1>SKILLS HUB</h1>
        <p>All Claude skills synced across devices. Download, explore, and share.</p>
    </div>

    <!-- Filter Buttons -->
    <div class="filter-bar" id="filter-bar"></div>
    <div class="skill-count" id="skill-count"></div>

    <div class="grid" id="grid"></div>

    <div class="footer">Skills Hub by Amr Sabry &mdash; Powered by Claude</div>
</div>

<!-- ── MODAL ── -->
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
    <div class="modal" id="modal"></div>
</div>

<!-- ── TOAST ── -->
<div class="toast" id="toast"></div>

<script>
// ── AUTH ──
const _u = 'AmrSabry', _p = 'Skill@2026';
function doLogin() {
    const u = document.getElementById('login-user').value;
    const p = document.getElementById('login-pass').value;
    if (u === _u && p === _p) {
        sessionStorage.setItem('sk_auth', '1');
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('app').classList.add('visible');
    } else {
        document.getElementById('login-error').classList.add('show');
        document.getElementById('login-box').classList.add('shake');
        setTimeout(() => document.getElementById('login-box').classList.remove('shake'), 500);
    }
}
function doLogout() { sessionStorage.removeItem('sk_auth'); location.reload(); }
document.addEventListener('keydown', e => { if (e.key === 'Enter' && !document.getElementById('login-screen').classList.contains('hidden')) doLogin(); });
if (sessionStorage.getItem('sk_auth') === '1') { document.getElementById('login-screen').classList.add('hidden'); document.getElementById('app').classList.add('visible'); }

// ── RENDER FILTERS ──
let activeFilter = 'all';
function renderFilters() {
    const bar = document.getElementById('filter-bar');
    bar.innerHTML = Object.entries(CATS).map(([k, v]) => {
        const iconHtml = v.icon ? v.icon : '';
        return `<button class="filter-btn ${k===activeFilter?'active':''}" onclick="setFilter('${k}')">${iconHtml}${v.label}</button>`;
    }).join('');
}
function setFilter(cat) {
    activeFilter = cat;
    renderFilters();
    renderGrid();
}

// ── RENDER GRID ──
function renderGrid() {
    const filtered = activeFilter === 'all' ? SKILLS : SKILLS.filter(s => s.cat === activeFilter);
    document.getElementById('skill-count').textContent = filtered.length + ' SKILL' + (filtered.length !== 1 ? 'S' : '');
    document.getElementById('grid').innerHTML = filtered.map(s => `
        <div class="card" onclick="openModal('${s.id}')">
            <div class="card-top">
                <div class="card-icon">${s.icon}</div>
                <div class="card-actions">
                    <div class="card-act-btn" title="Share" onclick="event.stopPropagation();shareSkill('${s.id}')">
                        ${IC.share}
                    </div>
                    <a class="card-act-btn" title="Download" href="${s.file}" download onclick="event.stopPropagation()">
                        ${IC.download}
                    </a>
                </div>
            </div>
            <div class="card-name">${s.name}</div>
            <div class="card-desc">${s.desc}</div>
            <div class="card-tags">${s.tags.map(t => '<span class="tag">'+t+'</span>').join('')}</div>
            <div class="card-meta">
                <span class="card-size">${s.size}</span>
                <span class="card-category-badge ${CATS[s.cat].color}">${CATS[s.cat].label}</span>
            </div>
        </div>
    `).join('');
}

// ── MODAL ──
function openModal(id) {
    const s = SKILLS.find(x => x.id === id); if (!s) return;
    const c = CATS[s.cat];
    document.getElementById('modal').innerHTML = `
        <div class="modal-banner"></div>
        <div class="modal-close" onclick="closeModal()">${IC.x}</div>
        <div class="modal-body">
            <div class="modal-icon">${s.icon}</div>
            <div class="modal-title">${s.name}</div>
            <div class="modal-cat">${c.label} Skill</div>
            <div class="modal-section">
                <div class="modal-label">About</div>
                <div class="modal-text">${s.full}</div>
            </div>
            <div class="modal-section">
                <div class="modal-label">Trigger Phrases</div>
                <div class="modal-text" style="font-style:italic;opacity:0.45">${s.triggers}</div>
            </div>
            <div class="modal-section">
                <div class="modal-label">Requirements</div>
                <div class="modal-text">${s.requires}</div>
            </div>
            <div class="modal-section">
                <div class="modal-label">Tags</div>
                <div class="modal-tags">${s.tags.map(t => '<span class="tag">'+t+'</span>').join('')}</div>
            </div>
            <div class="modal-info-grid">
                <div class="modal-info-item"><div class="modal-info-val">${s.size}</div><div class="modal-info-lbl">File Size</div></div>
                <div class="modal-info-item"><div class="modal-info-val">.skill</div><div class="modal-info-lbl">Format</div></div>
            </div>
            <div class="modal-actions">
                <a class="modal-dl-btn" href="${s.file}" download>${IC.download} DOWNLOAD</a>
                <div class="modal-share-btn" onclick="shareSkill('${s.id}')">${IC.share}</div>
            </div>
        </div>
    `;
    document.getElementById('modal-overlay').classList.add('open');
    document.body.style.overflow = 'hidden';
}
function closeModal() {
    document.getElementById('modal-overlay').classList.remove('open');
    document.body.style.overflow = '';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// ── SHARE ──
function shareSkill(id) {
    const s = SKILLS.find(x => x.id === id); if (!s) return;
    const url = location.origin + '/claude-skills#' + s.id;
    if (navigator.clipboard) {
        navigator.clipboard.writeText(url).then(() => showToast('Link copied!')).catch(() => showToast('Copy failed'));
    } else { showToast(url); }
}
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
}

// ── DEEP LINK ──
function checkHash() {
    const h = location.hash.replace('#','');
    if (h && SKILLS.find(s => s.id === h)) {
        if (sessionStorage.getItem('sk_auth') === '1') openModal(h);
    }
}

// ── INIT ──
renderFilters();
renderGrid();
window.addEventListener('hashchange', checkHash);
checkHash();

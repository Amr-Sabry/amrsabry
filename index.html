<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amr Sabry | Creative Director</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --accent: #6C63FF;
            --accent2: #00E5FF;
            --text-dark: #ffffff;
            --text-light: #1a1a2e;
        }

        body {
            font-family: 'Exo 2', sans-serif;
            min-height: 100vh;
            overflow: hidden;
            transition: all 0.6s ease;
        }

        /* ===== BACKGROUNDS ===== */
        .bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            transition: opacity 0.6s ease;
        }

        .bg.dark-bg {
            background: url('dark-bg.webp') center/cover no-repeat;
            opacity: 1;
        }

        .bg.day-bg {
            background: url('day-bg.webp') center/cover no-repeat;
            opacity: 0;
            position: absolute;
        }

        body.day .dark-bg { opacity: 0; }
        body.day .day-bg { opacity: 1; }

        /* ===== TOP BAR ===== */
        .top-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 30px;
        }

        /* Brand */
        .brand {
            transition: color 0.4s;
        }

        body.dark .brand { color: var(--text-dark); }
        body.day .brand { color: var(--text-light); }

        .brand-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .brand-sub {
            font-size: 0.6rem;
            font-weight: 300;
            letter-spacing: 5px;
            opacity: 0.6;
            margin-top: 2px;
        }

        /* ===== THEME TOGGLE (TOP RIGHT) ===== */
        .toggle-wrap {
            position: relative;
            width: 52px; height: 26px;
            cursor: pointer;
        }

        .toggle-wrap input { display: none; }

        .toggle-track {
            position: absolute;
            inset: 0;
            border-radius: 13px;
            transition: all 0.4s ease;
        }

        body.dark .toggle-track {
            background: rgba(10,10,30,0.7);
            border: 1.5px solid rgba(108,99,255,0.3);
        }

        body.day .toggle-track {
            background: rgba(255,255,255,0.7);
            border: 1.5px solid rgba(108,99,255,0.2);
        }

        .toggle-thumb {
            position: absolute;
            top: 3px; left: 3px;
            width: 18px; height: 18px;
            border-radius: 50%;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.65rem;
        }

        body.dark .toggle-thumb {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
        }

        body.day .toggle-thumb {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
        }

        #theme-toggle:checked ~ .top-bar .toggle-track .toggle-thumb { left: 29px; }

        /* Sun/Moon inside toggle */
        .toggle-icons {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5px;
            pointer-events: none;
        }

        .toggle-icons span {
            font-size: 0.55rem;
            opacity: 0.6;
            transition: opacity 0.3s;
        }

        body.day .toggle-icons span:first-child { opacity: 0.3; }
        body.dark .toggle-icons span:last-child { opacity: 0.3; }

        /* ===== BOTTOM - UNDER CONSTRUCTION ===== */
        .bottom {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
        }

        /* Under Construction - Plain Text */
        .uc-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.35s ease;
        }

        body.dark .uc-text { color: rgba(231, 76, 60, 0.7); }
        body.dark .uc-text:hover { color: rgba(231, 76, 60, 1); }
        body.day .uc-text { color: rgba(231, 76, 60, 0.7); }
        body.day .uc-text:hover { color: rgba(231, 76, 60, 1); }

        .uc-text.hidden {
            opacity: 0.3;
            text-decoration: line-through;
        }

        /* Hint text */
        .hint {
            font-size: 0.6rem;
            opacity: 0;
            transition: opacity 0.3s;
            margin-top: 6px;
            letter-spacing: 1px;
        }

        body.dark .hint { color: rgba(255,255,255,0.3); }
        body.day .hint { color: rgba(26,26,46,0.3); }
        .hint.show { opacity: 1; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 500px) {
            .brand-name { font-size: 0.85rem; letter-spacing: 2px; }
            .top-bar { padding: 16px 20px; }
        }
    </style>
</head>
<body class="dark">

    <!-- Backgrounds -->
    <div class="bg dark-bg"></div>
    <div class="bg day-bg"></div>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="brand">
            <div class="brand-name">Amr Sabry</div>
            <div class="brand-sub">Creative Director</div>
        </div>

        <label class="toggle-wrap">
            <input type="checkbox" id="theme-toggle" checked>
            <div class="toggle-track">
                <div class="toggle-thumb"></div>
                <div class="toggle-icons">
                    <span>☀</span>
                    <span>◐</span>
                </div>
            </div>
        </label>
    </div>

    <!-- Bottom - Under Construction -->
    <div class="bottom">
        <div class="uc-text" id="uc-badge">Under Construction</div>
        <div class="hint" id="hint">tap to toggle</div>
    </div>

    <script>
        // Theme Toggle
        const toggle = document.getElementById('theme-toggle');

        toggle.addEventListener('change', () => {
            if (toggle.checked) {
                document.body.classList.remove('day');
                document.body.classList.add('dark');
            } else {
                document.body.classList.remove('dark');
                document.body.classList.add('day');
            }
        });

        // Under Construction Toggle
        const badge = document.getElementById('uc-badge');
        const hint = document.getElementById('hint');
        let ucVisible = true;

        setTimeout(() => {
            hint.classList.add('show');
            setTimeout(() => hint.classList.remove('show'), 2000);
        }, 800);

        badge.addEventListener('click', () => {
            ucVisible = !ucVisible;
            if (ucVisible) {
                badge.classList.remove('hidden');
                badge.textContent = 'Under Construction';
                hint.textContent = 'visible';
            } else {
                badge.classList.add('hidden');
                badge.textContent = 'Hidden';
                hint.textContent = 'hidden';
            }
            hint.classList.add('show');
            setTimeout(() => hint.classList.remove('show'), 1200);
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amr Sabry | Creative Director</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --accent: #6C63FF;
            --accent2: #00E5FF;
            --text-dark: #ffffff;
            --text-light: #1a1a2e;
        }

        body {
            font-family: 'Exo 2', sans-serif;
            min-height: 100vh;
            overflow: hidden;
            transition: all 0.6s ease;
        }

        /* ===== CRT SCANLINES ===== */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 50;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.03) 2px,
                rgba(0, 0, 0, 0.03) 4px
            );
        }

        /* ===== SCANNING LINE ===== */
        .scan-line {
            position: fixed;
            left: 0; top: 0;
            width: 100%; height: 2px;
            background: linear-gradient(90deg,
                transparent 0%,
                rgba(108, 99, 255, 0.15) 20%,
                rgba(0, 229, 255, 0.25) 50%,
                rgba(108, 99, 255, 0.15) 80%,
                transparent 100%
            );
            z-index: 49;
            pointer-events: none;
            animation: scan 6s linear infinite;
        }

        @keyframes scan {
            0%   { top: -2px; opacity: 0; }
            5%   { opacity: 1; }
            95%  { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        /* ===== GLITCH Flicker on load ===== */
        @keyframes glitchIn {
            0%   { opacity: 0; transform: translateX(-2px); clip-path: inset(40% 0 20% 0); }
            20%  { opacity: 1; transform: translateX(2px);  clip-path: inset(10% 0 60% 0); }
            40%  { transform: translateX(-1px); clip-path: inset(70% 0 5% 0); }
            60%  { transform: translateX(1px);  clip-path: inset(30% 0 40% 0); }
            80%  { transform: translateX(0);    clip-path: inset(0% 0 0% 0); }
            100% { opacity: 1; transform: translateX(0); clip-path: inset(0% 0 0% 0); }
        }

        @keyframes glitchText {
            0%, 100% { text-shadow: none; }
            92% { text-shadow: none; }
            93% { text-shadow: 2px 0 var(--accent), -2px 0 var(--accent2); }
            94% { text-shadow: -2px 0 var(--accent), 2px 0 var(--accent2); }
            95% { text-shadow: none; }
            96% { text-shadow: 1px 0 var(--accent2), -1px 0 var(--accent); }
        }

        /* ===== RGB Split on brand hover ===== */
        @keyframes rgbSplit {
            0%, 100% {
                text-shadow: none;
                transform: translate(0);
            }
            25% {
                text-shadow: 2px 0 var(--accent), -2px 0 var(--accent2);
                transform: translate(0);
            }
            50% {
                text-shadow: -2px 0 var(--accent2), 2px 0 var(--accent);
                transform: translate(1px, -1px);
            }
            75% {
                text-shadow: 1px 0 var(--accent), -1px 0 var(--accent2);
                transform: translate(-1px, 1px);
            }
        }

        @keyframes flicker {
            0%, 97%, 100% { opacity: 1; }
            98% { opacity: 0.85; }
            99% { opacity: 1; }
        }

        /* ===== BACKGROUNDS ===== */
        .bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            transition: opacity 0.6s ease;
        }

        .bg.dark-bg {
            background: url('dark-bg.webp') center/cover no-repeat;
            opacity: 1;
        }

        .bg.day-bg {
            background: url('day-bg.webp') center/cover no-repeat;
            opacity: 0;
            position: absolute;
        }

        body.day .dark-bg { opacity: 0; }
        body.day .day-bg { opacity: 1; }

        /* ===== TOP BAR ===== */
        .top-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 30px;
        }

        /* Brand - CENTERED */
        .brand {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, calc(-50% + 20px));
            text-align: center;
            z-index: 10;
            animation: glitchIn 1.2s ease forwards, flicker 8s ease infinite;
        }

        body.dark .brand { color: var(--text-dark); }
        body.day .brand { color: var(--text-light); }

        .brand-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 6px;
            text-transform: uppercase;
            line-height: 1;
        }

        body.dark .brand-name {
            text-shadow: 0 0 20px rgba(108, 99, 255, 0.3);
        }

        .brand:hover .brand-name {
            animation: rgbSplit 0.4s ease infinite, glitchText 4s ease infinite;
        }

        .brand-sub {
            font-size: 0.6rem;
            font-weight: 300;
            letter-spacing: 8px;
            opacity: 0.5;
            margin-top: 8px;
            animation: glitchIn 1.4s ease forwards, flicker 10s 2s ease infinite;
        }

        /* coming soon */
        .coming-soon {
            position: fixed;
            top: calc(50% + 52px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.6rem;
            font-weight: 400;
            letter-spacing: 5px;
            text-transform: uppercase;
            animation: flicker 6s 1.5s ease infinite;
            transition: color 0.4s;
            cursor: pointer;
        }

        body.dark .coming-soon { color: rgba(108, 99, 255, 0.6); }
        body.dark .coming-soon:hover { color: rgba(0, 229, 255, 0.8); }
        body.day .coming-soon { color: rgba(108, 99, 255, 0.5); }
        body.day .coming-soon:hover { color: rgba(108, 99, 255, 0.9); }

        .coming-soon.hidden {
            opacity: 0.25;
            text-decoration: line-through;
        }

        /* ===== THEME TOGGLE (TOP RIGHT) ===== */
        .toggle-wrap {
            position: fixed;
            top: 20px; right: 30px;
            z-index: 11;
            position: fixed;
            width: 52px; height: 26px;
            cursor: pointer;
        }

        .toggle-wrap input { display: none; }

        .toggle-track {
            position: absolute;
            inset: 0;
            border-radius: 13px;
            transition: all 0.4s ease;
        }

        body.dark .toggle-track {
            background: rgba(10,10,30,0.7);
            border: 1.5px solid rgba(108,99,255,0.3);
        }

        body.day .toggle-track {
            background: rgba(255,255,255,0.7);
            border: 1.5px solid rgba(108,99,255,0.2);
        }

        .toggle-thumb {
            position: absolute;
            top: 3px; left: 3px;
            width: 18px; height: 18px;
            border-radius: 50%;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        body.dark .toggle-thumb {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
        }

        body.day .toggle-thumb {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
        }

        #theme-toggle:checked ~ .toggle-wrap .toggle-track .toggle-thumb { left: 29px; }

        .toggle-icons {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5px;
            pointer-events: none;
        }

        .toggle-icons span {
            font-size: 0.55rem;
            opacity: 0.6;
            transition: opacity 0.3s;
        }

        body.day .toggle-icons span:first-child { opacity: 0.3; }
        body.dark .toggle-icons span:last-child { opacity: 0.3; }

        /* ===== CORNER DECORATIONS ===== */
        .corner {
            position: fixed;
            width: 30px; height: 30px;
            z-index: 10;
            opacity: 0.3;
        }

        .corner::before, .corner::after {
            content: '';
            position: absolute;
            background: var(--accent);
        }

        .corner-tl { top: 16px; left: 16px; }
        .corner-tl::before { top: 0; left: 0; width: 100%; height: 1px; }
        .corner-tl::after  { top: 0; left: 0; width: 1px; height: 100%; }

        .corner-tr { top: 16px; right: 16px; }
        .corner-tr::before { top: 0; right: 0; width: 100%; height: 1px; }
        .corner-tr::after  { top: 0; right: 0; width: 1px; height: 100%; }

        .corner-bl { bottom: 16px; left: 16px; }
        .corner-bl::before { bottom: 0; left: 0; width: 100%; height: 1px; }
        .corner-bl::after  { bottom: 0; left: 0; width: 1px; height: 100%; }

        .corner-br { bottom: 16px; right: 16px; }
        .corner-br::before { bottom: 0; right: 0; width: 100%; height: 1px; }
        .corner-br::after  { bottom: 0; right: 0; width: 1px; height: 100%; }

        body.day .corner { opacity: 0.15; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .brand-name { font-size: 1.4rem; letter-spacing: 3px; }
            .brand { transform: translate(-50%, calc(-50% + 10px)); }
            .coming-soon { top: calc(50% + 40px); font-size: 0.5rem; }
            .top-bar { padding: 16px 20px; }
        }
    </style>
</head>
<body class="dark">

    <!-- Backgrounds -->
    <div class="bg dark-bg"></div>
    <div class="bg day-bg"></div>

    <!-- CRT Scanlines -->
    <div class="scan-line"></div>

    <!-- Corner Decorations -->
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>

    <!-- Brand - CENTERED -->
    <div class="brand">
        <div class="brand-name">Amr Sabry</div>
        <div class="brand-sub">Creative Director</div>
    </div>

    <!-- Coming Soon -->
    <div class="coming-soon" id="uc-badge">coming soon...</div>

    <!-- Theme Toggle -->
    <label class="toggle-wrap">
        <input type="checkbox" id="theme-toggle" checked>
        <div class="toggle-track">
            <div class="toggle-thumb"></div>
            <div class="toggle-icons">
                <span>☀</span>
                <span>◐</span>
            </div>
        </div>
    </label>

    <script>
        // Theme Toggle
        const toggle = document.getElementById('theme-toggle');
        const badge = document.getElementById('uc-badge');

        toggle.addEventListener('change', () => {
            if (toggle.checked) {
                document.body.classList.remove('day');
                document.body.classList.add('dark');
            } else {
                document.body.classList.remove('dark');
                document.body.classList.add('day');
            }
        });

        // Coming Soon Toggle
        let ucVisible = true;
        badge.addEventListener('click', () => {
            ucVisible = !ucVisible;
            if (ucVisible) {
                badge.classList.remove('hidden');
                badge.textContent = 'coming soon...';
            } else {
                badge.classList.add('hidden');
                badge.textContent = 'hidden';
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amr Sabry | Creative Director</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --accent: #6C63FF;
            --accent2: #00E5FF;
        }

        body {
            font-family: 'Space Mono', monospace;
            min-height: 100vh;
            overflow: hidden;
            transition: all 0.5s ease;
        }

        /* ===== DUAL SCANLINES ===== */
        /* Fine scan — very subtle */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 50;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(255,255,255,0.018) 2px,
                rgba(255,255,255,0.018) 4px
            );
        }

        /* Bold scan — more visible */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 50;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 8px,
                rgba(0,0,0,0.06) 8px,
                rgba(0,0,0,0.06) 10px
            );
        }

        /* Moving scan beam */
        .scan-beam {
            position: fixed;
            left: 0; top: 0;
            width: 100%; height: 3px;
            background: linear-gradient(
                180deg,
                transparent,
                rgba(255,255,255,0.12) 40%,
                rgba(255,255,255,0.2) 50%,
                rgba(255,255,255,0.12) 60%,
                transparent
            );
            z-index: 49;
            pointer-events: none;
            animation: scanBeam 4s linear infinite;
        }

        body.day .scan-beam {
            background: linear-gradient(
                180deg,
                transparent,
                rgba(0,0,0,0.08) 40%,
                rgba(0,0,0,0.14) 50%,
                rgba(0,0,0,0.08) 60%,
                transparent
            );
        }

        @keyframes scanBeam {
            0%   { top: -4px; opacity: 0; }
            5%   { opacity: 1; }
            95%  { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        /* ===== BACKGROUNDS ===== */
        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            transition: opacity 0.6s ease;
        }

        .bg.dark-bg {
            background: url('dark-bg.webp') center/cover no-repeat;
            opacity: 1;
        }

        .bg.day-bg {
            background: url('day-bg.webp') center/cover no-repeat;
            opacity: 0;
            position: absolute;
        }

        body.day .dark-bg { opacity: 0; }
        body.day .day-bg  { opacity: 1; }

        /* ===== GLITCH ON BACKGROUND — EVERY SECOND ===== */
        .glitch-layer {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background: url('dark-bg.webp') center/cover no-repeat;
        }

        body.day .glitch-layer { background: url('day-bg.webp') center/cover no-repeat; }

        /* Slice 1 — cyan/blue shift */
        .g1 { animation: g1 1s steps(1) infinite; }
        @keyframes g1 {
            0%,78%,100% { clip-path: none; transform: none; filter: none; opacity: 0; }
            80% {
                clip-path: polygon(0 10%, 100% 10%, 100% 25%, 0 25%);
                transform: translate(-5px, 0) scale(1.01);
                filter: hue-rotate(80deg) saturate(2);
                opacity: 0.45;
            }
            82% {
                clip-path: polygon(0 60%, 100% 60%, 100% 72%, 0 72%);
                transform: translate(5px, 0);
                filter: hue-rotate(80deg) saturate(1.8);
                opacity: 0.4;
            }
            84% { opacity: 0; }
        }

        /* Slice 2 — red/desaturation */
        .g2 { animation: g2 1s steps(1) infinite; }
        @keyframes g2 {
            0%,81%,100% { clip-path: none; transform: none; filter: none; opacity: 0; }
            83% {
                clip-path: polygon(0 38%, 100% 38%, 100% 50%, 0 50%);
                transform: translate(7px, 0);
                filter: brightness(1.5) saturate(0) hue-rotate(0deg);
                opacity: 0.5;
            }
            85% {
                clip-path: polygon(0 78%, 100% 78%, 100% 88%, 0 88%);
                transform: translate(-4px, 0);
                filter: brightness(1.3) saturate(0);
                opacity: 0.4;
            }
            87% { opacity: 0; }
        }

        /* Slice 3 — horizontal shift */
        .g3 { animation: g3 1s steps(1) infinite; }
        @keyframes g3 {
            0%,84%,100% { clip-path: none; transform: none; opacity: 0; }
            86% {
                clip-path: polygon(0 0, 100% 0, 100% 18%, 0 18%);
                transform: translate(3px, 0);
                filter: hue-rotate(-60deg) brightness(1.2);
                opacity: 0.35;
            }
            88% { opacity: 0; }
        }

        /* Slice 4 — bottom slice */
        .g4 { animation: g4 1s steps(1) infinite; }
        @keyframes g4 {
            0%,86%,100% { clip-path: none; transform: none; opacity: 0; }
            88% {
                clip-path: polygon(0 80%, 100% 80%, 100% 95%, 0 95%);
                transform: translate(-6px, 0) scale(1.01);
                filter: hue-rotate(40deg) brightness(1.15);
                opacity: 0.38;
            }
            90% { opacity: 0; }
        }

        /* ===== BRAND — TOP LEFT ===== */
        .brand {
            position: fixed;
            top: 28px; left: 32px;
            z-index: 10;
        }

        .brand-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.05rem;
            font-weight: 900;
            letter-spacing: 5px;
            text-transform: uppercase;
            line-height: 1;
        }

        body.dark  .brand-name { color: rgba(255,255,255,0.92); }
        body.day   .brand-name { color: rgba(10,10,30,0.88); }

        .brand-sub {
            font-size: 0.55rem;
            letter-spacing: 5px;
            opacity: 0.5;
            margin-top: 5px;
        }

        body.dark  .brand-sub { color: rgba(255,255,255,0.5); }
        body.day   .brand-sub { color: rgba(10,10,30,0.5); }

        /* ===== TOGGLE — TOP RIGHT ===== */
        .toggle {
            position: fixed;
            top: 22px; right: 32px;
            z-index: 10;
            width: 50px; height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            background: transparent;
            border: none;
        }

        .toggle svg {
            width: 20px; height: 20px;
            stroke-width: 1.5;
            fill: none;
        }

        body.dark  .toggle { color: rgba(255,255,255,0.9); }
        body.day   .toggle { color: rgba(10,10,30,0.85); }

        .toggle:hover { opacity: 0.6; }

        /* ===== CORNER TICKS ===== */
        .tick {
            position: fixed; z-index: 10; width: 14px; height: 14px; pointer-events: none;
        }
        .tick::before, .tick::after { content: ''; position: absolute; transition: background 0.4s, opacity 0.4s; }
        body.dark  .tick::before, body.dark  .tick::after { background: rgba(255,255,255,0.35); }
        body.day   .tick::before, body.day   .tick::after { background: rgba(10,10,30,0.35); }
        .tick-tl { top: 18px; left: 18px; }
        .tick-tl::before { top: 0; left: 0; width: 100%; height: 1px; }
        .tick-tl::after  { top: 0; left: 0; width: 1px; height: 100%; }
        .tick-br { bottom: 18px; right: 18px; }
        .tick-br::before { bottom: 0; right: 0; width: 100%; height: 1px; }
        .tick-br::after  { bottom: 0; right: 0; width: 1px; height: 100%; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 500px) {
            .brand-name { font-size: 0.85rem; letter-spacing: 3px; }
            .brand { top: 22px; left: 22px; }
            .toggle { top: 18px; right: 22px; width: 44px; height: 44px; }
        }
    </style>
</head>
<body class="dark">

    <!-- Backgrounds -->
    <div class="bg dark-bg"></div>
    <div class="bg day-bg"></div>

    <!-- Glitch Layers on Background -->
    <div class="glitch-layer g1"></div>
    <div class="glitch-layer g2"></div>
    <div class="glitch-layer g3"></div>
    <div class="glitch-layer g4"></div>

    <!-- Moving Scan Beam -->
    <div class="scan-beam"></div>

    <!-- Corner Ticks -->
    <div class="tick tick-tl"></div>
    <div class="tick tick-br"></div>

    <!-- Brand — TOP LEFT -->
    <div class="brand">
        <div class="brand-name">Amr Sabry</div>
        <div class="brand-sub">Creative Director</div>
    </div>

    <!-- Toggle — TOP RIGHT -->
    <button class="toggle" id="toggle-btn" title="Toggle Theme">
        <!-- Sun = shown in dark mode → click to switch to day -->
        <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
        <!-- Moon = shown in day mode → click to switch to dark -->
        <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="display:none">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
        </svg>
    </button>

    <script>
        const toggle = document.getElementById('toggle-btn');
        const sun  = document.getElementById('icon-sun');
        const moon = document.getElementById('icon-moon');
        let isDark = true;

        toggle.addEventListener('click', () => {
            isDark = !isDark;
            if (isDark) {
                document.body.classList.add('dark');
                document.body.classList.remove('day');
                sun.style.display  = 'block';
                moon.style.display = 'none';
            } else {
                document.body.classList.add('day');
                document.body.classList.remove('dark');
                sun.style.display  = 'none';
                moon.style.display = 'block';
            }
        });
    </script>
</body>
</html>

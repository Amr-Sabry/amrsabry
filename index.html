<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amr Sabry | Creative Director</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --accent: #6C63FF;
            --accent2: #00E5FF;
        }

        body {
            font-family: 'Space Mono', monospace;
            min-height: 100vh;
            overflow: hidden;
            transition: all 0.5s ease;
        }

        /* ===== SCAN LINES ===== */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 50;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 3px,
                rgba(255,255,255,0.025) 3px,
                rgba(255,255,255,0.025) 4px
            );
        }

        .scan-line {
            position: fixed;
            left: 0; top: 0;
            width: 100%; height: 1px;
            background: rgba(255,255,255,0.55);
            z-index: 49;
            pointer-events: none;
            animation: scanDown 7s linear infinite;
            box-shadow: 0 0 8px rgba(255,255,255,0.3);
        }

        @keyframes scanDown {
            0%   { top: -2px; opacity: 0; }
            4%   { opacity: 1; }
            96%  { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        /* ===== BACKGROUNDS ===== */
        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            transition: opacity 0.6s ease;
        }

        .bg.dark-bg {
            background: url('dark-bg.webp') center/cover no-repeat;
            opacity: 1;
        }

        .bg.day-bg {
            background: url('day-bg.webp') center/cover no-repeat;
            opacity: 0;
            position: absolute;
        }

        body.day .dark-bg { opacity: 0; }
        body.day .day-bg  { opacity: 1; }

        /* ===== GLITCH ON BACKGROUND ===== */
        .bg-glitch {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background: url('dark-bg.webp') center/cover no-repeat;
            animation: bgGlitch 5s steps(1) infinite;
        }

        body.day .bg-glitch {
            background: url('day-bg.webp') center/cover no-repeat;
        }

        @keyframes bgGlitch {
            0%, 80%, 100% { clip-path: none; transform: none; filter: none; opacity: 0; }
            82% {
                clip-path: polygon(0 15%, 100% 15%, 100% 28%, 0 28%);
                transform: translate(-6px, 0) scale(1.02);
                filter: hue-rotate(90deg) saturate(2);
                opacity: 0.5;
            }
            84% {
                clip-path: polygon(0 55%, 100% 55%, 100% 68%, 0 68%);
                transform: translate(6px, 0) scale(1.02);
                filter: hue-rotate(-90deg) saturate(1.5) brightness(1.3);
                opacity: 0.45;
            }
            86% {
                clip-path: polygon(0 0, 100% 0, 100% 40%, 0 40%);
                transform: translate(3px, 0);
                filter: hue-rotate(45deg);
                opacity: 0.35;
            }
            88% {
                clip-path: polygon(0 70%, 100% 70%, 100% 85%, 0 85%);
                transform: translate(-4px, 0) scale(1.01);
                filter: hue-rotate(-45deg) brightness(1.2);
                opacity: 0.4;
            }
            90%, 99% { clip-path: none; transform: none; filter: none; opacity: 0; }
        }

        /* Glitch slice 2 — red channel */
        .bg-glitch2 {
            position: fixed;
            inset: 0;
            z-index: 3;
            pointer-events: none;
            background: url('dark-bg.webp') center/cover no-repeat;
            animation: bgGlitch2 5s steps(1) infinite;
        }

        body.day .bg-glitch2 {
            background: url('day-bg.webp') center/cover no-repeat;
        }

        @keyframes bgGlitch2 {
            0%, 81%, 100% { clip-path: none; transform: translateX(0); opacity: 0; }
            83% {
                clip-path: polygon(0 40%, 100% 40%, 100% 52%, 0 52%);
                transform: translate(8px, 0);
                filter: brightness(1.4) saturate(0) hue-rotate(0deg);
                opacity: 0.5;
            }
            85% {
                clip-path: polygon(0 5%, 100% 5%, 100% 18%, 0 18%);
                transform: translate(-5px, 0);
                filter: brightness(1.3) saturate(0);
                opacity: 0.4;
            }
            87% { opacity: 0; }
        }

        /* ===== TOP LEFT — BRAND ===== */
        .brand {
            position: fixed;
            top: 28px; left: 32px;
            z-index: 10;
            transition: color 0.5s;
        }

        body.dark .brand { color: rgba(255,255,255,0.9); }
        body.day  .brand { color: rgba(15,15,35,0.85); }

        body.dark .brand-name { color: rgba(255,255,255,0.9); text-shadow: none; }
        body.day  .brand-name { color: rgba(15,15,35,0.85); text-shadow: none; }

        .brand-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.05rem;
            font-weight: 900;
            letter-spacing: 5px;
            text-transform: uppercase;
            line-height: 1;
        }

        .brand-sub {
            font-size: 0.55rem;
            letter-spacing: 5px;
            opacity: 0.5;
            margin-top: 5px;
        }

        /* ===== TOGGLE — TOP RIGHT ===== */
        .toggle {
            position: fixed;
            top: 26px; right: 32px;
            z-index: 10;
            width: 44px; height: 44px;
            border-radius: 50%;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            background: transparent;
            border: none;
            transition: color 0.4s;
        }

        body.dark .toggle { color: rgba(255,255,255,0.85); }
        body.day  .toggle { color: rgba(15,15,35,0.8); }

        .toggle:hover { opacity: 0.6; }
        .toggle svg { width: 20px; height: 20px; stroke-width: 1.5; }

        /* ===== CORNER TICKS ===== */
        .tick {
            position: fixed;
            z-index: 10;
            width: 14px; height: 14px;
            pointer-events: none;
        }
        .tick::before, .tick::after { content: ''; position: absolute; opacity: 0.35; transition: opacity 0.4s; }
        body.dark .tick::before, body.dark .tick::after { background: rgba(255,255,255,0.35); }
        body.day  .tick::before, body.day  .tick::after { background: rgba(15,15,35,0.35); }

        .tick-tl { top: 18px; left: 18px; }
        .tick-tl::before { top: 0; left: 0; width: 100%; height: 1px; }
        .tick-tl::after  { top: 0; left: 0; width: 1px; height: 100%; }
        .tick-br { bottom: 18px; right: 18px; }
        .tick-br::before { bottom: 0; right: 0; width: 100%; height: 1px; }
        .tick-br::after  { bottom: 0; right: 0; width: 1px; height: 100%; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 500px) {
            .brand-name { font-size: 0.85rem; letter-spacing: 3px; }
            .brand { top: 22px; left: 22px; }
            .toggle { top: 20px; right: 22px; }
        }
    </style>
</head>
<body class="dark">

    <!-- Backgrounds -->
    <div class="bg dark-bg"></div>
    <div class="bg day-bg"></div>

    <!-- Glitch Layers on Background -->
    <div class="bg-glitch"></div>
    <div class="bg-glitch2"></div>

    <!-- Scan Line -->
    <div class="scan-line"></div>

    <!-- Corner Ticks -->
    <div class="tick tick-tl"></div>
    <div class="tick tick-br"></div>

    <!-- Brand — TOP LEFT -->
    <div class="brand">
        <div class="brand-name">Amr Sabry</div>
        <div class="brand-sub">Creative Director</div>
    </div>

    <!-- Toggle — TOP RIGHT -->
    <button class="toggle" id="toggle-btn" title="Toggle Theme">
        <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
        <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="display:none">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
        </svg>
    </button>

    <script>
        const toggle = document.getElementById('toggle-btn');
        const sunIcon = document.getElementById('icon-sun');
        const moonIcon = document.getElementById('icon-moon');

        let isDark = true;

        function applyTheme(dark) {
            if (dark) {
                document.body.classList.add('dark');
                document.body.classList.remove('day');
                sunIcon.style.display  = 'block';
                moonIcon.style.display = 'none';
            } else {
                document.body.classList.add('day');
                document.body.classList.remove('dark');
                sunIcon.style.display  = 'none';
                moonIcon.style.display = 'block';
            }
        }

        toggle.addEventListener('click', () => {
            isDark = !isDark;
            applyTheme(isDark);
        });
    </script>
</body>
</html>

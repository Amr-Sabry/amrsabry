<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amr Sabry | Creative Director</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --accent: #6C63FF;
            --accent2: #00E5FF;
            --c: rgba(255,255,255,0.88);
            --c-sub: rgba(255,255,255,0.45);
        }

        body {
            font-family: 'Space Mono', monospace;
            min-height: 100vh;
            overflow: hidden;
            transition: all 0.5s ease;
        }

        body.day { --c: rgba(15,15,35,0.82); --c-sub: rgba(15,15,35,0.45); }

        /* ===== SCAN LINES ===== */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 50;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 3px,
                rgba(255,255,255,0.025) 3px,
                rgba(255,255,255,0.025) 4px
            );
        }

        .scan-line {
            position: fixed;
            left: 0; top: 0;
            width: 100%; height: 1px;
            background: rgba(255,255,255,0.55);
            z-index: 49;
            pointer-events: none;
            animation: scanDown 7s linear infinite;
            box-shadow: 0 0 8px rgba(255,255,255,0.3);
        }

        @keyframes scanDown {
            0%   { top: -2px; opacity: 0; }
            4%   { opacity: 1; }
            96%  { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        /* ===== BACKGROUNDS ===== */
        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            transition: opacity 0.6s ease;
        }

        .bg.dark-bg {
            background: url('dark-bg.webp') center/cover no-repeat;
            opacity: 1;
        }

        .bg.day-bg {
            background: url('day-bg.webp') center/cover no-repeat;
            opacity: 0;
            position: absolute;
        }

        body.day .dark-bg { opacity: 0; }
        body.day .day-bg  { opacity: 1; }

        /* ===== TOP LEFT — BRAND ===== */
        .brand {
            position: fixed;
            top: 28px; left: 32px;
            z-index: 10;
            color: var(--c);
            transition: color 0.5s;
        }

        .brand-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.05rem;
            font-weight: 900;
            letter-spacing: 5px;
            text-transform: uppercase;
            line-height: 1;
            color: var(--c);
            transition: color 0.5s;
        }

        .brand-sub {
            font-size: 0.55rem;
            letter-spacing: 5px;
            opacity: 0.5;
            margin-top: 5px;
            color: var(--c-sub);
            transition: color 0.5s;
        }

        /* ===== GLITCH ===== */
        .glitching {
            animation: glitchFlash 3s steps(1) infinite;
        }

        @keyframes glitchFlash {
            0%, 89%, 100% {
                text-shadow: none;
                transform: translate(0);
                clip-path: none;
            }
            90% {
                text-shadow: -3px 0 #ff0055, 3px 0 #00ffff;
                transform: translate(-2px, 1px);
                clip-path: inset(20% 0 50% 0);
            }
            92% {
                text-shadow: 3px 0 #ff0055, -3px 0 #00ffff;
                transform: translate(2px, -1px);
                clip-path: inset(60% 0 10% 0);
            }
            94% {
                text-shadow: none;
                transform: translate(0);
                clip-path: none;
            }
            95% {
                text-shadow: -2px 0 #00ffff, 2px 0 #ff0055;
                transform: translate(1px, 0);
            }
            97%, 99% {
                text-shadow: none;
                transform: translate(0);
            }
        }

        /* ===== TOGGLE — TOP RIGHT ===== */
        .toggle {
            position: fixed;
            top: 26px; right: 32px;
            z-index: 10;
            width: 44px; height: 44px;
            border-radius: 50%;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            color: var(--c);
            transition: color 0.4s, background 0.3s;
            background: transparent;
            border: none;
        }

        .toggle:hover { color: var(--c); }
        .toggle svg { width: 20px; height: 20px; stroke-width: 1.5; }

        /* ===== CORNER TICKS ===== */
        .tick {
            position: fixed;
            z-index: 10;
            width: 14px; height: 14px;
            pointer-events: none;
        }
        .tick::before, .tick::after { content: ''; position: absolute; background: var(--c); opacity: 0.35; transition: opacity 0.4s, background 0.4s; }
        body.day .tick::before, body.day .tick::after { opacity: 0.2; }
        .tick-tl { top: 18px; left: 18px; }
        .tick-tl::before { top: 0; left: 0; width: 100%; height: 1px; }
        .tick-tl::after  { top: 0; left: 0; width: 1px; height: 100%; }
        .tick-br { bottom: 18px; right: 18px; }
        .tick-br::before { bottom: 0; right: 0; width: 100%; height: 1px; }
        .tick-br::after  { bottom: 0; right: 0; width: 1px; height: 100%; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 500px) {
            .brand-name { font-size: 0.85rem; letter-spacing: 3px; }
            .brand { top: 22px; left: 22px; }
            .toggle { top: 20px; right: 22px; }
        }
    </style>
</head>
<body class="dark">

    <!-- Backgrounds -->
    <div class="bg dark-bg"></div>
    <div class="bg day-bg"></div>

    <!-- Scan Line -->
    <div class="scan-line"></div>

    <!-- Corner Ticks -->
    <div class="tick tick-tl"></div>
    <div class="tick tick-br"></div>

    <!-- Brand — TOP LEFT -->
    <div class="brand">
        <div class="brand-name glitching" id="brand-name">Amr Sabry</div>
        <div class="brand-sub">Creative Director</div>
    </div>

    <!-- Toggle — TOP RIGHT -->
    <button class="toggle" id="toggle-btn" title="Toggle Theme">
        <!-- Sun icon (shown in dark mode) -->
        <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
        <!-- Moon icon (shown in day mode) -->
        <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="display:none">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
        </svg>
    </button>

    <script>
        const toggle = document.getElementById('toggle-btn');
        const sunIcon = document.getElementById('icon-sun');
        const moonIcon = document.getElementById('icon-moon');
        const brand = document.getElementById('brand-name');

        let isDark = true;

        function applyTheme(dark) {
            if (dark) {
                document.body.classList.add('dark');
                document.body.classList.remove('day');
                sunIcon.style.display  = 'block';
                moonIcon.style.display = 'none';
            } else {
                document.body.classList.add('day');
                document.body.classList.remove('dark');
                sunIcon.style.display  = 'none';
                moonIcon.style.display = 'block';
            }
        }

        toggle.addEventListener('click', () => {
            isDark = !isDark;
            applyTheme(isDark);
        });

        // Keep glitch alive — restart animation every 4s
        function restartGlitch() {
            brand.classList.remove('glitching');
            void brand.offsetWidth; // reflow
            brand.classList.add('glitching');
        }
        setInterval(restartGlitch, 4000);
    </script>
</body>
</html>

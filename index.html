<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amr Sabry | Creative Director</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Space Mono', monospace;
            min-height: 100vh;
            overflow: hidden;
            transition: all 0.5s ease;
        }

        /* ===== DUAL SCANLINES — ultra close + thick ===== */
        /* Fine lines every 1px */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 50;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 1px,
                rgba(255,107,0,0.05) 1px,
                rgba(255,107,0,0.05) 2px
            );
        }

        /* Bold lines every 4px */
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 50;
            pointer-events: none;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 4px,
                rgba(255,107,0,0.13) 4px,
                rgba(255,107,0,0.13) 6px
            );
        }

        /* ===== MULTI SCAN BEAMS — different speeds & opacities ===== */
        .scan-beam {
            position: fixed;
            left: 0;
            width: 100%;
            height: 2px;
            z-index: 49;
            pointer-events: none;
            background: linear-gradient(
                180deg,
                transparent,
                rgba(255,107,0,0.30) 40%,
                rgba(255,107,0,0.50) 50%,
                rgba(255,107,0,0.30) 60%,
                transparent
            );
            animation: scanBeam 3s linear infinite;
        }

        .scan-beam.b2 {
            height: 4px;
            opacity: 0.6;
            animation: scanBeam2 7s linear infinite;
            animation-delay: -2s;
        }

        .scan-beam.b3 {
            height: 1px;
            opacity: 0.4;
            animation: scanBeam3 5s linear infinite;
            animation-delay: -4s;
        }

        @keyframes scanBeam {
            0%   { top: -4px; opacity: 0; }
            5%   { opacity: 1; }
            95%  { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        @keyframes scanBeam2 {
            0%   { top: -6px; opacity: 0; }
            5%   { opacity: 0.7; }
            95%  { opacity: 0.7; }
            100% { top: 100%; opacity: 0; }
        }

        @keyframes scanBeam3 {
            0%   { top: -3px; opacity: 0; }
            5%   { opacity: 1; }
            95%  { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        /* ===== BACKGROUNDS ===== */
        .bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            transition: opacity 0.6s ease;
        }

        .bg.dark-bg {
            background: url('dark-bg.webp') center/cover no-repeat;
            opacity: 1;
        }

        .bg.day-bg {
            background: url('day-bg.webp') center/cover no-repeat;
            opacity: 0;
            position: absolute;
        }

        body.day .dark-bg { opacity: 0; }
        body.day .day-bg  { opacity: 1; }

        /* ===== GLITCH ON BACKGROUND — EVERY 2 SECONDS ===== */
        .glitch-layer {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background: url('dark-bg.webp') center/cover no-repeat;
        }

        body.day .glitch-layer { background: url('day-bg.webp') center/cover no-repeat; }

        .g1 { animation: g1 2s steps(1) infinite; }
        @keyframes g1 {
            0%,77%,100% { clip-path: none; transform: none; filter: none; opacity: 0; }
            79% {
                clip-path: polygon(0 8%,  100% 8%,  100% 22%, 0 22%);
                transform: translate(-6px, 0) scale(1.01);
                filter: hue-rotate(75deg) saturate(2);
                opacity: 0.5;
            }
            81% {
                clip-path: polygon(0 58%, 100% 58%, 100% 70%, 0 70%);
                transform: translate(6px, 0);
                filter: hue-rotate(75deg) saturate(1.7);
                opacity: 0.45;
            }
            83% { opacity: 0; }
        }

        .g2 { animation: g2 2s steps(1) infinite; }
        @keyframes g2 {
            0%,80%,100% { clip-path: none; transform: none; filter: none; opacity: 0; }
            82% {
                clip-path: polygon(0 35%, 100% 35%, 100% 48%, 0 48%);
                transform: translate(8px, 0);
                filter: brightness(1.5) saturate(0);
                opacity: 0.55;
            }
            84% {
                clip-path: polygon(0 75%, 100% 75%, 100% 86%, 0 86%);
                transform: translate(-5px, 0);
                filter: brightness(1.3) saturate(0);
                opacity: 0.4;
            }
            86% { opacity: 0; }
        }

        .g3 { animation: g3 2s steps(1) infinite; }
        @keyframes g3 {
            0%,82%,100% { clip-path: none; transform: none; opacity: 0; }
            84% {
                clip-path: polygon(0 0, 100% 0, 100% 15%, 0 15%);
                transform: translate(4px, 0);
                filter: hue-rotate(-55deg) brightness(1.2);
                opacity: 0.38;
            }
            86% { opacity: 0; }
        }

        .g4 { animation: g4 2s steps(1) infinite; }
        @keyframes g4 {
            0%,84%,100% { clip-path: none; transform: none; opacity: 0; }
            86% {
                clip-path: polygon(0 78%, 100% 78%, 100% 93%, 0 93%);
                transform: translate(-7px, 0) scale(1.01);
                filter: hue-rotate(40deg) brightness(1.15);
                opacity: 0.4;
            }
            88% { opacity: 0; }
        }

        /* ===== BRAND — TOP LEFT ===== */
        .brand {
            position: fixed;
            top: 28px; left: 32px;
            z-index: 10;
        }

        .brand-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.05rem;
            font-weight: 900;
            letter-spacing: 5px;
            text-transform: uppercase;
            line-height: 1;
        }

        body.dark  .brand-name { color: #FF6B00; text-shadow: 0 0 18px rgba(255,107,0,0.35); }
        body.day   .brand-name { color: #FF6B00; text-shadow: 0 0 14px rgba(255,107,0,0.25); }

        .brand-sub {
            font-size: 0.55rem;
            letter-spacing: 5px;
            opacity: 0.6;
            margin-top: 5px;
            color: #FF6B00;
            text-shadow: 0 0 10px rgba(255,107,0,0.2);
        }

        /* ===== TOGGLE — TOP RIGHT ===== */
        .toggle {
            position: fixed;
            top: 22px; right: 32px;
            z-index: 10;
            width: 50px; height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            background: transparent;
            border: none;
            color: #FF6B00;
            transition: color 0.3s;
        }

        .toggle:hover { opacity: 0.6; }
        .toggle svg { width: 20px; height: 20px; stroke-width: 1.5; fill: none; color: #FF6B00; }

        /* ===== CORNER TICKS ===== */
        .tick {
            position: fixed; z-index: 10; width: 14px; height: 14px; pointer-events: none;
        }
        .tick::before, .tick::after { content: ''; position: absolute; background: rgba(255,107,0,0.4); transition: background 0.4s; }
        .tick-tl { top: 18px; left: 18px; }
        .tick-tl::before { top: 0; left: 0; width: 100%; height: 1px; }
        .tick-tl::after  { top: 0; left: 0; width: 1px; height: 100%; }
        .tick-br { bottom: 18px; right: 18px; }
        .tick-br::before { bottom: 0; right: 0; width: 100%; height: 1px; }
        .tick-br::after  { bottom: 0; right: 0; width: 1px; height: 100%; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 500px) {
            .brand-name { font-size: 0.85rem; letter-spacing: 3px; }
            .brand { top: 22px; left: 22px; }
            .toggle { top: 18px; right: 22px; width: 44px; height: 44px; }
        }
    </style>
</head>
<body class="dark">

    <!-- Backgrounds -->
    <div class="bg dark-bg"></div>
    <div class="bg day-bg"></div>

    <!-- Glitch Layers on Background -->
    <div class="glitch-layer g1"></div>
    <div class="glitch-layer g2"></div>
    <div class="glitch-layer g3"></div>
    <div class="glitch-layer g4"></div>

    <!-- Multi Scan Beams -->
    <div class="scan-beam b1"></div>
    <div class="scan-beam b2"></div>
    <div class="scan-beam b3"></div>

    <!-- Corner Ticks -->
    <div class="tick tick-tl"></div>
    <div class="tick tick-br"></div>

    <!-- Brand — TOP LEFT -->
    <div class="brand">
        <div class="brand-name">Amr Sabry</div>
        <div class="brand-sub">Creative Director</div>
    </div>

    <!-- Toggle — TOP RIGHT -->
    <button class="toggle" id="toggle-btn" title="Toggle Theme">
        <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
        <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" style="display:none">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
        </svg>
    </button>

    <script>
        const toggle = document.getElementById('toggle-btn');
        const sun  = document.getElementById('icon-sun');
        const moon = document.getElementById('icon-moon');
        let isDark = true;

        toggle.addEventListener('click', () => {
            isDark = !isDark;
            if (isDark) {
                document.body.classList.add('dark');
                document.body.classList.remove('day');
                sun.style.display  = 'block';
                moon.style.display = 'none';
            } else {
                document.body.classList.add('day');
                document.body.classList.remove('dark');
                sun.style.display  = 'none';
                moon.style.display = 'block';
            }
        });
    </script>
</body>
</html>

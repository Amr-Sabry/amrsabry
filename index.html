<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amr Sabry | Creative Director</title>
    <!-- Futuristic Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --glass-dark: rgba(10, 10, 30, 0.55);
            --glass-light: rgba(255, 255, 255, 0.55);
            --accent: #6C63FF;
            --accent2: #00E5FF;
            --text-dark: #ffffff;
            --text-light: #1a1a2e;
        }

        body {
            font-family: 'Exo 2', sans-serif;
            min-height: 100vh;
            overflow: hidden;
            transition: all 0.6s ease;
        }

        /* ===== BACKGROUNDS ===== */
        .bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            transition: opacity 0.6s ease;
        }

        .bg.dark-bg {
            background: url('dark-bg.webp') center/cover no-repeat;
            opacity: 1;
        }

        .bg.day-bg {
            background: url('day-bg.webp') center/cover no-repeat;
            opacity: 0;
            position: absolute;
        }

        body.day .dark-bg { opacity: 0; }
        body.day .day-bg { opacity: 1; }

        /* ===== GLASSMORPHISM OVERLAY ===== */


        /* ===== GLOW ACCENTS ===== */
        body.dark .glow-line {
            position: fixed;
            z-index: 1;
            pointer-events: none;
        }

        .glow-h {
            width: 200px; height: 1px;
            top: 20%; left: 5%;
            background: linear-gradient(90deg, transparent, var(--accent2), transparent);
            box-shadow: 0 0 20px var(--accent2);
        }

        .glow-h2 {
            width: 150px; height: 1px;
            bottom: 25%; right: 8%;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            box-shadow: 0 0 15px var(--accent);
        }

        body.day .glow-h,
        body.day .glow-h2 { display: none; }

        /* ===== TOP BAR ===== */
        .top-bar {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px 30px;
        }

        /* Brand */
        .brand {
            transition: all 0.4s;
        }

        body.dark .brand { color: var(--text-dark); }
        body.day .brand { color: var(--text-light); }

        .brand-name {
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .brand-sub {
            font-size: 0.6rem;
            font-weight: 300;
            letter-spacing: 5px;
            opacity: 0.6;
            margin-top: 2px;
            font-family: 'Exo 2', sans-serif;
        }

        /* Social Icons - Line Art */
        .social {
            display: flex;
            gap: 12px;
        }

        .social a {
            width: 38px; height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.35s ease;
            text-decoration: none;
            border: 1.5px solid transparent;
        }

        body.dark .social a {
            background: var(--glass-dark);
            border-color: rgba(108, 99, 255, 0.25);
            color: rgba(255,255,255,0.7);
            backdrop-filter: blur(10px);
        }

        body.dark .social a:hover {
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(108, 99, 255, 0.4);
            transform: translateY(-3px);
            color: var(--accent2);
        }

        body.day .social a {
            background: var(--glass-light);
            border-color: rgba(108, 99, 255, 0.2);
            color: rgba(26,26,46,0.7);
            backdrop-filter: blur(10px);
        }

        body.day .social a:hover {
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(108, 99, 255, 0.25);
            transform: translateY(-3px);
            color: var(--accent);
        }

        .social svg {
            width: 16px; height: 16px;
            stroke-width: 1.5;
        }

        /* ===== BOTTOM CONTROLS ===== */
        .controls {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .toggle-label {
            font-size: 0.75rem;
            transition: color 0.4s;
        }

        body.dark .toggle-label { color: rgba(255,255,255,0.5); }
        body.day .toggle-label { color: rgba(26,26,46,0.45); }

        /* Theme Toggle - Futuristic Pill */
        .toggle-wrap {
            position: relative;
            width: 52px; height: 26px;
            cursor: pointer;
        }

        .toggle-wrap input { display: none; }

        .toggle-track {
            position: absolute;
            inset: 0;
            border-radius: 13px;
            transition: all 0.4s ease;
        }

        body.dark .toggle-track {
            background: rgba(10,10,30,0.7);
            border: 1.5px solid rgba(108,99,255,0.3);
            box-shadow: 0 0 10px rgba(108,99,255,0.15);
        }

        body.day .toggle-track {
            background: rgba(255,255,255,0.7);
            border: 1.5px solid rgba(108,99,255,0.2);
            box-shadow: 0 0 10px rgba(108,99,255,0.1);
        }

        .toggle-thumb {
            position: absolute;
            top: 3px; left: 3px;
            width: 18px; height: 18px;
            border-radius: 50%;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            display: flex; align-items: center; justify-content: center;
        }

        body.dark .toggle-thumb {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            box-shadow: 0 0 8px rgba(108,99,255,0.6);
        }

        body.day .toggle-thumb {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            box-shadow: 0 0 8px rgba(108,99,255,0.5);
        }

        .toggle-thumb svg {
            width: 10px; height: 10px;
            stroke: white;
            stroke-width: 2;
            fill: none;
        }

        #theme-toggle:checked ~ .toggle-track .toggle-thumb { left: 29px; }

        /* Under Construction - Plain Text */
        .uc-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.35s ease;
            padding: 6px 0;
        }

        body.dark .uc-text {
            color: rgba(231, 76, 60, 0.7);
        }

        body.dark .uc-text:hover {
            color: rgba(231, 76, 60, 1);
        }

        body.day .uc-text {
            color: rgba(231, 76, 60, 0.7);
        }

        body.day .uc-text:hover {
            color: rgba(231, 76, 60, 1);
        }

        .uc-text.hidden {
            opacity: 0.3;
            text-decoration: line-through;
        }

        /* Hint text */
        .hint {
            font-size: 0.6rem;
            opacity: 0;
            transition: opacity 0.3s;
            text-align: center;
            margin-top: 6px;
            letter-spacing: 1px;
        }

        body.dark .hint { color: rgba(255,255,255,0.3); }
        body.day .hint { color: rgba(26,26,46,0.3); }
        .hint.show { opacity: 1; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 500px) {
            .brand-name { font-size: 0.85rem; letter-spacing: 2px; }
            .social a { width: 32px; height: 32px; }
            .controls { gap: 10px; }
            .badge { padding: 5px 12px; font-size: 0.55rem; }
            .top-bar { padding: 16px 20px; }
        }
    </style>
</head>
<body class="dark">

    <!-- Backgrounds -->
    <div class="bg dark-bg"></div>
    <div class="bg day-bg"></div>

    <!-- Overlay -->
    <div class="overlay"></div>

    <!-- Futuristic Glow Lines -->
    <div class="glow-line glow-h"></div>
    <div class="glow-line glow-h2"></div>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="brand">
            <div class="brand-name">Amr Sabry</div>
            <div class="brand-sub">Creative Director</div>
        </div>

        <div class="social">
            <!-- Instagram - Line Art -->
            <a href="#" title="Instagram">
                <i data-lucide="instagram"></i>
            </a>
            <!-- Twitter/X - Line Art -->
            <a href="#" title="Twitter">
                <i data-lucide="twitter"></i>
            </a>
            <!-- LinkedIn - Line Art -->
            <a href="#" title="LinkedIn">
                <i data-lucide="linkedin"></i>
            </a>
            <!-- Behance - Line Art -->
            <a href="#" title="Behance">
                <i data-lucide="figma"></i>
            </a>
            <!-- Dribbble -->
            <a href="#" title="Dribbble">
                <i data-lucide="dribbble"></i>
            </a>
        </div>
    </div>

    <!-- Bottom Controls -->
    <div class="controls">
        <span class="toggle-label">☀</span>

        <label class="toggle-wrap">
            <input type="checkbox" id="theme-toggle" checked>
            <div class="toggle-track">
                <div class="toggle-thumb">
                    <i data-lucide="sun"></i>
                </div>
            </div>
        </label>

        <span class="toggle-label">◐</span>

        <div class="uc-text" id="uc-badge">Under Construction</div>
    </div>

    <div class="hint" id="hint">tap badge to toggle</div>

    <script>
        // Init Lucide icons
        lucide.createIcons();

        // Theme Toggle
        const toggle = document.getElementById('theme-toggle');

        toggle.addEventListener('change', () => {
            if (toggle.checked) {
                document.body.classList.remove('day');
                document.body.classList.add('dark');
            } else {
                document.body.classList.remove('dark');
                document.body.classList.add('day');
            }
            lucide.createIcons();
        });

        // Under Construction Toggle
        const badge = document.getElementById('uc-badge');
        const hint = document.getElementById('hint');
        let ucVisible = true;

        // Show hint
        setTimeout(() => {
            hint.classList.add('show');
            setTimeout(() => hint.classList.remove('show'), 2000);
        }, 800);

        badge.addEventListener('click', () => {
            ucVisible = !ucVisible;
            if (ucVisible) {
                badge.classList.remove('hidden');
                badge.textContent = 'Under Construction';
                hint.textContent = 'visible';
            } else {
                badge.classList.add('hidden');
                badge.textContent = 'Hidden';
                hint.textContent = 'hidden';
            }
            hint.classList.add('show');
            setTimeout(() => hint.classList.remove('show'), 1200);
        });
    </script>
</body>
</html>

/* ================= renderer / scene ================= */

/* sky: gradient, sun glow, procedural clouds */
const SUN_DIR = new THREE.Vector3(0.55, 0.19, 0.81).normalize();
const sky = new THREE.Mesh(new THREE.SphereGeometry(5000, 48, 24), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { sun: { value: SUN_DIR } },
  vertexShader: `varying vec3 vW; void main(){ vW = normalize((modelMatrix*vec4(position,1.)).xyz - cameraPosition); gl_Position = projectionMatrix*viewMatrix*modelMatrix*vec4(position,1.);} `,
  fragmentShader: `uniform vec3 sun; varying vec3 vW;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
    float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
      return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y); }
    float fbm(vec2 p){ float v=0., a=.5; for(int i=0;i<5;i++){ v+=a*noise(p); p*=2.03; a*=.5; } return v; }
    void main(){
      vec3 d = normalize(vW); float h = clamp(d.y, -.1, 1.);
      vec3 hor = vec3(.98,.72,.47), mid = vec3(.62,.70,.78), top = vec3(.20,.36,.52);
      vec3 c = mix(hor, mid, smoothstep(0., .18, h)); c = mix(c, top, smoothstep(.18, .75, h));
      float s = max(dot(d, normalize(sun)), 0.);
      c += vec3(1.,.66,.32)*pow(s,10.)*.55 + vec3(1.,.85,.6)*pow(s,120.)*1.2 + vec3(1.,.95,.85)*pow(s,2400.)*6.;
      if (d.y > 0.02) { vec2 uv = d.xz/(d.y+.08)*1.6; float cl = smoothstep(.55,.85, fbm(uv*1.3 + vec2(3.,7.)));
        vec3 cc = mix(vec3(.95,.78,.6), vec3(1.,.9,.75), pow(s,6.)); c = mix(c, cc, cl*.55*smoothstep(.02,.15,d.y)); }
      gl_FragColor = vec4(c,1.); }`

scene.add(sky);
{ const es = new THREE.Scene(); es.add(sky.clone()); const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromScene(es, 0.03).texture; }

/* ================= textures (drawn from the reference photos) ================= */
function ctex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = MAXANI; return t;
}
const rep = (t, u, v) => { const c = t.clone(); c.needsUpdate = true; c.repeat.set(u, v); return c; };

    const pal = ['#1d3550', '#28466a', '#3b6189', '#152a40', '#5a7fa3', '#86a6c2', '#c9a46e'];

  siloTower: ctex(128, 128, (g, w, h) => { noiseFill(g, w, h, '#c6baa4', 12); g.fillStyle = 'rgba(70,60,48,.2)'; g.fillRect(0, 60, w, 2); g.fillStyle = '#5a5f63'; g.fillRect(40, 30, 22, 16); g.fillStyle = '#e8e8e8'; g.fillRect(42, 32, 18, 3); }),
  city: ctex(128, 128, (g, w, h) => { noiseFill(g, w, h, '#dccbb0', 8); g.fillStyle = '#56575a'; for (const [x, y] of [[18, 22], [74, 22], [18, 82], [74, 82]]) g.fillRect(x, y, 34, 22); g.fillStyle = 'rgba(0,0,0,.08)'; g.fillRect(0, 62, w, 3); }),
  road: ctex(64, 256, (g, w, h) => { noiseFill(g, w, h, '#3b3b3f', 14, 1500); g.fillStyle = '#e9e3d4'; g.fillRect(30, 0, 4, 120); g.fillStyle = '#c9b36a'; g.fillRect(2, 0, 3, h); g.fillRect(w - 5, 0, 3, h); }),
  paving: ctex(256, 256, (g, w, h) => { g.fillStyle = '#ddd2c0'; g.fillRect(0, 0, w, h); for (let y = 0; y < h; y += 64) for (let x = 0; x < w; x += 64) { g.fillStyle = (x + y) % 128 ? '#9d9284' : '#c7bba8'; g.beginPath(); g.moveTo(x + 32, y + 6); g.lineTo(x + 58, y + 32); g.lineTo(x + 32, y + 58); g.lineTo(x + 6, y + 32); g.fill(); } }),
  grass: ctex(256, 256, (g, w, h) => { noiseFill(g, w, h, '#5f8a3e', 22, 9000); }),
  ground: ctex(512, 512, (g, w, h) => { noiseFill(g, w, h, '#c99d66', 18, 20000); }),
  urbanGround: ctex(512, 512, (g, w, h) => { noiseFill(g, w, h, '#b9a78c', 14, 15000); }),
  panel: ctex(128, 64, (g, w, h) => { g.fillStyle = '#1e3248'; g.fillRect(0, 0, w, h); g.strokeStyle = '#8fa2b4'; g.lineWidth = 1.5; for (let x = 0; x <= w; x += 16) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); } for (let y = 0; y <= h; y += 16) { g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); } }),
  trainHead: ctex(1024, 256, (g, w, h) => {
    g.fillStyle = '#f4f4f2'; g.fillRect(0, 0, w, h); g.fillStyle = '#3a3f45'; g.fillRect(0, 214, w, 42);
    const sw = (col, lw, y0, y1, y2) => { g.strokeStyle = col; g.lineWidth = lw; g.beginPath(); g.moveTo(0, y0); g.bezierCurveTo(w * .35, y0 - 10, w * .55, y1, w * .78, y1 - 20); g.bezierCurveTo(w * .9, y1 - 34, w * .97, y2, w, y2); g.stroke(); };
    sw('#c8a54c', 6, 168, 150, 60); sw('#1f7a4b', 10, 182, 168, 82); sw('#c8a54c', 4, 196, 184, 104); sw('#1f7a4b', 5, 206, 198, 124);
    g.fillStyle = '#2b3036'; g.fillRect(880, 60, 26, 120); g.fillStyle = '#9aa3aa'; g.fillRect(884, 64, 18, 4);
  }),
  trainCar: ctex(512, 128, (g, w, h) => { g.fillStyle = '#f4f4f2'; g.fillRect(0, 0, w, h); g.fillStyle = '#3a3f45'; g.fillRect(0, 106, w, 22); g.fillStyle = '#26303a'; for (let x = 24; x < w - 40; x += 58) g.fillRect(x, 36, 44, 26); g.fillStyle = '#1f7a4b'; g.fillRect(0, 92, w, 4); g.fillStyle = '#c8a54c'; g.fillRect(0, 98, w, 2); }),
};
T.ground.repeat.set(160, 160);

const std = (o) => new THREE.MeshStandardMaterial(Object.assign({ roughness: .85 }, o));
const M = {
  white: std({ color: 0xf2f0ea, roughness: .6 }), stone: std({ color: 0xd8bc90 }), beige: std({ color: 0xe6dccb }),
  dark: std({ color: 0x2a2c30, roughness: .6 }), steel: std({ color: 0xc9ccd1, roughness: .28, metalness: .65 }),
  green: std({ color: 0xffffff, roughness: 1, map: rep(T.grass, 4, 4) }), trunk: std({ color: 0x8c6c4a }), frond: std({ color: 0xffffff, side: THREE.DoubleSide }),
  yellow: std({ color: 0xd8b860, roughness: .6, metalness: .2 }), rail: std({ color: 0x8a8a90, roughness: .35, metalness: .8 }),
  conc: std({ color: 0xcbc3b3 }), turbine: std({ color: 0xf2f3f4, roughness: .4 }),
};

/* ================= helpers ================= */
const _o = new THREE.Object3D();
const add = (geo, mat, x, y, z, parent = scene) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; parent.add(m); return m; };
function tbox(w, h, d, x, y, z, o = {}) {
  const tw = o.tw || 4, th = o.th || 4;
  const mk = (t, u, v) => t ? std(Object.assign({ map: rep(t, u, v) }, o.mat || {})) : (o.base || M.beige);
  const side = mk(o.side || o.front, d / tw, h / th), front = mk(o.front, w / tw, h / th), top = o.top || M.beige;
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), [side, side, top, top, front, front]);
  m.position.set(x, y + h / 2, z); m.rotation.y = o.ry || 0; m.castShadow = m.receiveShadow = true; (o.parent || scene).add(m); return m;
}
const box = (w, h, d, mat, x, y, z, ry = 0, parent = scene) => { const m = add(new THREE.BoxGeometry(w, h, d), mat, x, y + h / 2, z, parent); m.rotation.y = ry; return m; };
const cyl = (r, h, mat, x, y, z, seg = 32, r2 = r) => add(new THREE.CylinderGeometry(r2, r, h, seg), mat, x, y + h / 2, z);
function flat(w, d, mat, x, y, z) { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat); m.rotation.x = -Math.PI / 2; m.position.set(x, y, z); m.receiveShadow = true; scene.add(m); return m; }

flat(9000, 9000, std({ color: 0xffffff, map: T.ground, roughness: 1 }), 400, 0, 0);

/* palms: trunk + drooping fronds */
const PALMS = [];
const palm = (x, z, s = 1) => PALMS.push([x, z, s]);
function buildPalms() {
  const n = PALMS.length, F = 9;
  const trunk = new THREE.InstancedMesh(new THREE.CylinderGeometry(.28, .45, 1, 6), M.trunk, n);
  const fg = new THREE.BoxGeometry(.55, .05, 4.8); fg.translate(0, 0, 2.4);
  const fr = new THREE.InstancedMesh(fg, M.frond, n * F);
  const col = new THREE.Color();
  PALMS.forEach(([x, z, s], i) => {
    const H = (8 + rand() * 4) * s;
    _o.position.set(x, H / 2, z); _o.rotation.set(0, 0, (rand() - .5) * .08); _o.scale.set(s, H, s); _o.updateMatrix(); trunk.setMatrixAt(i, _o.matrix);
    for (let k = 0; k < F; k++) {
      _o.position.set(x, H, z); _o.rotation.set(0, k / F * Math.PI * 2 + rand() * .3, 0); _o.rotateX(.45 + rand() * .45); _o.scale.set(s, s, s * (.85 + rand() * .3)); _o.updateMatrix();
      fr.setMatrixAt(i * F + k, _o.matrix); fr.setColorAt(i * F + k, col.setHSL(.27 + rand() * .04, .45, .26 + rand() * .08));
    }
  });

}

/* roads + moving cars */
const ROADS = [];
function road(x0, z0, x1, z1, w = 14) {
  const len = Math.hypot(x1 - x0, z1 - z0), ang = Math.atan2(x1 - x0, z1 - z0);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, len), std({ map: rep(T.road, 1, len / 18), roughness: .95 }));
  m.rotation.order = 'YXZ'; m.rotation.y = ang; m.rotation.x = -Math.PI / 2; m.position.set((x0 + x1) / 2, .06, (z0 + z1) / 2); m.receiveShadow = true; scene.add(m);
  ROADS.push([x0, z0, x1, z1, w, len]);
}
let CARS = null; const CARDATA = [];
function buildCars() {
  const per = 9, n = ROADS.length * per * 2;
  CARS = new THREE.InstancedMesh(new THREE.BoxGeometry(2, 1.5, 4.4), std({ color: 0xffffff, roughness: .3, metalness: .5 }), n);
  const cols = [0xf2f2f2, 0x1d1d20, 0x8f959b, 0xc7c9cc, 0x7a1f1f, 0x2b3b55, 0xe9e4d8]; let k = 0;
  ROADS.forEach(r => { for (let d = 0; d < 2; d++) for (let i = 0; i < per; i++) { CARDATA.push({ r, dir: d ? 1 : -1, off: rand(), sp: 14 + rand() * 10 }); CARS.setColorAt(k++, new THREE.Color(cols[Math.floor(rand() * cols.length)])); } });
  CARS.castShadow = true; scene.add(CARS);
}
function updateCars(t) {
  if (!CARS) return;
  CARDATA.forEach((c, i) => {
    const [x0, z0, x1, z1, w, len] = c.r; let u = (c.off + c.dir * c.sp * t / len) % 1; if (u < 0) u += 1;
    const lat = c.dir * w * .2, nx = (z1 - z0) / len, nz = -(x1 - x0) / len;
    _o.position.set(x0 + (x1 - x0) * u + nx * lat, .85, z0 + (z1 - z0) * u + nz * lat);
    _o.rotation.set(0, Math.atan2(x1 - x0, z1 - z0) + (c.dir < 0 ? Math.PI : 0), 0); _o.scale.set(1, 1, 1); _o.updateMatrix(); CARS.setMatrixAt(i, _o.matrix);
  });
  CARS.instanceMatrix.needsUpdate = true;

  for (let i = 0; i < 14; i++) mountain(-560 + i * 78 + rand() * 40, -620 - rand() * 260, 120 + rand() * 90, 90 + rand() * 150, 90 + rand() * 60);
  for (let i = 0; i < 10; i++) mountain(760 + i * 120, 620 + rand() * 300, 160 + rand() * 120, 50 + rand() * 70, 120);
})();
buildPalms(); buildCars(); buildPeople();

/* ================= FPV camera: one smooth spline, continuous speed, banking from yaw-rate ================= */
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const WP = [
  [0.00, V(-175, 44, 132)], [0.50, V(-98, 23, 58)], [0.95, V(-34, 11, 10)], [1.35, V(36, 9, -24)], [1.70, V(108, 19, -14)],
  [2.05, V(164, 31, -20)], [2.40, V(226, 19, -20)], [2.75, V(288, 34, -22)], [3.05, V(330, 76, 22)], [3.40, V(392, 44, 110)],
  [3.75, V(448, 13.5, 101)], [4.15, V(508, 13.5, 99)], [4.50, V(546, 34, 66)], [4.90, V(540, 82, 34)], [5.25, V(586, 138, 26)],
  [5.65, V(640, 52, -36)], [6.00, V(700, 8.5, -56)], [6.40, V(792, 10, -52)], [6.80, V(860, 24, 6)], [7.25, V(936, 28, 12)],
  [7.65, V(1022, 38, 10)], [8.08, V(1112, 58, 34)],
];
const curve = new THREE.CatmullRomCurve3(WP.map(w => w[1]), false, 'centripetal');
const tk = WP.map(w => w[0]), pk = WP.map((_, i) => i / (WP.length - 1));
const mk = (() => { const n = tk.length, d = [], m = []; for (let i = 0; i < n - 1; i++) d.push((pk[i + 1] - pk[i]) / (tk[i + 1] - tk[i]));
  m[0] = d[0]; m[n - 1] = d[n - 2]; for (let i = 1; i < n - 1; i++) m[i] = (d[i - 1] + d[i]) / 2; return m; })();
function param(t) {
  t = Math.min(Math.max(t, 0), DUR); let i = 0; while (i < tk.length - 2 && tk[i + 1] <= t) i++;
  const h = tk[i + 1] - tk[i], s = (t - tk[i]) / h, s2 = s * s, s3 = s2 * s;
  return (2 * s3 - 3 * s2 + 1) * pk[i] + (s3 - 2 * s2 + s) * h * mk[i] + (-2 * s3 + 3 * s2) * pk[i + 1] + (s3 - s2) * h * mk[i + 1];
}
const posAt = t => curve.getPoint(Math.min(Math.max(param(t), 0), 1));
let TIME = 0;
const SUBJ = [
  [0.0, () => V(0, 16, -58)], [1.65, () => V(328, 40, -20)], [3.15, () => V(trainX(Math.min(Math.max(TIME, 3.2), 4.4)) + 4, DECK + 3, TZ)],
  [4.35, () => V(526, 84, -6)], [5.5, () => V(760, 30, -240)], [6.6, () => V(1010, 30, -42)],
];
const sstep = (a, b, x) => { const u = Math.min(Math.max((x - a) / (b - a), 0), 1); return u * u * (3 - 2 * u); };
function subjectAt(t) { let p = SUBJ[0][1](); for (let i = 1; i < SUBJ.length; i++) p.lerp(SUBJ[i][1](), sstep(SUBJ[i][0] - .3, SUBJ[i][0] + .3, t)); return p; }
function lookDir(t) {
  const p = posAt(t), fwd = posAt(t + .22).sub(p).normalize();
  const sub = subjectAt(t).sub(p).normalize();
  return fwd.multiplyScalar(.45).add(sub.multiplyScalar(.55)).normalize();
}
function smoothLook(t) { const d = new THREE.Vector3(); for (const [o, w] of [[-.08, .2], [0, .6], [.08, .2]]) d.addScaledVector(lookDir(t + o), w); return d.normalize(); }
function yawRate(t) { const a = smoothLook(t - .1), b = smoothLook(t + .1); let d = Math.atan2(b.x, b.z) - Math.atan2(a.x, a.z); if (d > Math.PI) d -= 2 * Math.PI; if (d < -Math.PI) d += 2 * Math.PI; return d / .2; }
function rollAt(t) { let r = 0; for (const [o, w] of [[-.15, .25], [0, .5], [.15, .25]]) r += w * yawRate(t + o); return THREE.MathUtils.clamp(-r * 11, -22, 22); }

/* ================= place / render ================= */
let mode = 'fpv';
const controls = new OrbitControls(camera, canvas); controls.enabled = false; controls.enableDamping = true;
function place(t) {
  TIME = t;
  TRAIN.position.x = trainX(t);
  BLADES.forEach((b, i) => b.rotation.z = t * 1.3 + i);
  updateCars(t);
  if (mode === 'fpv') {
    const p = posAt(t), d = smoothLook(t);
    p.x += Math.sin(t * 31) * .05 + Math.sin(t * 53) * .03; p.y += Math.sin(t * 27 + 1) * .05;
    camera.position.copy(p); camera.up.set(0, 1, 0); camera.lookAt(p.clone().add(d)); camera.rotateZ(THREE.MathUtils.degToRad(rollAt(t)));
  }
  const focus = mode === 'fpv' ? camera.position.clone().addScaledVector(smoothLook(t), 90) : controls.target.clone();
  sun.target.position.copy(focus); sun.position.copy(focus).addScaledVector(SUN_DIR, 600); sun.target.updateMatrixWorld();
  sky.position.copy(camera.position);
}
function resize() {
  const w = CAPTURE ? +(Q.get('w') || 1920) : innerWidth, h = CAPTURE ? +(Q.get('h') || 1080) : innerHeight;
  renderer.setSize(w, h, !CAPTURE); if (CAPTURE) { canvas.style.width = w + 'px'; canvas.style.height = h + 'px'; }
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
window.WW = { renderAt(t) { place(t); renderer.render(scene, camera); return true; }, DUR };

const ZONES = [
  [0, 'King Faisal Specialist Hospital', 'Health sector', V(0, 15, -50), 'KFSH'],
  [1.65, 'Princess Nourah University', 'Education', V(300, 18, -20), 'PNU'],
  [3.15, 'Haramain High-Speed Railway', 'Transport', V(470, 10, 82), 'Haramain'],
  [4.35, 'Communications, Space & Technology Commission', 'Communications · Space · Technology', V(526, 60, -6), 'CST'],
  [5.5, 'Solar & wind', 'Renewable energy', V(740, 20, -80), 'Solar & wind'],
  [6.6, 'Grain silos', 'Food security', V(1000, 25, -42), 'Silos'],
];
const zoneAt = t => { let z = 0; ZONES.forEach((q, i) => { if (t >= q[0]) z = i; }); return z; };
if (!CAPTURE) {
  const $ = s => document.querySelector(s);
  let t = 0, speed = 1, playing = true, last = performance.now();
  const fmt = x => { const f = Math.round(x * 25); return String(Math.floor(f / 25)).padStart(2, '0') + ':' + String(f % 25).padStart(2, '0'); };
  $('#chips').innerHTML = ZONES.map((z, i) => `<button data-z="${i}"><b>0${i + 1}</b><span>${z[4]}</span></button>`).join('');
  document.querySelectorAll('#chips button').forEach(b => b.onclick = () => {
    const z = ZONES[+b.dataset.z];
    if (mode === 'orbit') { controls.target.copy(z[3]); camera.position.copy(z[3]).add(V(-80, 55, 110)); } else t = z[0] + .02;
  });
  $('#play').onclick = () => { playing = !playing; $('#play').textContent = playing ? '❚❚ Pause' : '▶ Play'; };
  document.querySelectorAll('#speeds button').forEach(b => b.onclick = () => { speed = +b.dataset.s; document.querySelectorAll('#speeds button').forEach(x => x.classList.toggle('on', x === b)); });
  document.querySelectorAll('#modes button').forEach(b => b.onclick = () => {
    mode = b.dataset.m; document.querySelectorAll('#modes button').forEach(x => x.classList.toggle('on', x === b));
    controls.enabled = mode === 'orbit';
    if (mode === 'orbit') { const z = ZONES[zoneAt(t)]; camera.up.set(0, 1, 0); controls.target.copy(z[3]); camera.position.copy(z[3]).add(V(-80, 55, 110)); controls.update(); }
  });
  const scrub = $('#scrub'); scrub.oninput = () => { t = +scrub.value; playing = false; $('#play').textContent = '▶ Play'; };
  if (Q.has('t')) t = +Q.get('t');
  (function loop(now) {
    const dt = Math.min((now - last) / 1000, .1); last = now;
    if (playing) { t += dt * speed; if (t > DUR) t = 0; }
    if (mode === 'orbit') controls.update();
    place(t); renderer.render(scene, camera);
    const zi = zoneAt(t), z = ZONES[zi];
    $('#proj').innerHTML = `0${zi + 1} · ${z[1]}<small>${z[2]}</small>`;
    $('#tc').textContent = fmt(t) + ' / ' + fmt(DUR);
    if (playing) scrub.value = t.toFixed(2);
    document.querySelectorAll('#chips button').forEach((b, i) => b.classList.toggle('on', i === zi));
    requestAnimationFrame(loop);
  })(performance.now());
}
</script>

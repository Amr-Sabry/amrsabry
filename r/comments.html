<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Aroma Hub · التعليقات</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ink:#0d0b0a; --cell:#141110; --cell-2:#1b1614; --line:#2e2622; --line-2:#463831;
  --text:#f3ece6; --muted:#9d9087; --aroma:#ef4122; --or:#ff8a1f; --aroma-ink:#180703; --guide:#4fb3b0; --ok:#7fd6a2;
  --display:"Michroma","Eurostile","Arial Black",sans-serif;
  --ui:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--ui);font-size:15.5px;line-height:1.6}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:22px 18px 80px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line)}
.brand b{display:block;font-family:var(--display);font-weight:400;font-size:10px;letter-spacing:.34em;color:var(--muted);direction:ltr;text-align:right}
h1{font-weight:700;font-size:clamp(24px,3.2vw,36px);line-height:1.2;margin:2px 0 0}
.btn{min-height:42px;padding:0 16px;background:none;border:1px solid var(--line-2);color:var(--text);clip-path:polygon(0 0,100% 0,100% 100%,10px 100%,0 calc(100% - 10px))}
.btn:hover{border-color:var(--text)}
.btn.go{background:var(--aroma);border-color:var(--aroma);color:#fff;font-weight:700}
.btn.go:hover{background:var(--or);border-color:var(--or);color:var(--aroma-ink)}
.btn.warn{border-color:var(--aroma);color:var(--aroma)}
.btn[disabled]{opacity:.5;cursor:default}
.btn:focus-visible,input:focus-visible,.chip:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.tools{display:flex;gap:8px}

/* lock */
.lock{max-width:440px;margin:9vh auto 0;background:var(--cell);border:1px solid var(--line);padding:24px}
.lock h2{margin:0 0 6px;font-size:20px}
.lock p{margin:0 0 16px;color:var(--muted);font-size:14.5px}
.lock label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.lock input{width:100%;background:var(--ink);border:1px solid var(--line-2);padding:11px 12px;font-family:var(--mono);direction:ltr;text-align:left}
.lock .row{display:flex;gap:10px;margin-top:14px;align-items:center}
.msg{min-height:22px;font-size:14px;color:var(--or);margin:10px 0 0}

/* filters */
.bar{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:18px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 13px;background:none;border:1px solid var(--line-2);color:var(--muted);font-size:14px}
.chip[aria-pressed=true]{background:var(--text);border-color:var(--text);color:var(--aroma-ink);font-weight:600}
.chip i{font-style:normal;font-family:var(--mono);font-size:12px;opacity:.75}
.count{color:var(--muted);font-size:14px}

/* cards */
.list{display:flex;flex-direction:column;gap:18px}
.card{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);background:var(--cell);border:1px solid var(--line);scroll-margin-top:16px}
.card.done{opacity:.72}
.card.hit{border-color:var(--or);box-shadow:0 0 0 1px var(--or)}
.shot{position:relative;background:#050404;border-inline-end:1px solid var(--line);min-height:180px;display:flex;align-items:center;justify-content:center}
.shot a{display:block;position:relative;width:100%}
.shot img{display:block;width:100%;height:auto}
.shot .wait{color:var(--muted);font-size:13px;padding:30px}
.ring{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;border:3px solid var(--or);box-shadow:0 0 0 4px rgba(255,138,31,.3);pointer-events:none;opacity:0;transition:opacity .15s}
.ring.on{opacity:1}
.body{padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.who{font-size:19px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.when{font-size:13px;color:var(--muted)}
.badge{flex:none;font-size:12.5px;padding:2px 10px;border:1px solid var(--or);color:var(--or)}
.done .badge{border-color:var(--ok);color:var(--ok)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:12.5px;padding:2px 9px;border:1px solid var(--line-2);color:var(--muted);overflow-wrap:anywhere}
.pill.room{font-family:var(--mono);color:var(--guide);border-color:rgba(79,179,176,.5);direction:ltr}
.gen{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;border-inline-start:3px solid var(--line-2);padding-inline-start:12px}
.pins{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.pins li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;padding:4px;margin:-4px;cursor:default}
.pins li:hover{background:var(--cell-2)}
.pins b{width:28px;height:28px;border-radius:50%;background:#e2300f;color:#fff;font:700 13.5px/28px var(--mono);text-align:center}
.pins span{white-space:pre-wrap;overflow-wrap:anywhere}
.pins .blank{color:var(--muted)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.acts .btn{min-height:38px;padding:0 13px;font-size:14px}
.empty{border:1px dashed var(--line-2);padding:44px 18px;text-align:center;color:var(--muted)}
.more{display:flex;justify-content:center;margin-top:20px}
@media (max-width:820px){.card{grid-template-columns:1fr}.shot{border-inline-end:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><b>AROMA HUB</b><h1>التعليقات</h1></div>
    <div class="tools" id="tools" hidden>
      <button class="btn" type="button" id="b-refresh">حدّث</button>
      <button class="btn" type="button" id="b-lock">اقفل</button>
    </div>
  </header>

  <section class="lock" id="lock">
    <h2>افتح صفحة التعليقات</h2>
    <p>نفس كلمة سر صفحة الأدمن. بتتحوّل لمفتاح جوّه المتصفح، وكلمة السر نفسها ما بتتبعتش لأي مكان.</p>
    <form id="f-lock">
      <label for="pass">كلمة سر الأدمن</label>
      <input id="pass" type="password" autocomplete="off" spellcheck="false">
      <div class="row"><button class="btn go" type="submit" id="b-unlock">افتح</button></div>
      <p class="msg" id="lock-msg" role="alert"></p>
    </form>
  </section>

  <main id="main" hidden>
    <div class="bar">
      <div class="chips" id="rooms" role="group" aria-label="المشروع"></div>
      <div class="chips" id="states" role="group" aria-label="الحالة">
        <button class="chip" type="button" data-s="new" aria-pressed="true">جديد</button>
        <button class="chip" type="button" data-s="done" aria-pressed="false">تم</button>
        <button class="chip" type="button" data-s="all" aria-pressed="false">الكل</button>
      </div>
    </div>
    <p class="count" id="count"></p>
    <div class="list" id="list"></div>
    <div class="more"><button class="btn" type="button" id="b-more" hidden>حمّل الأقدم</button></div>
    <p class="msg" id="main-msg" role="alert"></p>
  </main>
</div>
<script>
(function(){
  'use strict';
  var API='/api/notes', $=function(id){ return document.getElementById(id); };
  var K='', NOTES=[], TOTAL=0, ROOM='', STATE='new', URLS={}, busy=false;
  function el(tag,cls,txt){ var e=document.createElement(tag); if(cls) e.className=cls; if(txt!=null) e.textContent=txt; return e; }
  function hex(buf){ return Array.prototype.map.call(new Uint8Array(buf),function(b){ return ('0'+b.toString(16)).slice(-2); }).join(''); }
  function unb64(s){ var b=atob(s), a=new Uint8Array(b.length), i; for(i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a; }
  function say(id,t){ $(id).textContent=t||''; }

  /* the passphrase becomes a key here; only the key travels, and the hub only knows the key's fingerprint */
  function derive(pass){
    return fetch('/r/_notes.json',{cache:'no-store'}).then(function(r){ if(!r.ok) throw new Error('setup'); return r.json(); }).then(function(v){
      return crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveBits'])
        .then(function(k){ return crypto.subtle.deriveBits({name:'PBKDF2',salt:unb64(v.s),iterations:v.n,hash:'SHA-256'},k,256); })
        .then(function(bits){ return crypto.subtle.digest('SHA-256',bits).then(function(d){ if(hex(d)!==v.h) throw new Error('wrong'); return hex(bits); }); });
    });
  }
  function call(path,opt){ opt=opt||{}; opt.headers=Object.assign({'x-hub-key':K},opt.headers||{}); opt.cache='no-store';
    return fetch(API+path,opt).then(function(r){ if(r.status===401){ lock('المفتاح اتغيّر. اكتب كلمة السر تاني.'); throw new Error('key'); } if(!r.ok) throw new Error('http '+r.status); return r; }); }

  function lock(msg){ K=''; try{ sessionStorage.removeItem('hub-notes-key'); }catch(e){} Object.keys(URLS).forEach(function(k){ URL.revokeObjectURL(URLS[k]); }); URLS={}; NOTES=[];
    $('list').textContent=''; $('main').hidden=true; $('tools').hidden=true; $('lock').hidden=false; say('lock-msg',msg||''); $('pass').focus(); }
  function unlocked(){ $('lock').hidden=true; $('main').hidden=false; $('tools').hidden=false; var h=decodeURIComponent(location.hash.slice(1)).split('/'); if(h.length===2){ STATE='all'; press('states','s','all'); } load(true); }

  $('f-lock').addEventListener('submit',function(e){ e.preventDefault(); var p=$('pass').value; if(!p){ say('lock-msg','اكتب كلمة السر.'); return; }
    $('b-unlock').disabled=true; say('lock-msg','بفتح…');
    derive(p).then(function(k){ K=k; try{ sessionStorage.setItem('hub-notes-key',k); }catch(e){} say('lock-msg',''); unlocked(); },
      function(err){ say('lock-msg',err.message==='wrong'?'كلمة السر دي ما بتفتحش.':err.message==='setup'?'صفحة التعليقات لسه ما اتجهّزتش على الموقع.':'حصلت مشكلة. جرّب تاني.'); })
      .then(function(){ $('b-unlock').disabled=false; $('pass').value=''; }); });
  $('b-lock').addEventListener('click',function(){ lock(''); });
  $('b-refresh').addEventListener('click',function(){ load(true); });
  $('b-more').addEventListener('click',function(){ load(false); });

  function press(group,attr,val){ [].forEach.call($(group).children,function(b){ b.setAttribute('aria-pressed',String(b.dataset[attr]===val)); }); }
  $('states').addEventListener('click',function(e){ var b=e.target.closest('.chip'); if(!b) return; STATE=b.dataset.s; press('states','s',STATE); render(); });
  $('rooms').addEventListener('click',function(e){ var b=e.target.closest('.chip'); if(!b) return; ROOM=b.dataset.r; render(); });

  function load(fresh){ if(busy) return; busy=true; say('main-msg',''); $('b-refresh').disabled=true; if(fresh) say('count','بحمّل…');
    call('?from='+(fresh?0:NOTES.length)).then(function(r){ return r.json(); }).then(function(j){ TOTAL=j.total; NOTES=fresh?j.notes:NOTES.concat(j.notes); render(); jump(); },
      function(e){ if(e.message!=='key') say('main-msg','التعليقات ما اتحمّلتش. جرّب «حدّث».'); })
      .then(function(){ busy=false; $('b-refresh').disabled=false; }); }

  function when(iso){ var d=new Date(iso); if(isNaN(d)) return ''; try{ return d.toLocaleString('ar-EG-u-nu-latn',{dateStyle:'medium',timeStyle:'short'}); }catch(e){ return d.toLocaleString(); } }
  var io='IntersectionObserver' in window?new IntersectionObserver(function(en){ en.forEach(function(e){ if(e.isIntersecting){ io.unobserve(e.target); picture(e.target); } }); },{rootMargin:'400px'}):null;
  function picture(box){ var id=box.dataset.k; function show(u){ var a=el('a'), im=el('img'); a.href=u; a.target='_blank'; a.rel='noopener'; a.title='افتح الصورة كاملة'; im.alt='اللقطة وعليها العلامات'; im.src=u; a.appendChild(im); var ring=el('i','ring'); a.appendChild(ring); box.textContent=''; box.appendChild(a); }
    if(URLS[id]){ show(URLS[id]); return; }
    call('?img='+encodeURIComponent(id)).then(function(r){ return r.blob(); }).then(function(b){ URLS[id]=URL.createObjectURL(b); show(URLS[id]); },function(){ box.firstChild.textContent='الصورة ما اتحمّلتش.'; }); }

  function card(n){
    var c=el('article','card'+(n.status==='done'?' done':'')); c.id='n-'+n.id; c.dataset.id=n.room+'/'+n.id;
    var shot=el('div','shot'); shot.dataset.k=n.room+'/'+n.id; shot.appendChild(el('span','wait','بحمّل الصورة…')); c.appendChild(shot);
    var b=el('div','body'), top=el('div','top'), l=el('div'); l.appendChild(el('div','who',n.name||'—')); l.appendChild(el('div','when',when(n.at))); top.appendChild(l); top.appendChild(el('span','badge',n.status==='done'?'تم':'جديد')); b.appendChild(top);
    var pills=el('div','pills'); pills.appendChild(el('span','pill room',n.room)); if(n.context) Object.keys(n.context).forEach(function(k){ if(n.context[k]) pills.appendChild(el('span','pill',n.context[k])); }); b.appendChild(pills);
    if(n.general){ var g=el('p','gen',n.general); g.dir='auto'; b.appendChild(g); }
    if(n.pins&&n.pins.length){ var ul=el('ul','pins'); n.pins.forEach(function(p){ var li=el('li'); li.appendChild(el('b',null,String(p.n))); var s=el('span',p.text?null:'blank',p.text||'علامة من غير كلام'); s.dir='auto'; li.appendChild(s);
        function ring(on){ var r=shot.querySelector('.ring'); if(!r) return; r.style.left=(p.x*100)+'%'; r.style.top=(p.y*100)+'%'; r.classList.toggle('on',on); }
        li.addEventListener('pointerenter',function(){ ring(true); }); li.addEventListener('pointerleave',function(){ ring(false); }); ul.appendChild(li); }); b.appendChild(ul); }
    var acts=el('div','acts'), mark=el('button','btn'+(n.status==='done'?'':' go'),n.status==='done'?'رجّعه جديد':'تم'), rm=el('button','btn','امسح'); mark.type='button'; rm.type='button';
    mark.addEventListener('click',function(){ mark.disabled=true; var to=n.status==='done'?'new':'done';
      call('?a=mark',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({room:n.room,id:n.id,status:to})}).then(function(){ n.status=to; render(); },function(){ mark.disabled=false; say('main-msg','الحالة ما اتغيّرتش. جرّب تاني.'); }); });
    var armed=0; rm.addEventListener('click',function(){ if(!armed){ armed=setTimeout(function(){ armed=0; rm.textContent='امسح'; rm.classList.remove('warn'); },4000); rm.textContent='متأكد؟ امسح نهائي'; rm.classList.add('warn'); return; }
      clearTimeout(armed); rm.disabled=true;
      call('?a=del',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({room:n.room,id:n.id})}).then(function(){ NOTES.splice(NOTES.indexOf(n),1); TOTAL--; render(); },function(){ rm.disabled=false; say('main-msg','التعليق ما اتمسحش. جرّب تاني.'); }); });
    acts.appendChild(mark); acts.appendChild(rm); b.appendChild(acts); c.appendChild(b);
    if(io) io.observe(shot); else picture(shot);
    return c;
  }

  function render(){
    var rooms={}, i; NOTES.forEach(function(n){ rooms[n.room]=(rooms[n.room]||0)+(n.status==='done'?0:1); });
    if(ROOM&&!(ROOM in rooms)) ROOM='';
    var rb=$('rooms'); rb.textContent=''; [''].concat(Object.keys(rooms).sort()).forEach(function(r){ var c=el('button','chip',r||'كل المشاريع'); c.type='button'; c.dataset.r=r; c.setAttribute('aria-pressed',String(r===ROOM));
      var k=r?rooms[r]:NOTES.filter(function(n){ return n.status!=='done'; }).length; if(k){ c.appendChild(el('i',null,String(k))); } rb.appendChild(c); });
    var show=NOTES.filter(function(n){ return (!ROOM||n.room===ROOM)&&(STATE==='all'||(STATE==='done')===(n.status==='done')); });
    var list=$('list'); if(io) io.disconnect(); list.textContent='';
    if(!show.length) list.appendChild(el('div','empty',NOTES.length?'مفيش تعليقات بالاختيار ده.':'لسه مفيش تعليقات.'));
    else show.forEach(function(n){ list.appendChild(card(n)); });
    say('count',NOTES.length?('ظاهر '+show.length+' من '+TOTAL+' تعليق'):'');
    $('b-more').hidden=NOTES.length>=TOTAL;
  }
  function jump(){ var h=decodeURIComponent(location.hash.slice(1)).split('/'); if(h.length!==2) return; var c=document.getElementById('n-'+h[1]); if(c){ c.classList.add('hit'); c.scrollIntoView({block:'start'}); } }

  try{ K=sessionStorage.getItem('hub-notes-key')||''; }catch(e){}
  if(/^[a-f0-9]{64}$/.test(K)) unlocked(); else { K=''; $('pass').focus(); }
})();
</script>
</body>
</html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>منتدى مصر 2026 · محرر السلايد</title>
<link rel="stylesheet" href="lib/fonts.css" onerror="this.remove()">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@300;400;500;600;700&display=swap">
<style>
/* Slide editor (ed v1, Amr 19 Oct 11:12 / 11:20: «يفتح السلايد في صفحة كانفا تقدر تضغط فيه على اي لاير وتغيره»).
   The slide in the middle is the deck itself (?edit=1): click a card or a text to pick it, drag it to move it on the 12 x 6 grid, pull its
   handles to resize it. The layers are on the right, the picked layer's place, colour, icon, picture, texts and numbers on the left.
   Every change is kept on this machine (fctl-spec-<deck>, numbers in fctl-num-<deck>) and shows on the big screen at once. */
:root{
  --bg:#05060a;--ink:#f4f5fa;--mute:#9a9cb4;--dim:#5d6078;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);--glass:rgba(255,255,255,.045);--glass2:rgba(255,255,255,.075);
  --tile:linear-gradient(180deg,rgba(255,255,255,.062),rgba(255,255,255,.026));
  --mint:#b6f2dc;--vio:#6e6df2;--vio2:#8f8ef7;--blue:#3d5cc0;--sun:#ee9873;--ok:#4fd1a1;--chg:#ffd23f;
  --fd:"Readex Pro","IBM Plex Sans Arabic","Geeza Pro","Segoe UI",Tahoma,sans-serif;--ft:"IBM Plex Sans Arabic","Readex Pro","Geeza Pro","Segoe UI",Tahoma,sans-serif;
  --ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.5 var(--ft)}
body{display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(1200px 700px at 85% -10%,rgba(110,109,242,.14),transparent 60%),var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{opacity:.35;cursor:default}
input,textarea,select{font:inherit;color:var(--ink)}
svg.i{width:1.15em;height:1.15em;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.num{font-family:var(--fd);font-variant-numeric:tabular-nums}

/* top bar */
header{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand .mk{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--vio),var(--blue));color:#fff;box-shadow:0 8px 22px -10px rgba(110,109,242,.9)}
.brand b{display:block;font:600 15px var(--fd)}.brand span{font-size:12px;color:var(--mute)}
.seg{display:flex;align-items:center;gap:4px;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{height:32px;min-width:32px;padding:0 10px;border-radius:9px;display:flex;align-items:center;justify-content:center;gap:6px;font:500 13px var(--fd);color:var(--mute)}
.seg button:hover:not(:disabled){background:var(--glass2);color:var(--ink)}
#slsel{height:32px;max-width:380px;min-width:220px;background:transparent;border:0;outline:none;font:500 13.5px var(--fd);color:var(--ink);padding:0 6px}
#slsel option{background:#14151f;color:var(--ink)}
.sp{flex:1}
#stat{font:500 12.5px var(--fd);color:var(--mute);display:flex;align-items:center;gap:7px;white-space:nowrap}
#stat i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(79,209,161,.18)}
#stat.wait i{background:var(--chg);box-shadow:0 0 0 3px rgba(255,210,63,.18)}
.btn{height:34px;padding:0 13px;border-radius:10px;display:flex;align-items:center;gap:7px;background:var(--glass2);border:1px solid var(--line);font:500 13px var(--fd);white-space:nowrap}
.btn:hover:not(:disabled){background:rgba(255,255,255,.11)}
.btn.warn{color:#ffd9c8;background:rgba(238,152,115,.12);border-color:rgba(238,152,115,.3)}
.btn.pri{background:linear-gradient(135deg,var(--vio),var(--blue));border-color:transparent;color:#fff}

/* three columns: layers · canvas · the picked layer */
main{flex:1;min-height:0;display:grid;grid-template-columns:270px minmax(0,1fr) 340px;gap:12px;padding:12px}
.panel{background:var(--tile);border:1px solid var(--line);border-radius:20px;min-height:0;display:flex;flex-direction:column;overflow:hidden;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.ph{display:flex;align-items:center;gap:8px;padding:13px 15px 11px;border-bottom:1px solid var(--line);flex:none}
.ph b{font:600 14px var(--fd)}.ph span{color:var(--mute);font-size:12px}
.scroll{overflow:auto;min-height:0;flex:1}

/* layers */
#lyr{padding:8px}
.ly{display:grid;grid-template-columns:30px 1fr auto;gap:9px;align-items:center;padding:8px 9px;border-radius:12px;cursor:pointer;transition:background .2s;position:relative}
.ly:hover,.ly.hv{background:var(--glass)}
.ly.on{background:linear-gradient(90deg,rgba(110,109,242,.06),rgba(110,109,242,.24));box-shadow:inset -3px 0 0 var(--vio2)}
.ly .ti{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.06);color:var(--mute)}
.ly.on .ti{background:var(--vio);color:#fff}
.ly .tx{min-width:0}.ly .tx b{display:block;font:500 13px var(--fd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ly .tx small{display:block;color:var(--dim);font-size:11.5px}
.ly .st{font:500 11px var(--fd);color:var(--mute);background:rgba(255,255,255,.05);border-radius:7px;padding:2px 7px;white-space:nowrap}
.ly .dot{position:absolute;top:8px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--chg);box-shadow:0 0 0 2px #10111a}
.lsec{font:600 11.5px var(--fd);color:var(--dim);padding:12px 10px 6px;letter-spacing:.2px}

/* canvas */
#cvw{position:relative;min-height:0;display:flex;flex-direction:column;gap:10px}
#cv{flex:1;min-height:0;border-radius:20px;background:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1.4px) 0 0/18px 18px,#15161d;border:1px solid var(--line);overflow:auto;display:grid;place-items:center;position:relative}
#pg{position:relative;border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.12),0 30px 80px -30px rgba(0,0,0,.95);background:#e9ecf4;flex:none}
#pg iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
#ld{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:8px;color:var(--mute);font:500 14px var(--fd);background:#15161d;z-index:2;text-align:center;padding:20px}
#ld[hidden]{display:none}
#ld b{display:block;color:var(--ink);font:600 16px var(--fd)}
.zb{display:flex;align-items:center;gap:8px;flex:none;justify-content:center;flex-wrap:wrap}
.zb .seg button.on{background:rgba(255,255,255,.12);color:var(--ink)}
.hint{color:var(--dim);font-size:12px}

/* the picked layer */
#pp{padding:14px 15px 24px;display:flex;flex-direction:column;gap:16px}
.sec{display:flex;flex-direction:column;gap:9px}
.sec>h4{margin:0;font:600 12px var(--fd);color:var(--dim);letter-spacing:.3px;display:flex;align-items:center;gap:8px}
.sec>h4 small{font-weight:400;color:var(--dim)}
.ttl{display:flex;align-items:center;gap:10px}
.ttl .ti{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--vio);color:#fff;flex:none}
.ttl b{display:block;font:600 15px var(--fd)}.ttl small{color:var(--mute);font-size:12px}
.ttl .btn{margin-inline-start:auto;height:30px;padding:0 10px;font-size:12px}
.pos{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.pos label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--mute)}
.pos input{width:100%;height:34px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.04);padding:0 8px;text-align:center;font:600 14px var(--fd);outline:none}
.pos input:focus{border-color:rgba(143,142,247,.7)}
#mini{position:relative;direction:ltr;aspect-ratio:16/9;border-radius:10px;background:rgba(255,255,255,.035);border:1px solid var(--line);overflow:hidden}
#mini i{position:absolute;border-radius:4px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.08)}
#mini i.on{background:#fff;border-color:#fff;box-shadow:0 0 0 2px rgba(110,109,242,.6)}
.sw{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.sw button{aspect-ratio:1.3;border-radius:10px;border:2px solid transparent;box-shadow:0 0 0 1px rgba(255,255,255,.12) inset;position:relative}
.sw button.on{border-color:#fff;box-shadow:0 0 0 3px rgba(110,109,242,.6)}
.ic{display:flex;align-items:center;gap:10px}
.ic .cur{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.08);color:var(--ink)}
.ic .cur svg{width:24px;height:24px}
.ig{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-height:210px;overflow:auto;padding:2px}
.ig button{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.04);color:var(--mute);border:1px solid transparent}
.ig button:hover{color:var(--ink);background:rgba(255,255,255,.09)}
.ig button.on{color:#fff;background:var(--vio);border-color:transparent}
.ig button svg{width:21px;height:21px}
.srch{width:100%;height:34px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);padding:0 11px;outline:none;font-size:13px}
.srch:focus{border-color:rgba(143,142,247,.7)}
.imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;max-height:260px;overflow:auto;padding:2px}
.imgs button{aspect-ratio:16/10;border-radius:9px;overflow:hidden;border:2px solid transparent;background:#222 center/cover no-repeat;box-shadow:0 0 0 1px rgba(255,255,255,.08) inset}
.imgs button.on{border-color:#fff;box-shadow:0 0 0 3px rgba(110,109,242,.6)}
.cimg{aspect-ratio:16/9;border-radius:12px;background:#222 center/cover no-repeat;box-shadow:0 0 0 1px rgba(255,255,255,.1) inset}
.fld{display:grid;grid-template-columns:1fr 28px;gap:4px 6px;align-items:start}
.fld label{grid-column:1/3;font:500 11.5px var(--fd);color:var(--mute);display:flex;align-items:center;gap:6px}
.fld label em{font-style:normal;font-size:10.5px;color:var(--dim);background:rgba(255,255,255,.05);border-radius:6px;padding:0 6px}
.fld textarea,.fld input{width:100%;resize:none;overflow:hidden;min-height:36px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font:500 13.5px/1.45 var(--fd);outline:none;transition:border-color .2s,background .2s}
.fld input{height:36px;font:600 15px var(--fd)}
.fld textarea:focus,.fld input:focus{border-color:rgba(143,142,247,.75);background:rgba(110,109,242,.07)}
.fld.chg textarea,.fld.chg input{border-color:rgba(255,210,63,.5)}
.fld .rs{width:28px;height:28px;margin-top:4px;border-radius:8px;display:grid;place-items:center;color:var(--dim);visibility:hidden}
.fld.chg .rs{visibility:visible;color:var(--chg)}.fld .rs:hover{background:rgba(255,255,255,.08)}
.fld small{grid-column:1;color:var(--dim);font-size:11px;padding:0 4px}
.fld.hl textarea,.fld.hl input{border-color:#fff;box-shadow:0 0 0 3px rgba(110,109,242,.5)}
.empty{padding:28px 18px;color:var(--mute);text-align:center;line-height:1.9}
.empty b{display:block;color:var(--ink);font:600 15px var(--fd);margin-bottom:4px}
.empty svg.i{width:34px;height:34px;color:var(--dim);margin-bottom:8px}
.tip{font-size:12px;color:var(--mute);line-height:1.75;background:rgba(182,242,220,.05);border:1px solid rgba(182,242,220,.12);border-radius:12px;padding:10px 12px}
.tip b{color:var(--mint);font-weight:500}
#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);opacity:0;background:rgba(20,22,34,.96);border:1px solid var(--line);border-radius:12px;padding:10px 16px;font-size:13.5px;transition:all .35s var(--ease);pointer-events:none;z-index:9}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:1180px){main{grid-template-columns:220px minmax(0,1fr) 300px}}
@media (max-width:900px){body{overflow:auto}main{grid-template-columns:1fr;grid-template-rows:auto 60vh auto}#cvw{order:-1}}
</style>
</head>

    typing={p:f.p,go:function(){setField(SEL,f,t.value,true)}};typing.t=setTimeout(function(){var g=typing;typing=null;g&&g.go()},380);
    fd.classList.toggle('chg',String(t.value)!==String(origOf(SEL,f)));return}
  if(t.id==='isr'){var q=t.value.trim().toLowerCase();clearTimeout(t._t);t._t=setTimeout(function(){if(!q){renderIcons('');return}if(ICACHE[q])renderIcons(q);else send('icons',{q:q})},220)}});
$('pp').addEventListener('change',function(e){var t=e.target;if(t.dataset.gi==null)return;var c=cardOf(SEL);if(!c||!c.g)return;var g=c.g.slice(),i=+t.dataset.gi,v=Math.round(+t.value||0);
  g[i]=i<2?v-1:v;setRect(SEL,g)});
$('pp').addEventListener('keydown',function(e){var t=e.target;if(t.tagName==='TEXTAREA'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();t.blur()}if(t.tagName==='INPUT'&&e.key==='Enter')t.blur();e.stopPropagation()});
$('pp').addEventListener('focusout',function(e){if(e.target.closest('.fld'))flushTyping();setTimeout(function(){var ae=document.activeElement;if(PDIRTY&&!(ae&&ae.closest&&ae.closest('#pp .fld,#pp .pos,#isr'))){PDIRTY=false;props()}},250)});
$('pp').addEventListener('click',function(e){var b;
  if((b=e.target.closest('.rs'))){var fd=b.closest('.fld'),c=cardOf(SEL),f=c&&(c.fields||[]).find(function(x){return x.p===fd.dataset.p});if(f){flushTyping();var o=origOf(SEL,f);var t=fd.querySelector('textarea,input');t.value=o;setField(SEL,f,f.num?o:String(o));PDIRTY=false;props()}return}
  if((b=e.target.closest('.sw button'))){setProp(SEL,'bg',b.dataset.bg);return}
  if((b=e.target.closest('.ig button'))){setProp(SEL,'ic',b.dataset.ic);return}
  if((b=e.target.closest('.imgs button'))){setProp(SEL,'img',b.dataset.img);return}});

/* ---------- keys ---------- */
/* keys here, and the ones pressed while the slide has the focus (it sends them over) */
function onKey(k,meta,shift){
  if(meta&&k.toLowerCase()==='z'){if(shift)$('redo').click();else $('undo').click();return true}
  if(k==='Escape'){select(null,null,false);return true}
  var c=SEL!=null&&cardOf(SEL);if(c&&c.g&&/^Arrow/.test(k)){var g=c.g.slice(),d={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[k];
    if(shift){g[2]+=d[0];g[3]+=d[1]}else{g[0]+=d[0];g[1]+=d[1]}setRect(SEL,g);return true}
  return false}
addEventListener('keydown',function(e){var t=e.target,inField=t&&/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName);
  if(inField&&!((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'&&t.tagName==='SELECT'))return;if(onKey(e.key,e.metaKey||e.ctrlKey,e.shiftKey))e.preventDefault()});
/* another window changed the same slide (the control's number edits): follow it */
addEventListener('storage',function(e){if(e.key===SKEY||e.key===NKEY){SPEC=lsGet(SKEY);NUM=lsGet(NKEY);send('redraw')}});

fit();loadDeck();
setTimeout(function(){if(!ready&&!$('ld').hidden)$('ld').innerHTML='<span><b>السلايد بياخد وقت</b>لو فضل كده، اعمل ريفرش للصفحة.</span>'},15000);
})();

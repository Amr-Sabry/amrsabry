<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>الجلسة الختامية · Keynote</title>
<style>
/* «الجلسة الختامية» — keynote edition v9 (Amr 21:30–22:19): one question per slide, the figures answer it.
   Soft lavender (never white), cobalt accent, no orange, no maps, no grid, no motion, wide margins, room to breathe.
   Every slide has the same header: an outline icon and the question, top right, 160px from the edges. 1920×1080, scaled to the screen. */
@font-face{font-family:'KNum';src:url(fonts/montserrat-500.woff2) format('woff2');font-weight:100 549;font-display:block;unicode-range:U+0025,U+002B-002E,U+0030-0039,U+2013,U+00D7}
@font-face{font-family:'KNum';src:url(fonts/montserrat-600.woff2) format('woff2');font-weight:550 649;font-display:block;unicode-range:U+0025,U+002B-002E,U+0030-0039,U+2013,U+00D7}
@font-face{font-family:'KNum';src:url(fonts/montserrat-700.woff2) format('woff2');font-weight:650 749;font-display:block;unicode-range:U+0025,U+002B-002E,U+0030-0039,U+2013,U+00D7}
@font-face{font-family:'KNum';src:url(fonts/montserrat-800.woff2) format('woff2');font-weight:750 1000;font-display:block;unicode-range:U+0025,U+002B-002E,U+0030-0039,U+2013,U+00D7}
@font-face{font-family:'KAr';src:url(fonts/cairo-medium.woff2) format('woff2');font-weight:100 549;font-display:block}
@font-face{font-family:'KAr';src:url(fonts/cairo-ar-600.woff2) format('woff2');font-weight:550 649;font-display:block;unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+200C-200E,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:'KAr';src:url(fonts/cairo-ar-700.woff2) format('woff2');font-weight:650 749;font-display:block;unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+200C-200E,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:'KAr';src:url(fonts/cairo-ar-800.woff2) format('woff2');font-weight:750 849;font-display:block;unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+200C-200E,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:'KAr';src:url(fonts/cairo-black.woff2) format('woff2');font-weight:850 1000;font-display:block}
:root{--cob:#3d5cc0;--lav:#8e9be6;--lav2:#aab4f0;--navy:#1c2547;--acc:#3d5cc0;--bar0:rgba(28,37,71,.16);--line:rgba(28,37,71,.2);--f:'KNum','KAr',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#cfd5e6;overflow:hidden}
body{font-family:var(--f);-webkit-font-smoothing:antialiased;color:var(--navy)}
#vp{position:fixed;inset:0;display:grid;place-items:center}
#stage{position:relative;width:1920px;height:1080px;transform-origin:50% 50%;overflow:hidden}
.s{position:absolute;inset:0;display:none;overflow:hidden;color:var(--navy)}
.s.on{display:block}
.s.light{background:radial-gradient(70% 70% at 0% 0%,rgba(142,155,230,.30) 0%,rgba(142,155,230,0) 70%),radial-gradient(70% 70% at 100% 110%,rgba(91,120,221,.20) 0%,rgba(91,120,221,0) 70%),#d9deec}
.num{font-family:'KNum','KAr',sans-serif;font-variant-numeric:lining-nums;direction:ltr;unicode-bidi:isolate;line-height:.9;letter-spacing:-.02em}
.grad{background:linear-gradient(100deg,#24357f 0%,#3d5cc0 60%,#7d8be0 120%);-webkit-background-clip:text;background-clip:text;color:transparent}
.ico{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block}
.pg{position:absolute;left:64px;bottom:40px;font:600 24px/1 'KNum',sans-serif;opacity:.35;direction:ltr}

/* the header: icon + question (+ one line of the client's) */
.hd{position:absolute;top:110px;right:160px;left:160px;display:flex;align-items:flex-start;gap:34px}
.hd .ib{width:104px;height:104px;flex:none;border-radius:30px;background:rgba(61,92,192,.10);color:var(--cob);display:grid;place-items:center}
.hd .h{font:900 84px/1.15 var(--f)}
.hd .k{font:500 40px/1.4 var(--f);opacity:.68;margin-top:12px}
.legend{position:absolute;display:flex;gap:44px;font:700 34px/1 var(--f)}
.legend span{display:inline-flex;align-items:center;gap:14px}
.legend i{width:34px;height:34px;border-radius:9px;flex:none}

/* ---- the column chart ---- */
.ch{position:absolute;inset:0}
.ch .base{position:absolute;height:3px;background:var(--line);border-radius:2px}
.ch .col{position:absolute}
.ch .bar{position:absolute;bottom:0;left:0;right:0;border-radius:24px 24px 6px 6px;overflow:hidden;display:flex;flex-direction:column-reverse}
.ch .bar i{display:block;width:100%;flex:none}
.ch .o .bar{background:var(--bar0)}
.ch .bar.clr{background:none;border:4px dashed rgba(61,92,192,.55);border-bottom:0}
.ch .n .bar i{background:linear-gradient(0deg,#2f49ad,#4a67d2)}
.ch .n .bar i.b0{background:linear-gradient(0deg,#8e9be6,#aab4f0)}
.ch .n .bar i.a1{background:linear-gradient(0deg,#1c2a6e,#2a3b86)}
.ch .n .bar i+i{box-shadow:0 -3px 0 #d9deec inset}
.ch .lbl{position:absolute;left:-220px;right:-220px;display:flex;flex-direction:column;align-items:center;text-align:center}
.ch .o .lbl .num{font-size:120px;font-weight:600;opacity:.55}
.ch .n .lbl .num{font-size:170px;font-weight:700}
.ch .lbl .u{font:700 44px/1.25 var(--f);margin-top:12px}
.ch .o .lbl .u{opacity:.6}
.ch .yr{position:absolute;left:-220px;right:-220px;text-align:center;font:800 42px/1 var(--f)}
.ch .o .yr{opacity:.55}.ch .n .yr{color:var(--cob)}
.ch .nt{position:absolute;text-align:center;font:500 36px/1.35 var(--f);opacity:.62}
.ch .call{position:absolute;display:flex;flex-direction:column;align-items:flex-start;gap:26px;text-align:right;width:640px}
.ch .call .pre{font:600 38px/1.2 var(--f);opacity:.7;margin-bottom:-18px}
.ch .call .v{display:flex;align-items:baseline;gap:18px}
.ch .call .v .num{font-size:116px;font-weight:700}
.ch .call .v>span:last-child{font:700 42px/1.25 var(--f);white-space:nowrap}
.ch .call .sw{width:30px;height:30px;border-radius:8px;flex:none;align-self:center}
.ch .call::after{content:"";position:absolute;right:-56px;top:50%;width:40px;height:4px;border-radius:2px;background:var(--cob)}

/* ---- rows: 2–3 measures, each a pair of bars on its own scale ---- */
.mr{position:absolute;right:160px;left:160px;height:180px;display:flex;align-items:center;gap:56px}
.mr+.mr{border-top:2px solid rgba(28,37,71,.08)}
.mr .mh{width:660px;flex:none;display:flex;align-items:center;gap:26px}
.mr .mh .ib{width:84px;height:84px;flex:none;border-radius:24px;background:rgba(61,92,192,.10);color:var(--cob);display:grid;place-items:center}
.mr .mn{font:800 46px/1.2 var(--f);white-space:nowrap}
.mr .mu{font:500 32px/1.3 var(--f);opacity:.6;margin-top:4px}
.mr .mb{flex:1;display:flex;flex-direction:column;gap:14px}
.mr .br{display:flex;align-items:center;gap:22px}
.mr .br i{display:block;flex:none;border-radius:12px}
.mr .br.o i{height:40px;background:var(--bar0)}
.mr .br.n i{height:56px;background:linear-gradient(270deg,#2f49ad,#4a67d2)}
.mr .br.o .num{font-size:58px;font-weight:600;opacity:.55}
.mr .br.n .num{font-size:78px;font-weight:700}
.mr .br .nb{font:600 32px/1.2 var(--f);opacity:.65;white-space:nowrap}

/* ---- share: a part of Egypt's whole area ---- */
.sr{position:absolute;right:160px;left:160px;display:flex;align-items:center;gap:56px}
.sr .sl{width:420px;flex:none;display:flex;align-items:baseline;gap:26px}
.sr .y{font:800 42px/1 var(--f)}
.sr.o .y{opacity:.55}.sr.n .y{color:var(--cob)}
.sr.o .num{font-size:130px;font-weight:600;opacity:.55}.sr.n .num{font-size:170px;font-weight:700}
.sr .tr{flex:1;position:relative;height:110px;border-radius:30px;background:rgba(28,37,71,.06);box-shadow:inset 0 0 0 2px rgba(28,37,71,.10);overflow:hidden;display:flex}
.sr .tr i{display:block;height:100%;flex:none}
.sr .tr i.b0{background:linear-gradient(0deg,#8e9be6,#aab4f0)}
.sr .tr i.a0{background:linear-gradient(0deg,#2f49ad,#4a67d2)}
.sr .tr span{position:absolute;left:36px;top:50%;transform:translateY(-50%);font:600 34px/1 var(--f);opacity:.5}

/* ---- gaps: a crossing every N km, so a shorter distance shows as more crossings ---- */
.gr{position:absolute;right:160px;left:160px;display:flex;align-items:center;gap:56px}
.gr .gl{width:420px;flex:none}
.gr .vv{display:flex;align-items:baseline;gap:18px}
.gr .y{font:800 40px/1 var(--f);margin-bottom:14px}
.gr.o .y{opacity:.55}.gr.n .y{color:var(--cob)}
.gr.o .num{font-size:110px;font-weight:600;opacity:.55}.gr.n .num{font-size:130px;font-weight:700}
.gr .u{font:700 44px/1.2 var(--f)}
.gr .nt{font:500 34px/1.3 var(--f);opacity:.62;margin-top:10px}
.gr .river{flex:1;position:relative;height:70px}
.gr .river::before{content:"";position:absolute;left:0;right:0;top:50%;height:12px;transform:translateY(-50%);border-radius:6px;background:linear-gradient(270deg,rgba(79,150,220,.35),#4f96dc)}
.gr .river i{position:absolute;top:0;width:12px;height:70px;border-radius:5px;transform:translateX(50%)}
.gr.o .river i{background:rgba(28,37,71,.38)}.gr.n .river i{background:var(--cob)}
.gr .pt{flex:1;position:relative;height:70px;border-radius:22px;background:rgba(28,37,71,.06);box-shadow:inset 0 0 0 2px rgba(28,37,71,.10);overflow:hidden}
.gr .pt i{position:absolute;right:0;top:0;bottom:0;background:linear-gradient(270deg,#2f49ad,#4a67d2);border-radius:22px}
.gr .pt span{position:absolute;left:30px;top:50%;transform:translateY(-50%);font:700 34px/1 var(--f);opacity:.6;white-space:nowrap}

/* ---- cover: the timeline from 2014 to 2026 and the five moves on the way ---- */
.cover .kick{position:absolute;top:120px;left:160px;right:160px;text-align:center;font:700 40px/1 var(--f);color:var(--cob)}
.cover .end{position:absolute;top:220px;width:720px}
.cover .end.a{right:160px;text-align:right}.cover .end.b{left:160px;text-align:left}
.cover .end .num{font-size:230px;font-weight:700;display:block}
.cover .end.a .num{opacity:.4}
.cover .end .sb{font:700 50px/1.3 var(--f);margin-top:26px;white-space:nowrap}
.cover .end.a .sb{opacity:.7}.cover .end.b .sb{color:var(--cob);font-weight:800;direction:rtl}
.cover .tl{position:absolute;left:790px;right:760px;top:322px;height:6px;border-radius:3px;background:linear-gradient(270deg,rgba(28,37,71,.22),#3d5cc0)}
.cover .tl::after{content:"";position:absolute;left:-6px;top:50%;width:26px;height:26px;border-left:6px solid #3d5cc0;border-bottom:6px solid #3d5cc0;border-radius:3px;transform:translateY(-50%) rotate(45deg)}
.cover .tl i{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:#d9deec;box-shadow:0 0 0 4px rgba(61,92,192,.55);transform:translate(50%,-50%)}
.cover .mv{position:absolute;left:160px;right:160px;top:690px;display:flex;justify-content:space-between}
.cover .mv::before{content:"";position:absolute;right:120px;left:120px;top:60px;height:3px;background:rgba(61,92,192,.25)}
.cover .m{position:relative;width:300px;display:flex;flex-direction:column;align-items:center;text-align:center}
.cover .m .ib{width:120px;height:120px;border-radius:36px;background:#d9deec;box-shadow:inset 0 0 0 3px rgba(61,92,192,.35);color:var(--cob);display:grid;place-items:center}
.cover .m .n{font:600 30px/1 var(--f);opacity:.6;margin-top:26px}
.cover .m .t{font:800 42px/1.2 var(--f);margin-top:12px;white-space:nowrap}
#hint{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);font:500 12px var(--f);color:rgba(28,37,71,.35);pointer-events:none;animation:hf .8s 4s forwards}@keyframes hf{to{opacity:0}}
</style>
</head>
<body>
<div id="vp"><div id="stage"></div></div>
<div id="hint">← → للتنقل · F ملء الشاشة</div>
<script src="src/kn/icons.js?v=1"></script>
<script src="src/kn/slides.js?v=3"></script>
<script>
const N=v=>`<span class="num">${v}</span>`, G=v=>`<span class="num grad">${v}</span>`;
const fnum=x=>parseFloat(String(x).replace(/[^0-9.]/g,''))||0;
const ICON=(n,sz)=>KICONS[n]?`<svg class="ico" viewBox="0 0 24 24" width="${sz}" height="${sz}">${KICONS[n]}</svg>`:'';
const HD=s=>`<div class="hd">${s.ic?`<div class="ib">${ICON(s.ic,58)}</div>`:''}<div><div class="h">${s.q||s.t}</div>${s.k?`<div class="k">${s.k}</div>`:''}</div></div>`;
const LEG=(pos,a,b)=>`<div class="legend" style="${pos}"><span><i style="background:var(--bar0)"></i>${a||'قبل 2014'}</span><span><i style="background:linear-gradient(135deg,#2f49ad,#4a67d2)"></i>${b||'2026'}</span></div>`;
/* two columns, true to scale: 2014 right of the centre, 2026 left of it (as Arabic reads); box x0..x1 measured from the right edge */
function colChart(p,box,o={}){const W=box.x1-box.x0,H=box.base-box.top;let h=`<div class="base" style="right:${box.x0}px;width:${W}px;top:${box.base}px"></div>`;
  const bw=o.bw||270,gap=o.gap||(p.b.clear?300:170),A=fnum(p.a.v),B=fnum(p.b.v),M=Math.max(A,B)||1,cx=box.x0+W/2,xr=cx-gap/2-bw,xl=cx+gap/2;
  const hA=Math.max(12,Math.round(A/M*H)),hB=Math.max(12,Math.round(B/M*H));
  const adds=p.adds?p.adds.map(x=>fnum(x.v)):(p.add?[p.add]:[]),sumA=adds.reduce((x,y)=>x+y,0);
  const col=(cls,x,hh,val,u,segs,isN)=>`<div class="col ${cls}" style="right:${x}px;width:${bw}px;top:${box.top}px;height:${H}px"><div class="bar" style="height:${hh}px">${segs}</div>
    <div class="lbl" style="bottom:${hh+20}px">${isN?G(val):N(val)}${u?`<span class="u">${u}</span>`:''}</div>
    <div class="yr" style="top:${H+26}px">${isN?(o.yb||'2026'):(o.ya||'قبل 2014')}</div></div>`;
  const segB=adds.length?`<i class="b0" style="height:${((B-sumA)/B*100).toFixed(2)}%"></i>`+adds.map((v,j)=>`<i class="a${j}" style="height:${(v/B*100).toFixed(2)}%"></i>`).join(''):`<i style="height:100%"></i>`;
  h+=col('o',xr,hA,p.a.v,p.a.u,'',0);
  if(p.b.clear)h+=`<div class="col n" style="right:${xl}px;width:${bw}px;top:${box.top}px;height:${H}px"><div class="bar clr" style="height:${hA}px"></div><div class="lbl" style="bottom:${hA+24}px"><span class="u" style="color:var(--cob);font-size:48px;font-weight:800">${p.b.ul||p.b.u}</span></div><div class="yr" style="top:${H+26}px">${o.yb||'2026'}</div></div>`;
  else h+=col('n',xl,hB,p.b.v,p.b.u,segB,1);
  const nw=(p.a.n&&p.b.n)?340:640;if(p.a.n)h+=`<div class="nt" style="right:${xr-nw/2}px;width:${bw+nw}px;top:${box.base+90}px">${p.a.n}</div>`;if(p.b.n)h+=p.a.n?`<div class="nt" style="right:${xl-nw/2}px;width:${bw+nw}px;top:${box.base+90}px">${p.b.n}</div>`:`<div class="nt" style="right:${cx-560}px;width:1120px;top:${box.base+90}px">${p.b.n}</div>`;
  const yAdd=box.base-hB+Math.round(sumA/M*H)/2,cl=p.b.clear?box.base-hA/2:yAdd;
  if(p.call)h+=`<div class="call" style="right:${xl+bw+70}px;top:${cl}px;transform:translateY(-50%)">${p.call.pre?`<span class="pre">${p.call.pre}</span>`:''}<span class="v">${G(p.call.v)}<span>${p.call.u||''}</span></span></div>`;
  if(p.adds)h+=`<div class="call" style="right:${xl+bw+70}px;top:${yAdd}px;transform:translateY(-50%)">${p.adds.map((x,j)=>`<span class="v"><i class="sw" style="background:${j?'#24357f':'#3d5cc0'}"></i>${G(x.v)}<span>${x.u}</span></span>`).reverse().join('')}</div>`;
  return `<div class="ch">${h}</div>`}
const R={
  cover:s=>`<div class="kick">${s.k}</div>
    <div class="end a">${N(s.y0)}<div class="sb">${s.s0}</div></div>
    <div class="tl">${Array.from({length:11},(_,i)=>`<i style="right:${((i+1)/12*100).toFixed(2)}%"></i>`).join('')}</div>
    <div class="end b">${G(s.y1)}<div class="sb">${s.s1}</div></div>
    <div class="mv">${s.moves.map(m=>`<div class="m"><div class="ib">${ICON(m.ic,62)}</div><div class="n">${m.n}</div><div class="t">${m.t}</div></div>`).join('')}</div>`,
  /* one measure; with a callout the pair moves right to leave the callout its room */
  col:s=>HD(s)+colChart({a:s.a,b:s.b,add:s.add,adds:s.adds,call:s.call},(s.call||s.adds)?{x0:300,x1:1260,top:560,base:870}:{x0:360,x1:1560,top:560,base:870},{ya:s.ya,yb:s.yb}),
  /* 2–3 measures in rows, each pair of bars on its own scale */
  rows:s=>HD(s)+LEG('top:150px;left:160px',s.ya,s.yb)+s.rows.map((r,i)=>{const A=fnum(r.a),B=fnum(r.b),M=Math.max(A,B)||1,w=f=>`calc((100% - 330px) * ${(f/M).toFixed(4)})`;
    return `<div class="mr" style="top:${370+i*200}px"><div class="mh"><div class="ib">${ICON(r.ic,46)}</div><div><div class="mn">${r.nm}</div><div class="mu">${r.u}</div>${r.nb?`<div class="mu" style="color:var(--cob);opacity:1;font-weight:700">${r.nb}</div>`:''}</div></div>
      <div class="mb"><div class="br o"><i style="width:${w(A)}"></i>${N(r.a)}</div><div class="br n"><i style="width:${w(B)}"></i>${G(r.b)}</div></div></div>`}).join(''),
  /* a share of Egypt's whole area: the same 7% in both rows, and what was added */
  share:s=>{const A=fnum(s.a.v),B=fnum(s.b.v);
    return HD(s)+`<div class="sr o" style="top:440px"><div class="sl"><span class="y">${s.ya||'قبل 2014'}</span>${N(s.a.v)}</div><div class="tr"><i class="b0" style="width:${A}%"></i><span>${s.whole}</span></div></div>
      <div class="sr n" style="top:690px"><div class="sl"><span class="y">${s.yb||'2026'}</span>${G(s.b.v)}</div><div class="tr"><i class="b0" style="width:${A}%"></i><i class="a0" style="width:${B-A}%"></i><span>${s.whole}</span></div></div>`},
  /* the Nile's crossings: the same stretch of river, a mark at every crossing */
  gaps:s=>{const span=4*Math.max(fnum(s.a.v),fnum(s.b.v));
    const marks=v=>{let h='';for(let k=0;k<=span+1e-6;k+=fnum(v))h+=`<i style="right:${(k/span*100).toFixed(2)}%"></i>`;return h};
    const row=(c,x,t,y)=>`<div class="gr ${c}" style="top:${t}px"><div class="gl"><div class="y">${y}</div><div class="vv">${c=='n'?G(x.v):N(x.v)}<span class="u">${x.u}</span></div><div class="nt">${x.n||''}</div></div><div class="river">${marks(x.v)}</div></div>`;
    return HD(s)+row('o',s.a,360,s.ya||'قبل 2014')+row('n',s.b,610,s.yb||'2026')+
      `<div class="gr n" style="top:870px"><div class="gl"><div class="vv">${G(s.done.v)}<span class="u">${s.done.u}</span></div></div><div class="pt"><i style="width:${(fnum(s.done.v)/fnum(s.of.v)*100).toFixed(2)}%"></i><span>${s.of.v} ${s.of.u}</span></div></div>`}
};
const stage=document.getElementById('stage');
stage.innerHTML=KN.map((s,i)=>`<section class="s ${s.bg||'light'} ${s.type}" data-i="${i}">${R[s.type](s)}<div class="pg">${i+1} / ${KN.length}</div></section>`).join('');
const S=[...stage.children];let cur=Math.min(S.length-1,Math.max(0,(parseInt(location.hash.slice(1))||1)-1));
function go(i){cur=Math.max(0,Math.min(S.length-1,i));S.forEach((x,j)=>x.classList.toggle('on',j===cur));history.replaceState(null,'','#'+(cur+1))}
function fit(){const k=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`scale(${k})`}
addEventListener('resize',fit);fit();go(cur);
addEventListener('keydown',e=>{if(['ArrowLeft','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();go(cur+1)}else if(['ArrowRight','PageUp','Backspace'].includes(e.key)){e.preventDefault();go(cur-1)}else if(e.key==='Home')go(0);else if(e.key==='End')go(S.length-1);else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}});
addEventListener('click',e=>{go(e.clientX<innerWidth/2?cur+1:cur-1)});
let tx=0;addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>40)go(d>0?cur+1:cur-1)},{passive:true});
/* live: the page reloads on the same slide when src/kn/live.js changes (offline too) */
(function(){let last=null;setInterval(()=>{const sc=document.createElement('script');sc.src='src/kn/live.js?t='+Date.now();sc.onload=()=>{if(last===null)last=window.KNLIVE;else if(window.KNLIVE!==last)location.reload();sc.remove()};sc.onerror=()=>sc.remove();document.head.appendChild(sc)},2500)})();
</script>
</body>
</html>

.ph.p0 i{background:#2f49ad}.ph.p1 i{background:#7b90e0}.ph.p2 i{background:#c3cbf0}
.ph .pv{display:flex;align-items:baseline;gap:12px;margin-top:20px}.ph .pv .num{font-size:84px;font-weight:800}.ph .pv .u{font:700 38px/1 var(--f)}
.ph.p0 .pv .num,.ph.p0 .pn{color:#2f49ad}.ph.p1 .pv .num,.ph.p1 .pn{color:#3f55b8}.ph.p2 .pv .num,.ph.p2 .pn{color:#4f63b8}
.ph .ps{font:700 40px/1.2 var(--f);color:#5a6280;margin-top:6px}
.sk2{position:absolute;top:290px;right:160px;left:160px;height:700px;display:flex}

.skd{width:3px;margin:40px 50px;border-radius:2px;background:rgba(28,37,71,.12)}
.sk2 .y{font:800 46px/1 var(--f);margin-bottom:22px}.sko .y{color:rgba(28,37,71,.55)}.skn .y{color:var(--cob)}
.sko .kx .num{position:relative;font-size:250px;font-weight:700;color:rgba(28,37,71,.45);white-space:nowrap}
.sko .kx .num::after{content:"";position:absolute;left:-20px;right:-20px;top:46%;height:16px;border-radius:8px;background:#3d5cc0;transform:rotate(-13deg)}
.skn .kz .num{font-size:250px;font-weight:800}
.sk2 .u{font:800 52px/1.2 var(--f);margin-top:-10px}.sko .u{color:#6a7088}.skn .u{color:var(--cob)}
.skn .t{font:900 72px/1.25 var(--f);color:var(--cob);margin-top:40px;max-width:720px}.skn .t.sm{font:800 44px/1.3 var(--f);margin-top:18px}
.sk2 .ex{display:flex;align-items:baseline;gap:12px;margin-top:70px;font-size:38px!important;white-space:nowrap;font:700 42px/1.2 var(--f);color:#5a6280}.sk2 .ex svg{align-self:center}.sk2 .ex .num{font-size:64px;font-weight:700}
.sk2 .ex.n{color:var(--cob)}.sk2 .ex.tg{color:#6a7fd2;margin-right:60px;margin-left:60px}.sk2 .ex.tg .num{color:#6a7fd2}.sk2 .ex>*{flex:none;white-space:nowrap}
/* ---- cover: the timeline from 2014 to 2026 and the five moves on the way ---- */
.cover .kick{position:absolute;top:120px;left:160px;right:160px;text-align:center;font:700 40px/1 var(--f);color:var(--cob)}
.cover .end{position:absolute;top:220px;width:720px}
.cover .end.a{right:160px;text-align:right}.cover .end.b{left:160px;text-align:left}
.cover .end .num{font-size:230px;font-weight:700;display:block}
.cover .end.a .num{opacity:.4}
.cover .end .sb{font:700 50px/1.3 var(--f);margin-top:26px;white-space:nowrap}
.cover .end.a .sb{opacity:.7}.cover .end.b .sb{color:var(--cob);font-weight:800;direction:rtl}
.cover .tl{position:absolute;left:790px;right:760px;top:322px;height:6px;border-radius:3px;background:linear-gradient(270deg,rgba(28,37,71,.22),#3d5cc0)}
.cover .tl::after{content:"";position:absolute;left:-6px;top:50%;width:26px;height:26px;border-left:6px solid #3d5cc0;border-bottom:6px solid #3d5cc0;border-radius:3px;transform:translateY(-50%) rotate(45deg)}
.cover .tl i{position:absolute;top:50%;width:5px;height:26px;border-radius:3px;background:rgba(61,92,192,.6);transform:translate(50%,-50%)}
.cover .mv{position:absolute;left:160px;right:160px;top:690px;display:flex;justify-content:space-between}
.cover .m:not(:last-child)::after{content:"";position:absolute;top:59px;right:calc(50% + 82px);width:161px;height:3px;border-radius:2px;background:rgba(61,92,192,.3)}
.cover .m{position:relative;width:300px;display:flex;flex-direction:column;align-items:center;text-align:center}
.cover .m .ib{width:120px;height:120px;color:var(--cob);display:grid;place-items:center}
.cover .m .n{font:600 36px/1 var(--f);opacity:.72;margin-top:26px}
.cover .m .t{font:800 42px/1.2 var(--f);margin-top:12px;white-space:nowrap}
#hint{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);font:500 12px var(--f);color:rgba(28,37,71,.35);pointer-events:none;animation:hf .8s 4s forwards}@keyframes hf{to{opacity:0}}
</style>

<body>
<div id="vp"><div id="stage"></div></div>
<script src="src/kn/icons.js?v=18"></script>
<script src="src/kn/slides.js?v=13"></script>
<script>
const RG=v=>/^\s*[\d.]+\s*[–-]\s*[\d.]+\s*$/.test(String(v)),N=v=>`<span class="num"${RG(v)?' style="direction:rtl"':''}>${v}</span>`, G=v=>`<span class="num grad"${RG(v)?' style="direction:rtl"':''}>${v}</span>`;
const fnum=x=>parseFloat(String(x).replace(/[^0-9.]/g,''))||0;
const ICON=(n,sz)=>KICONS[n]?`<svg class="ico" viewBox="0 0 24 24" width="${sz}" height="${sz}">${KICONS[n]}</svg>`:'';
const HD=s=>`<div class="hd">${s.ic?`<div class="ib"${s.mir?' style="transform:scaleX(-1)"':''}>${ICON(s.ic,92)}</div>`:''}<div><div class="h">${s.q||s.t}</div>${s.k?`<div class="k">${s.k}</div>`:''}</div></div>`;
const LEG=(pos,a,b)=>`<div class="legend" style="${pos}"><span><i style="background:var(--bar0)"></i>${a||'قبل 2014'}</span><span><i style="background:linear-gradient(135deg,#2f49ad,#4a67d2)"></i>${b||'2026'}</span></div>`;
/* two columns, true to scale: 2014 right of the centre, 2026 left of it (as Arabic reads); box x0..x1 measured from the right edge */
function colChart(p,box,o={}){const W=box.x1-box.x0,H=box.base-box.top;let h=`<div class="base" style="right:${box.x0}px;width:${W}px;top:${box.base}px"></div>`;
  const bw=o.bw||270,gap=o.gap||(p.b.clear?300:170),A=fnum(p.a.v),B=fnum(p.b.v),M=Math.max(A,B)||1,cx=box.x0+W/2,xr=cx-gap/2-bw,xl=cx+gap/2;
  const hA=Math.max(12,Math.round(A/M*H)),hB=Math.max(12,Math.round(B/M*H));
  const adds=p.adds?p.adds.map(x=>fnum(x.v)):(p.add?[p.add]:[]),sumA=adds.reduce((x,y)=>x+y,0);
  const col=(cls,x,hh,val,u,segs,isN)=>`<div class="col ${cls}" style="right:${x}px;width:${bw}px;top:${box.top}px;height:${H}px"><div class="bar" style="height:${hh}px">${segs}</div>
    <div class="lbl" style="bottom:${hh+20}px">${isN?G(val):N(val)}${u?`<span class="u">${u}</span>`:''}${!isN&&p.a.x?`<span class="x">${p.a.x}</span>`:''}</div>
    <div class="yr" style="top:${H+26}px">${isN?(o.yb||'2026'):(o.ya||'قبل 2014')}</div></div>`;
  const segB=adds.length?`<i class="b0" style="height:${((B-sumA)/B*100).toFixed(2)}%"></i>`+adds.map((v,j)=>`<i class="a${j}" style="height:${(v/B*100).toFixed(2)}%"></i>`).join(''):`<i style="height:100%"></i>`;
  h+=col('o',xr,hA,p.a.v,p.a.u,'',0);
  if(p.b.clear)h+=`<div class="col n" style="right:${xl}px;width:${bw}px;top:${box.top}px;height:${H}px"><div class="bar clr" style="height:${hA}px"></div><div class="lbl" style="bottom:${hA+24}px"><span class="u" style="color:var(--cob);font-size:48px;font-weight:800">${p.b.ul||p.b.u}</span></div><div class="yr" style="top:${H+26}px">${o.yb||'2026'}</div></div>`;
  else h+=col('n',xl,hB,p.b.v,p.b.u,segB,1);
  const nw=(p.a.n&&p.b.n)?340:640;if(p.a.n)h+=p.b.n?`<div class="nt" style="right:${xr-nw/2}px;width:${bw+nw}px;top:${box.base+90}px">${p.a.n}</div>`:`<div class="nt" style="right:${box.x0}px;width:${(xr+bw/2-box.x0)*2}px;top:${box.base+90}px">${p.a.n}</div>`;if(p.b.n)h+=p.a.n?`<div class="nt" style="right:${xl-nw/2}px;width:${bw+nw}px;top:${box.base+90}px">${p.b.n}</div>`:`<div class="nt" style="right:${box.x0-170}px;width:${W+340}px;top:${box.base+90}px">${p.b.n}</div>`;
  const yAdd=box.base-hB+Math.round(sumA/M*H)/2,cl=p.b.clear?box.base-hA/2:yAdd;
  const addH=Math.round(sumA/M*H);if(p.call&&addH)h+=`<div class="brk" style="right:${xl+bw+14}px;top:${box.base-hB}px;height:${addH}px"></div>`;
  if(p.call)h+=`<div class="call" style="right:${xl+bw+66}px;top:${cl}px;transform:translateY(-50%)">${p.call.pre?`<span class="pre">${p.call.pre}</span>`:''}<span class="v">${G(p.call.v)}<span>${p.call.u||''}</span></span>${p.call.n?`<span class="cn">${p.call.n}</span>`:''}</div>`;
  /* each added part gets its own bracket and its own figure, level with it */
  if(p.adds){let lo=(B-sumA)/M*H;p.adds.forEach((x,j)=>{const hh=adds[j]/M*H,top=box.base-lo-hh;
    h+=`<div class="brk" style="right:${xl+bw+14}px;top:${(top+4).toFixed(1)}px;height:${(hh-8).toFixed(1)}px"></div><div class="call ad" style="right:${xl+bw+66}px;top:${(top+hh/2).toFixed(1)}px;transform:translateY(-50%)"><span class="v">${G(x.v)}<span>${x.u}</span></span></div>`;lo+=hh})}
  return `<div class="ch">${h}</div>`}
const R={
  phases:s=>{const T=s.parts.reduce((x,p)=>x+fnum(p.v),0);
    return HD(s)+`<div class="phT">${s.stats.map((x,j)=>`<div class="phk${j?'':' n'}"><div class="v">${j?N(x.v):G(x.v)}<span class="u">${x.u}</span></div><div class="l">${x.l}</div></div>`).join('')}</div>
      <div class="phB">${s.parts.map((p,j)=>`<div class="ph p${j}" style="width:${(fnum(p.v)/T*100).toFixed(2)}%"><div class="pn">${p.n}</div><i></i><div class="pv">${N(p.v)}<span class="u">${p.u}</span></div><div class="ps">${p.s}</div></div>`).join('')}</div>`+(s.foot?`<div class="foot">${s.foot}</div>`:'')},
  /* which systems existed: one row per system, its state before 2014 and in 2026 */
  sys:s=>HD(s)+`<div class="sy"><div class="syh"><span class="o">${s.ya||'قبل 2014'}</span><span class="n">${s.yb||'2026'}</span></div>
    ${s.items.map(x=>`<div class="syr"><span class="o">${x.a?`<i class="on">${x.t} · ${x.a}</i>`:`<i class="no"><b>${x.t}</b></i>`}</span><span class="n"><i class="on">${ICON(x.ic,46)}<b>${x.t}</b></i></span></div>`).join('')}
    <div class="syc"><span class="o">${s.a.cap}</span><span class="n">${s.b.cap}</span></div></div>`,
  cover:s=>`<div class="kick">${s.k}</div>
    <div class="end a">${N(s.y0)}<div class="sb">${s.s0}</div></div>
    <div class="tl">${Array.from({length:11},(_,i)=>`<i style="right:${((i+1)/12*100).toFixed(2)}%"></i>`).join('')}</div>
    <div class="end b">${G(s.y1)}<div class="sb">${s.s1}</div></div>
    <div class="mv">${s.moves.map(m=>`<div class="m"><div class="ib">${ICON(m.ic,62)}</div><div class="n">${m.n}</div><div class="t">${m.t}</div></div>`).join('')}</div>`,
  /* one measure; with a callout the pair moves right to leave the callout its room */
  col:s=>HD(s)+colChart({a:s.a,b:s.b,add:s.add,adds:s.adds,call:s.call},(s.call||s.adds)?{x0:300,x1:1260,top:s.k?530:470,base:890}:{x0:360,x1:1560,top:s.k?530:470,base:890},{ya:s.ya,yb:s.yb}),
  /* a few indicators side by side: for each, the earlier figure (faint) and the figure before 2014 (dark), true to scale */
  /* the economy before 2014: each indicator's figure big, an arrow for which way it went, and what it had been */
  /* the economy before 2014: what each indicator had been (small, grey), a falling connector, and what it fell to (big) —
     read top to bottom, every column shows the slide's «تدهور» (Amr 23:14–23:15) */
  /* the economy before 2014 as small curves (Amr 23:15 «كيرفات بيانية … واضحة للشخص العادي»): the earlier figure on the right,
     a curve to the figure before 2014 on the left, the area under it shaded; the new figure big under the curve */
  pairs:s=>{const n=s.rows.length,W=1600/n;
    return HD(s)+s.rows.map((r,i)=>{const VW=Math.round(W-60),XO=VW-32,C1=Math.round(VW*.63),C2=Math.round(VW*.37),A=fnum(r.a),B=fnum(r.b),M=Math.max(A,B)*1.12||1,lo=s.fut?Math.min(A,B)*.8:0,hi=s.fut?Math.max(A,B)*1.05:M,yo=Math.round(196-(A-lo)/(hi-lo)*160),yn=Math.round(196-(B-lo)/(hi-lo)*160);
      return `<div class="ec${s.fut?' fu':''}${n>3?' st':''}" style="right:${160+i*W}px;width:${W}px"><div class="ic2">${ICON(r.ic,56)}</div><div class="nm">${r.nm}${r.sub?`<div class="sub">${r.sub}</div>`:''}</div>
        <div class="cv" style="width:${VW}px"><svg viewBox="0 0 ${VW} 210" style="width:${VW}px"><defs><linearGradient id="cg${i}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${s.fut?'#3d5cc0':'#7d839b'}" stop-opacity=".3"/><stop offset="1" stop-color="${s.fut?'#3d5cc0':'#2b3350'}" stop-opacity="0"/></linearGradient></defs>
          <line x1="16" y1="200" x2="${VW-16}" y2="200" stroke="rgba(28,37,71,.2)" stroke-width="3"/>
          <path d="M${XO} ${yo} C${C1} ${yo} ${C2} ${yn} 32 ${yn} L32 200 L${XO} 200 Z" fill="url(#cg${i})"/>
          <path d="M${XO} ${yo} C${C1} ${yo} ${C2} ${yn} 32 ${yn}" fill="none" stroke="${s.fut?'#3d5cc0':'#7d839b'}" stroke-width="6" stroke-linecap="round"/>
          <circle cx="${XO}" cy="${yo}" r="11" fill="#d9deec" stroke="${s.fut?'#7b90e0':'#8a90a8'}" stroke-width="5"/><circle cx="32" cy="${yn}" r="15" fill="${s.fut?'#3d5cc0':'#7d839b'}"/></svg></div>
        <div class="pv"><div class="po"><div class="ey2">${s.ya||''}</div><div class="nr">${N(r.a)}${r.u?`<span class="u">${r.u}</span>`:''}</div></div><div class="pn"><div class="ey2">${s.yb||''}</div><div class="nr">${s.fut?G(r.b):N(r.b)}${r.u?`<span class="u">${r.u}</span>`:''}</div></div></div></div>`}).join('')},
  /* a decline told as slopes: the earlier figure, the line, the figure before 2014 */
  trend:s=>HD(s)+s.rows.map((r,i)=>{const A=fnum(r.a),B=fnum(r.b),M=Math.max(A,B)||1,ya=96-A/M*84,yb=96-B/M*84;
    return `<div class="tw" style="top:${310+i*142}px"><div class="mh"><div class="ib">${ICON(r.ic,52)}</div><div><div class="mn">${r.nm}</div></div></div>
      <div class="va">${N(r.a)}${r.u?`<span class="x">${r.u}</span>`:''}</div><svg class="sl" viewBox="0 0 300 110"><line x1="284" y1="${ya.toFixed(1)}" x2="16" y2="${yb.toFixed(1)}" stroke="#5a6280" stroke-width="6" stroke-linecap="round"/><circle cx="284" cy="${ya.toFixed(1)}" r="11" fill="#d9deec" stroke="#8a90a8" stroke-width="5"/><circle cx="16" cy="${yb.toFixed(1)}" r="13" fill="#2b3350"/></svg>
      <div class="vb">${N(r.b)}${r.u?`<span class="x">${r.u}</span>`:''}</div></div>`}).join(''),
  /* shares of a whole, each on its own 100% track */
  pcts:s=>{const n=s.rows.length,W=1600/n,C=2*Math.PI*130;
    return HD(s)+s.rows.map((r,i)=>{const f=fnum(r.v)/100;return `<div class="dn" style="right:${160+i*W}px;width:${W}px"><div style="position:relative;width:330px;height:330px"><svg viewBox="0 0 330 330"><circle cx="165" cy="165" r="130" fill="none" stroke="rgba(28,37,71,.1)" stroke-width="44"/><circle cx="165" cy="165" r="130" fill="none" stroke="#8a90a8" stroke-width="44" stroke-dasharray="${(C*f).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 165 165) scale(1,-1) translate(0,-330)" stroke-linecap="butt"/></svg>
      <div class="ctr">${r.pre?`<span class="pre">${r.pre}</span>`:''}${N(r.v)}</div></div><div class="l">${r.l}</div>${r.l2?`<div class="l2">${r.l2}</div>`:''}</div>`}).join('')},
  /* a portion of a whole: the whole as a full track, then the part of it that was done */
  part:s=>{const W=fnum(s.a.v),P=fnum(s.b.v),pw=(P/W*100).toFixed(2);
    const TOP=`
      <div class="p3t"><div class="p3n"><span class="y">${s.yb||'2026'}</span>${G(s.b.v)}<span class="u">${s.b.u}</span></div><div class="p3c n">${s.b.n||''}</div></div>
`,BAR=`${s.wh?'<div class="spn"></div>':''}<div class="p3bar"><i style="width:${pw}%"></i></div>`,BOT=`<div class="p3t o"><div class="p3n"><span class="y">${s.ya||'قبل 2014'}</span>${N(s.a.v)}<span class="u">${s.a.u}</span></div><div class="p3c">${s.a.n||''}</div></div>`;
    return HD(s)+(s.hero?`<div class="hero"><span>${s.hero.pre||''}</span>${G(s.hero.v)}<span>${s.hero.u}</span></div>`:'')+`<div class="p3${s.wh?' wh':''}${s.rem?' rm':''}">${s.flip?BOT+BAR+TOP:TOP+BAR+BOT}</div>`+(s.foot?`<div class="foot">${s.foot}</div>`:'')},
  /* what there was, and what there is now, as two lists */
  list:s=>HD(s)+`<div class="ls o"><div class="y">${s.ya||'قبل 2014'}</div>${s.a.items.map(t=>`<div class="it">${t}</div>`).join('')}<div class="cap">${s.a.cap||''}</div></div><div class="ls-d"></div>
    <div class="ls n"><div class="y">${s.yb||'2026'}</div>${s.b.items.map(t=>`<div class="it">${ICON(t.ic,64)}<span>${t.t}</span></div>`).join('')}<div class="cap">${s.b.cap||''}</div></div>`,
  /* two figures the client sets against each other */
  duo:s=>{const C=2*Math.PI*120,f=fnum(s.a.v)/100;return HD(s)+`<div class="dud"></div><div class="du o"><div class="y">${s.ya||'قبل 2014'}</div>${s.a.pct?`<div class="ring"><svg viewBox="0 0 300 300"><circle cx="150" cy="150" r="120" fill="none" stroke="rgba(28,37,71,.1)" stroke-width="40"/><circle cx="150" cy="150" r="120" fill="none" stroke="#6a7088" stroke-width="40" stroke-dasharray="${(C*f).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 150 150) scale(1,-1) translate(0,-300)"/></svg><div class="rc">${N(s.a.v)}</div></div>`:`<div class="vv">${N(s.a.v)}${s.a.u?`<span class="u">${s.a.u}</span>`:''}</div>`}<div class="l">${s.a.l}</div></div>

    <div class="du n"><div class="y">${s.yb||'2026'}</div><div class="vv">${G(s.b.v)}${s.b.u?`<span class="u">${s.b.u}</span>`:''}</div><div class="l">${s.b.l}</div></div>`},
  /* the closing words */
  close:s=>`<div class="cl${s.dv?' dv':''}"><div class="q">${s.q}</div><div class="a">${s.a}</div></div>`,
  /* what was ended, crossed out; who lived there and what was built, under it */
  strike:s=>HD(s)+`<div class="sk2"><div class="sko"><div class="y">${s.ya||'قبل 2014'}</div><div class="kx">${N(s.a.v)}</div><div class="u">${s.a.u}</div>
      ${s.a2?`<div class="ex">${ICON(s.a2.ic,56)}<span>${s.a2.pre||''}</span>${N(s.a2.v)}<span>${s.a2.u}</span></div>`:''}</div>
    <div class="skd"></div>
    <div class="skn"><div class="y">${s.yb||'2026'}</div>${s.b.v!=null?`<div class="kz">${G(s.b.v)}</div><div class="u">${s.b.u}</div><div class="t sm">${s.b.t}</div>`:`<div class="t">${s.b.t}</div>`}
      ${s.b2?`<div class="ex ${s.b2.tg?'tg':'n'}">${ICON(s.b2.ic,56)}<span>${s.b2.pre||''}</span>${s.b2.tg?N(s.b2.v):G(s.b2.v)}<span>${s.b2.u}</span></div>`:''}</div></div>`,
  /* the same measure in both rows: a full bar of unsafe areas, then the empty track where it was; who lived there and how it ended sit inside */
  gone:s=>HD(s)+`<div class="gn o" style="top:400px"><div class="gl"><div class="y">${s.ya||'قبل 2014'}</div><div class="vv">${N(s.a.v)}<span class="u">${s.a.u}</span></div></div>
      <div class="tr">${ICON(s.a2.ic,64)}<span class="pre">${s.a2.pre}</span>${N(s.a2.v)}<span class="u">${s.a2.u}</span></div></div>
    <div class="gn n" style="top:700px"><div class="gl"><div class="y">${s.yb||'2026'}</div><div class="res">${ICON(s.b.ic,72)}<span>${s.b.t}</span></div></div>
      <div class="tr">${ICON(s.b2.ic,64)}<span class="pre">${s.b2.pre}</span>${G(s.b2.v)}<span class="u">${s.b2.u}</span></div></div>`,
  /* two sides, one hierarchy: the problem and who lived it (right, dim) · the outcome and how (left, cobalt) */
  split:s=>HD(s)+`<div class="sp o"><div class="y">${s.ya||'قبل 2014'}</div>
      <div class="hero"><span class="num">${s.a.v}</span><div class="u">${s.a.u}</div></div><div class="ln"></div>
      <div class="sec"><span class="pre">${s.a2.pre}</span><span class="num">${s.a2.v}</span><span class="u">${s.a2.u}</span></div></div>
    <div class="sp-ar">${ICON('arrow-left',58)}</div>
    <div class="sp n"><div class="y">${s.yb||'2026'}</div>
      <div class="hero"><div class="ic">${ICON(s.b.ic,120)}</div><div class="t">${s.b.t}</div></div><div class="ln"></div>
      <div class="sec"><span class="pre">${s.b2.pre}</span><span class="num">${s.b2.v}</span><span class="u">${s.b2.u}</span></div></div>`,
  /* the same people, before and after: one figure for every 100 thousand, in an unsafe area (right) and in a safe home (left) */
  people:s=>{const fig=n=>Array.from({length:n},()=>ICON('user',74)).join(''),n=Math.round(fnum(s.who.v)*10);
    return HD(s)+`<div class="pp o"><div class="y">${s.ya||'قبل 2014'}</div><div class="fr"><div class="bd">${ICON('triangle-alert',44)}</div>${fig(n)}</div>
        <div class="l1"><span class="pre">${s.who.pre}</span>${N(s.who.v)}<span class="u">${s.who.u}</span></div>
        <div class="l2">${N(s.a.v)}<span>${s.a.u}</span></div></div>
      <div class="pp-ar">${ICON('arrow-left',58)}</div>
      <div class="pp n"><div class="y">${s.yb||'2026'}</div><div class="fr"><div class="bd">${ICON('shield-check',44)}</div>${fig(n)}</div>
        <div class="l1"><span class="t">${s.res}</span></div>
        <div class="l2"><span>${s.b.pre}</span>${G(s.b.v)}<span>${s.b.u}</span></div></div>
      <div class="pp-key">${ICON('user',40)}<span>= ${s.key}</span></div>`},
  /* people on the move: from the unsafe areas (right) through a band that carries them to the new homes (left) */
  sankey:s=>{const p=s.mid;
    return HD(s)+`<div class="sk"><svg viewBox="0 0 1920 1080"><defs><linearGradient id="skg" x1="1" x2="0" y1="0" y2="0"><stop offset="0" stop-color="#1c2547" stop-opacity=".14"/><stop offset="1" stop-color="#3d5cc0" stop-opacity=".42"/></linearGradient></defs>
      <path d="M1360 430 C1120 430 800 470 560 470 L560 770 C800 770 1120 810 1360 810 Z" fill="url(#skg)"/><path d="M1272 592 L1236 622 L1272 652" fill="none" stroke="#3d5cc0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.35"/><path d="M1212 592 L1176 622 L1212 652" fill="none" stroke="#3d5cc0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/><path d="M722 592 L686 622 L722 652" fill="none" stroke="#3d5cc0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/><path d="M662 592 L626 622 L662 652" fill="none" stroke="#3d5cc0" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/></svg>
      <div class="yy o">${s.a.y||'قبل 2014'}</div><div class="yy n">${s.b.y||'2026'}</div>
      <div class="bx o"><div class="ib">${ICON(s.a.ic,72)}</div>${N(s.a.v)}<div class="u">${s.a.u}</div></div>
      <div class="mid"><div class="ib">${ICON(p.ic,56)}</div><div class="pre">${p.pre}</div>${G(p.v)}<div class="u">${p.u}</div></div>
      <div class="bx n"><div class="ib">${ICON(s.b.ic,72)}</div><div class="pre">${s.b.pre||''}</div><span class="num">${s.b.v}</span><div class="u">${s.b.u}</div></div>
      ${s.res?`<div class="res">${ICON(s.res.ic,58)}${s.res.t}</div>`:''}</div>`},
  /* a before → after story told in figures: what there was, who lived there, what was built, what came of it */
  flow:s=>{const it=(x,isN)=>`<div class="it"><div class="ib">${ICON(x.ic,72)}</div><div class="pre">${x.pre||''}</div>${isN?G(x.v):N(x.v)}<div class="u">${x.u}</div></div>`;
    return HD(s)+`<div class="fl o"><div class="y">${s.a.y||'قبل 2014'}</div><div class="its">${s.a.items.map(x=>it(x,0)).join('')}</div></div>
      <div class="fl-ar">${ICON('arrow-left',60)}</div>
      <div class="fl n"><div class="y">${s.b.y||'2026'}</div><div class="its">${s.b.items.map(x=>it(x,1)).join('')}</div>${s.b.res?`<div class="res">${ICON(s.b.res.ic,56)}${s.b.res.t}</div>`:''}</div>`},
  /* 2–3 measures in rows, each pair of bars on its own scale */
  /* 2–5 measures in rows, each pair of bars on its own scale (a percentage on the whole 100); the years are named once, on the first row */
  /* 2–5 measures side by side (Amr 22:56 «بالعرض»), each its own pair of columns to scale, every column named by its year under it:
     grey = قبل 2014 on the right, cobalt = 2026 on the left, the figure and its unit right above its column */
  rows:s=>{const n=s.rows.length,W=1600/n,stk=r=>96+((r.u||(r.pct&&r.ax))?40:0)+(r.pb?38:0)+((!r.pct&&(r.ax||r.bx))?76:0),H=Math.min(n>4?260:(n>2?320:340),...s.rows.map(r=>496-stk(r))),sp=t=>{const m=String(t||'').match(/^([\d.,:\s–-]+)\s*(.*)$/);return m?[m[1].trim(),m[2]]:['',t||'']},CM=s.common?Math.max(...s.rows.map(r=>Math.max(fnum(r.a),fnum(r.b)))):0;
    return HD(s)+s.rows.map((r,i)=>{const T=r.pct&&r.ax&&r.bx,A=r.an!=null?r.an:fnum(r.a),B=r.bn!=null?r.bn:fnum(r.b),M=r.pct?100:(CM||Math.max(A,B)||1)*(s.rows.some(q=>q.pct)?1.18:1),
      bw=T?Math.min(176,W*.33):Math.min(130,W*.27),gp=r.gp||Math.max(26,W*.16),cx=W/2,xr=cx-gp/2-bw,xl=cx+gp/2,hA=r.a==null||A===0?0:Math.max(10,Math.round(A/M*H)),hB=Math.max(10,Math.round(B/M*H)),
      LW=bw+gp+40,ua=r.ua||r.u||'',ub=r.ub||r.u||'',xa=!r.pct&&r.ax?`<span class="xx" style="width:${s.wf?bw+gp:LW}px${s.wf?';white-space:nowrap':''}">${r.ax}</span>`:'',xb=!r.pct&&r.bx?`<span class="xx" style="width:${LW+40}px">${r.bx}</span>`:'',
      PA=r.pct&&r.ax?sp(r.ax):null,PB=r.pct&&r.bx?sp(r.bx):null,fa=T&&hA>=84,fb=T&&hB>=84,inA=fa?`<div class="inb${String(r.a).length>4?' sm':''}">${N(r.a)}</div>`:'',inB=fb?`<div class="inb${String(r.b).length>4?' sm':''}">${N(r.b)}</div>`:'',
      topA=T?((fa?'':N(r.a))+(PA?`${N(PA[0])}<span class="uu">${PA[1]}</span>`:'')):`${N(r.a)}${ua?`<span class="uu">${ua}</span>`:''}${xa}`,
      topB=T?((fb?'':G(r.b))+(PB?`${G(PB[0])}<span class="uu">${PB[1]}</span>`:'')):`${s.wf?N(r.b):G(r.b)}${ub?`<span class="uu">${ub}</span>`:''}${xb}`;
      return `<div class="cs${T?' t':''}" style="right:${160+i*W}px;width:${W}px"><div class="nm">${r.ic?`<span class="ni">${ICON(r.ic,54)}</span>`:''}<span>${r.nm}</span></div>
        ${r.a==null&&r.at?`<div class="so"><div class="so-o"><div class="y">${r.ya||s.ya||'قبل 2014'}</div><div class="t">${r.at}</div></div><div class="so-n"><div class="y">${r.yb||s.yb||'2026'}</div>${r.pb?`<div class="pb">${r.pb}</div>`:''}${G(r.b)}<div class="u">${r.u||''}</div></div></div>`:r.a==null?`<div class="lb o" style="right:${xr+bw/2-LW/2}px;width:${LW}px;bottom:${130+16}px">${r.at?`<span class="tt">${r.at}</span>`:N('—')}</div>`
          :`${r.pct?`<div class="trk" style="right:${xr}px;width:${bw}px;height:${H}px"></div><div class="trk" style="right:${xl}px;width:${bw}px;height:${H}px"></div>`:''}<div class="col2 o" style="right:${xr}px;width:${bw}px;height:${hA}px">${RG(r.a)?(()=>{const q=String(r.a).split(/[–-]/).map(Number);return `<i class="cap" style="height:${((1-Math.min(...q)/Math.max(...q))*100).toFixed(1)}%"></i>`})():''}${inA}</div><div class="lb o" style="right:${xr+bw/2-LW/2}px;width:${LW}px;bottom:${130+(r.pct?H:hA)+14}px">${topA}</div>`}
        ${r.a==null&&r.at?'':`<div class="col2 ${s.wf?'w':'n'}" style="right:${xl}px;width:${bw}px;height:${hB}px">${inB}</div><div class="lb ${s.wf?'w':'n'}" style="right:${xl+bw/2-LW/2}px;width:${LW}px;bottom:${130+(r.pct?H:hB)+14}px">${r.pb?`<span class="pr2">${r.pb}</span>`:''}${topB}</div>
        <div class="base3"></div>
        <div class="yy2 o" style="right:${xr+bw/2-90}px;width:180px">${r.ya||s.ya||'قبل 2014'}</div><div class="yy2 ${s.wf?'w':'n'}" style="right:${xl+bw/2-90}px;width:180px">${r.yb||s.yb||'2026'}</div>`}
        ${r.nb?`<div class="nb2${r.nbo?' o':''}${r.nbt?' tg':''}" style="left:0;right:0;font-size:32px">${r.nb}</div>`:''}</div>`}).join('')+(s.foot?`<div class="foot"${s.wf?' style="color:#3b4160"':''}>${s.foot}</div>`:'')},
  /* a share of Egypt's whole area: the same 7% in both rows, and what was added */
  share:s=>{const A=fnum(s.a.v),B=fnum(s.b.v);
    return HD(s)+`<div class="sr o" style="top:450px"><div class="sl"><span class="y">${s.ya||'قبل 2014'}</span>${N(s.a.v)}</div><div class="tr"><i class="b0" style="width:${A}%"></i><span>${s.whole}</span></div></div>
      <div class="sr n" style="top:720px"><div class="sl"><span class="y">${s.yb||'2026'}</span>${G(s.b.v)}</div><div class="trw"><div class="tr"><i class="b0" style="width:${A}%"></i><i class="a0" style="width:${B-A}%"></i></div><em class="ad" style="right:${A}%;width:${B-A}%">${N('+'+(B-A)+'%')}</em></div></div>`},
  /* the Nile's crossings: the same stretch of river, a mark at every crossing */
  gaps:s=>{const span=4*Math.max(fnum(s.a.v),fnum(s.b.v));
    const marks=v=>{let h='';for(let k=0;k<=span+1e-6;k+=fnum(v))h+=`<i style="right:${(k/span*100).toFixed(2)}%"></i>`;return h};
    const row=(c,x,t,y)=>`<div class="gr ${c}" style="top:${t}px"><div class="gl"><div class="y">${y}</div><div class="vv">${c.startsWith('n')?G(x.v):N(x.v)}<span class="u">${x.u}</span></div><div class="nt">${x.n||''}</div></div><div class="river">${marks(x.v)}<b>${s.river||'النيل'}</b>${c=='o'&&s.key?`<em class="ky">${s.key}</em>`:''}</div></div>`;
    return HD(s)+row('o',s.a,360,s.ya||'قبل 2014')+row(s.bt?'n t':'n',s.b,610,s.bt||s.yb||'2026')+
      `<div class="gsep"></div><div class="gr n d" style="top:900px"><div class="gl"><div class="vv"><span class="y" style="margin:0 0 0 8px">${s.yb||'2026'}</span>${G(s.done.v)}<span class="u">${s.done.u}</span></div></div><div class="pt"><i style="width:${(fnum(s.done.v)/fnum(s.of.v)*100).toFixed(2)}%"></i><span>${s.of.t}</span></div></div>`}
};
const stage=document.getElementById('stage');
stage.innerHTML=KN.map((s,i)=>`<section class="s ${s.bg||'light'} ${s.type}" data-i="${i}">${R[s.type](s)}</section>`).join('');
const S=[...stage.children];let cur=Math.min(S.length-1,Math.max(0,(parseInt(location.hash.slice(1))||1)-1));
function go(i){cur=Math.max(0,Math.min(S.length-1,i));S.forEach((x,j)=>x.classList.toggle('on',j===cur));history.replaceState(null,'','#'+(cur+1))}
function fitN(){document.querySelectorAll('.s').forEach(sec=>{const ts=[...sec.querySelectorAll('.cs .nm>span:last-child')];if(!ts.length)return;const on=sec.classList.contains('on');if(!on)sec.style.display='block';let m=44;ts.forEach(t=>{t.style.whiteSpace='nowrap';let f=44;t.style.fontSize=f+'px';const nm=t.parentElement;while(nm.scrollWidth>nm.clientWidth&&f>34){f-=2;t.style.fontSize=f+'px'}m=Math.min(m,f)});ts.forEach(t=>t.style.fontSize=m+'px');if(!on)sec.style.display=''})}
function fitQ(){document.querySelectorAll('.hd .h').forEach(h=>{const sec=h.closest('.s'),on=sec.classList.contains('on');if(!on)sec.style.display='block';h.style.whiteSpace='nowrap';let f=84;h.style.fontSize=f+'px';while(h.scrollWidth>h.parentElement.clientWidth&&f>60){f-=2;h.style.fontSize=f+'px'}if(!on)sec.style.display=''})}
function fit(){const k=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`scale(${k})`}
addEventListener('resize',fit);fit();go(cur);document.fonts.ready.then(()=>{fitQ();fitN()});
addEventListener('keydown',e=>{if(['ArrowLeft','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();go(cur+1)}else if(['ArrowRight','PageUp','Backspace'].includes(e.key)){e.preventDefault();go(cur-1)}else if(e.key==='Home')go(0);else if(e.key==='End')go(S.length-1);else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}});
addEventListener('click',e=>{go(e.clientX<innerWidth/2?cur+1:cur-1)});
let tx=0;addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>40)go(d>0?cur+1:cur-1)},{passive:true});
/* live: the page reloads on the same slide when src/kn/live.js changes (offline too) */
(function(){let last=null;setInterval(()=>{const sc=document.createElement('script');sc.src='src/kn/live.js?t='+Date.now();sc.onload=()=>{if(last===null)last=window.KNLIVE;else if(window.KNLIVE!==last)location.reload();sc.remove()};sc.onerror=()=>sc.remove();document.head.appendChild(sc)},2500)})();
</script>

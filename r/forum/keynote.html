<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>الجلسة الختامية · Keynote</title>
<style>
/* «الجلسة الختامية» keynote edition (Amr 21:30): one idea per slide, the figure is the hero, 2014 against 2026,
   short words, no grid and no motion: slides simply follow one another. 1920×1080, scaled to the screen. */
@font-face{font-family:'KNum';src:url(fonts/montserrat-500.woff2) format('woff2');font-weight:100 549;font-display:block;unicode-range:U+0025,U+002B-002E,U+0030-0039,U+2013,U+00D7}
@font-face{font-family:'KNum';src:url(fonts/montserrat-600.woff2) format('woff2');font-weight:550 649;font-display:block;unicode-range:U+0025,U+002B-002E,U+0030-0039,U+2013,U+00D7}
@font-face{font-family:'KNum';src:url(fonts/montserrat-700.woff2) format('woff2');font-weight:650 749;font-display:block;unicode-range:U+0025,U+002B-002E,U+0030-0039,U+2013,U+00D7}
@font-face{font-family:'KNum';src:url(fonts/montserrat-800.woff2) format('woff2');font-weight:750 1000;font-display:block;unicode-range:U+0025,U+002B-002E,U+0030-0039,U+2013,U+00D7}
@font-face{font-family:'KAr';src:url(fonts/cairo-medium.woff2) format('woff2');font-weight:100 549;font-display:block}
@font-face{font-family:'KAr';src:url(fonts/cairo-ar-600.woff2) format('woff2');font-weight:550 649;font-display:block;unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+200C-200E,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:'KAr';src:url(fonts/cairo-ar-700.woff2) format('woff2');font-weight:650 749;font-display:block;unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+200C-200E,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:'KAr';src:url(fonts/cairo-ar-800.woff2) format('woff2');font-weight:750 849;font-display:block;unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+200C-200E,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:'KAr';src:url(fonts/cairo-black.woff2) format('woff2');font-weight:850 1000;font-display:block}
:root{--blue:#3d5cc0;--blue2:#8e9be6;--navy:#1c2547;--ink:#1c2547;--paper:#e6eaf3;--grey:#8a8fa6;--peach:#ee9873;--f:'KNum','KAr',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0e1430;overflow:hidden}
body{font-family:var(--f);-webkit-font-smoothing:antialiased;color:#eef1fa}
#vp{position:fixed;inset:0;display:grid;place-items:center}
#stage{position:relative;width:1920px;height:1080px;transform-origin:50% 50%;overflow:hidden}
.s{position:absolute;inset:0;display:none;overflow:hidden}
.s.on{display:block}
/* backgrounds */
.s.dark{background:radial-gradient(90% 80% at 12% 0%,rgba(238,152,115,.16) 0%,rgba(238,152,115,0) 60%),radial-gradient(120% 120% at 100% 100%,#22306a 0%,#141b3e 45%,#0e1430 100%);color:#eef1fa}
.s.blue{background:radial-gradient(70% 70% at 10% 15%,rgba(238,152,115,.45) 0%,rgba(238,152,115,0) 60%),linear-gradient(135deg,#2a3b86 0%,#34499f 45%,#3d5cc0 100%);color:#f3f5fb}
.s.light{background:radial-gradient(60% 60% at 0% 0%,rgba(182,214,240,.55) 0%,rgba(182,214,240,0) 70%),radial-gradient(55% 55% at 100% 0%,rgba(238,152,115,.28) 0%,rgba(238,152,115,0) 70%),radial-gradient(70% 70% at 50% 110%,rgba(142,155,230,.4) 0%,rgba(142,155,230,0) 70%),#dfe4ef;color:var(--ink)}
/* the forum mark on every slide */
.brand{position:absolute;top:56px;right:96px;left:96px;display:flex;justify-content:space-between;align-items:center;font:600 22px/1 var(--f);opacity:.75}
.brand img{height:44px;width:auto}
.brand .gov{display:flex;align-items:center;gap:14px}
.brand .gov span{display:flex;flex-direction:column;gap:6px}.brand .gov b{font-weight:700}
.s.light .brand{opacity:.8}
.pg{position:absolute;bottom:52px;left:96px;font:500 20px/1 var(--f);opacity:.45;direction:ltr}
.tag{position:absolute;bottom:52px;right:96px;font:600 22px/1 var(--f);opacity:.55}
/* type */
.num{font-family:'KNum','KAr',sans-serif;font-variant-numeric:lining-nums;direction:ltr;unicode-bidi:isolate;line-height:.86;letter-spacing:-.02em}
.h1{font:900 104px/1.12 var(--f)}
.h2{font:900 76px/1.15 var(--f)}
.lead{font:500 40px/1.45 var(--f);opacity:.78}
.grad{background:linear-gradient(100deg,#eef1fa 0%,#c3cdf2 45%,#ee9873 110%);-webkit-background-clip:text;background-clip:text;color:transparent}
.s.light .grad{background:linear-gradient(100deg,#2a3b86 0%,#3d5cc0 55%,#ee9873 115%);-webkit-background-clip:text;background-clip:text;color:transparent}
.yr{align-self:flex-start;display:inline-flex;align-items:center;gap:12px;font:700 30px/1 var(--f);padding:12px 26px;border-radius:999px}
.yr.old{background:rgba(238,241,250,.1);color:rgba(238,241,250,.7)}
.yr.new{background:var(--blue);color:#fff}
.s.light .yr.old{background:rgba(11,13,20,.07);color:rgba(11,13,20,.6)}
.s.blue .yr.new{background:var(--peach);color:#1c2547}

/* ---- cover ---- */
.cover .c{position:absolute;right:140px;left:140px;top:300px}
.cover .kick{font:600 34px/1 var(--f);opacity:.8;margin-bottom:40px}
.cover .big{display:flex;align-items:baseline;gap:40px;font:900 190px/1 var(--f)}
.cover .big .num{font-weight:700;font-size:220px}
.cover .sub{margin-top:56px;font:500 50px/1.4 var(--f);opacity:.9}

/* ---- section ---- */
.sec .no{position:absolute;left:110px;top:120px;font:800 760px/.8 'KNum',sans-serif;letter-spacing:-.06em;color:transparent;-webkit-text-stroke:3px rgba(142,155,230,.4);direction:ltr}
.sec .c{position:absolute;right:140px;bottom:200px;max-width:1150px}
.sec .k{font:700 40px/1 var(--f);color:var(--peach);margin-bottom:30px}
.sec .h1{font-size:150px}

/* ---- compare: 2014 on the right, 2026 on the left ---- */
.cmp .t{position:absolute;right:140px;top:170px;left:140px}
.cmp .t .k{font:600 34px/1 var(--f);opacity:.55;margin-bottom:22px}
.cmp .row{position:absolute;right:140px;left:140px;top:350px;display:grid;grid-template-columns:1fr auto 1.25fr;align-items:end;column-gap:80px;direction:rtl}
.cmp .col{display:flex;flex-direction:column;gap:22px}
.cmp .col.old .num{font-size:210px;font-weight:600;color:rgba(238,241,250,.4)}
.cmp .col.new .num{font-size:300px;font-weight:700}
.s.light.cmp .col.old .num{color:rgba(28,37,71,.32)}
.cmp .u{font:700 52px/1.2 var(--f)}
.cmp .col.old .u{opacity:.5}
.cmp .note{font:500 32px/1.4 var(--f);opacity:.62;max-width:720px}
.cmp .arrow{align-self:center;width:130px;height:130px;opacity:.5;margin-bottom:60px}
.cmp .chip{align-self:flex-start;margin-top:10px;white-space:nowrap;display:flex;align-items:center;gap:22px;font:700 40px/1.2 var(--f);padding:26px 40px;border-radius:28px;background:rgba(238,152,115,.14);box-shadow:inset 0 0 0 2px rgba(238,152,115,.45)}
.cmp .col .chip .num{font-size:64px;font-weight:700;color:#ee9873;-webkit-text-fill-color:currentColor}
.s.light.cmp .chip{background:rgba(61,92,192,.1);box-shadow:inset 0 0 0 2px rgba(61,92,192,.3)}.s.light.cmp .col .chip .num{color:var(--blue)}

/* ---- photo hero ---- */
.photo .img{position:absolute;inset:0;background-size:cover;background-position:50% 50%}
.photo .img::after{content:"";position:absolute;inset:0;background:linear-gradient(270deg,rgba(3,4,10,.94) 0%,rgba(3,4,10,.82) 38%,rgba(3,4,10,.25) 75%,rgba(3,4,10,.1) 100%)}
.photo .c{position:absolute;right:140px;top:170px;width:1000px}

/* ---- rows: several measures, 2014 → 2026 ---- */
.rows .t{position:absolute;right:140px;top:170px;left:140px}
.rows .list{position:absolute;right:140px;left:140px;top:350px;display:flex;flex-direction:column}
.rows .r{display:grid;grid-template-columns:1fr .55fr 60px 1.05fr .9fr;align-items:center;column-gap:40px;padding:28px 0;border-top:2px solid rgba(28,37,71,.12)}
.s.dark.rows .r{border-top-color:rgba(238,241,250,.12)}
.rows .r:last-child{border-bottom:2px solid rgba(28,37,71,.12)}
.s.dark.rows .r:last-child{border-bottom-color:rgba(238,241,250,.12)}
.rows .nm{font:800 46px/1.2 var(--f)}
.rows .a,.rows .b{display:flex;align-items:baseline;gap:18px;justify-content:flex-start}
.rows .a .num{font-size:96px;font-weight:600;opacity:.38}
.rows .b .num{font-size:140px;font-weight:700}
.rows .a i,.rows .b i{font:600 32px/1.2 var(--f);font-style:normal;opacity:.6;white-space:nowrap}
.rows .ar{width:56px;height:56px;opacity:.35}
.rows .hd{display:grid;grid-template-columns:1fr .55fr 60px 1.05fr .9fr;column-gap:40px;margin-bottom:18px}
.rows .hd span{font:700 26px/1 var(--f);opacity:.5}


/* ---- map: Egypt with the network drawn on it, the figures beside ---- */
.map .mp{position:absolute;left:40px;top:70px;width:960px;height:960px}
.map .mp svg{width:100%;height:100%;overflow:visible}
.map .mp .eg{fill:rgba(142,155,230,.10);stroke:rgba(142,155,230,.55);stroke-width:2;stroke-linejoin:round}
.map .mp .nl{fill:none;stroke:#7fb7e6;stroke-width:3;stroke-linecap:round;opacity:.85}
.map .mp .rt{fill:none;stroke:#ee9873;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px rgba(238,152,115,.55))}
.map .mp .st{fill:#ee9873;stroke:#141b3e;stroke-width:3}
.s.light.map .mp .eg{fill:rgba(61,92,192,.08);stroke:rgba(61,92,192,.45)}.s.light.map .mp .st{stroke:#dfe4ef}
.map .c{position:absolute;right:140px;top:180px;width:780px}
.map .c .k{font:600 34px/1.35 var(--f);opacity:.6;margin-bottom:24px}
.map .figs{display:grid;grid-template-columns:auto auto;justify-content:start;column-gap:80px;align-items:end;margin-top:70px}
.map .fig{display:flex;flex-direction:column;gap:12px}
.map .fig .num{font-weight:700}
.map .fig.old .num{font-size:140px;font-weight:600;opacity:.45}
.map .fig.new .num{font-size:240px}
.map .fig .u{font:700 46px/1.2 var(--f)}.map .fig.old .u{opacity:.55}
.map .fig .note{font:500 30px/1.4 var(--f);opacity:.62}

/* ---- compare v2 (Amr 21:41 «اي رقم له رسم بياني بيبين المقارنة»): each figure sits on its own bar, true to scale;
   a percentage is drawn on a 0–100 track; what was added since 2014 lights up in peach ---- */
.cmp2 .t{position:absolute;right:140px;top:160px;left:140px}
.cmp2 .t .k{font:600 34px/1.35 var(--f);opacity:.6;margin-bottom:22px}
.cmp2 .bars{position:absolute;right:140px;left:140px;top:350px;display:flex;flex-direction:column;gap:46px}
.cmp2 .br{display:grid;grid-template-columns:660px 1fr;column-gap:70px;align-items:end}
.cmp2 .lab{display:flex;flex-direction:column;gap:14px}
.cmp2 .vv{display:flex;align-items:baseline;gap:24px}
.cmp2 .br.old .num{font-size:130px;font-weight:600;opacity:.45}
.cmp2 .br.new .num{font-size:200px;font-weight:700}
.cmp2 .vv .u{font:700 44px/1.2 var(--f);white-space:nowrap}.cmp2 .br.old .u{opacity:.55}
.cmp2 .note{font:500 30px/1.4 var(--f);opacity:.62}
.cmp2 .trk{position:relative;height:70px;border-radius:20px;background:rgba(142,155,230,.10);overflow:hidden;display:flex;margin-bottom:26px}
.cmp2 .br.new .trk{height:104px;border-radius:26px;margin-bottom:40px}
.cmp2 .trk i{display:block;height:100%}
.cmp2 .br.old .trk i{background:rgba(238,241,250,.32)}
.cmp2 .br.new .trk i{background:linear-gradient(270deg,#8e9be6,#3d5cc0)}
.cmp2 .br.new .trk i.add{background:linear-gradient(270deg,#f2b394,#ee9873)}
.cmp2 .scale{position:absolute;left:18px;top:50%;transform:translateY(-50%);font:600 24px/1 'KNum',sans-serif;opacity:.45;direction:ltr}
.s.light.cmp2 .br.old .trk i{background:rgba(28,37,71,.22)}.s.light.cmp2 .trk{background:rgba(61,92,192,.09)}
.s.blue.cmp2 .br.new .trk i{background:linear-gradient(270deg,#ffffff,#c3cdf2)}.s.blue.cmp2 .trk{background:rgba(255,255,255,.12)}
.cmp2 .key{display:flex;gap:40px;margin-top:-30px;font:600 30px/1.3 var(--f);opacity:.85}
.cmp2 .key span{display:inline-flex;align-items:center;gap:14px}.cmp2 .key span::before{content:"";width:26px;height:26px;border-radius:8px;background:var(--c)}
.cmp2 .key .num{font-size:44px;font-weight:700;color:#ee9873}
.cmp2 .key .ring::before{width:52px!important;height:52px!important;border-radius:50%!important;background:radial-gradient(closest-side,#141b3e 64%,transparent 66%),conic-gradient(#ee9873 calc(var(--p)*1%),rgba(142,155,230,.22) 0)!important}

/* mixed units (areas then, housing units now): no shared scale; the areas are counted as cells, all of them cleared by 2026 */
.cmp2 .cells{display:flex;flex-wrap:wrap;gap:7px;direction:rtl;align-content:flex-end;margin-bottom:26px}
.cmp2 .cells i{width:20px;height:20px;border-radius:5px;background:rgba(238,241,250,.32)}
.cmp2 .br.new .cells i{background:transparent;box-shadow:inset 0 0 0 2px rgba(142,155,230,.55)}
.cmp2 .br.new .cells i:nth-child(n){background:linear-gradient(135deg,#3d5cc0,#8e9be6);opacity:.25}

/* ---- compare v3 (Amr 21:43 «خد بالك من الاطراف ولسه كتاباتك صغيرة»): the bar is the chart and carries its figure at its tip;
   big words, 160px clear of every edge ---- */
.c3 .t{position:absolute;right:160px;left:160px;top:140px}
.c3 .t .k{font:600 42px/1.35 var(--f);opacity:.62;margin-bottom:18px}
.c3 .t .h2{font-size:104px}
.c3 .lanes{position:absolute;right:160px;left:160px;top:390px;display:flex;flex-direction:column;gap:34px}
.c3 .cap{display:flex;align-items:center;gap:24px;margin-bottom:14px}
.c3 .cap .yr{font-size:36px;padding:12px 28px}
.c3 .cap .nt{font:600 40px/1.3 var(--f);opacity:.7}
.c3 .lane{position:relative;display:flex;align-items:center;gap:34px;height:112px}
.c3 .new .lane{height:150px}
.c3 .fill{position:relative;height:100%;display:flex;border-radius:26px;overflow:hidden;flex:none;min-width:22px}
.c3 .old .fill{background:rgba(238,241,250,.3)}
.c3 .new .fill i{display:block;height:100%;background:linear-gradient(270deg,#8e9be6,#3d5cc0)}
.c3 .new .fill i.add{background:linear-gradient(270deg,#f5bd9f,#ee9873)}
.c3 .val{display:flex;align-items:baseline;gap:20px;white-space:nowrap}
.c3 .old .val .num{font-size:100px;font-weight:600;opacity:.55}
.c3 .new .val .num{font-size:140px;font-weight:700}
.c3 .val .u{font:700 52px/1.2 var(--f)}.c3 .old .val .u{opacity:.6}
.c3 .lane.in .val{position:absolute;right:auto;left:40px;top:50%;transform:translateY(-50%);color:#fff}
.c3 .lane.in .val .num{background:none;-webkit-text-fill-color:#fff;color:#fff;opacity:1}
.c3 .lane .trk{position:absolute;inset:0;border-radius:26px;background:rgba(142,155,230,.09);pointer-events:none}
.c3 .lane .trk b{position:absolute;left:24px;top:50%;transform:translateY(-50%);font:600 30px/1 'KNum',sans-serif;opacity:.45;direction:ltr}
.s.light.c3 .old .fill{background:rgba(28,37,71,.2)}.s.light.c3 .lane .trk{background:rgba(61,92,192,.08)}
.s.blue.c3 .new .fill i{background:linear-gradient(270deg,#fff,#c3cdf2)}.s.blue.c3 .lane.in .val{color:#1c2547}.s.blue.c3 .lane.in .val .num{-webkit-text-fill-color:#1c2547;color:#1c2547}
.c3 .key{display:flex;flex-wrap:wrap;gap:24px 56px;margin-top:6px;font:700 40px/1.3 var(--f)}
.c3 .key span{display:inline-flex;align-items:center;gap:16px}.c3 .key span::before{content:"";flex:none;width:34px;height:34px;border-radius:10px;background:var(--c)}
.c3 .key .num{font-size:56px;font-weight:700;color:#ee9873}
.c3 .key .ring::before{width:60px!important;height:60px!important;border-radius:50%!important;background:radial-gradient(closest-side,#141b3e 62%,transparent 64%),conic-gradient(#ee9873 calc(var(--p)*1%),rgba(142,155,230,.25) 0)!important}
.c3 .cells{display:flex;flex-wrap:wrap;gap:6px;direction:rtl;width:1100px}
.c3 .cells i{width:14px;height:14px;border-radius:4px;background:rgba(238,241,250,.34)}
.c3 .new .cells i{background:rgba(142,155,230,.18);box-shadow:inset 0 0 0 2px rgba(142,155,230,.35)}
/* bigger chrome */
.brand{top:60px;right:160px;left:160px;font-size:26px}.brand img{height:58px}
.pg{left:64px;bottom:44px;font-size:24px}.tag{right:64px;top:44px;bottom:auto;font-size:26px}

/* ---- zone map: the 2014 valley and what was added by 2026, on Egypt; the shares on a 0–100 track beside ---- */
.zmap .mp{position:absolute;left:70px;top:60px;width:960px;height:960px}
.zmap .mp svg{width:100%;height:100%;overflow:visible}
.zmap .eg{fill:rgba(142,155,230,.08);stroke:rgba(142,155,230,.5);stroke-width:2}
.zmap .zv{fill:#5b78dd;stroke:#8e9be6;stroke-width:1.5}
.zmap .zg{fill:rgba(238,152,115,.55);stroke:#ee9873;stroke-width:2}
.zmap .nl{fill:none;stroke:#7fb7e6;stroke-width:2.5;opacity:.8}
.zmap .co{fill:#c3cdf2;stroke:#141b3e;stroke-width:2}.zmap .cn{fill:#ee9873;stroke:#141b3e;stroke-width:2}
.zmap .c{position:absolute;right:160px;top:150px;width:720px}
.zmap .ch .n .bar i{background:#5b78dd}.zmap .ch .n .bar i.add{background:#ee9873}.zmap .ch .o .bar{background:#5b78dd}
.zmap .c .k{font:600 42px/1.35 var(--f);opacity:.62;margin-bottom:18px}
.zmap .c .h2{font-size:100px}
.zmap .f{margin-top:56px}
.zmap .f .cap{display:flex;align-items:center;gap:20px;font:600 38px/1.3 var(--f)}
.zmap .f .sw{width:40px;height:40px;border-radius:10px;flex:none}
.zmap .f .vv{display:flex;align-items:baseline;gap:20px;margin-top:10px}
.zmap .f.o .num{font-size:130px;font-weight:600;opacity:.6}.zmap .f.n .num{font-size:190px;font-weight:700}
.zmap .f .tk{height:34px;border-radius:12px;background:rgba(142,155,230,.12);overflow:hidden;margin-top:16px;display:flex;position:relative}
.zmap .f .tk i{display:block;height:100%}
.zmap .f .tk b{position:absolute;left:14px;top:50%;transform:translateY(-50%);font:600 22px/1 'KNum',sans-serif;opacity:.5;direction:ltr}
.zmap .f .note{font:500 36px/1.4 var(--f);opacity:.66;margin-top:12px}

/* ==== v4 (Amr 21:46 «توزيع المعلومات لسه مش مريح للعين»): one calm grid for every slide —
   the title centred at the top, the chart centred under it: a column for 2014 and a column for 2026 on one baseline, true to
   scale, each figure standing on its column, the year under it; what was added since 2014 is the peach top of the 2026 column ==== */
.v4 .hd4{position:absolute;top:96px;right:200px;left:200px;text-align:center}
.v4 .hd4 .h2{font-size:96px;line-height:1.15}
.v4 .hd4 .k{font:600 40px/1.35 var(--f);opacity:.62;margin-top:16px}
.ch{position:absolute;left:0;right:0;bottom:0;top:0}
.ch .base{position:absolute;height:3px;background:rgba(142,155,230,.35);border-radius:2px}
.s.light .ch .base{background:rgba(28,37,71,.2)}
.ch .col{position:absolute;bottom:0;display:flex;flex-direction:column;align-items:center}
.ch .bar{position:absolute;bottom:0;left:0;right:0;border-radius:22px 22px 6px 6px;overflow:hidden;display:flex;flex-direction:column-reverse}
.ch .bar i{display:block;width:100%}
.ch .o .bar{background:rgba(238,241,250,.26)}.s.light .ch .o .bar{background:rgba(28,37,71,.18)}
.ch .n .bar i{background:linear-gradient(0deg,#3d5cc0,#8e9be6)}.ch .n .bar i.add{background:linear-gradient(0deg,#ee9873,#f5bd9f)}
.s.blue .ch .n .bar i{background:linear-gradient(0deg,#c3cdf2,#fff)}
.ch .trk{position:absolute;top:0;bottom:0;left:0;right:0;border-radius:22px 22px 6px 6px;box-shadow:inset 0 0 0 2px rgba(142,155,230,.3)}
.ch .trk b{position:absolute;top:-44px;left:50%;transform:translateX(-50%);font:600 26px/1 'KNum',sans-serif;opacity:.5}
.ch .lbl{position:absolute;left:-200px;right:-200px;display:flex;flex-direction:column;align-items:center;text-align:center}
.ch .lbl .num{line-height:.9}
.ch .o .lbl .num{font-size:120px;font-weight:600;opacity:.6}.ch .n .lbl .num{font-size:160px;font-weight:700}
.ch .lbl .u{font:700 44px/1.25 var(--f);margin-top:10px}.ch .o .lbl .u{opacity:.6}
.ch .yrs{position:absolute;left:-220px;right:-220px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.ch .yrs .y{font:800 40px/1 var(--f)}.ch .o .yrs .y{opacity:.6}.ch .n .yrs .y{color:#ee9873}.s.light .ch .n .yrs .y{color:#3d5cc0}
.ch .yrs .nt{font:500 32px/1.35 var(--f);opacity:.62;max-width:620px}
.ch .call{position:absolute;display:flex;align-items:center;gap:22px;font:700 40px/1.3 var(--f);width:470px}
.ch .call::before{content:"";width:60px;height:3px;background:#ee9873;flex:none}
.ch .call .num{font-size:64px;font-weight:700;color:#ee9873}
/* small multiples: several measures, a pair of columns each */
.ch .mname{position:absolute;text-align:center;font:800 36px/1.25 var(--f)}

/* two counts in different units: each drawn as its own field of cells (one cell = one area / one thousand units) */
.cg{position:absolute;top:400px;width:720px;display:flex;flex-direction:column;align-items:center;text-align:center}
.cg .cells{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;width:720px;direction:rtl}
.cg .cells i{width:18px;height:18px;border-radius:5px}
.cg.o .cells i{background:rgba(238,241,250,.3)}.cg.n .cells i{background:linear-gradient(135deg,#ee9873,#f5bd9f)}
.cg .vv{display:flex;align-items:baseline;gap:20px;margin-top:34px}
.cg.o .num{font-size:120px;font-weight:600;opacity:.6}.cg.n .num{font-size:150px;font-weight:700}
.cg .u{font:700 44px/1.2 var(--f)}.cg.o .u{opacity:.6}
.cg .y{font:800 40px/1 var(--f);margin-bottom:26px}.cg.o .y{opacity:.6}.cg.n .y{color:#ee9873}
.cg .nt{font:500 32px/1.35 var(--f);opacity:.62;margin-top:12px}
/* mini bars for rows and maps */
.mb{display:flex;flex-direction:column;gap:10px}
.mb i{display:block;height:22px;border-radius:8px;background:rgba(238,241,250,.3)}
.mb i.n{height:32px;border-radius:10px;background:linear-gradient(270deg,#8e9be6,#3d5cc0)}
.s.light .mb i{background:rgba(28,37,71,.22)}.s.light .mb i.n{background:linear-gradient(270deg,#8e9be6,#3d5cc0)}
.s.blue .mb i.n{background:linear-gradient(270deg,#fff,#c3cdf2)}
.mb .tk{background:rgba(142,155,230,.10);border-radius:10px;overflow:hidden}
/* footer note */
.src{position:absolute;right:140px;bottom:130px;font:500 30px/1.4 var(--f);opacity:.6;max-width:1100px}

/* navigation hint */
#hint{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);font:500 13px var(--f);color:rgba(255,255,255,.35);direction:rtl;pointer-events:none}
</style>
</head>
<body>
<div id="vp"><div id="stage"></div></div>
<div id="hint">← → للتنقل · F ملء الشاشة</div>
<script src="src/kn/geo.js?v=1"></script>
<script src="src/kn/slides.js?v=1"></script>
<script>
const ARROW='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>';
const N=v=>`<span class="num">${v}</span>`;
const BRAND=s=>'';   /* Amr 21:45: no emblem or forum mark for now — the information only */

/* the column chart: pairs [{a:{v,u},b:{v,u},add,call,nm}] in a box (x0..x1 = from the right, top..base in px) */
const fnum=x=>parseFloat(String(x).replace(/[^0-9.]/g,''))||0;
function colChart(pairs,box,o={}){const many=pairs.length>1,W=box.x1-box.x0,slot=W/pairs.length;let h='';
  const bw=o.bw||(many?Math.min(150,slot*.26):260),gap=o.gap||(many?bw*.5:180);
  h+=`<div class="base" style="right:${box.x0}px;width:${W}px;top:${box.base}px"></div>`;
  pairs.forEach((p,k)=>{const pc=/%$/.test(p.a.v+'')||/%$/.test(p.b.v+''),A=fnum(p.a.v),B=fnum(p.b.v),M=pc?100:Math.max(A,B),H=box.base-box.top;
    const cx=box.x0+slot*k+slot/2, xr=cx-gap/2-bw, xl=cx+gap/2;   /* 2014 to the right of the centre, 2026 to its left (RTL) */
    const col=(cls,x,val,u,v,segs,y,nt,isN)=>{const hh=Math.max(10,Math.round(v/M*H));
      return `<div class="col ${cls}" style="right:${x}px;width:${bw}px;top:${box.top}px;height:${H}px">${pc?`<div class="trk"></div>`:''}
        <div class="bar" style="height:${hh}px">${segs}</div>
        <div class="lbl" style="bottom:${hh+18}px">${isN?`<span class="num grad" style="${many?'font-size:120px':''}">${val}</span>`:`<span class="num" style="${many?'font-size:92px':''}">${val}</span>`}${u?`<span class="u" style="${many?'font-size:34px':''}">${u}</span>`:''}</div>
        <div class="yrs" style="top:${H+22}px"><span class="y" style="${many?'font-size:32px':''}">${y}</span>${nt&&!many&&!o.nonotes?`<span class="nt">${nt}</span>`:''}</div></div>`};
    const segB=p.add?`<i style="height:${((B-p.add)/B*100).toFixed(2)}%"></i><i class="add" style="height:${(p.add/B*100).toFixed(2)}%"></i>`:`<i style="height:100%"></i>`;
    h+=col('o',xr,p.a.v,p.a.u,A,'',o.ya||'قبل 2014',p.a.n,0);
    h+=col('n',xl,p.b.v,p.b.u,B,segB,o.yb||'2026',p.b.n,1);
    if(p.call&&p.add){const hh=Math.round(B/M*H),ha=Math.round(p.add/M*H);h+=`<div class="call" style="right:${xl+bw+30}px;top:${box.base-hh+ha/2-30}px">${p.call}</div>`}
    if(many&&p.nm)h+=`<div class="mname" style="right:${box.x0+slot*k+20}px;width:${slot-40}px;top:${box.base+80}px">${p.nm}</div>`});
  return `<div class="ch">${h}</div>`}
const R={
  cover:s=>`${BRAND(s)}<div class="c"><div class="kick">${s.k}</div><div class="big">${s.t}<span style="font-family:KNum,sans-serif;font-weight:700;font-size:220px">${s.y}</span></div><div class="sub">${s.s}</div></div>`,
  sec:s=>`${BRAND(s)}<div class="no">${s.no}</div><div class="c"><div class="k">${s.k}</div><div class="h1">${s.t}</div>${s.s?`<div class="lead" style="margin-top:36px">${s.s}</div>`:''}</div>`,
  cmp:s=>`${BRAND(s)}<div class="t">${s.k?`<div class="k">${s.k}</div>`:''}<div class="h2">${s.t}</div></div>
    <div class="row"><div class="col old"><span class="yr old">${s.ya||'قبل 2014'}</span>${N(s.a.v)}<div class="u">${s.a.u||''}</div>${s.a.n?`<div class="note">${s.a.n}</div>`:''}</div>
    <div class="arrow">${ARROW}</div>
    <div class="col new"><span class="yr new">${s.yb||'2026'}</span><span class="num grad">${s.b.v}</span><div class="u">${s.b.u||''}</div>${s.b.n?`<div class="note">${s.b.n}</div>`:''}${s.chip?`<div class="chip">${s.chip}</div>`:''}</div></div>`,
  photo:s=>`<div class="img" style="background-image:url(img/c5/${s.img}.webp);background-position:${s.pos||'50% 50%'}"></div>${BRAND(s)}<div class="c">${s.k?`<div class="k" style="font:600 34px/1 var(--f);opacity:.6;margin-bottom:26px">${s.k}</div>`:''}<div class="h2">${s.t}</div>
    <div style="display:flex;flex-direction:column;gap:44px;margin-top:56px">${s.items.map(it=>`<div><span class="yr ${it.y==='2026'?'new':'old'}">${it.y}</span>${it.pre?`<div style="font:600 34px/1.3 var(--f);opacity:.8;margin-top:22px">${it.pre}</div>`:''}<div style="display:flex;align-items:baseline;gap:26px;margin-top:${it.pre?10:22}px">${it.y==='2026'?`<span class="num grad" style="font-size:230px;font-weight:700">${it.v}</span>`:`<span class="num" style="font-size:170px;font-weight:600;opacity:.55">${it.v}</span>`}<span style="font:700 46px/1.2 var(--f)${it.y==='2026'?'':';opacity:.6'}">${it.u}</span></div>${it.n?`<div class="note" style="font:500 30px/1.4 var(--f);opacity:.6;margin-top:14px">${it.n}</div>`:''}</div>`).join('')}</div></div>`,
  map:s=>{const g=KGEO,nt=g.net[s.net]||{routes:[]};const st=s.dots?nt.routes.flatMap(r=>r.st).map(p=>`<circle class="st" cx="${p[0]}" cy="${p[1]}" r="${s.dots}"/>`).join(''):'';
    return `${BRAND(s)}<div class="mp"><svg viewBox="0 0 ${g.W} ${g.H}"><path class="eg" d="${g.egypt}"/><path class="nl" d="${g.nile}"/>${nt.routes.map(r=>`<path class="rt" d="${r.d}"/>`).join('')}${st}</svg></div>
    <div class="c">${s.k?`<div class="k">${s.k}</div>`:''}<div class="h2">${s.t}</div>
    <div class="figs">${s.a?`<div class="fig old"><span class="yr old">${s.ya||'قبل 2014'}</span>${N(s.a.v)}<div class="u">${s.a.u||''}</div>${s.a.n?`<div class="note">${s.a.n}</div>`:''}</div>`:''}
    <div class="fig new"><span class="yr new">${s.yb||'2026'}</span><span class="num grad">${s.b.v}</span><div class="u">${s.b.u||''}</div>${s.b.n?`<div class="note">${s.b.n}</div>`:''}</div></div>${s.a?(()=>{const f=x=>parseFloat(String(x).replace(/[^0-9.]/g,''))||0,a=f(s.a.v),b=f(s.b.v),m=Math.max(a,b)||1;return `<div class="mb" style="margin-top:44px;width:720px"><div class="tk"><i style="width:${(a/m*100).toFixed(1)}%"></i></div><div class="tk"><i class="n" style="width:${(b/m*100).toFixed(1)}%"></i></div></div>`})():''}</div>`},
  cmp2:s=>{const pc=/%$/.test(s.a.v+'')||/%$/.test(s.b.v+''),f=x=>parseFloat(String(x).replace(/[^0-9.]/g,''))||0,A=f(s.a.v),B=f(s.b.v),M=pc?100:Math.max(A,B);
    const w=x=>(x/M*100).toFixed(2)+'%',seg=s.add?`<i style="width:${w(B-s.add)}"></i><i class="add" style="width:${w(s.add)}"></i>`:`<i style="width:${w(B)}"></i>`;
    return `${BRAND(s)}<div class="t">${s.k?`<div class="k">${s.k}</div>`:''}<div class="h2">${s.t}</div></div><div class="bars">
    <div class="br old"><div class="lab"><span class="yr old">${s.ya||'قبل 2014'}</span><div class="vv">${N(s.a.v)}<span class="u">${s.a.u||''}</span></div>${s.a.n?`<div class="note">${s.a.n}</div>`:''}</div>${s.cells?`<div class="cells">${'<i></i>'.repeat(A)}</div>`:`<div class="trk"><i style="width:${w(A)}"></i>${pc?'<span class="scale">100%</span>':''}</div>`}</div>
    <div class="br new"><div class="lab"><span class="yr new">${s.yb||'2026'}</span><div class="vv"><span class="num grad">${s.b.v}</span><span class="u">${s.b.u||''}</span></div>${s.b.n?`<div class="note">${s.b.n}</div>`:''}</div>${s.cells?`<div class="cells">${'<i></i>'.repeat(A)}</div>`:`<div class="trk">${seg}${pc?'<span class="scale">100%</span>':''}</div>`}</div>
    ${s.key?`<div class="key">${s.key}</div>`:''}</div>`},
  cmp3:s=>{const pc=/%$/.test(s.a.v+'')||/%$/.test(s.b.v+''),f=x=>parseFloat(String(x).replace(/[^0-9.]/g,''))||0,A=f(s.a.v),B=f(s.b.v),M=pc?100:Math.max(A,B);
    const LW=1600-560;   /* the widest bar leaves room for its figure */
    const w=x=>Math.max(22,Math.round(x/M*LW));
    const lane=(cls,x,v,u,segs)=>{const W=w(x),inside=!pc&&W>LW*.62;return `<div class="lane${inside?' in':''}">${pc?`<div class="trk" style="width:${LW}px"><b>100%</b></div>`:''}<div class="fill" style="width:${inside?Math.round(x/M*1600):W}px">${segs}</div><div class="val">${cls==='new'?`<span class="num grad">${v}</span>`:N(v)}<span class="u">${u||''}</span></div></div>`};
    const segB=s.add?`<i style="width:${((B-s.add)/B*100).toFixed(2)}%"></i><i class="add" style="width:${(s.add/B*100).toFixed(2)}%"></i>`:`<i style="width:100%"></i>`;
    const body=s.cells?`<div class="old"><div class="cap"><span class="yr old">${s.ya||'قبل 2014'}</span><span class="nt">${s.a.n||''}</span></div><div style="display:flex;align-items:flex-end;gap:50px"><div class="cells">${'<i></i>'.repeat(A)}</div><div class="val">${N(s.a.v)}<span class="u">${s.a.u}</span></div></div></div>
      <div class="new"><div class="cap"><span class="yr new">${s.yb||'2026'}</span><span class="nt">${s.b.n||''}</span></div><div class="lane"><div class="val"><span class="num grad">${s.b.v}</span><span class="u">${s.b.u}</span></div></div></div>`
      :`<div class="old"><div class="cap"><span class="yr old">${s.ya||'قبل 2014'}</span>${s.a.n?`<span class="nt">${s.a.n}</span>`:''}</div>${lane('old',A,s.a.v,s.a.u,'')}</div>
      <div class="new"><div class="cap"><span class="yr new">${s.yb||'2026'}</span>${s.b.n?`<span class="nt">${s.b.n}</span>`:''}</div>${lane('new',B,s.b.v,s.b.u,segB)}</div>`;
    return `${BRAND(s)}<div class="t">${s.k?`<div class="k">${s.k}</div>`:''}<div class="h2">${s.t}</div></div><div class="lanes">${body}${s.key?`<div class="key">${s.key}</div>`:''}</div>`},
  zmap:s=>{const g=KGEO;const v=(g.zones.valley||[]).map(z=>`<path class="zv" d="${z.d}"/>`).join(''),gr=(g.zones.grow||[]).map(z=>`<path class="zg" d="${z.d}"/>`).join('');
    return `<div class="mp"><svg viewBox="0 0 ${g.W} ${g.H}"><path class="eg" d="${g.egypt}"/>${gr}${v}<path class="nl" d="${g.nile}"/></svg></div>
    <div class="c" style="top:120px;width:760px;text-align:center"><div class="h2">${s.t}</div>${s.k?`<div class="k" style="margin-top:16px">${s.k}</div>`:''}</div>
    ${colChart([{a:s.a,b:s.b,add:fnum(s.b.v)-fnum(s.a.v)}],{x0:160,x1:920,top:520,base:880},{ya:s.ya,yb:s.yb,bw:200,gap:130,nonotes:1})}
    <div style="position:absolute;left:120px;bottom:60px;display:flex;gap:40px;font:700 34px/1 var(--f)"><span style="display:inline-flex;align-items:center;gap:14px"><i style="width:34px;height:34px;border-radius:9px;background:#5b78dd"></i>قبل 2014</span><span style="display:inline-flex;align-items:center;gap:14px"><i style="width:34px;height:34px;border-radius:9px;background:#ee9873"></i>ما أضيف حتى 2026</span></div>`},
  cells:s=>`<div class="hd4"><div class="h2">${s.t}</div>${s.k?`<div class="k">${s.k}</div>`:''}</div>
    <div class="cg o" style="right:200px"><div class="y">${s.ya||'قبل 2014'}</div><div class="cells">${'<i></i>'.repeat(fnum(s.a.v))}</div><div class="vv">${N(s.a.v)}<span class="u">${s.a.u}</span></div>${s.a.n?`<div class="nt">${s.a.n}</div>`:''}</div>
    <div class="cg n" style="left:200px"><div class="y">${s.yb||'2026'}</div><div class="cells">${'<i></i>'.repeat(fnum(s.b.v))}</div><div class="vv"><span class="num grad">${s.b.v}</span><span class="u">${s.b.u}</span></div>${s.b.n?`<div class="nt">${s.b.n}</div>`:''}</div>`,
  col:s=>`<div class="hd4"><div class="h2">${s.t}</div>${s.k?`<div class="k">${s.k}</div>`:''}</div>${colChart([{a:s.a,b:s.b,add:s.add,call:s.call}],{x0:260,x1:1660,top:560,base:880},{ya:s.ya,yb:s.yb})}${s.key?`<div style="position:absolute;bottom:40px;left:0;right:0;text-align:center;font:700 38px/1.3 var(--f)">${s.key}</div>`:''}`,
  multi:s=>`<div class="hd4"><div class="h2">${s.t}</div>${s.k?`<div class="k">${s.k}</div>`:''}</div>${colChart(s.rows.map(r=>({a:{v:r.a,u:r.ua},b:{v:r.b,u:r.ub},nm:r.nm})),{x0:160,x1:1760,top:540,base:800})}${s.foot?`<div style="position:absolute;bottom:50px;left:0;right:0;text-align:center;font:600 36px/1.3 var(--f);opacity:.7">${s.foot}</div>`:''}`,
  rows:s=>`${BRAND(s)}<div class="t">${s.k?`<div class="k" style="font:600 34px/1 var(--f);opacity:.55;margin-bottom:22px">${s.k}</div>`:''}<div class="h2">${s.t}</div></div>
    <div class="list"><div class="hd"><span></span><span>قبل 2014</span><span></span><span>2026</span></div>${s.rows.map(r=>`<div class="r"><div class="nm">${r.nm}</div><div class="a">${r.a?N(r.a):''}<i>${r.ua||''}</i></div><div class="ar">${r.a?ARROW:''}</div><div class="b"><span class="num grad">${r.b}</span><i>${r.ub||''}</i></div>${(()=>{const f=x=>parseFloat(String(x).replace(/[^0-9.]/g,''))||0,a=f(r.a),b=f(r.b),m=Math.max(a,b)||1;return `<div class="mb"><div class="tk"><i style="width:${(a/m*100).toFixed(1)}%"></i></div><div class="tk"><i class="n" style="width:${(b/m*100).toFixed(1)}%"></i></div></div>`})()}</div>`).join('')}${s.foot?`<div style="font:600 32px/1.4 var(--f);opacity:.65;margin-top:34px">${s.foot}</div>`:''}</div>`
};
const stage=document.getElementById('stage');
stage.innerHTML=KN.map((s,i)=>`<section class="s ${s.bg||'dark'} ${s.type}${s.type==='cmp3'?' c3':''}${/^(col|multi|cells)$/.test(s.type)?' v4':''}" data-i="${i}">${R[s.type](s)}<div class="pg">${i+1} / ${KN.length}</div>${s.sec?`<div class="tag">${s.sec}</div>`:''}</section>`).join('');
const S=[...stage.children];let cur=Math.min(S.length-1,Math.max(0,(parseInt(location.hash.slice(1))||1)-1));
function go(i){cur=Math.max(0,Math.min(S.length-1,i));S.forEach((x,j)=>x.classList.toggle('on',j===cur));history.replaceState(null,'','#'+(cur+1))}
function fit(){const k=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`scale(${k})`}
addEventListener('resize',fit);fit();go(cur);
addEventListener('keydown',e=>{if(['ArrowLeft','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();go(cur+1)}else if(['ArrowRight','PageUp','Backspace'].includes(e.key)){e.preventDefault();go(cur-1)}else if(e.key==='Home')go(0);else if(e.key==='End')go(S.length-1);else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}});
addEventListener('click',e=>{go(e.clientX<innerWidth/2?cur+1:cur-1)});
let tx=0;addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>40)go(d>0?cur+1:cur-1)},{passive:true});
/* live: the page reloads on the same slide when src/kn/live.js changes (works offline too) */
(function(){let last=null;setInterval(()=>{const sc=document.createElement('script');sc.src='src/kn/live.js?t='+Date.now();sc.onload=()=>{if(last===null)last=window.KNLIVE;else if(window.KNLIVE!==last)location.reload();sc.remove()};sc.onerror=()=>sc.remove();document.head.appendChild(sc)},2500)})();
</script>
</body>
</html>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>الجلسة الختامية · Keynote</title>
<style>
/* «الجلسة الختامية» — keynote edition v5 (Amr 21:30–21:54): one idea per slide, the figure is the hero, 2014 against 2026,
   every figure on a chart true to scale, few big words, no grid and no motion. One system for every slide:
   the title centred at the top, the chart centred under it, 160px clear of every edge. 1920×1080, scaled to the screen. */
@font-face{font-family:'KNum';src:url(fonts/montserrat-500.woff2) format('woff2');font-weight:100 549;font-display:block;unicode-range:U+0025,U+002B-002E,U+0030-0039,U+2013,U+00D7}
@font-face{font-family:'KNum';src:url(fonts/montserrat-600.woff2) format('woff2');font-weight:550 649;font-display:block;unicode-range:U+0025,U+002B-002E,U+0030-0039,U+2013,U+00D7}
@font-face{font-family:'KNum';src:url(fonts/montserrat-700.woff2) format('woff2');font-weight:650 749;font-display:block;unicode-range:U+0025,U+002B-002E,U+0030-0039,U+2013,U+00D7}
@font-face{font-family:'KNum';src:url(fonts/montserrat-800.woff2) format('woff2');font-weight:750 1000;font-display:block;unicode-range:U+0025,U+002B-002E,U+0030-0039,U+2013,U+00D7}
@font-face{font-family:'KAr';src:url(fonts/cairo-medium.woff2) format('woff2');font-weight:100 549;font-display:block}
@font-face{font-family:'KAr';src:url(fonts/cairo-ar-600.woff2) format('woff2');font-weight:550 649;font-display:block;unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+200C-200E,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:'KAr';src:url(fonts/cairo-ar-700.woff2) format('woff2');font-weight:650 749;font-display:block;unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+200C-200E,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:'KAr';src:url(fonts/cairo-ar-800.woff2) format('woff2');font-weight:750 849;font-display:block;unicode-range:U+0600-06FF,U+0750-077F,U+08A0-08FF,U+200C-200E,U+FB50-FDFF,U+FE70-FEFC}
@font-face{font-family:'KAr';src:url(fonts/cairo-black.woff2) format('woff2');font-weight:850 1000;font-display:block}
:root{--cob:#3d5cc0;--cob2:#8e9be6;--navy:#1c2547;--peach:#ee9873;--peach2:#f5bd9f;--valley:#5b78dd;--f:'KNum','KAr',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0e1430;overflow:hidden}
body{font-family:var(--f);-webkit-font-smoothing:antialiased;color:#eef1fa}
#vp{position:fixed;inset:0;display:grid;place-items:center}
#stage{position:relative;width:1920px;height:1080px;transform-origin:50% 50%;overflow:hidden}
.s{position:absolute;inset:0;display:none;overflow:hidden}
.s.on{display:block}
/* the forum's colours; the light slides are a soft lavender, never white */
.s.dark{background:radial-gradient(90% 80% at 12% 0%,rgba(238,152,115,.14) 0%,rgba(238,152,115,0) 60%),radial-gradient(120% 120% at 100% 100%,#22306a 0%,#141b3e 45%,#0e1430 100%);color:#eef1fa;--bar0:rgba(238,241,250,.26);--line:rgba(142,155,230,.35);--hole:#141b3e}
.s.blue{background:radial-gradient(70% 70% at 10% 15%,rgba(238,152,115,.42) 0%,rgba(238,152,115,0) 60%),linear-gradient(135deg,#2a3b86 0%,#34499f 45%,#3d5cc0 100%);color:#f3f5fb;--bar0:rgba(255,255,255,.28);--line:rgba(255,255,255,.4);--hole:#34499f}
.s.light{background:radial-gradient(60% 60% at 0% 0%,rgba(182,214,240,.5) 0%,rgba(182,214,240,0) 70%),radial-gradient(55% 55% at 100% 0%,rgba(238,152,115,.26) 0%,rgba(238,152,115,0) 70%),radial-gradient(70% 70% at 50% 110%,rgba(142,155,230,.38) 0%,rgba(142,155,230,0) 70%),#dde2ee;color:#1c2547;--bar0:rgba(28,37,71,.2);--line:rgba(28,37,71,.22);--hole:#dde2ee}
.num{font-family:'KNum','KAr',sans-serif;font-variant-numeric:lining-nums;direction:ltr;unicode-bidi:isolate;line-height:.9;letter-spacing:-.02em}
.grad{background:linear-gradient(100deg,#eef1fa 0%,#c3cdf2 45%,#ee9873 115%);-webkit-background-clip:text;background-clip:text;color:transparent}
.s.light .grad{background:linear-gradient(100deg,#2a3b86 0%,#3d5cc0 55%,#ee9873 120%);-webkit-background-clip:text;background-clip:text;color:transparent}
.pg{position:absolute;left:64px;bottom:40px;font:600 24px/1 'KNum',sans-serif;opacity:.4;direction:ltr}

/* title block */
.hd{position:absolute;top:84px;right:160px;left:160px;text-align:center}
.hd .h{font:900 92px/1.15 var(--f)}
.hd .k{font:500 44px/1.35 var(--f);opacity:.7;margin-top:14px}
.hd .k b{font-weight:800;opacity:1;color:var(--peach)}
.s.light .hd .k b{color:var(--cob)}
.legend{position:absolute;left:0;right:0;display:flex;justify-content:center;gap:56px;font:700 38px/1 var(--f)}
.legend span{display:inline-flex;align-items:center;gap:16px}
.legend i{width:38px;height:38px;border-radius:10px;flex:none}

/* ---- the column chart ---- */
.ch{position:absolute;inset:0}
.ch .base{position:absolute;height:3px;background:var(--line);border-radius:2px}
.ch .col{position:absolute}
.ch .bar{position:absolute;bottom:0;left:0;right:0;border-radius:24px 24px 6px 6px;overflow:hidden;display:flex;flex-direction:column-reverse}
.ch .bar i{display:block;width:100%;flex:none}
.ch .o .bar{background:var(--bar0)}
.ch .bar.clr{background:none;border:4px dashed rgba(238,152,115,.75);border-bottom:0}
.ch .n .bar i{background:linear-gradient(0deg,#3d5cc0,#8e9be6)}
.ch .n .bar i.add{background:linear-gradient(0deg,#ee9873,#f5bd9f)}
.s.blue .ch .n .bar i:not(.add){background:linear-gradient(0deg,#c3cdf2,#ffffff)}
.ch .lbl{position:absolute;left:-220px;right:-220px;display:flex;flex-direction:column;align-items:center;text-align:center}
.ch .o .lbl .num{font-size:120px;font-weight:600;opacity:.62}
.ch .n .lbl .num{font-size:170px;font-weight:700}
.ch .lbl .u{font:700 46px/1.25 var(--f);margin-top:12px}
.ch .o .lbl .u{opacity:.65}
.ch .yr{position:absolute;left:-220px;right:-220px;text-align:center;font:800 44px/1 var(--f)}
.ch .o .yr{opacity:.62}.ch .n .yr{color:var(--peach)}.s.light .ch .n .yr{color:var(--cob)}
.ch .nt{position:absolute;text-align:center;font:500 38px/1.35 var(--f);opacity:.7}
.ch .mname{position:absolute;text-align:center;font:800 42px/1.25 var(--f)}
/* callout beside the added part of the 2026 column */
.ch .call{position:absolute;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:right;width:600px}
.ch .call .pre{font:600 40px/1.2 var(--f);opacity:.8}
.ch .call .v{display:flex;align-items:baseline;gap:18px}
.ch .call .v .num{font-size:120px;font-weight:700;color:var(--peach)}
.ch .call .v span{font:700 44px/1.25 var(--f);white-space:nowrap}
.ch .call::after{content:"";position:absolute;right:-56px;top:50%;width:40px;height:4px;border-radius:2px;background:var(--peach)}

/* ---- waffle: a share of 100 ---- */
.wf{position:absolute;display:grid;grid-template-columns:repeat(10,1fr);gap:12px;direction:rtl}
.wf i{aspect-ratio:1;border-radius:9px;background:rgba(142,155,230,.14);box-shadow:inset 0 0 0 1.5px rgba(142,155,230,.22)}
.wf i.a{background:var(--valley);box-shadow:none}.wf i.b{background:var(--peach);box-shadow:none}

/* ---- map ---- */
.mp{position:absolute;left:80px;top:60px;width:960px;height:960px}
.mp svg{width:100%;height:100%;overflow:visible}
.mp .eg{fill:rgba(142,155,230,.08);stroke:rgba(142,155,230,.5);stroke-width:2;stroke-linejoin:round}
.mp .nl{fill:none;stroke:#7fb7e6;stroke-width:3;stroke-linecap:round;opacity:.85}
.mp .rt{fill:none;stroke:var(--peach);stroke-width:7;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 7px rgba(238,152,115,.55))}
.mp .axl{stroke:var(--peach);stroke-width:5;stroke-linecap:round}
.mp .zv{fill:var(--valley);stroke:#8e9be6;stroke-width:1.5}
.mp .zg{fill:rgba(238,152,115,.6);stroke:var(--peach);stroke-width:2}
.zmap .ch .o .bar{background:var(--valley)}.zmap .ch .n .bar i{background:var(--valley)}.zmap .ch .n .bar i.add{background:var(--peach)}
.side{position:absolute;right:160px;width:720px;text-align:center}
.side .h{font:900 88px/1.15 var(--f)}
.side .k{font:500 42px/1.35 var(--f);opacity:.7;margin-top:14px}

/* ---- cells: counts that cannot share one scale ---- */
.cg{position:absolute;top:360px;width:700px;display:flex;flex-direction:column;align-items:center;text-align:center}
.cg .y{font:800 44px/1 var(--f);margin-bottom:28px}.cg.o .y{opacity:.62}.cg.n .y{color:var(--peach)}
.cg .cells{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;width:700px;direction:rtl}
.cg .cells i{width:18px;height:18px;border-radius:5px}
.cg.o .cells i{background:var(--bar0)}.cg.n .cells i{background:linear-gradient(135deg,#ee9873,#f5bd9f)}
.cg .vv{display:flex;align-items:baseline;justify-content:center;gap:20px;margin-top:34px}
.cg.o .num{font-size:120px;font-weight:600;opacity:.62}.cg.n .num{font-size:150px;font-weight:700}
.cg .u{font:700 46px/1.2 var(--f)}.cg.o .u{opacity:.65}
.cg .nt{font:500 38px/1.35 var(--f);opacity:.7;margin-top:14px}

/* ---- gaps: the spacing between the Nile's crossings ---- */
.gp{position:absolute;right:160px;width:720px}
.gp .row{margin-bottom:34px}
.gp .y{font:800 44px/1 var(--f);margin-bottom:18px}.gp .o .y{opacity:.62}.gp .n .y{color:var(--peach)}
.gp .river{position:relative;height:40px;margin:26px 0 14px}
.gp .river::before{content:"";position:absolute;left:0;right:0;top:50%;height:10px;transform:translateY(-50%);border-radius:5px;background:linear-gradient(90deg,rgba(127,183,230,.35),#7fb7e6)}
.gp .river i{position:absolute;top:0;width:10px;height:40px;border-radius:4px;transform:translateX(50%)}
.gp .o .river i{background:rgba(238,241,250,.6)}.gp .n .river i{background:var(--peach)}
.gp .vv{display:flex;align-items:baseline;gap:18px}
.gp .o .num{font-size:100px;font-weight:600;opacity:.62}.gp .n .num{font-size:130px;font-weight:700}
.gp .u{font:700 44px/1.2 var(--f)}
.gp .nt{font:500 38px/1.35 var(--f);opacity:.7}

/* ---- cover ---- */
.cover .c{position:absolute;left:160px;right:160px;top:250px;text-align:center}
.cover .kick{font:600 44px/1 var(--f);opacity:.8}
.cover .yrs{display:flex;justify-content:center;align-items:center;gap:60px;margin-top:70px;direction:ltr}
.cover .yrs .num{font-size:250px;font-weight:700}
.cover .yrs .a{opacity:.5}
.cover .yrs svg{width:120px;height:120px;opacity:.7}
.cover .sub{margin-top:70px;font:600 58px/1.4 var(--f)}
#hint{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);font:500 12px var(--f);color:rgba(255,255,255,.3);pointer-events:none}
</style>
</head>
<body>
<div id="vp"><div id="stage"></div></div>
<div id="hint">← → للتنقل · F ملء الشاشة</div>
<script src="src/kn/geo.js?v=2"></script>
<script src="src/kn/slides.js?v=2"></script>
<script>
const N=v=>`<span class="num">${v}</span>`, G=v=>`<span class="num grad">${v}</span>`;
const fnum=x=>parseFloat(String(x).replace(/[^0-9.]/g,''))||0;
const HD=s=>`<div class="hd"><div class="h">${s.t}</div>${s.k?`<div class="k">${s.k}</div>`:''}</div>`;
const LEG=(top,a,b,c)=>`<div class="legend" style="top:${top}px"><span><i style="background:var(--bar0)"></i>${a||'قبل 2014'}</span><span><i style="background:linear-gradient(135deg,#3d5cc0,#8e9be6)"></i>${b||'2026'}</span>${c?`<span><i style="background:var(--peach)"></i>${c}</span>`:''}</div>`;
/* pairs of columns (2014 right of each pair's centre, 2026 left, as Arabic reads); box: x0..x1 measured from the right edge */
function colChart(pairs,box,o={}){const many=pairs.length>1,W=box.x1-box.x0,slot=W/pairs.length,H=box.base-box.top;let h=`<div class="base" style="right:${box.x0}px;width:${W}px;top:${box.base}px"></div>`;
  const bw=o.bw||(many?Math.min(170,slot*.27):270),gap=o.gap||(many?bw*.42:170);
  pairs.forEach((p,k)=>{const A=fnum(p.a.v),B=fnum(p.b.v),M=Math.max(A,B)||1,cx=box.x0+slot*k+slot/2,xr=cx-gap/2-bw,xl=cx+gap/2;   /* «right» grows leftwards: 2014 sits right of the centre, 2026 left of it */
    const hA=Math.max(12,Math.round(A/M*H)),hB=Math.max(12,Math.round(B/M*H));
    const col=(cls,x,hh,val,u,segs,isN)=>`<div class="col ${cls}" style="right:${x}px;width:${bw}px;top:${box.top}px;height:${H}px"><div class="bar" style="height:${hh}px">${segs}</div>
      <div class="lbl" style="bottom:${hh+20}px">${isN?`<span class="num grad" style="${many?'font-size:118px':''}">${val}</span>`:`<span class="num" style="${many?'font-size:88px':''}">${val}</span>`}${u?`<span class="u" style="${many?'font-size:36px':''}">${u}</span>`:''}</div>
      ${many?'':`<div class="yr" style="top:${H+26}px">${isN?(o.yb||'2026'):(o.ya||'قبل 2014')}</div>`}</div>`;
    const segB=p.add?`<i style="height:${((B-p.add)/B*100).toFixed(2)}%"></i><i class="add" style="height:${(p.add/B*100).toFixed(2)}%"></i>`:`<i style="height:100%"></i>`;
    h+=col('o',xr,hA,p.a.v,p.a.u,'',0);
    if(p.b.clear)h+=`<div class="col n" style="right:${xl}px;width:${bw}px;top:${box.top}px;height:${H}px"><div class="bar clr" style="height:${hA}px"></div><div class="lbl" style="bottom:${hA+20}px"><span class="u" style="color:var(--peach);font-size:52px;font-weight:800;max-width:520px">${p.b.u}</span></div><div class="yr" style="top:${H+26}px">${o.yb||'2026'}</div></div>`;
    else h+=col('n',xl,hB,p.b.v,p.b.u,segB,1);
    if(!many&&(p.a.n||p.b.n)){h+=`<div class="nt" style="right:${xr-170}px;width:${bw+340}px;left:auto;top:${box.base+86}px">${p.a.n||''}</div><div class="nt" style="right:${xl-170}px;width:${bw+340}px;left:auto;top:${box.base+86}px">${p.b.n||''}</div>`}
    if(p.call){const ya=box.base-hB+Math.round((p.add||0)/M*H)/2;h+=`<div class="call" style="right:${xl+bw+70}px;top:${ya}px;transform:translateY(-50%)">${p.call.pre?`<span class="pre">${p.call.pre}</span>`:''}<span class="v">${G(p.call.v)}<span>${p.call.u||''}</span></span></div>`}
    if(many&&p.nm)h+=`<div class="mname" style="right:${box.x0+slot*k+20}px;width:${slot-40}px;top:${box.base+30}px">${p.nm}</div>`});
  return `<div class="ch">${h}</div>`}
const R={
  cover:s=>`<div class="c"><div class="kick">${s.k}</div><div class="yrs"><span class="num a">${s.y0}</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>${G(s.y1)}</div><div class="sub">${s.s}</div></div>`,
  /* one measure: chart centred; with a callout the pair moves right to leave the callout its room */
  col:s=>HD(s)+colChart([{a:s.a,b:s.b,add:s.add,call:s.call}],s.call?{x0:260,x1:1260,top:540,base:850}:{x0:360,x1:1560,top:540,base:850},{ya:s.ya,yb:s.yb})+(s.foot?`<div class="legend" style="bottom:60px;font-weight:600;opacity:.8">${s.foot}</div>`:''),
  /* several measures: a pair each, one legend */
  multi:s=>HD(s)+LEG(330,s.ya,s.yb)+colChart(s.rows.map(r=>({a:{v:r.a,u:r.ua},b:{v:r.b,u:r.ub},nm:r.nm})),{x0:160,x1:1760,top:560,base:850})+(s.foot?`<div class="legend" style="bottom:56px;font-weight:600;opacity:.8">${s.foot}</div>`:''),
  /* a network on the map, its measure beside */
  map:s=>{const g=KGEO,nt=g.net[s.net]||{routes:[]};
    return `<div class="mp"><svg viewBox="0 0 ${g.W} ${g.H}"><path class="eg" d="${g.egypt}"/><path class="nl" d="${g.nile}"/>${nt.routes.map(r=>`<path class="rt" d="${r.d}"/>`).join('')}</svg></div>
    <div class="side" style="top:110px"><div class="h">${s.t}</div>${s.k?`<div class="k">${s.k}</div>`:''}</div>
    ${colChart([{a:s.a,b:s.b,add:s.add}],{x0:160,x1:880,top:620,base:840},{bw:210,gap:120})}
    ${s.foot?`<div style="position:absolute;right:160px;width:720px;bottom:56px;text-align:center;font:600 36px/1.35 var(--f);opacity:.8">${s.foot}</div>`:''}`},
  /* shares of Egypt on the map, and the same share as 100 squares */
  zmap:s=>{const g=KGEO,v=(g.zones.valley||[]).map(z=>`<path class="zv" d="${z.d}"/>`).join(''),gr=(g.zones.grow||[]).map(z=>`<path class="zg" d="${z.d}"/>`).join('');
    const A=Math.round(fnum(s.a.v)),B=Math.round(fnum(s.b.v));
    return `<div class="mp"><svg viewBox="0 0 ${g.W} ${g.H}"><path class="eg" d="${g.egypt}"/>${gr}${v}<path class="nl" d="${g.nile}"/></svg></div>
    <div class="side" style="top:100px"><div class="h">${s.t}</div>${s.k?`<div class="k">${s.k}</div>`:''}</div>
    ${colChart([{a:s.a,b:s.b,add:fnum(s.b.v)-fnum(s.a.v)}],{x0:160,x1:880,top:600,base:880},{bw:210,gap:120})}
    <div style="position:absolute;right:160px;width:720px;bottom:52px;display:flex;justify-content:center;gap:40px;font:700 34px/1 var(--f)"><span style="display:inline-flex;align-items:center;gap:12px"><i style="width:32px;height:32px;border-radius:8px;background:var(--valley)"></i>الوادي والدلتا</span><span style="display:inline-flex;align-items:center;gap:12px"><i style="width:32px;height:32px;border-radius:8px;background:var(--peach)"></i>ما أضيف حتى 2026</span></div>`},
  /* two counts in different units, each as its own field of cells */
  cells:s=>HD(s)+`<div class="cg o" style="right:200px"><div class="y">${s.ya||'قبل 2014'}</div><div class="cells">${'<i></i>'.repeat(fnum(s.a.v))}</div><div class="vv">${N(s.a.v)}<span class="u">${s.a.u}</span></div>${s.a.n?`<div class="nt">${s.a.n}</div>`:''}</div>
    <div class="cg n" style="left:200px"><div class="y">${s.yb||'2026'}</div><div class="cells">${'<i></i>'.repeat(fnum(s.b.v))}</div><div class="vv">${G(s.b.v)}<span class="u">${s.b.u}</span></div>${s.b.n?`<div class="nt">${s.b.n}</div>`:''}</div>`,
  /* the Nile with its crossings: a mark every N km, so a shorter distance shows as more crossings */
  gaps:s=>{const g=KGEO,nt=g.net[s.net]||{routes:[]},L=700,unit=L/Math.max(fnum(s.a.v),fnum(s.b.v))/(s.scale||1.2);
    const marks=v=>{const st=fnum(v)*unit;let h='';for(let x=0;x<=L+1;x+=st)h+=`<i style="right:${x.toFixed(1)}px"></i>`;return h};
    const dots=nt.routes.flatMap(r=>r.st).map(p=>`<line class="axl" x1="${p[0]-16}" y1="${p[1]}" x2="${p[0]+16}" y2="${p[1]}"/>`).join('');
    return `<div class="mp"><svg viewBox="0 0 ${g.W} ${g.H}"><path class="eg" d="${g.egypt}"/><path class="nl" d="${g.nile}" style="stroke-width:5"/>${dots}</svg></div>
    <div class="side" style="top:100px"><div class="h">${s.t}</div>${s.k?`<div class="k">${s.k}</div>`:''}</div>
    <div class="gp" style="top:360px"><div class="row o"><div class="y">${s.ya||'قبل 2014'}</div><div class="vv">${N(s.a.v)}<span class="u">${s.a.u}</span></div><div class="river">${marks(s.a.v)}</div><div class="nt">${s.a.n||''}</div></div>
      <div class="row n"><div class="y">${s.yb||'2026'}</div><div class="vv">${G(s.b.v)}<span class="u">${s.b.u}</span></div><div class="river">${marks(s.b.v)}</div><div class="nt">${s.b.n||''}</div></div></div>`}
};
const stage=document.getElementById('stage');
stage.innerHTML=KN.map((s,i)=>`<section class="s ${s.bg||'dark'} ${s.type}" data-i="${i}">${R[s.type](s)}<div class="pg">${i+1} / ${KN.length}</div></section>`).join('');
const S=[...stage.children];let cur=Math.min(S.length-1,Math.max(0,(parseInt(location.hash.slice(1))||1)-1));
function go(i){cur=Math.max(0,Math.min(S.length-1,i));S.forEach((x,j)=>x.classList.toggle('on',j===cur));history.replaceState(null,'','#'+(cur+1))}
function fit(){const k=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`scale(${k})`}
addEventListener('resize',fit);fit();go(cur);
addEventListener('keydown',e=>{if(['ArrowLeft','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();go(cur+1)}else if(['ArrowRight','PageUp','Backspace'].includes(e.key)){e.preventDefault();go(cur-1)}else if(e.key==='Home')go(0);else if(e.key==='End')go(S.length-1);else if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}});
addEventListener('click',e=>{go(e.clientX<innerWidth/2?cur+1:cur-1)});
let tx=0;addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>40)go(d>0?cur+1:cur-1)},{passive:true});
/* live: the page reloads on the same slide when src/kn/live.js changes (offline too) */
(function(){let last=null;setInterval(()=>{const sc=document.createElement('script');sc.src='src/kn/live.js?t='+Date.now();sc.onload=()=>{if(last===null)last=window.KNLIVE;else if(window.KNLIVE!==last)location.reload();sc.remove()};sc.onerror=()=>sc.remove();document.head.appendChild(sc)},2500)})();
</script>
</body>
</html>

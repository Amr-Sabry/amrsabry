<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0a0a0a">
<title>Aroma Typo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=JetBrains+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@100..900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,100..900&display=swap">
<style>
body{margin:0}[hidden]{display:none!important}img{max-width:100%}
@media (min-width:1181px){.ctl{padding-bottom:236px}}

/* layout: an edit suite. Moves bin on the left, monitor + transport in the middle, inspector on the right. One dark look on purpose (it sits next to video). */
:root{color-scheme:dark;
  --bg:#0a0a0a; --panel:#101010; --raise:#171716; --line:#272625; --line2:#3d3b39; --fg:#f0f0ef; --mute:#8f8b86; --accent:#EF4122; --accent-ink:#0a0a0a;
  --ui:'Montserrat','Alexandria',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace; --ar:'Alexandria','Montserrat',Tahoma,sans-serif;}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:500 13px/1.4 var(--ui);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template:56px minmax(0,1fr)/300px minmax(0,1fr) 340px;grid-template-areas:"top top top" "moves stage ctl"}
.top{grid-area:top;display:flex;align-items:center;gap:16px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--panel);min-width:0}
.brand{display:flex;align-items:center;gap:11px;font:700 15px/1 var(--mono);letter-spacing:.2em;flex:none}
.brand svg{display:block}.brand .x{color:var(--mute);font-weight:400}
.spec{margin-left:auto;font:400 11px/1 var(--mono);letter-spacing:.12em;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:8px 12px;white-space:nowrap}
.cta{border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font:700 14px/1 var(--ui);padding:11px 22px;flex:none}
.cta:hover{filter:brightness(1.1)}
.lab{font:700 10.5px/1 var(--mono);letter-spacing:.16em;color:var(--mute);text-transform:uppercase}
/* moves bin */
.moves{grid-area:moves;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0;min-width:0}
.moves .hd{padding:16px 16px 10px;display:flex;flex-direction:column;gap:10px}
.moves .hd .row{display:flex;justify-content:space-between;align-items:center}
#mCount{color:var(--accent)}
.search{width:100%;background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.search::placeholder{color:#66625e}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:5px 10px;font:600 11px/1 var(--ui);color:var(--mute)}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--fg)}
.grid{flex:1;min-height:0;overflow:auto;padding:4px 16px 18px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:max-content;gap:10px;align-content:start}
.tile{border:1px solid var(--line);border-radius:10px;background:var(--raise);padding:0;overflow:hidden;display:block;text-align:left;min-width:0}
.tile canvas{display:block;width:100%;aspect-ratio:16/9;background:#000}
.tile span{display:block;padding:7px 9px 8px;font:600 11.5px/1.2 var(--ui);color:#c9c5c0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile:hover{border-color:var(--line2)}
.tile[aria-pressed="true"]{border-color:var(--accent)}.tile[aria-pressed="true"] span{color:var(--fg)}
/* monitor */
.stage{grid-area:stage;display:flex;flex-direction:column;gap:12px;padding:16px 18px;min-width:0;min-height:0}
.vpwrap{flex:1;min-height:0;display:grid;place-items:center;container-type:size}
.vp{position:relative;width:min(100cqw,calc(100cqh*16/9));aspect-ratio:16/9;max-width:100%;border:1px solid var(--line);border-radius:8px;overflow:hidden;touch-action:none;cursor:grab;background:#000}
.vp.drag{cursor:grabbing}
.vp[data-bg="checker"]{background:#0b0b0b repeating-conic-gradient(#191918 0 25%,#0b0b0b 0 50%) 0 0/28px 28px}
.vp[data-bg="white"]{background:#fff}.vp[data-bg="grey"]{background:linear-gradient(160deg,#5b6770,#2b2f33 60%,#3a322c)}
.vp canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.vp .tag{position:absolute;left:10px;top:9px;font:700 10px/1 var(--mono);letter-spacing:.16em;color:#fff;mix-blend-mode:difference;pointer-events:none}
.guides{position:absolute;inset:0;pointer-events:none}
.guides i{position:absolute;border:1px dashed rgba(255,255,255,.35);mix-blend-mode:difference}
.guides .g1{inset:5%}.guides .g2{inset:10%}
.snap{position:absolute;background:var(--accent);pointer-events:none}
.snap.v{top:0;bottom:0;left:50%;width:1px}.snap.h{left:0;right:0;top:50%;height:1px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 10px;font:600 11.5px/1 var(--ui);color:var(--mute)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--fg)}
.play{width:40px;height:40px;border-radius:50%;border:0;background:var(--fg);display:grid;place-items:center;flex:none}
.play i{width:0;height:0;border-left:13px solid #000;border-top:8px solid transparent;border-bottom:8px solid transparent;margin-left:3px}
.play[aria-pressed="true"] i{width:12px;height:14px;border:0;border-left:4px solid #000;border-right:4px solid #000;margin:0}
.time{font:400 13px/1 var(--mono);letter-spacing:.06em;color:#c9c5c0;font-variant-numeric:tabular-nums;white-space:nowrap}
.scrub{flex:1;min-width:120px}
.hint{font:500 12px/1.5 var(--ar);color:var(--mute);direction:rtl;text-align:right}
/* ranges */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--accent) var(--p,0%),var(--line2) var(--p,0%))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line2)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--accent)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--fg);margin-top:-6px;border:0}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--fg);border:0}
/* inspector */
.ctl{grid-area:ctl;border-left:1px solid var(--line);background:var(--panel);overflow:auto;min-width:0;padding:6px 16px 28px}
.sec{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.sec:last-child{border-bottom:0}
.f{display:flex;flex-direction:column;gap:7px;min-width:0}
.f .r{display:flex;justify-content:space-between;align-items:center;gap:8px}
.val{font:700 11px/1 var(--mono);letter-spacing:.08em;color:var(--fg);font-variant-numeric:tabular-nums}
textarea,select,.inp{width:100%;background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:10px 11px}
textarea{font:600 17px/1.5 var(--ar);resize:vertical;min-height:84px}
textarea:focus,select:focus,.inp:focus{border-color:var(--accent);outline:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sw{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid var(--line2);padding:0}
.sw button[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 2px var(--accent)}
.sw input[type=color]{width:34px;height:30px;border:1px solid var(--line2);border-radius:8px;background:var(--raise);padding:2px}
.sw .hex{margin-left:auto;font:400 12px/1 var(--mono);color:#c9c5c0}
.switch{position:relative;width:40px;height:22px;border-radius:11px;border:0;background:var(--line2);flex:none}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--fg);transition:transform .15s}
.switch[aria-pressed="true"]{background:var(--accent)}.switch[aria-pressed="true"]::after{transform:translateX(18px)}
.pos{display:grid;grid-template-columns:repeat(3,34px);gap:5px}
.pos button{height:26px;border:1px solid var(--line);border-radius:5px;background:var(--raise);padding:0;display:grid;place-items:center}
.pos button::after{content:"";width:8px;height:3px;border-radius:2px;background:var(--mute)}
.pos button[aria-pressed="true"]{border-color:var(--accent)}.pos button[aria-pressed="true"]::after{background:var(--accent)}
.ghost{border:1px solid var(--line2);background:transparent;border-radius:8px;padding:9px 12px;font:600 12px/1 var(--ui)}
.ghost:hover{border-color:var(--fg)}
/* render dialog */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:16px;z-index:50}
.dlg{width:min(560px,100%);background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:18px}
.dlg h2{margin:0;font:700 24px/1 var(--ui)}
.fmt{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fmt button{border:1px solid var(--line);border-radius:10px;background:var(--raise);padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px}
.fmt button b{font:700 14px/1 var(--ui)}.fmt button small{font:500 11.5px/1.5 var(--ar);color:var(--mute);direction:rtl;text-align:right}
.fmt button[aria-pressed="true"]{border-color:var(--accent)}
.track{height:10px;border-radius:5px;background:var(--line2);overflow:hidden}.track i{display:block;height:100%;width:0;background:var(--accent)}
.dlg .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.note{font:500 12px/1.6 var(--ar);color:var(--mute);direction:rtl;text-align:right;margin:0}
.file{border:1px solid var(--accent);border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.file b{font:700 14px/1.3 var(--ui);word-break:break-all}
@media (max-width:1180px){
  html,body{height:auto}
  .app{height:auto;grid-template:auto/minmax(0,1fr);grid-template-areas:"top" "stage" "ctl" "moves"}
  .top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:10px 16px;flex-wrap:wrap}
  .spec{display:none}.cta{margin-left:auto}
  .stage{padding:14px 16px}.vpwrap{flex:none;container-type:inline-size}.vp{width:100%}
  .ctl{border-left:0;border-top:1px solid var(--line);overflow:visible}
  .moves{border-right:0;border-top:1px solid var(--line)}.grid{flex:none;overflow:visible;grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
}
@media (prefers-reduced-motion:reduce){.switch::after{transition:none}}
</style>
</head>

</div>

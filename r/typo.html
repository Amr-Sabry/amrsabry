<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0a0a0a">
<title>Aroma Typo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=JetBrains+Mono:wght@400;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@100..900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,100..900&display=swap">
<style>
body{margin:0}[hidden]{display:none!important}img{max-width:100%}

/* layout: an edit suite. Moves bin on the left, monitor + transport in the middle, inspector on the right. One dark look on purpose (it sits next to video). */
:root{color-scheme:dark;
  --bg:#0a0a0a; --panel:#101010; --raise:#171716; --line:#272625; --line2:#3d3b39; --fg:#f0f0ef; --mute:#8f8b86; --accent:#EF4122; --accent-ink:#0a0a0a;
  --ui:'Montserrat','Alexandria',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace; --ar:'Alexandria','Montserrat',Tahoma,sans-serif;}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:500 13px/1.4 var(--ui);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{height:100%;display:grid;grid-template:56px minmax(0,1fr)/300px minmax(0,1fr) 340px;grid-template-areas:"top top top" "moves stage ctl"}
.top{grid-area:top;display:flex;align-items:center;gap:16px;padding:0 18px;border-bottom:1px solid var(--line);background:var(--panel);min-width:0}
.brand{display:flex;align-items:center;gap:11px;font:700 15px/1 var(--mono);letter-spacing:.2em;flex:none}
.brand svg{display:block}.brand .x{color:var(--mute);font-weight:400}
button.spec{background:transparent;cursor:pointer;transition:border-color .15s,color .15s}
button.spec:hover{border-color:var(--line2);color:var(--fg)}
.vp[data-solid]{background:var(--obg,#000)!important}
.seg button:disabled{opacity:.35;cursor:default}
.pre{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pre button{border:1px solid var(--line);border-radius:10px;background:var(--raise);padding:10px 6px 9px;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.pre button[aria-pressed="true"]{border-color:var(--accent)}
.pre i{height:26px;display:grid;place-items:center;color:var(--mute)}
.pre i::after{content:"";display:block;border:1.5px solid currentColor;border-radius:2px;width:calc(24px*var(--rw));height:calc(24px*var(--rh))}
.pre button[aria-pressed="true"] i{color:var(--accent)}
.pre b{font:700 12.5px/1 var(--mono)}
.pre small{font:400 10px/1 var(--mono);color:var(--mute);letter-spacing:.03em;white-space:nowrap}
.pre em{font:500 10.5px/1.2 var(--ui);color:var(--mute);font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.dlg .seg{display:flex}.dlg .seg button{flex:1;white-space:nowrap}
@media (max-width:520px){.pre{grid-template-columns:repeat(2,1fr)}}
.lns{display:flex;flex-direction:column;gap:6px}
.ln{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:9px;background:var(--raise);padding:4px 4px 4px 5px;transition:border-color .15s,box-shadow .15s}
.ln[aria-selected="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.ln .n{flex:none;width:22px;height:22px;border-radius:6px;border:0;background:var(--line);color:var(--mute);font:700 10px/1 var(--mono);padding:0}
.ln[aria-selected="true"] .n{background:var(--accent);color:var(--accent-ink)}
.ln textarea{flex:1;width:auto;min-width:0;min-height:0;border:0;border-radius:0;background:transparent;padding:7px 3px;font:600 15px/1.4 var(--ar);color:var(--fg);outline:0;resize:none;overflow:hidden;display:block}
.ln textarea::placeholder{color:var(--mute);font-weight:500}
.ln .mv{flex:none;border:1px solid var(--line2);background:transparent;border-radius:6px;font:700 10px/1 var(--mono);color:var(--mute);padding:5px 6px}
.ln[aria-selected="true"] .mv{color:var(--fg)}
.ln .x{flex:none;width:24px;height:24px;border:0;background:transparent;color:var(--mute);font:400 17px/1 var(--ui);border-radius:6px;padding:0}
.ln .x:hover:not(:disabled){background:var(--line);color:var(--fg)}.ln .x:disabled{opacity:.25;cursor:default}
#secLines>.r{display:flex;justify-content:space-between;align-items:center}
.lnacts{display:flex;gap:8px}.lnacts .ghost{flex:1;white-space:nowrap}.ghost:disabled{opacity:.4;cursor:default}
.selbox{position:absolute;border:1px dashed var(--accent);border-radius:3px;pointer-events:none;opacity:0;transition:opacity .25s}
.selbox.on{opacity:1}
.selbox b{position:absolute;left:-1px;bottom:100%;background:var(--accent);color:var(--accent-ink);font:700 10px/1 var(--mono);padding:3px 5px;border-radius:3px 3px 0 0}
.selbox.hov{border:1px solid rgba(255,255,255,.5);mix-blend-mode:difference}
.ln textarea[readonly]{cursor:pointer;color:#d8d4cf}
.ln[data-kind="comp"] .mv{color:var(--accent);border-color:var(--accent)}
.cf{display:flex;flex-direction:column;gap:10px}
.pts{display:flex;flex-direction:column;gap:5px}
.pt{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.75fr) minmax(0,.75fr) minmax(0,1.15fr) 24px;gap:4px;align-items:center}
.pt input{width:100%;min-width:0;background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:7px 6px;font:600 12px/1.2 var(--ar);text-align:center}
.pt input:focus{border-color:var(--accent);outline:0}
.pt span{font:400 9px/1 var(--mono);letter-spacing:.08em;color:var(--mute);text-align:center;text-transform:uppercase}
.pt button{width:24px;height:24px;border:0;background:transparent;color:var(--mute);font:400 16px/1 var(--ui);border-radius:6px;padding:0}
.pt button:hover:not(:disabled){background:var(--line);color:var(--fg)}.pt button:disabled{opacity:.25;cursor:default}
#mGrid.off .tile{opacity:.32}
.ptabs{display:flex;margin:14px 16px 0}.ptabs button{flex:1}
.moves[data-tab="proj"] .hd,.moves[data-tab="proj"] .grid{display:none}
.moves:not([data-tab="proj"]) .pjp{display:none}
.pjp{flex:1;min-height:0;overflow:auto;padding:14px 16px 18px;display:flex;flex-direction:column;gap:14px}
.pjp h3{margin:0;font:700 18px/1.1 var(--mono);letter-spacing:.16em;display:flex;align-items:center;gap:10px}
.pjp h3 i{display:flex;gap:4px}.pjp h3 i b{width:14px;height:14px;border-radius:50%;border:1px solid var(--line2);display:block}
.pjp .pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pjp .lab{display:block}
.pjp .acts2{display:flex;flex-direction:column;gap:8px}
.pjm-i{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px 10px;align-items:center;padding:12px;border-radius:7px;color:var(--fg);border:0;background:transparent;width:100%;text-align:left;cursor:pointer}
.pjm-i:hover,.pjm-i:focus-visible{background:rgba(255,255,255,.06)}
.pjm-i b{font:700 12px/1 var(--mono);letter-spacing:.18em}.pjm-i small{grid-column:1/-1;font:500 12px/1.5 var(--ar);color:var(--mute);direction:rtl;text-align:right}
.pjm-i[aria-current="true"] b{color:var(--accent)}
@media (max-width:900px){.pjp{flex:none;overflow:visible}.pjp .pgrid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}}
.gbord{margin:10px 0 4px;padding:12px 10px 4px;border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;gap:8px}.gbord h4{margin:0;font:700 11px/1 var(--mono);letter-spacing:.14em;color:var(--accent);text-transform:uppercase}
.seg.g3{display:grid!important;grid-template-columns:repeat(3,1fr)}.seg.g3 button{border-left:1px solid var(--line);border-top:1px solid var(--line);margin:-1px 0 0 -1px;padding:8px 4px}
.gtree{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.gr{display:flex;align-items:center;gap:6px;padding:0 6px 0 0;border-top:1px solid var(--line);min-height:32px}
.gr:first-child{border-top:0}
.gr[aria-selected="true"]{background:rgba(239,65,34,.12);box-shadow:inset 3px 0 0 var(--accent)}
.gr .eye{flex:none;width:28px;height:30px;border:0;background:transparent;color:var(--mute);padding:0;display:grid;place-items:center}
.gr .eye[aria-pressed="false"]{opacity:.35}
.gr .nm{flex:1;min-width:0;border:0;background:transparent;text-align:left;padding:7px 0;font:600 12px/1.2 var(--ui);color:#d8d4cf;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gr .ty{flex:none;font:700 9px/1 var(--mono);letter-spacing:.1em;color:var(--mute);text-transform:uppercase}
.gprops{display:flex;flex-direction:column;gap:12px;border:1px solid var(--line2);border-radius:10px;padding:12px}
.gprops h4{margin:0;font:700 11px/1 var(--mono);letter-spacing:.14em;color:var(--accent);text-transform:uppercase}
.gcon{display:flex;flex-direction:column;gap:8px}
.gsteps{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line2);border-radius:10px;padding:10px 12px}
.gsteps .chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.gsteps .chip{min-width:34px;height:32px;border-radius:8px;border:1px solid var(--line2);background:var(--raise);color:#d8d4cf;font:700 13px/1 var(--mono)}
.gsteps .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.gsteps .ghost.mini{height:32px}
.gcon textarea.inp{resize:vertical;min-height:0;font:inherit;line-height:1.4;padding-top:9px;padding-bottom:9px;overflow:hidden}
.gcon .two input{min-width:0}
.ccol{display:flex;gap:6px;align-items:center}.ccol select{flex:1;min-width:0}
.hexin{width:86px;flex:none;margin-left:auto;background:transparent;border:1px solid var(--line);border-radius:7px;padding:7px 8px;font:400 12px/1 var(--mono);letter-spacing:.06em;color:#c9c5c0;text-transform:uppercase}.hexin:focus{outline:none;border-color:var(--accent);color:var(--fg)}.hexin.bad{border-color:#e5484d}.ccol .hexin{margin-left:0}.ccol input[type=color]{width:34px;height:34px;border:1px solid var(--line2);border-radius:8px;background:var(--raise);padding:2px;flex:none}
.selbox.node{border:1.5px dotted #4fb3ff;mix-blend-mode:normal}
.hist{display:flex;gap:4px;margin-left:8px}.hist .hb{padding:7px 9px}.hist .hb svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.hist .hb:disabled{opacity:.3;cursor:default}.hist{position:relative}.htip{position:absolute;top:calc(100% + 8px);left:0;white-space:nowrap;font:400 11px/1 var(--mono);letter-spacing:.08em;color:var(--fg);background:var(--raise);border:1px solid var(--line2);border-radius:6px;padding:6px 8px;opacity:0;transform:translateY(-3px);transition:opacity .15s,transform .15s;pointer-events:none;z-index:30}.htip.on{opacity:1;transform:none}
.spec{margin-left:auto;font:400 11px/1 var(--mono);letter-spacing:.12em;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:8px 12px;white-space:nowrap}
.cta{border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font:700 14px/1 var(--ui);padding:11px 22px;flex:none}
.cta:hover{filter:brightness(1.1)}
.lab{font:700 10.5px/1 var(--mono);letter-spacing:.16em;color:var(--mute);text-transform:uppercase}
/* moves bin */
.moves{grid-area:moves;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0;min-width:0}
.moves .hd{padding:16px 16px 10px;display:flex;flex-direction:column;gap:10px}
.moves .hd .row{display:flex;justify-content:space-between;align-items:center}
#mCount{color:var(--accent)}
.search{width:100%;background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
.search::placeholder{color:#66625e}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:5px 10px;font:600 11px/1 var(--ui);color:var(--mute)}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--fg)}
.grid{flex:1;min-height:0;overflow:auto;padding:4px 16px 18px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:max-content;gap:10px;align-content:start}
.tile{border:1px solid var(--line);border-radius:10px;background:var(--raise);padding:0;overflow:hidden;display:block;text-align:left;min-width:0}
.tile canvas{display:block;width:100%;aspect-ratio:16/9;background:#000}
.tile span{display:block;padding:7px 9px 8px;font:600 11.5px/1.2 var(--ui);color:#c9c5c0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile span b{font:700 10px/1 var(--mono);letter-spacing:.06em;color:var(--mute);margin-inline-end:7px}
.tile[aria-pressed="true"] span b{color:var(--accent)}
.tile:hover{border-color:var(--line2)}
.tile[aria-pressed="true"]{border-color:var(--accent)}.tile[aria-pressed="true"] span{color:var(--fg)}
/* monitor */
.stage{grid-area:stage;display:flex;flex-direction:column;gap:12px;padding:16px 18px;min-width:0;min-height:0}
.vpwrap{flex:1;min-height:0;display:grid;place-items:center;container-type:size}
.vp{position:relative;width:min(100cqw,calc(100cqh*var(--asp,1.7778)));aspect-ratio:var(--asp,1.7778);max-width:100%;border:1px solid var(--line);border-radius:8px;overflow:hidden;touch-action:none;cursor:grab;background:#000}
.vp.drag{cursor:grabbing}
.vp[data-bg="checker"]{background:#0b0b0b repeating-conic-gradient(#191918 0 25%,#0b0b0b 0 50%) 0 0/28px 28px}
.vp[data-bg="white"]{background:#fff}.vp[data-bg="grey"]{background:linear-gradient(160deg,#5b6770,#2b2f33 60%,#3a322c)}
.vp canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.vp .tag{position:absolute;left:10px;top:9px;font:700 10px/1 var(--mono);letter-spacing:.16em;color:#fff;mix-blend-mode:difference;pointer-events:none}
.guides{position:absolute;inset:0;pointer-events:none}
.guides i{position:absolute;border:1px dashed rgba(255,255,255,.35);mix-blend-mode:difference}
.guides .g1{inset:5%}.guides .g2{inset:10%}
.snap{position:absolute;background:var(--accent);pointer-events:none}
.snap.v{top:0;bottom:0;left:50%;width:1px}.snap.h{left:0;right:0;top:50%;height:1px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 10px;font:600 11.5px/1 var(--ui);color:var(--mute)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--raise);color:var(--fg)}
.play{width:40px;height:40px;border-radius:50%;border:0;background:var(--fg);display:grid;place-items:center;flex:none}
.play i{width:0;height:0;border-left:13px solid #000;border-top:8px solid transparent;border-bottom:8px solid transparent;margin-left:3px}
.play[aria-pressed="true"] i{width:12px;height:14px;border:0;border-left:4px solid #000;border-right:4px solid #000;margin:0}
.time{font:400 13px/1 var(--mono);letter-spacing:.06em;color:#c9c5c0;font-variant-numeric:tabular-nums;white-space:nowrap}
.scrub{flex:1;min-width:120px}
.hint{font:500 12px/1.5 var(--ar);color:var(--mute);direction:rtl;text-align:right}
/* assistant dock: the mascot's home. His speech and the buttons that are his job sit next to him. */
.dock{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:8px 14px 10px 6px}
.slot{flex:none;width:150px;height:98px;display:grid;place-items:center}
.slot i{width:78px;height:40px;border:2px solid var(--line2);clip-path:polygon(0 0,100% 0,100% 100%,18% 100%,0 60%)}
.dock.live .slot i{display:none}
.dock .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.dock .r{display:flex;justify-content:space-between;gap:8px}
.dock p{margin:0;font:600 15.5px/1.5 var(--ar);direction:rtl;text-align:right;min-height:3em}
.dock .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.dock .acts button{font-family:var(--ar)}
.cta.sm{padding:8px 14px;font-size:12.5px}
#mQc.bad{color:var(--accent)}
/* ranges */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--accent) var(--p,0%),var(--line2) var(--p,0%))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line2)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--accent)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--fg);margin-top:-6px;border:0}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--fg);border:0}
/* inspector */
.ctl{grid-area:ctl;border-left:1px solid var(--line);background:var(--panel);overflow:auto;min-width:0;padding:6px 16px 28px}
.sec{padding:14px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.sec:last-child{border-bottom:0}
.f{display:flex;flex-direction:column;gap:7px;min-width:0}
.f .r{display:flex;justify-content:space-between;align-items:center;gap:8px}
.val{font:700 11px/1 var(--mono);letter-spacing:.08em;color:var(--fg);font-variant-numeric:tabular-nums}
textarea,select,.inp{width:100%;background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:10px 11px}
textarea{font:600 17px/1.5 var(--ar);resize:vertical;min-height:84px}
textarea:focus,select:focus,.inp:focus{border-color:var(--accent);outline:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mbox{display:flex;flex-direction:column;gap:12px}
.mbox .seg{display:flex;flex-wrap:wrap}.mbox .seg button{flex:1;white-space:nowrap}
input[type=number].inp{font:400 13px/1 var(--mono)}
.sw{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid var(--line2);padding:0}
.sw button[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 2px var(--accent)}
.sw input[type=color]{width:34px;height:30px;border:1px solid var(--line2);border-radius:8px;background:var(--raise);padding:2px}
.sw .hex{margin-left:auto;font:400 12px/1 var(--mono);color:#c9c5c0}
.switch{position:relative;width:40px;height:22px;border-radius:11px;border:0;background:var(--line2);flex:none}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--fg);transition:transform .15s}
.switch[aria-pressed="true"]{background:var(--accent)}.switch[aria-pressed="true"]::after{transform:translateX(18px)}
.pos{display:grid;grid-template-columns:repeat(3,34px);gap:5px}
.pos button{height:26px;border:1px solid var(--line);border-radius:5px;background:var(--raise);padding:0;display:grid;place-items:center}
.pos button::after{content:"";width:8px;height:3px;border-radius:2px;background:var(--mute)}
.pos button[aria-pressed="true"]{border-color:var(--accent)}.pos button[aria-pressed="true"]::after{background:var(--accent)}
.ghost{border:1px solid var(--line2);background:transparent;border-radius:8px;padding:9px 12px;font:600 12px/1 var(--ui)}
.ghost:hover{border-color:var(--fg)}
/* icons + folding sections */
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;display:block}
.sh{display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;padding:3px 0;text-align:left;color:var(--fg);border-radius:4px}
.sh .ic{color:var(--accent)}.sh .lab{flex:1;color:#c9c5c0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sh:hover .lab{color:var(--fg)}
.sh .chev{color:var(--mute);transition:transform .15s}.sec.shut .sh .chev{transform:rotate(-90deg)}
.sec.shut>:not(.sh){display:none!important}.sec.shut{padding-bottom:12px}
.cta,.ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px}
.ghost.mini{align-self:flex-end;padding:6px 10px;font-size:11px;color:#c9c5c0}
.seg button{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.seg.icons{display:flex}.seg.icons button{flex:1;padding:8px 10px}

/* every move has a fixed number: its place in this list. New moves are only ever added at the end. */
var MOVE_BY={}; MOVES.forEach(function(m,i){MOVE_BY[m.id]=m; m.no=i+1; m.num=(i<9?'0':'')+(i+1);});
/* draw one frame of P at time t (seconds). K = scale of the target canvas vs 1920 (for blur / shadow). */
var COMPS={};
function render(g,t,P,K){K=K||1; var T=timing(P), env={t:clamp(t,0,T.D),D:T.D,Ti:T.Ti,To:T.To,tOut:T.tOut}, CO=P.kind==='comp'?COMPS[P.comp]:(P.kind==='group'?GRP:null), M0, v, M, L=null;
  if(P.kind==='comp'&&!CO) return; if(!CO){M0=MOVE_BY[P.move]||MOVES[0]; v=mvals(M0,P); M=M0.cfg?Object.assign({},M0,M0.cfg(v,P)):M0; L=layout(P);}
  function draw(c){c.save(); setup(c,P,K); c.globalAlpha=1; c.filter='none'; try{ if(CO) CO.draw(c,P,env,K); else if(M.custom) CUSTOM[M.custom](c,L,env,P,M,K,v); else generic(c,L,env,P,M,K); } finally {c.restore();} }
  var ol=P.outline>0&&!P.olOnly, sh=!!P.shOn&&P.shOp>0, grad=L?gradFor(P,L):null;
  if(PASS.busy||(!ol&&!sh)){var keep=INK.grad; INK.grad=grad; try{draw(g);} finally {INK.grad=keep;} return;}
  /* outline and shadow belong to the finished picture, not to each letter: the line is drawn on spare canvases and put together here */
  PASS.busy=1; INK.grad=grad;
  try{var cv=g.canvas, w=cv.width, h=cv.height, T0=g.getTransform(), C=fxCanvas('C',w,h), c=C._raw;
    var fresh=function(X){var x=X._raw; x.setTransform(1,0,0,1,0,0); x.globalAlpha=1; x.globalCompositeOperation='source-over'; x.filter='none'; x.clearRect(0,0,w,h); x.setTransform(T0); return x;};
    fresh(C);
    if(ol){var A=fxCanvas('A',w,h), S=fxCanvas('S',w,h), a=fresh(A), s=fresh(S);
      PASS.mode='text'; draw(passCtx(a)); PASS.mode='ol'; draw(passCtx(s)); PASS.mode='gfx'; draw(passCtx(c)); PASS.mode=0;
      s.setTransform(1,0,0,1,0,0); s.globalCompositeOperation='destination-out'; s.drawImage(A,0,0); s.globalCompositeOperation='source-over';
      c.setTransform(1,0,0,1,0,0); c.drawImage(S,0,0); c.drawImage(A,0,0);}
    else draw(c);
    g.save(); g.setTransform(1,0,0,1,0,0); g.globalAlpha=1; g.filter='none';
    if(sh){var an=(P.shAngle||0)*Math.PI/180, kd=Math.sqrt(Math.abs(T0.a*T0.d-T0.b*T0.c))||1; g.shadowColor=rgba(P.shColor,(P.shOp/100).toFixed(3)); g.shadowBlur=P.shBlur*kd; g.shadowOffsetX=Math.cos(an)*P.shDist*kd; g.shadowOffsetY=Math.sin(an)*P.shDist*kd;}
    g.drawImage(C,0,0); g.restore();
  } finally {PASS.mode=0; PASS.busy=0; INK.grad=null;}}

/* ================= components: a layer that is a finished graphic (number + text + shapes) with fields to fill =================
   A component layer is a line object with kind:'comp', comp:<id> and f:{field values}. It shares everything a text line has:
   place (x, y = its centre), Size (170 = designed size), Fill = text colour, Accent = brand colour, Font, timing, outline, shadow.
   Each component:  fields (what the team types), geo(P) (its measured layout), box(P) (where it rests), draw(g,P,env,K). */
function cFields(P){var C=COMPS[P.comp], o={}; if(!C) return o; C.fields.forEach(function(f){var v=P.f?P.f[f.k]:undefined; o[f.k]=(v===undefined||v===null||typeof v!==typeof f.def||(Array.isArray(f.def)&&!Array.isArray(v)))?f.def:v;}); return o;}
function cW(P,str,w,px){ if(!str) return 0; MG.font=fontW(P,w,px); MG.direction=hasAr(str)?'rtl':'ltr'; return MG.measureText(str).width;}

    else if(name==='move'){check(); quip('cat'+d.cat,CAT_LINE[d.cat]||'حلوة دي','wow',{icon:CAT_ICON[d.cat]||'play',word:d.name.replace(/[^A-Za-z0-9 ]/g,'').slice(0,9)});}

    else if(name==='font-upload'){check(); quip(null,'فونت البراند؟ كده الشغل بقى رسمي','wow',{icon:'star',word:'BRAND',spin:1});}
    else if(name==='drag'){check(); quip('drag',d?'في النص بالظبط.. مظبوطة':'مكانه كده أحسن','happy',{icon:'target',word:'PLACE'});}
    else if(name==='reset'){check(); speak('رجّعنا كل حاجة زي الأول','happy',{icon:'spin',word:'RESET',spin:1,ms:2400});}
    else if(name==='dlg-open'){renderProg=null; speak('جاهز؟ اختار الـ Format ودوس Start Render','happy',{word:'RENDER',icon:'rocket',at:$('#dlgBox'),fly:600000,ms:5000});}
    else if(name==='dlg-close'){target=null; renderProg=null; setText(defaultText()); line={text:'',until:0,prio:0};}
    else if(name==='render-start'){renderProg=0; speak('ثواني.. بطبخ الفريمات','dizzy',{word:'RENDER',icon:'load',ms:90000,prio:2});}
    else if(name==='render-progress'){renderProg=d;}
    else if(name==='encode-load'){speak('أول مرة بس.. بنزّل الـ Encoder، اصبر عليّا','sleepy',{word:'LOADING',icon:'hour',ms:120000,prio:2});}
    else if(name==='encode'){speak('بحوّلها ProRes.. قرّبنا','happy',{word:'PRORES',icon:'load',ms:240000,prio:2});}
    else if(name==='render-done'){renderProg=1; speak('اتفضل يا باشا.. ملفك جاهز بـ Alpha','wow',{word:'DONE',icon:'check',ms:6000,prio:2,spin:1});}
    else if(name==='render-cancel'){renderProg=null; speak('ولا يهمك.. نعيدها وقت ما تحب','idle',{word:'OK',ms:2600});}
    else if(name==='render-error'){renderProg=null; speak('حصلت مشكلة في الـ Encoder.. جرّب PNG Sequence','sad',{word:'OOPS',icon:'warn',ms:6000,prio:2});}
    else if(name==='saved'){speak('اتحفظ.. ابعته للـ Editor وقوله سلّملي عليه','happy',{word:'SAVED',icon:'heart',ms:4200});} }

  /* ---- he is clickable while he is home: fix the note if there is one, otherwise suggest ---- */
  function poke(){var now=performance.now(); pokes=pokes.filter(function(t){return now-t<1700;}); pokes.push(now); lastAct=now;
    if(pokes.length>=4){pokes=[]; speak('براحة عليّا.. دوّختني','dizzy',{word:'WHOA',icon:'spin',ms:2600,prio:1,spin:1}); return;}
    if(issue&&issue.run) applyFix(); else suggest(); }
  MK.onclick=poke; MK.onsay=function(t){ if(t&&!tour){line={text:t,until:performance.now()+3600,prio:0}; setText(t);} };
  fixBtn.addEventListener('click',applyFix); sugBtn.addEventListener('click',suggest);

  /* ---- flight: a damped spring to the target, banking into the turn, facing what he points at ---- */
  function frame(now){requestAnimationFrame(frame); var dt=Math.min(.05,(now-lastT)/1000); lastT=now; if(document.hidden) return;
    if(target&&now>target.until) target=null; var h=home(), tg=target, tx=tg?tg.x:h.x, ty=tg?tg.y:h.y, ts=tg?tg.size:(wide()?150:118);
    if(!pos.init){pos.x=tx; pos.y=ty; pos.s=ts; pos.init=1;}
    if(!tg&&Math.abs(tx-pos.x)+Math.abs(ty-pos.y)<1.5&&Math.abs(pos.vx)+Math.abs(pos.vy)<4){pos.x=tx; pos.y=ty; pos.vx=pos.vy=0;}
    else {pos.vx+=((tx-pos.x)*64-pos.vx*13.5)*dt; pos.vy+=((ty-pos.y)*64-pos.vy*13.5)*dt; pos.x+=pos.vx*dt; pos.y+=pos.vy*dt;}
    pos.s+=(ts-pos.s)*(1-Math.pow(.003,dt)); var sp=Math.sqrt(pos.vx*pos.vx+pos.vy*pos.vy), st=(now-spinT0)/750, spin=st<1?Math.PI*2*(1-Math.pow(1-st,3)):0;
    yaw+=((tg?tg.side*.42:0)-yaw)*(1-Math.pow(.01,dt));
    fx.x=pos.x; fx.y=pos.y; fx.size=pos.s; fx.rz=Math.max(-.5,Math.min(.5,-pos.vx/2400)); fx.rx=Math.max(-.32,Math.min(.32,pos.vy/3000)); fx.ry=yaw+spin; fx.sy=1+Math.min(.1,sp/11000); fx.sx=1-Math.min(.06,sp/18000);
    fx.hand=tg&&sp<160?(tg.side>0?[[-1.55,-.7,.25],[1.98,.18+Math.sin(now/170)*.1,.55]]:[[-1.98,.18+Math.sin(now/170)*.1,.55],[1.55,-.7,.25]]):null; fx.click=!tg;
    fx.prog=renderProg!=null?renderProg:clamp(time/timing(P).D); fx.slow=renderProg!=null&&renderProg<1;
    if(now>fxUntil){fx.icon=null; fx.word=issue?'CHECK':(MOVE_BY[P.move].name.replace(/[^A-Za-z0-9 ]/g,'').slice(0,9));}
    var n=Math.min(typed.full.length,Math.floor((now-typed.t)/15)); if(n!==typed.n){typed.n=n; sayEl.textContent=typed.full.slice(0,n);}
    if(line.text&&now>line.until){line={text:'',until:0,prio:0}; setText(defaultText());}
    if(!tour&&!line.text&&$('#scrim').hidden&&now-lastAct>26000){lastAct=now; tipI=(tipI+1)%TIPS.length; speak(TIPS[tipI],'idle',{word:'TIP',icon:'bulb',ms:5200});}
    if(MK.ready&&!dock.classList.contains('live')) dock.classList.add('live'); }
  issue=inspect(); paintDock(); startTour(); requestAnimationFrame(frame);
  return {on:on,check:check,suggest:suggest};
})();

})();
</script>

<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0A0A0F">
<title>HRID · Director Room</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap">
<style>
:root{
  --bg:#0A0A0F; --card:#0F1117; --card2:#151822; --line:rgba(240,240,239,.09); --line2:rgba(240,240,239,.16);
  --text:#F0F0EF; --soft:#c9c9c7; --mute:#888; --dim:#55555d;
  --red:#EF4122; --orange:#FF6B35; --green:#4CAF50; --yellow:#F59E0B;
  --cyan:#4ECDC4; --blue:#3B82F6; --purple:#8B5CF6; --magenta:#D946EF;
  --f:'IBM Plex Sans Arabic',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --m:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f);font-size:14px;line-height:1.55;
  background-image:radial-gradient(900px 420px at 100% -8%,rgba(239,65,34,.13),transparent 62%),radial-gradient(700px 500px at 0% 0%,rgba(59,130,246,.06),transparent 60%);background-repeat:no-repeat}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
bdi,.ltr{direction:ltr;unicode-bidi:isolate}
.mono{font-family:var(--m);font-variant-numeric:tabular-nums}
.wrap{max-width:1640px;margin:0 auto;padding:22px max(18px,env(safe-area-inset-right,0px)) 64px max(18px,env(safe-area-inset-left,0px));display:grid;gap:14px;min-width:0}

/* header */
.hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 24px;padding-bottom:14px;border-bottom:1px solid var(--line2)}
.kick{font-family:var(--m);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--orange);margin:0 0 4px;display:flex;align-items:center;gap:9px}
.kick::before{content:"";width:22px;height:2px;background:var(--red);box-shadow:0 0 10px var(--red)}
h1{margin:0;font-size:clamp(24px,3vw,36px);line-height:1.15;font-weight:700;letter-spacing:-.01em}
.note{margin:6px 0 0;color:var(--mute);font-size:13.5px;max-width:74ch}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:999px;padding:3px 11px;font-size:12.5px;color:var(--soft);background:rgba(255,255,255,.02);white-space:nowrap}
.chip b{font-weight:600;color:var(--text)}
.chip .over{color:var(--red);font-weight:600}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;min-width:0}
.sec-t{margin:0;font-size:12px;font-weight:600;color:var(--mute);letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.sec-t::before{content:"";width:6px;height:6px;background:var(--red);border-radius:1px;flex:none}

/* summary */
.sum{display:grid;grid-template-columns:1.25fr 1.25fr 1fr 1fr;gap:10px}
.sum .card{padding:12px 14px;display:grid;gap:9px;align-content:start}
.stats{display:flex;flex-wrap:wrap;gap:6px 16px}
.stat{display:flex;align-items:baseline;gap:6px;font-size:12.5px;color:var(--soft)}
.stat i{width:8px;height:8px;border-radius:2px;background:var(--c);flex:none;align-self:center}
.stat b{font-family:var(--m);font-size:19px;font-weight:600;color:var(--text);line-height:1}
.bar{display:flex;height:5px;border-radius:3px;overflow:hidden;background:#1b1e28;direction:ltr}
.bar i{background:var(--c);min-width:2px}
.big{font-family:var(--m);font-size:30px;font-weight:600;line-height:1;letter-spacing:-.02em}
.big small{font-family:var(--f);font-size:13px;font-weight:400;color:var(--mute);letter-spacing:0;margin-inline-start:6px}
.sub{font-size:12.5px;color:var(--mute);margin:0}
.sub b{color:var(--soft);font-weight:500}
.idchips{display:flex;flex-wrap:wrap;gap:5px}
.idc{font-family:var(--m);font-size:11.5px;border:1px solid var(--line2);background:#151822;border-radius:5px;padding:1px 7px;color:var(--soft);direction:ltr}
.idc:hover{border-color:var(--orange);color:#fff}
.idc.temp{border-color:rgba(239,65,34,.5);color:#ff9a86}

/* flags */
.flags{padding:13px 14px 14px;display:grid;gap:11px}
.flags>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px}
.flags>summary::-webkit-details-marker{display:none}
.flags>summary:focus-visible{outline:2px solid var(--orange);outline-offset:4px;border-radius:4px}
.sec-t small{font-weight:400;color:var(--mute)}
.ftitles{display:flex;gap:6px;overflow:hidden;white-space:nowrap;mask-image:linear-gradient(to left,#000 82%,transparent);-webkit-mask-image:linear-gradient(to left,#000 82%,transparent)}
.ftitles span{font-size:11.5px;color:var(--soft);border:1px solid var(--line);border-radius:999px;padding:2px 9px;flex:none}
.flags[open] .ftitles{visibility:hidden}
.fmore::before{content:'عرض';font-size:11.5px;color:var(--orange)}
.flags[open] .fmore::before{content:'إخفاء'}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:9px}
.fl{background:var(--card2);border:1px solid var(--line);border-inline-start:3px solid var(--orange);border-radius:7px;padding:9px 12px 10px;display:grid;gap:5px;align-content:start}
.fl h3{margin:0;font-size:13.5px;font-weight:600}
.fl p{margin:0;font-size:12.5px;color:var(--soft)}

/* main */
.main{display:grid;grid-template-columns:minmax(0,.84fr) minmax(0,1fr);gap:14px;align-items:stretch}
.colA,.colB{min-width:0}
.stick{position:sticky;top:var(--top,12px);display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - var(--top,12px) - 12px);max-height:calc(100dvh - var(--top,12px) - 12px);min-height:0}
.player{padding:10px;display:grid;gap:8px;flex:none}
.stage{position:relative;aspect-ratio:16/9;background:#000;border-radius:6px;overflow:hidden;direction:ltr}
.stage video{position:absolute;inset:0;width:100%;height:100%;display:block;background:transparent;object-fit:contain;opacity:0}
.stage.ready video{opacity:1;background:#000}
.poster{position:absolute;inset:0;background-color:#000;background-repeat:no-repeat;opacity:.6}
.stage.ready .poster{display:none}
.bigplay{position:absolute;inset:0;margin:auto;width:64px;height:64px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:rgba(10,10,15,.55);backdrop-filter:blur(4px);display:grid;place-items:center;color:#fff;padding:0}
.bigplay svg{width:26px;height:26px;margin-left:3px}
.stage.playing .bigplay{display:none}
.verr{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(15,17,23,.92);border:1px solid rgba(239,65,34,.6);border-radius:6px;padding:8px 12px;font-size:12.5px;color:#ffb4a6;direction:rtl;text-align:start}
.hud{position:absolute;top:8px;left:8px;display:flex;gap:6px;pointer-events:none}
.hud span{font-family:var(--m);font-size:11.5px;background:rgba(10,10,15,.72);border:1px solid rgba(255,255,255,.14);border-radius:4px;padding:1px 7px;color:#fff}
.hud .lab{color:#ffb199;border-color:rgba(239,65,34,.6)}
.tr{display:flex;flex-wrap:wrap;align-items:center;gap:6px;direction:ltr}
.tb{height:32px;min-width:34px;padding:0 8px;border-radius:6px;border:1px solid var(--line2);background:#161924;display:inline-grid;place-items:center;color:var(--soft)}
.tb:hover{border-color:rgba(255,107,53,.7);color:#fff}
.tb svg{width:16px;height:16px;display:block}
.tb.on{background:rgba(239,65,34,.16);border-color:var(--red);color:#ff8a70}
.tb.pp{min-width:46px;background:var(--red);border-color:var(--red);color:#fff}
.tb.pp:hover{background:#ff5436}
.rates{display:inline-flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden}
.rates button{height:30px;padding:0 8px;border:0;background:#161924;color:var(--mute);font-family:var(--m);font-size:11.5px}
.rates button+button{border-left:1px solid var(--line2)}
.rates button.on{background:#262a38;color:#fff}
.tcbox{margin-left:auto;display:flex;align-items:baseline;gap:9px;font-family:var(--m);font-variant-numeric:tabular-nums;white-space:nowrap}
.tcbox .t{font-size:17px;font-weight:600;letter-spacing:.02em}
.tcbox .s{font-size:12.5px;color:var(--orange);font-weight:600}
.tcbox .f{font-size:11.5px;color:var(--mute)}
.tl{position:relative;direction:ltr;user-select:none;-webkit-user-select:none;touch-action:none}
.strip{position:relative;display:flex;height:34px;border-radius:5px;overflow:hidden;background:#12141c;cursor:pointer}
.blk{position:relative;min-width:0;height:100%;background:var(--sc);opacity:.42;border-top:3px solid var(--kc);box-shadow:inset 1px 0 0 var(--bg);overflow:hidden;transition:opacity .12s}
.blk b{position:absolute;left:4px;bottom:2px;font-family:var(--m);font-size:10px;font-weight:500;color:#fff;opacity:.9;pointer-events:none}
.blk.cur{opacity:1}
.blk.hov{opacity:.8}
.ph{position:absolute;top:-2px;bottom:-2px;width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.55),0 0 8px rgba(255,255,255,.7);pointer-events:none;left:0}
.ruler{position:relative;height:15px;font-family:var(--m);font-size:10px;color:var(--dim)}
.ruler span{position:absolute;top:3px;transform:translateX(-50%)}
.ruler span::before{content:"";position:absolute;left:50%;top:-3px;width:1px;height:4px;background:var(--dim)}
.ruler span:first-child{transform:none}.ruler span:first-child::before{left:0}
.tip{position:absolute;top:38px;transform:translateX(-50%);background:#fff;color:#0A0A0F;border-radius:5px;padding:3px 8px;font-size:11.5px;font-weight:500;white-space:nowrap;pointer-events:none;z-index:3;max-width:min(320px,90%);overflow:hidden;text-overflow:ellipsis}
.tip .mono{font-weight:600}
.vo{display:flex;gap:9px;align-items:baseline;min-height:24px;font-size:13px;color:var(--soft);border-top:1px solid var(--line);padding-top:7px;direction:ltr;text-align:left}
.vo em{font-style:normal;font-family:var(--m);font-size:10.5px;color:var(--orange);border:1px solid rgba(255,107,53,.45);border-radius:4px;padding:0 5px;flex:none}
.vo span{font-style:italic;min-width:0;overflow-wrap:anywhere}
.vo .none{color:var(--dim);font-style:normal}

/* detail */
.detail{padding:12px 14px 14px;display:grid;gap:9px;align-content:start;flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#2a2e3b transparent}
.d-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 9px}
.d-id{font-family:var(--m);font-size:20px;font-weight:600;color:var(--orange);line-height:1}
.d-name{margin:0;font-size:16px;font-weight:600;direction:ltr;unicode-bidi:isolate;text-align:right;overflow-wrap:anywhere}
.d-desc{margin:0;color:var(--soft);font-size:13.5px}
.meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.meta div{background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:5px 9px;min-width:0}
.meta dt{font-size:10.5px;color:var(--mute);margin:0}
.meta dd{margin:0;font-family:var(--m);font-size:12.5px;font-variant-numeric:tabular-nums;direction:ltr;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
dl{margin:0}
.lbl{font-size:11px;color:var(--mute);font-weight:600;margin:2px 0 -3px}
.work{margin:0;padding:0;list-style:none;display:grid;gap:3px}
.work li{position:relative;padding-inline-start:16px;font-size:13px;color:var(--text);overflow-wrap:anywhere}
.work li::before{content:"";position:absolute;inset-inline-start:2px;top:.6em;width:7px;height:7px;border:1.5px solid var(--mute);border-radius:2px}
.d-vo{margin:0;font-size:13px;font-style:italic;color:var(--soft);direction:ltr;text-align:left;border-left:2px solid var(--orange);padding-left:9px}
.fnote{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.fnote li{font-size:12.5px;color:#f4cf9a;background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.28);border-radius:6px;padding:4px 9px;overflow-wrap:anywhere}
.qbox{font-size:13px;background:rgba(239,65,34,.10);border:1px solid rgba(239,65,34,.55);border-radius:7px;padding:7px 10px;color:#ffd2c8;overflow-wrap:anywhere}
.qbox b{color:#ff8a70;font-weight:600;margin-inline-end:6px}

/* badges */
.bdg{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;border-radius:5px;padding:1px 7px;border:1px solid var(--c);color:var(--c);border:1px solid color-mix(in srgb,var(--c) 55%,transparent);color:color-mix(in srgb,var(--c) 70%,#fff);background:color-mix(in srgb,var(--c) 11%,transparent);white-space:nowrap}
.bdg::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c);flex:none}
.bdg.k::before{border-radius:1px}
.dp{font-family:var(--m);font-size:11px;border:1px solid var(--line2);border-radius:4px;padding:0 6px;color:var(--soft);direction:ltr;white-space:nowrap}
.sz{display:inline-flex;align-items:baseline;gap:6px;font-size:12px;color:var(--soft);white-space:nowrap}
.sz b{font-family:var(--m);font-weight:600;color:#fff;background:#262a38;border-radius:4px;padding:0 6px;font-size:11.5px}
.sz.XL b{background:var(--red)}.sz.L b{background:#b4531f}
.onlab{font-family:var(--m);font-size:11px;color:#ffb199;border:1px dashed rgba(239,65,34,.7);border-radius:4px;padding:0 6px;direction:ltr;white-space:nowrap}

/* plan */
.plan{padding:13px 14px 14px;display:grid;gap:10px}
.p-hd{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px}
.p-hd h2{margin:0;font-size:17px;font-weight:700;display:flex;align-items:baseline;gap:9px}
.p-hd h2 small{font-size:12px;font-weight:400;color:var(--mute)}
.search{height:32px;width:min(260px,100%);border:1px solid var(--line2);border-radius:6px;background:#12141c;padding:0 10px;font-size:13px;outline:none}
.search:focus{border-color:var(--orange)}
.filters{display:grid;gap:6px}
.fg{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.fg>span{font-size:11.5px;color:var(--mute);min-width:38px}
.fc{height:26px;border:1px solid var(--line2);background:transparent;border-radius:999px;padding:0 10px;font-size:12px;color:var(--soft);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.fc i{width:7px;height:7px;border-radius:50%;background:var(--c,#888)}
.fc em{font-style:normal;font-family:var(--m);font-size:10.5px;color:var(--mute)}
.fc:hover{border-color:var(--mute)}
.fc.on{background:#fff;border-color:#fff;color:#0A0A0F;font-weight:600}
.fc.on em{color:#444}
.rows{display:grid;gap:7px}
.row{display:grid;grid-template-columns:168px minmax(0,1fr);gap:12px;padding:9px;background:var(--card2);border:1px solid var(--line);border-inline-start:3px solid var(--sc);border-radius:8px;cursor:pointer;text-align:start;scroll-margin:90px 0}
.row:hover{border-color:var(--line2);border-inline-start-color:var(--sc);background:#181b27}
.row:focus-visible{outline:2px solid var(--orange);outline-offset:1px}
.row.cur{background:#1c1f2c;border-color:rgba(255,107,53,.75);border-inline-start-color:var(--sc);box-shadow:0 0 0 1px rgba(255,107,53,.28),0 6px 22px rgba(0,0,0,.35)}
.th{position:relative;width:100%;aspect-ratio:16/9;background-color:#000;background-repeat:no-repeat;border-radius:5px;overflow:hidden;align-self:start;clip-path:polygon(0 0,100% 0,100% 100%,13px 100%,0 calc(100% - 13px))}
.th .onlab{position:absolute;top:5px;left:5px;background:rgba(10,10,15,.8);font-size:10px}
.th .lk{position:absolute;right:5px;bottom:5px;font-family:var(--m);font-size:9.5px;color:#fff;background:rgba(10,10,15,.7);border-radius:3px;padding:0 5px}
.rm{display:grid;gap:5px;min-width:0;align-content:start}
.r-top{display:flex;flex-wrap:wrap;align-items:center;gap:5px 8px}
.r-id{font-family:var(--m);font-size:14px;font-weight:600;color:var(--orange)}
.r-tc{font-family:var(--m);font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap}
.r-sp{flex:1 1 0}
.fi{display:inline-flex;align-items:center;gap:3px;font-family:var(--m);font-size:11px;color:var(--yellow)}
.fi svg{width:13px;height:13px}
.fi.q{color:#ff8a70}
.r-name{margin:0;font-size:14px;font-weight:600;direction:ltr;unicode-bidi:isolate;text-align:right;overflow-wrap:anywhere}
.r-desc{margin:0;font-size:12.5px;color:var(--soft);overflow-wrap:anywhere}
.row .work li{font-size:12.5px;color:var(--soft)}
.r-ft{display:flex;flex-wrap:wrap;align-items:center;gap:5px 6px;margin-top:1px}
.empty{padding:26px;text-align:center;color:var(--mute);border:1px dashed var(--line2);border-radius:8px}
.foot{color:var(--dim);font-size:11.5px;text-align:center;margin-top:6px}
.keys{font-size:11.5px;color:var(--dim);direction:rtl;display:flex;flex-wrap:wrap;gap:4px 12px}
.keys kbd{font-family:var(--m);font-size:10.5px;border:1px solid var(--line2);border-radius:4px;padding:0 5px;color:var(--mute);background:#12141c}

@media (max-width:1099px){
  .main{grid-template-columns:minmax(0,1fr)}
  .stick{position:static;max-height:none}
  .detail{overflow:visible}
  .sum{grid-template-columns:1fr 1fr}
}
@media (max-width:700px){
  body{font-size:13.5px}
  .wrap{padding-top:14px;gap:10px}
  .sum{grid-template-columns:1fr}
  .fgrid{grid-template-columns:1fr}
  .row{grid-template-columns:112px minmax(0,1fr);gap:9px;padding:8px}
  .rm{display:contents}
  .r-top{grid-column:2;align-self:start}
  .r-name,.r-desc,.row .work,.r-ft{grid-column:1 / -1}
  .th{grid-row:1;grid-column:1}
  .meta{grid-template-columns:1fr 1fr}
  .tcbox{margin-left:0;width:100%;justify-content:space-between;order:9}
  .keys{display:none}
  .search{width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body data-mascot-side="left">
<div class="wrap">

<header class="hd" data-mascot-say="36 شوت ومفيش ولا واحد هيعدّي من غير بلان" data-mascot-mood="happy">
  <div>
    <p class="kick"><bdi>Aroma Studios · Director Room</bdi></p>
    <h1 id="h1" dir="auto"></h1>
    <p class="note" id="note"></p>
  </div>
  <div class="chips" id="chips"></div>
</header>

<section class="sum" id="sum" aria-label="ملخص"></section>



<main class="main">
  <div class="colA">
    <div class="stick" id="stick">
      <section class="card player" id="player" data-mascot-say="دوس على أي شوت وأنا أعيدهولك لحد ما تزهق" data-mascot-mood="idle">
        <div class="stage" id="stage">
          <div class="poster" id="poster"></div>
          <video id="v" playsinline preload="metadata"></video>
          <div class="hud"><span id="hud-id">SH01</span><span class="lab" id="hud-lab" hidden></span></div>
          <button class="bigplay" id="bigplay" type="button" aria-label="تشغيل"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg></button>
          <div class="verr" id="verr" hidden></div>
        </div>
        <div class="tr">

:"M","flags":["مفيش end logo في v07"],"q":"النهاية: التوقيع بس، ولا لازم يتحول للوجو HRID زي الـ treatment؟","id":"SH36","f0":1546,"f1":1609,"vo":"name to."}]}</script>
<script>
(function(){
'use strict';
var D;
try{ D=JSON.parse(document.getElementById('hrid-data').textContent); }
catch(e){ document.getElementById('note').textContent='بيانات الصفحة مش مقروءة.'; return; }
var M=D.meta||{}, S=D.shots||[], KD=D.kinds||{}, ST=D.status||{}, SZ=D.sizes||{}, FL=D.flags||[];
var FPS=M.fps||25, FRAMES=M.frames||(S.length?S[S.length-1].f1:1), DUR=FRAMES/FPS;
var SC={final:'#4CAF50',wip:'#F59E0B',temp:'#EF4122'}, KC={live:'#4ECDC4',cg:'#3B82F6',ai:'#8B5CF6',mix:'#D946EF'};
var $=function(id){return document.getElementById(id);};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function p2(n){return (n<10?'0':'')+n;}
function tc(f){f=Math.max(0,Math.round(f));var s=Math.floor(f/FPS);return p2(Math.floor(s/3600))+':'+p2(Math.floor(s/60)%60)+':'+p2(s%60)+':'+p2(f%FPS);}
function secs(fr){return (fr/FPS).toFixed(2);}
function num(n){var r=Math.round(n*10)/10;return (r%1===0)?String(r):r.toFixed(1);}
function sc(s){return SC[s]||'#888';} function kc(k){return KC[k]||'#888';}
function stLabel(s){return (ST[s]&&ST[s].label)||s||'';} function kdLabel(k){return (KD[k]&&KD[k].label)||k||'';}
function shortSt(s){return stLabel(s).split(' · ')[0];}
function store(k,v){try{ if(v===undefined) return JSON.parse(localStorage.getItem('hrid-dr:'+k)); localStorage.setItem('hrid-dr:'+k,JSON.stringify(v)); }catch(e){ return null; }}
var COLS=M.spriteCols||6, SROWS=Math.max(1,Math.ceil(S.length/COLS));
function tile(i){ var c=i%COLS, r=Math.floor(i/COLS);
  return 'background-image:url('+JSON.stringify(M.sprite||'').replace(/"/g,"'")+');background-size:'+(COLS*100)+'% '+(SROWS*100)+'%;background-position:'+(COLS>1?c/(COLS-1)*100:0)+'% '+(SROWS>1?r/(SROWS-1)*100:0)+'%'; }
var IDX={}; S.forEach(function(s,i){IDX[s.id]=i;});
function idchip(id,cls){ return '<button type="button" class="idc '+(cls||'')+'" data-go="'+esc(id)+'">'+esc(id)+'</button>'; }

/* ---------- header ---------- */
$('h1').textContent=M.project||'HRID';
if(M.note) $('note').textContent=M.note; else $('note').hidden=true;
(function(){
  var over=(M.target!=null)?(DUR-M.target):0, h='';
  if(M.edit) h+='<span class="chip">Edit <b><bdi>'+esc(M.edit)+'</bdi></b></span>';
  h+='<span class="chip"><b><bdi>'+S.length+'</bdi></b> شوت</span>';
  h+='<span class="chip"><b><bdi>'+DUR.toFixed(2)+'</bdi></b> ث'+(M.target!=null?' / <bdi>'+esc(M.target)+'</bdi> ث'+(Math.abs(over)>0.005?' <span class="over"><bdi>'+(over>0?'+':'−')+Math.abs(over).toFixed(2)+'</bdi> ث</span>':''):'')+'</span>';
  h+='<span class="chip"><b><bdi>'+FPS+'</bdi></b> <bdi>fps</bdi> · <bdi>'+FRAMES+'</bdi> <bdi>f</bdi></span>';
  if(M.updated) h+='<span class="chip">آخر تحديث <b><bdi>'+esc(M.updated)+'</bdi></b></span>';
  $('chips').innerHTML=h;
})();

/* ---------- summary ---------- */
(function(){
  var stc={},kdc={},szc={},stf={},kdf={},hours=0,temp=[],tempFr=0;
  S.forEach(function(s){ stc[s.status]=(stc[s.status]||0)+1; kdc[s.kind]=(kdc[s.kind]||0)+1; szc[s.size]=(szc[s.size]||0)+1; stf[s.status]=(stf[s.status]||0)+s.f1-s.f0; kdf[s.kind]=(kdf[s.kind]||0)+s.f1-s.f0;
    hours+=(SZ[s.size]&&SZ[s.size].hours)||0; if(s.status==='temp'){temp.push(s.id); tempFr+=s.f1-s.f0;} });
  function block(title,keys,counts,lab,col,frs){
    var st='',bar='',sub='';
    keys.forEach(function(k){ var n=counts[k]||0; if(n) sub+=(sub?' · ':'')+'<span style="color:'+col(k)+'">●</span> <bdi>'+secs(frs[k]||0)+'</bdi> ث'; st+='<span class="stat" style="--c:'+col(k)+'"><i></i><b>'+n+'</b>'+esc(lab(k))+'</span>'; if(n) bar+='<i style="--c:'+col(k)+';flex:'+n+' 1 0"></i>'; });
    return '<div class="card"><h2 class="sec-t">'+title+'</h2><div class="stats">'+st+'</div><div class="bar">'+bar+'</div><p class="sub">من زمن الفيلم: '+sub+'</p></div>';
  }
  var stKeys=Object.keys(ST).length?Object.keys(ST):Object.keys(stc), kdKeys=Object.keys(KD).length?Object.keys(KD):Object.keys(kdc);
  var szs=Object.keys(SZ).filter(function(k){return szc[k];}).map(function(k){return '<bdi>'+szc[k]+'×'+esc(k)+'</bdi>';}).join(' · ');
  var h=block('حالة الشوتات',stKeys,stc,shortSt,sc,stf)+block('نوع الشغل',kdKeys,kdc,kdLabel,kc,kdf);
  h+='<div class="card"><h2 class="sec-t">الوقت التقديري</h2><div class="big"><bdi>≈ '+Math.round(hours)+'</bdi><small>ساعة شغل</small></div><p class="sub">≈ <b><bdi>'+Math.round(hours/8)+'</bdi> يوم</b> (اليوم <bdi>8</bdi> س) · '+szs+'</p></div>';
  h+='<div class="card"><h2 class="sec-t">Placeholder · تتعمل من جديد</h2><div class="big" style="color:var(--red)"><bdi>'+temp.length+'</bdi><small>شوت · <bdi>'+secs(tempFr)+'</bdi> ث من الفيلم</small></div><div class="idchips">'+temp.map(function(id){return idchip(id,'temp');}).join('')+'</div></div>';
  $('sum').innerHTML=h;
})();

/* ---------- keep the sticky player clear of the hub's comment strip ---------- */
(function(){
  function fit(){ var pad=parseFloat(getComputedStyle(document.body).paddingTop)||0; document.documentElement.style.setProperty('--top',(pad+12)+'px'); }
  fit(); addEventListener('resize',fit); addEventListener('load',fit);
  try{ new MutationObserver(fit).observe(document.body,{attributes:true,attributeFilter:['style','class']}); }catch(e){}
  var n=0, t=setInterval(function(){ fit(); if(++n>20) clearInterval(t); },500);
})();

/* ---------- flags ---------- */
(function(){
  if(!FL.length){ $('flags').hidden=true; return; }
  $('fcount').textContent='· '+FL.length;
  $('ftitles').innerHTML=FL.map(function(f){return '<span>'+esc(f.t)+'</span>';}).join('');
  try{ if(localStorage.getItem('hrid-flags')==='1') $('flags').open=true; }catch(e){}
  $('flags').addEventListener('toggle',function(){ try{ localStorage.setItem('hrid-flags',$('flags').open?'1':'0'); }catch(e){} });
  $('fgrid').innerHTML=FL.map(function(f){
    return '<article class="fl"><h3>'+esc(f.t)+'</h3>'+(f.d?'<p>'+esc(f.d)+'</p>':'')+((f.shots&&f.shots.length)?'<div class="idchips">'+f.shots.map(function(id){return idchip(id);}).join('')+'</div>':'')+'</article>';
  }).join('');
})();

/* ---------- timeline ---------- */
var strip=$('strip'), ph=$('ph'), tip=$('tip'), blks=[];
(function(){
  var frag=document.createDocumentFragment();
  S.forEach(function(s,i){ var b=document.createElement('i'); b.className='blk'; b.style.cssText='flex:'+(s.f1-s.f0)+' 1 0;--sc:'+sc(s.status)+';--kc:'+kc(s.kind);
    b.innerHTML='<b>'+esc(String(s.id).replace(/^\D+/,''))+'</b>'; frag.appendChild(b); blks.push(b); });
  strip.insertBefore(frag,ph);
  var r='',step=DUR>40?10:5; for(var t=0;t<=DUR;t+=step) r+='<span style="left:'+(t/DUR*100)+'%">'+t+'s</span>';
  $('ruler').innerHTML=r;
})();
function fitLabels(){ blks.forEach(function(b){ b.firstChild.style.display=b.offsetWidth>=19?'':'none'; }); }
window.addEventListener('resize',fitLabels);

/* ---------- plan rows ---------- */
var rowsEl=$('rows'), rowEls=[];
function workList(s){ return (s.work&&s.work.length)?'<ul class="work">'+s.work.map(function(w){return '<li>'+esc(w)+'</li>';}).join('')+'</ul>':''; }
function sizeBadge(s){ var z=SZ[s.size]; return s.size?'<span class="sz '+esc(s.size)+'"><b>'+esc(s.size)+'</b>'+(z&&z.time?'<span>'+esc(z.time)+'</span>':'')+'</span>':''; }
var FLAG='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M5 3h2v18H5zM8 4h11l-2.6 4L19 12H8z"/></svg>';
(function(){
  var h='';
  S.forEach(function(s,i){
    var fr=s.f1-s.f0, nf=(s.flags||[]).length;
    h+='<article class="row" data-i="'+i+'" tabindex="0" role="button" aria-label="'+esc(s.id+' '+(s.name||''))+'" style="--sc:'+sc(s.status)+'">'
      +'<div class="th" style="'+tile(i)+'">'+(s.label?'<span class="onlab">'+esc(s.label)+'</span>':'')+'<span class="lk">'+(s.look==='color'?'COLOR':'B&amp;W')+'</span></div>'
      +'<div class="rm"><div class="r-top"><bdi class="r-id">'+esc(s.id)+'</bdi><bdi class="r-tc">'+tc(s.f0)+'</bdi><span class="r-tc"><bdi>'+secs(fr)+'</bdi> ث · <bdi>'+fr+' f</bdi></span>'
      +'<span class="bdg k" style="--c:'+kc(s.kind)+'">'+esc(kdLabel(s.kind))+'</span><span class="bdg" style="--c:'+sc(s.status)+'">'+esc(shortSt(s.status))+'</span><span class="r-sp"></span>'
      +(nf?'<span class="fi" title="'+esc((s.flags||[]).join(' · '))+'">'+FLAG+'<bdi>'+nf+'</bdi></span>':'')+(s.q?'<span class="fi q" title="'+esc(s.q)+'">؟ سؤال</span>':'')+'</div>'
      +'<h3 class="r-name">'+esc(s.name)+'</h3>'+(s.desc?'<p class="r-desc">'+esc(s.desc)+'</p>':'')+workList(s)
      +'<div class="r-ft">'+sizeBadge(s)+(s.dept||[]).map(function(d){return '<span class="dp">'+esc(d)+'</span>';}).join('')+'</div></div></article>';
  });
  rowsEl.innerHTML=h; rowEls=[].slice.call(rowsEl.children);
})();

/* ---------- filters ---------- */
var F=store('filters')||{}; if(typeof F!=='object'||!F) F={}; F.st=F.st||'all'; F.kd=F.kd||'all'; F.q=F.q||'';
if(F.st!=='all'&&!ST[F.st]) F.st='all'; if(F.kd!=='all'&&!KD[F.kd]) F.kd='all';
function hay(s){ return [s.id,s.name,s.desc,s.vo,s.label,s.q,(s.work||[]).join(' '),(s.dept||[]).join(' '),(s.flags||[]).join(' '),kdLabel(s.kind),stLabel(s.status),s.size].join(' ').toLowerCase(); }
var HAY=S.map(hay);
function drawFilters(){
  function grp(name,key,keys,lab,col,counts){
    var h='<div class="fg"><span>'+name+'</span><button type="button" class="fc'+(F[key]==='all'?' on':'')+'" data-f="'+key+'" data-v="all">الكل <em>'+S.length+'</em></button>';
    keys.forEach(function(k){ h+='<button type="button" class="fc'+(F[key]===k?' on':'')+'" data-f="'+key+'" data-v="'+esc(k)+'" style="--c:'+col(k)+'"><i></i>'+esc(lab(k))+' <em>'+(counts[k]||0)+'</em></button>'; });
    return h+'</div>';
  }
  var stc={},kdc={}; S.forEach(function(s){stc[s.status]=(stc[s.status]||0)+1; kdc[s.kind]=(kdc[s.kind]||0)+1;});
  $('filters').innerHTML=grp('الحالة','st',Object.keys(ST),shortSt,sc,stc)+grp('النوع','kd',Object.keys(KD),kdLabel,kc,kdc);
}
function applyFilters(){
  var q=(F.q||'').trim().toLowerCase(), n=0;
  S.forEach(function(s,i){ var ok=(F.st==='all'||s.status===F.st)&&(F.kd==='all'||s.kind===F.kd)&&(!q||HAY[i].indexOf(q)>=0); rowEls[i].hidden=!ok; if(ok) n++; });
  $('count').innerHTML=(n===S.length?'<bdi>'+n+'</bdi> شوت':'<bdi>'+n+'</bdi> من <bdi>'+S.length+'</bdi>');
  $('empty').hidden=n>0; store('filters',F);
}
$('filters').addEventListener('click',function(e){ var b=e.target.closest('.fc'); if(!b) return; F[b.dataset.f]=b.dataset.v; drawFilters(); applyFilters(); });
$('q').value=F.q; $('q').addEventListener('input',function(){ F.q=this.value; applyFilters(); });
drawFilters(); applyFilters();

/* ---------- detail ---------- */
function drawDetail(i){
  var s=S[i]; if(!s) return; var fr=s.f1-s.f0, z=SZ[s.size], h='';
  h+='<div class="d-top"><bdi class="d-id">'+esc(s.id)+'</bdi><span class="bdg k" style="--c:'+kc(s.kind)+'">'+esc(kdLabel(s.kind))+'</span><span class="bdg" style="--c:'+sc(s.status)+'">'+esc(stLabel(s.status))+'</span>'+(s.label?'<span class="onlab" title="مكتوب على الشاشة">'+esc(s.label)+'</span>':'')+'</div>';
  h+='<h2 class="d-name">'+esc(s.name)+'</h2>'+(s.desc?'<p class="d-desc">'+esc(s.desc)+'</p>':'');
  h+='<dl class="meta"><div><dt>TC In</dt><dd>'+tc(s.f0)+'</dd></div><div><dt>TC Out</dt><dd>'+tc(s.f1-1)+'</dd></div><div><dt>المدة</dt><dd>'+secs(fr)+' s · '+fr+' f</dd></div>'
    +'<div><dt>Frames</dt><dd>'+s.f0+' – '+(s.f1-1)+'</dd></div><div><dt>Look</dt><dd>'+(s.look==='color'?'Color':'B&amp;W')+'</dd></div><div><dt>الحجم / الوقت</dt><dd style="direction:rtl;text-align:start;font-family:var(--f)">'+(s.size?'<bdi class="mono">'+esc(s.size)+'</bdi>'+(z&&z.time?' · '+esc(z.time):''):'—')+'</dd></div></dl>';
  if(s.q) h+='<div class="qbox"><b>سؤال مفتوح</b>'+esc(s.q)+'</div>';

    function eyeOpen(c0,lx,ly,col,h,w){ w=w||8; var top=4+Math.floor((8-h)/2); for(var r=0;r<h;r++) for(var c=0;c<w;c++){ if(h>=6&&(r===0||r===h-1)&&(c===0||c===w-1)) continue; px(c0+c,top+r,col); }
      if(h>=6){ var pc=c0+3+lx, pr=top+Math.floor(h/2)-1+ly; fx.fillStyle='#050302'; fx.fillRect((pc+ox)*PX,(pr+oy)*PX,PX*2,PX*2); px(pc+1,pr,'rgba(255,255,255,.5)'); } }

    function eyeSpin(c0,col,k){ var P=[[3,4],[4,4],[5,5],[6,6],[6,7],[5,8],[4,9],[3,9],[2,8],[1,7],[1,6],[2,5]]; for(var i=0;i<8;i++){ var q=P[(i+k)%12]; px(c0+q[0],q[1]+1,col); } px(c0+3,7,col); px(c0+4,7,col); }
    function mouth(kind,col){ var c;
      if(kind==='smile'){ px(19,15,col); px(26,15,col); for(c=20;c<=25;c++) px(c,16,col); }
      else if(kind==='big'){ px(17,14,col); px(28,14,col); px(18,15,col); px(27,15,col); for(c=19;c<=26;c++){ px(c,16,col); px(c,15,col); } for(c=21;c<=24;c++) px(c,17,col); }
      else if(kind==='flat'){ for(c=20;c<=25;c++) px(c,16,col); }
      else if(kind==='frown'){ px(19,17,col); px(26,17,col); for(c=20;c<=25;c++) px(c,16,col); }
      else if(kind==='o'){ for(c=21;c<=24;c++){ px(c,14,col); px(c,17,col); } px(21,15,col); px(21,16,col); px(24,15,col); px(24,16,col); }
      else if(kind==='wave'){ for(c=18;c<=27;c++) px(c,16-(c%4<2?1:0),col); } }
    function two(n){ return (n<10?'0':'')+n; }
    function face(mood,lx,ly,blink,tick,pct){
      var d=new Date(), clk=two(d.getHours())+':'+two(d.getMinutes()), s=mood+lx+ly+blink+clk+pct+(mood==='dizzy'||mood==='sleepy'?tick:''); if(s===sig) return; sig=s; ox=0; oy=0;
      fx.fillStyle='#050302'; fx.fillRect(0,0,fc.width,fc.height);
      var r,c; for(r=0;r<ROWS;r++) for(c=0;c<COLS;c++) px(c,r,'rgba(255,230,207,.045)');
      var col=COL[mood]||WARM, L=9, R=29, dim='rgba(79,179,176,.95)';
      for(c=0;c<4;c++) for(r=0;r<=c+1;r++) px(3+c*2,6-r,dim);
      text(WORD[mood]||'HELLO',13,2,dim); text(clk,COLS-22,2,dim);
      for(c=2;c<COLS-2;c++) px(c,8,'rgba(79,179,176,.28)');
      ox=8; oy=7;
      if(mood==='happy'){ eyeHappy(L,col); eyeHappy(R,col); mouth('big',col); }
      else if(mood==='sad'){ eyeX(L,col); eyeX(R,col); mouth('frown',col); }
      else if(mood==='dizzy'){ eyeSpin(L,col,tick%12); eyeSpin(R,col,(tick+6)%12); mouth('wave',col); }
      else if(mood==='sleepy'){ eyeLine(L,col); eyeLine(R,col); mouth('flat',col); text('Z',40+(tick%3),1-(tick%3),col); }
      else if(mood==='wow'){ eyeOpen(L-1,lx,ly,col,blink?2:10,10); eyeOpen(R-1,lx,ly,col,blink?2:10,10); mouth('o',col); }
      else { var h=blink?2:8; eyeOpen(L,lx,ly,col,h); eyeOpen(R,lx,ly,col,h); mouth('smile',col); }
      ox=0; oy=0; var n=Math.round(pct*16); for(c=0;c<16;c++) px(16+c*2,25,c<n?'#ef6a3c':'rgba(239,106,60,.22)');   // bottom row: how far down the page you are
      ftex.needsUpdate=true;
    }

    /* moods → where the hands go */
    var POSE={ idle:[[-1.62,-.7,.25],[1.62,-.7,.25]], happy:[[-1.68,.9,.1],[1.68,.9,.1]], wow:[[-1.25,-.1,1.1],[1.25,-.1,1.1]], dizzy:[[-1.7,.2,1.0],[1.7,.2,1.0]], sleepy:[[-1.3,-1.05,.2],[1.3,-1.05,.2]], sad:[[-.42,0,HZ+.6],[.42,0,HZ+.6]] };
    var st={mood:'idle',until:0,t0:0,mx:0,my:0,tx:0,ty:0,blink:0,rayS:0,vel:0,sy:0,lastY:window.scrollY,lastT:performance.now(),travel:0,lastSay:0,lastMove:performance.now(),li:0,atEnd:false,wasDown:false};
    var STOCK=(document.body.getAttribute('data-mascot-lines')||'Keep going, it gets better.|Nice. Scroll on.|I helped make this one.|Still with you.|Good eye. Look at that.|Halfway there, probably.|My favourite part is coming.').split('|');
    var MOODS=['happy','idle','wow','happy','idle','wow','happy'], bubT=0;
    function say(t,m,ms){ var now=performance.now(); st.mood=POSE[m]?m:'idle'; st.t0=now; st.until=now+(ms||2600); st.lastSay=now;
      if(t){ var ar=/[\u0600-\u06FF]/.test(t); bub.textContent=t; bub.dir=ar?'rtl':'ltr'; bub.style.letterSpacing=ar?'0':'.06em'; bub.style.fontSize=ar?'14px':'12px'; bub.style.opacity='1'; bub.style.transform='none'; clearTimeout(bubT); bubT=setTimeout(function(){ bub.style.opacity='0'; bub.style.transform='translateY(6px)'; },ms||2600); } }
    window.AromaMascot.say=function(t,m){ say(String(t||''),m||'happy',3200); };
    Q.forEach(function(q){ say(q[0],q[1]||'happy',3200); });

    window.addEventListener('pointermove',function(e){ var r=wrap.getBoundingClientRect(); st.tx=Math.max(-1,Math.min(1,(e.clientX-(r.left+r.width/2))/500)); st.ty=Math.max(-1,Math.min(1,(e.clientY-(r.top+r.height/2))/400)); st.lastMove=performance.now(); },{passive:true});
    function pagePct(){ var m=document.documentElement.scrollHeight-window.innerHeight; return m>0?Math.max(0,Math.min(1,window.scrollY/m)):0; }
    window.addEventListener('scroll',function(){
      var now=performance.now(), y=window.scrollY, dy=y-st.lastY, dt=Math.max(16,now-st.lastT); st.lastY=y; st.lastT=now; st.lastMove=now;
      st.vel=dy/dt*1000; st.travel+=Math.abs(dy); if(y>300) st.wasDown=true;
      var p=pagePct(), quiet=now-st.lastSay>2300;
      if(Math.abs(st.vel)>3200&&now-st.lastSay>1400){ say('Whoa. Slow down, I get dizzy.','dizzy',2400); st.travel=0; return; }
      if(p>.985&&!st.atEnd){ st.atEnd=true; say('That is the whole reel. Encore?','happy',3200); st.travel=0; return; }
      if(p<.9) st.atEnd=false;
      if(y<8&&st.wasDown&&quiet){ st.wasDown=false; say('Back to the top. Again, from the start.','wow',2600); st.travel=0; return; }
      if(dy<-40&&st.travel>500&&quiet){ say('Going back? Missed something?','wow',2400); st.travel=0; return; }
      if(dy>0&&st.travel>900&&quiet){ say(STOCK[st.li%STOCK.length],MOODS[st.li%MOODS.length],2600); st.li++; st.travel=0; }
    },{passive:true});
    if('IntersectionObserver' in window){ var io=new IntersectionObserver(function(en){ en.forEach(function(e){ if(e.isIntersecting){ say(e.target.getAttribute('data-mascot-say')||'',e.target.getAttribute('data-mascot-mood')||'happy',3400); st.travel=0; io.unobserve(e.target); } }); },{threshold:.5});
      [].slice.call(document.querySelectorAll('[data-mascot-say],[data-mascot-mood]')).forEach(function(el){ io.observe(el); }); }
    setTimeout(function(){ if(!st.lastSay) say('Hi. I am the doorman. Scroll, I will come along.','happy',3400); },900);

    var clock=new T.Clock();
    (function frame(){
      requestAnimationFrame(frame); if(document.hidden) return;

      st.mx+=(st.tx-st.mx)*(1-Math.pow(.02,dt)); st.my+=(st.ty-st.my)*(1-Math.pow(.02,dt));
      st.vel*=Math.pow(.02,dt); st.sy+=(Math.max(-1,Math.min(1,st.vel/2600))-st.sy)*(1-Math.pow(.004,dt));

      bot.rotation.set(st.my*.12-st.sy*.5,st.mx*.3+(mood==='dizzy'?Math.sin(t*9)*.5:0),(mood==='dizzy'?Math.sin(t*6)*.25:0)-st.sy*.12);
      head.rotation.set(st.my*.14,st.mx*.18+(mood==='sad'&&since<.7?Math.sin(since*26)*.4*(1-since/.7):0),Math.sin(t*.9)*.03+(mood==='sleepy'?.14:0));
      ant.rotation.z=-.25+Math.sin(t*(mood==='dizzy'?14:2.2))*.09; bulb.rotation.y=t*2;
      st.blink-=dt; if(st.blink<-3-Math.random()*3) st.blink=.13;
      var ly=Math.abs(st.sy)>.15?(st.sy>0?1:-1):Math.round(st.my*1.4);

        else { h.to.y+=Math.sin(t*1.7+i*2.4)*.09-st.sy*.4; }
        HMOVE(h.pos,h.to,k); h.g.position.copy(h.pos); h.g.rotation.set(.06,Math.sin(t*.8+i*1.7)*.18+(i?-.12:.12),(i?-1:1)*.06); HICON(h.g,mood,i,t); }

    })();
  }

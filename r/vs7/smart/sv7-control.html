<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="sv7-build" content="10231232">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الكنترول · VS7</title>
<link rel="stylesheet" href="sv.css?v=21">
<style>
:root{--bg:#07090f;--card:rgba(255,255,255,.045);--line:rgba(255,255,255,.1);--ink:#eef0f4;--mute:#8d96a6;--gold:#e5b96d;--ok:#4fd1a1;--warn:#f5b84b;--bad:#ef6b6b;--f:'SVb','SVd',system-ui,sans-serif;--fd:'SVd','SVb',system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:radial-gradient(1200px 700px at 80% -10%,#141a29,#07090f 60%);color:var(--ink);font:400 15px/1.4 var(--f)}
button{font:inherit;color:inherit}
.tabs{display:flex;gap:6px;padding:4px;border-radius:14px;background:rgba(255,255,255,.05);border:1px solid var(--line)}
.tabs a{padding:8px 16px;border-radius:10px;color:var(--mute);text-decoration:none;font:600 14px var(--fd);white-space:nowrap}
.tabs a.on{background:linear-gradient(180deg,#f3d39b,#d9a457);color:#14110a}
header{display:flex;align-items:center;gap:14px;padding:14px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{margin:0 6px 0 0;font:600 18px var(--fd)}
.sp{flex:1}
.pill{display:flex;align-items:center;gap:8px;padding:7px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--mute);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--bad)}.pill.ok{color:var(--ink)}.pill.ok i{background:var(--ok)}.pill.warn i{background:var(--warn)}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:9px 15px;border-radius:11px;background:var(--card);border:1px solid var(--line);font:600 14px var(--fd)}
.btn:hover{background:rgba(255,255,255,.09)}.btn.pulse{animation:bpulse 1.2s ease-in-out infinite}@keyframes bpulse{50%{box-shadow:0 0 0 6px rgba(245,184,75,.45)}}.btn.gold{background:linear-gradient(180deg,#f3d39b,#d9a457);color:#14110a;border:0}
main{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 430px;gap:16px;padding:16px 20px;height:calc(100% - 66px)}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;min-height:0}
.col{display:flex;flex-direction:column;gap:16px;min-height:0}
.lab{font:600 12px var(--fd);color:var(--mute);letter-spacing:.04em;margin-bottom:8px;display:flex;justify-content:space-between}
.frame{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#04060b}
.frame .mini{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.frame.next{filter:grayscale(.6) brightness(.8);cursor:pointer}
.nav{display:grid;grid-template-columns:1fr 1.6fr;gap:12px}
.nav button{all:unset;cursor:pointer;text-align:center;padding:20px;border-radius:16px;background:var(--card);border:1px solid var(--line);font:600 20px var(--fd)}
.nav button.nx{background:linear-gradient(180deg,#f3d39b,#d9a457);color:#14110a;border:0}
.steps{display:flex;gap:6px;margin-top:10px}.steps i{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.12)}.steps i.on{background:var(--gold)}
.med{display:none}.med.on{display:block}
.mrow{display:flex;align-items:center;gap:10px;direction:ltr}
.mrow button{all:unset;cursor:pointer;flex:none;min-width:44px;height:44px;padding:0 6px;box-sizing:border-box;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);font:700 18px/1 system-ui}
.mrow #mPP{background:linear-gradient(180deg,#f3d39b,#d9a457);color:#14110a;border:0}
.mrow .cc{font-size:13px;letter-spacing:.06em;opacity:.5}.mrow .cc.on{opacity:1;border-color:var(--gold)}
.mt{flex:none;min-width:104px;font:600 16px/1 system-ui;font-variant-numeric:tabular-nums;color:var(--ink)}
.mtr{position:relative;flex:1;height:26px;cursor:pointer}.mtr::before,.mtr i{content:"";position:absolute;left:0;top:10px;height:6px;border-radius:3px}
.mtr::before{right:0;background:rgba(255,255,255,.12)}.mtr i{background:var(--gold)}.mtr.noseek{cursor:default}
.info h2{margin:2px 0 6px;font:600 24px var(--fd)}
.info .cue{margin:8px 0 0;padding:0 18px 0 0;font:500 17px/1.6 var(--f)}
.info .say{margin-top:10px;padding:12px 14px;border-radius:12px;background:rgba(229,185,109,.08);border:1px solid rgba(229,185,109,.25);font:400 16px/1.75 var(--f);color:#efe3c8}
.info .v6{margin-top:8px;font-size:13px;color:var(--mute)}
.tm{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tm div{padding:12px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.tm b{display:block;font:600 30px var(--fd);font-variant-numeric:tabular-nums;direction:ltr;text-align:right}
.tm small{color:var(--mute)}
.bar{height:6px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .5s}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.list{overflow:auto;display:flex;flex-direction:column;gap:6px;padding-left:4px}
.r{display:grid;grid-template-columns:14px 26px 120px minmax(0,1fr);gap:9px;align-items:center;padding:6px;border-radius:12px;cursor:pointer;border:1px solid transparent}
.r:hover{background:rgba(255,255,255,.04)}.r.cur{border-color:rgba(229,185,109,.6);background:rgba(229,185,109,.08)}
.r.off{opacity:.4}
.r .n{font:600 14px var(--fd);color:var(--mute);text-align:center}
.r .tb{position:relative;width:120px;height:67.5px;border-radius:8px;overflow:hidden;background:#04060b}
.r .tb .mini{position:absolute;left:0;top:0;width:1920px;height:1080px;transform:scale(.0625);transform-origin:0 0}
.r .tt{min-width:0;font:500 14px/1.35 var(--f)}.r .tt .ti{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.r .tt small{display:block;color:var(--mute);font-size:11.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .ra{display:flex;align-items:center;gap:4px;margin-top:6px}
.r .sw{all:unset;cursor:pointer;font-size:12px;padding:4px 8px;border-radius:8px;border:1px solid var(--line)}.r .sw.on{border-color:var(--gold);color:var(--gold)}
.r .mv{all:unset;cursor:pointer;width:22px;height:20px;display:grid;place-items:center;font-size:10px;border-radius:6px;color:var(--mute);opacity:.35}.r:hover .mv{opacity:1}.r .mv:hover{background:rgba(255,255,255,.1);color:var(--ink)}
.r .gp{cursor:grab;color:var(--mute);font-size:16px;text-align:center;opacity:.5}.r:hover .gp{opacity:1}
.r.drag{opacity:.35}.r.dropA{box-shadow:inset 0 3px 0 var(--gold)}.r.dropB{box-shadow:inset 0 -3px 0 var(--gold)}
.btn.sm{padding:3px 9px;font-size:11px;margin-right:8px;border-radius:8px}
.sec{font:600 12px var(--fd);color:var(--gold);padding:10px 6px 2px}
body.black .frame:first-child{outline:3px solid var(--bad)}
</style>
</head>
<body>
<header>
  <nav class="tabs"><a class="on" href="sv7-control.html">VS7</a></nav>
  <h1>«كنا فين؟ بقينا فين؟»</h1>
  <div class="sp"></div>
  <div class="pill" id="pShow"><i></i><span>العرض مش مفتوح</span></div>
  <div class="pill ok" id="pSnd"><i></i><span>الصوت…</span></div>
  <div class="pill"><span class="num" id="clock">--:--</span></div>
  <button class="btn gold" id="bShow">افتح العرض</button>
  <button class="btn" id="bPres">شاشة المتحدث</button>
</header>
<main>
  <section class="col">
    <div class="box"><div class="lab"><span>على الشاشة دلوقتي</span><span id="nowNo"></span></div><div class="frame" id="fNow"></div><div class="steps" id="dots"></div></div>
    <div class="nav"><button id="bPrev">→ السابق</button><button class="nx" id="bNext">التالي ←</button></div>
    <div class="box med" id="med"><div class="lab"><span>الفيديو على الشاشة</span><span id="mLen"></span></div>
      <div class="mrow"><button id="mRS" title="R">↺</button><button id="mB5" title="J">−5</button><button id="mPP" title="P">❚❚</button><button id="mF5" title="L">+5</button><span class="mt" id="mT">0:00 / 0:00</span>
      <div class="mtr" id="mTr"><i id="mPg"></i></div><button id="mCC" class="cc on" title="C">CC</button></div></div>

    <div class="box"><div class="tools">
      <button class="btn" id="bFirst">من البداية</button><button class="btn" id="bReplay">إعادة المشهد</button><button class="btn" id="bBlack">شاشة سودا (B)</button>
      <button class="btn" id="tGo">▶︎ تايمر الجلسة</button><button class="btn" id="tReset">تصفير</button></div></div>
  </section>
  <section class="col">
    <div class="box"><div class="lab"><span>اللي بعده</span><span id="nextNo"></span></div><div class="frame next" id="fNext"></div></div>
    <div class="box info" style="flex:1;overflow:auto"><div class="lab"><span id="iKind"></span><span id="iT"></span></div><h2 id="iTitle"></h2><ul class="cue" id="iCue"></ul><div class="say" id="iSay"></div><div class="v6" id="iV6"></div></div>
    <div class="tm"><div><small>وقت الجلسة · من <span id="tBud">45:00</span></small><b id="tAll">00:00</b><div class="bar"><i id="tAllB"></i></div></div><div><small>المشهد ده · المخطط <span id="tPl"></span></small><b id="tSc">00:00</b><div class="bar"><i id="tScB"></i></div></div></div>
  </section>
  <section class="box col" style="gap:8px"><div class="lab"><span>المشاهد <button class="btn sm" id="bOrd" style="display:none">الترتيب الأصلي</button></span><span id="lCount"></span></div><div class="list" id="rows"></div></section>
</main>

<script src="sv-kq.js?v=12"></script>

<script>
(function(){
const D=window.SV7,$=id=>document.getElementById(id),BUD=(D.mins||45)*60;
const sayOf=(S,k)=>(S.st&&S.st[k]&&S.st[k].say)||S.say;
const bc=('BroadcastChannel' in window)?new BroadcastChannel('sv7-ctl'):null;
const send=m=>bc&&bc.postMessage(m);
let off=Object.assign({},(window.SV7&&SV7.hid)||{});try{Object.assign(off,JSON.parse(localStorage.getItem('sv7-off')||'{}'))}catch(e){}
/* 06:26 Amr «اديني في الكنترول … الاخفاء والاظهار للسلايد وكمان امكانية تحريك مكانه»: the show order is the deck's order unless
   the control saved another (localStorage «sv7-ord», sent as {type:'ord'}); a scene the saved order doesn't know sits after its
   natural predecessor. Next/previous walk this order, skipping what is switched off. */
let ord=null;try{ord=JSON.parse(localStorage.getItem('sv7-ord')||'null')}catch(e){}
function seq(){const nat=D.scenes.map((s,i)=>i);if(!ord||!ord.length)return nat;const id2i={};D.scenes.forEach((s,i)=>id2i[s.id]=i);const out=[],seen=new Set();
  ord.forEach(id=>{const i=id2i[id];if(i!=null&&!seen.has(i)){out.push(i);seen.add(i)}});
  nat.forEach(i=>{if(seen.has(i))return;let k=-1;for(let j=i-1;j>=0;j--){const p=out.indexOf(j);if(p>=0){k=p;break}}out.splice(k+1,0,i);seen.add(i)});return out}
function nb(i,d){const S=seq();let p=S.indexOf(i);for(p+=d;p>=0&&p<S.length;p+=d){if(!off[D.scenes[S[p]].id])return S[p]}return null}
const live=()=>seq().filter(i=>!off[D.scenes[i].id]);
let cur=0,step=0,slideAt=Date.now(),showSeen=0,black=false;
const KIND={proj:'مشروع',hero:'صورة',stmt:'نص',question:'سؤال المنتدى',section:'قسم',oath:'البداية',cards:'بطاقات',leaders:'أقوال',stats:'أرقام',cmp:'قبل وبعد',people:'المواطن',gallery:'تجميع صور',cover:'غلاف',questions:'الأسئلة',film:'فيلم',act:'سؤال',statement:'جملة',crisis:'أرقام الأزمة',pressures:'الضغوط',generations:'مقارنة دولية',split:'الاختيار',system:'القدرات الخمسة',chapter:'قدرة',compare:'قبل ← بعد',race:'سباق',photo:'صورة',quote:'اقتباس',stat:'رقم',duo:'كارتين',trio:'٣ كروت',whatif:'ماذا لو',shocks:'الصدمات',voices:'شهادات',targets:'مستهدفات',citizen:'للمواطن',close:'القفلة',end:'النهاية',kq:'سؤال وإجابة',map:'الخريطة'};
const title=s=>SV.title(s);
function mini(frame,i,thumb){frame.querySelectorAll('.mini').forEach(n=>n.remove());if(i==null)return;
  const w=document.createElement('div');w.className='mini';const el=SV.render(D,i,{thumb:true});w.appendChild(el);frame.appendChild(w);
  const k=frame.clientWidth/1920;w.style.transform=`scale(${k})`;if(!thumb&&i===cur){SV.step(el,step,true)}}
const nextOf=i=>nb(i,1);
function draw(){
  const S=D.scenes[cur];mini($('fNow'),cur);const n=nextOf(cur);mini($('fNext'),n!=null?n:null);
  $('nowNo').textContent=(live().indexOf(cur)+1)+' / '+live().length;$('nextNo').textContent=n!=null?('مشهد '+(live().indexOf(n)+1)):'آخر مشهد';
  $('dots').innerHTML=Array.from({length:S.steps||1},(_,k)=>`<i class="${k<=step?'on':''}"></i>`).join('');
  $('iKind').textContent=KIND[S.type]||S.type;$('iT').textContent='مخطط: '+fmt(S.t||0);$('iTitle').textContent=title(S);
  $('iCue').innerHTML=(S.cue||[]).map(c=>`<li>${c}</li>`).join('');$('iSay').textContent=sayOf(S,step)||'—';$('iV6').textContent=S.v6&&S.v6.length?('التفاصيل في V6: سلايد '+S.v6.join('، ')):'';
  $('tPl').textContent=fmt(S.t||0);$('tBud').textContent=fmt(BUD);
  document.querySelectorAll('.r.cur').forEach(r=>r.classList.remove('cur'));const r=document.querySelector(`.r[data-i="${cur}"]`);if(r){r.classList.add('cur');r.scrollIntoView({block:'nearest'})}
}
function list(){
  const R=$('rows');R.innerHTML='';let sec='';const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);const tb=e.target.querySelector('.tb');const w=document.createElement('div');w.className='mini';w.appendChild(SV.render(D,+e.target.dataset.i,{thumb:true}));tb.appendChild(w)}}),{root:R,rootMargin:'300px'});
  seq().forEach(i=>{const S=D.scenes[i];
    const s=S.type==='act'?S.q:(S.ch?D.chapters[S.ch-1]:'');if(S.type==='act'||(S.type==='chapter')){const h=document.createElement('div');h.className='sec';h.textContent=S.type==='act'?S.q:('· '+S.name);R.appendChild(h)}
    const r=document.createElement('div');r.className='r'+(off[S.id]?' off':'');r.dataset.i=i;r.draggable=true;
    r.innerHTML=`<div class="gp" title="اسحب لتغيير المكان">⠿</div><div class="n">${off[S.id]?'–':live().indexOf(i)+1}</div><div class="tb"></div><div class="tt"><div class="ti">${title(S)}</div><small>V7 · ${S.v7}${S.hidden?' · مخفي في V7':''} · ${KIND[S.type]||''} · ${fmt(S.t||0)}</small><div class="ra"><button class="sw${off[S.id]?' on':''}">${off[S.id]?'إظهار':'إخفاء'}</button><button class="mv" data-d="-1" title="لفوق">▲</button><button class="mv" data-d="1" title="لتحت">▼</button></div></div>`;
    R.appendChild(r);io.observe(r)});
  const tot=D.scenes.reduce((a,s)=>a+(off[s.id]?0:s.t||0),0);$('lCount').textContent=live().length+' مشهد · '+fmt(tot);$('bOrd').style.display=ord?'':'none';
}
$('rows').addEventListener('click',e=>{const r=e.target.closest('.r');if(!r)return;const i=+r.dataset.i,S=D.scenes[i];
  if(e.target.closest('.mv')){const S2=seq(),p=S2.indexOf(i),q=p+(+e.target.closest('.mv').dataset.d);if(q<0||q>=S2.length)return;moveScene(i,S2[q],+e.target.closest('.mv').dataset.d>0);return}
  if(e.target.closest('.sw')){off[S.id]=!off[S.id];if(!off[S.id]&&!S.hidden)delete off[S.id];try{localStorage.setItem('sv7-off',JSON.stringify(off))}catch(_){}send({type:'off',off});list();draw();return}
  if(off[S.id])return;go(i,0)});
/* drag a row to its new place (or ▲▼); the order is saved here and sent to the show and the speaker's screen */
let dragI=null;const RW=$('rows');
const clr=()=>document.querySelectorAll('.r.dropA,.r.dropB').forEach(x=>x.classList.remove('dropA','dropB'));
RW.addEventListener('dragstart',e=>{const r=e.target.closest('.r');if(!r)return;dragI=+r.dataset.i;r.classList.add('drag');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',String(dragI))}catch(_){}});
RW.addEventListener('dragover',e=>{const r=e.target.closest('.r');if(!r||dragI==null)return;e.preventDefault();const b=r.getBoundingClientRect(),after=e.clientY>b.top+b.height/2;clr();r.classList.add(after?'dropB':'dropA');
  const L=RW.getBoundingClientRect();if(e.clientY<L.top+50)RW.scrollTop-=18;else if(e.clientY>L.bottom-50)RW.scrollTop+=18});
RW.addEventListener('drop',e=>{const r=e.target.closest('.r');if(!r||dragI==null)return;e.preventDefault();const t=+r.dataset.i,after=r.classList.contains('dropB');clr();moveScene(dragI,t,after)});
RW.addEventListener('dragend',()=>{dragI=null;clr();document.querySelectorAll('.r.drag').forEach(x=>x.classList.remove('drag'))});
function moveScene(a,t,after){if(a===t)return;const S2=seq().filter(i=>i!==a);let p=S2.indexOf(t);if(after)p++;S2.splice(p,0,a);ord=S2.map(i=>D.scenes[i].id);saveOrd()}
function saveOrd(){try{ord?localStorage.setItem('sv7-ord',JSON.stringify(ord)):localStorage.removeItem('sv7-ord')}catch(_){}send({type:'ord',ord});const st=RW.scrollTop;list();RW.scrollTop=st;draw()}
const fmt=s=>{s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function setCur(i,k,at){cur=i;step=k||0;if(at)slideAt=at;draw()}
function go(i,k){send({type:'go',i,step:k||0});if(Date.now()-showSeen>4000){slideAt=Date.now();setCur(i,k)}}
function next(){send({type:'next'});if(Date.now()-showSeen>4000){const S=D.scenes[cur];if(step<(S.steps||1)-1)setCur(cur,step+1);else{const j=nextOf(cur);if(j!=null){slideAt=Date.now();setCur(j,0)}}}}
function prev(){send({type:'prev'});if(Date.now()-showSeen>4000){if(step>0)setCur(cur,step-1);else{const j=nb(cur,-1);if(j!=null){slideAt=Date.now();setCur(j,(D.scenes[j].steps||1)-1)}}}}
$('bNext').onclick=next;$('bPrev').onclick=prev;$('fNext').onclick=()=>{const j=nextOf(cur);if(j!=null)go(j,0)};
$('bOrd').onclick=()=>{ord=null;saveOrd()};
$('bFirst').onclick=()=>go(live()[0],0);$('bReplay').onclick=()=>go(cur,0);
$('bBlack').onclick=()=>{black=!black;send({type:'black',on:black});document.body.classList.toggle('black',black)};
addEventListener('keydown',e=>{if(e.target.matches('input,textarea'))return;const k=e.key;
  if(['ArrowLeft','PageDown',' ','Enter','ArrowDown'].includes(k)){e.preventDefault();next()}else if(['ArrowRight','PageUp','Backspace','ArrowUp'].includes(k)){e.preventDefault();prev()}else if(k==='b'||k==='B')$('bBlack').click()});
let showBuild='';if(bc)bc.onmessage=ev=>{const d=ev.data||{};if(d.type==='state'&&(d.deck==='sv7'||d.deck==='sv1')){showSeen=Date.now();showBuild=d.build||'old';if(d.i!==cur||d.step!==step||d.slideAt!==slideAt)setCur(d.i,d.step,d.slideAt);showPill()}};
/* 23 Oct 00:22 Amr: the film on screen — play/pause, restart, where it is and how long it runs (the show reports, the control drives) */
let med={has:false},medAt=0;
if(bc)bc.addEventListener('message',ev=>{const d=ev.data||{};if(d.type!=='media')return;med=d;medAt=Date.now();medUpd()});
const mfmt=s=>{s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function medUpd(){const on=med.has&&Date.now()-medAt<1500;$('med').classList.toggle('on',on);if(!on)return;
  $('mT').textContent=mfmt(med.t)+' / '+(med.dur?mfmt(med.dur):'–:––');$('mLen').textContent=med.dur?('مدته '+mfmt(med.dur)):'';
  $('mPg').style.width=(med.dur?Math.min(100,med.t/med.dur*100):0).toFixed(1)+'%';{const t=med.paused?'▶':'❚❚';if($('mPP').textContent!==t)$('mPP').textContent=t}
  $('mCC').classList.toggle('on',!!med.cc);$('mCC').style.display=med.caps?'':'none';$('mTr').classList.toggle('noseek',!med.seek)}
setInterval(medUpd,700);
$('mPP').onclick=()=>send({type:'mcmd',c:'toggle'});$('mB5').onclick=()=>send({type:'mcmd',c:'skip',d:-5});$('mF5').onclick=()=>send({type:'mcmd',c:'skip',d:5});$('mRS').onclick=()=>send({type:'mcmd',c:'restart'});$('mCC').onclick=()=>send({type:'mcmd',c:'cc',on:!med.cc});
$('mTr').onclick=e=>{if(!med.seek||!med.dur)return;const r=e.currentTarget.getBoundingClientRect();send({type:'mcmd',c:'seek',t:(e.clientX-r.left)/r.width*med.dur})};
addEventListener('keydown',e=>{if(e.target.matches('input,textarea'))return;const k=e.code;if(k==='KeyP'||k==='KeyK')$('mPP').click();else if(k==='KeyR')$('mRS').click();else if(k==='KeyJ')$('mB5').click();else if(k==='KeyL')$('mF5').click();else if(k==='KeyC')$('mCC').click()});
/* 06:16 «انت ليه الابديت مش لايف»: a show window still on an older page is named here, with the one press that renews it */
function showPill(){const on=Date.now()-showSeen<5000,stale=on&&showBuild&&showBuild!==((document.querySelector('meta[name=sv7-build]')||{}).content||'');const p=$('pShow');p.className='pill'+(on?(stale?' warn':' ok'):'');p.querySelector('span').textContent=on?(stale?'العرض نسخة قديمة · دوس «افتح العرض»':'العرض شغال'):'العرض مش مفتوح';$('bShow').classList.toggle('pulse',!!stale)}
setInterval(()=>{send({type:'ping'});showPill()},2000);
/* 06:00 Amr «فين الكابشن … انا مش شايفه»: a show window opened before an update kept its old page (re-opening only changed its #);
   the show is opened with the build in its address, and every open window that is older than this control reloads itself */
const BUILD=(document.querySelector('meta[name=sv7-build]')||{}).content||'';
$('bShow').onclick=()=>window.open('sv7.html?b='+BUILD+'#'+(live().indexOf(cur)+1),'sv7show','popup=yes,width=1280,height=720');
setInterval(()=>send({type:'build',b:BUILD}),2000);send({type:'build',b:BUILD});
$('bPres').onclick=()=>window.open('sv7-presenter.html','sv7pres','popup=yes,width=1280,height=800');
/* session timer (shared with the presenter screen) */
const TK='sv7-timer';const T=()=>{try{return JSON.parse(localStorage.getItem(TK))||{run:0,start:0,acc:0}}catch(e){return{run:0,start:0,acc:0}}};
const el=t=>t.acc+(t.run?Date.now()-t.start:0);
$('tGo').onclick=()=>{const t=T();if(t.run){t.acc=el(t);t.run=0}else{t.run=1;t.start=Date.now()}localStorage.setItem(TK,JSON.stringify(t));tick()};
$('tReset').onclick=()=>{localStorage.setItem(TK,JSON.stringify({run:0,start:0,acc:0}));tick()};
function tick(){const t=T(),a=el(t)/1000;$('tAll').textContent=fmt(a);$('tAllB').style.width=Math.min(100,a/BUD*100)+'%';$('tAllB').style.background=a>BUD?'var(--bad)':a>BUD*.9?'var(--warn)':'var(--ok)';
  $('tGo').textContent=t.run?'⏸ إيقاف التايمر':'▶︎ تايمر الجلسة';
  const s=(Date.now()-slideAt)/1000,pl=D.scenes[cur].t||30;$('tSc').textContent=fmt(s);$('tScB').style.width=Math.min(100,s/pl*100)+'%';$('tScB').style.background=s>pl?'var(--bad)':s>pl*.8?'var(--warn)':'var(--ok)';
  const d=new Date();$('clock').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
setInterval(tick,500);
/* sound pill: the relay player lives here too (C6.sndRelay, shared with V6) */
if(window.C6&&C6.sndRelay)C6.sndRelay((n,ok)=>{const p=$('pSnd'),t=p.querySelector('span');if(n&&ok===false){p.className='pill warn';t.textContent='الصوت ممنوع — افتح من «تشغيل الجلسة الختامية بالصوت»'}else{p.className='pill ok';t.textContent=n?'الصوت شغال ✓':'الصوت أوتوماتيك'}});
addEventListener('resize',draw);
document.fonts.ready.then(()=>{list();draw();tick();send({type:'ping'})});
})();
</script>

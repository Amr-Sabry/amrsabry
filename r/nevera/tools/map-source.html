<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Nevera 3D Masterplan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Marcellus&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --cream:#f4efe6; --sand:#e7e0d3; --tan:#d7c2a4; --camel:#c8a883; --copper:#a97654; --umber:#5d4b35; --ink:#2b2117;
  --glass:rgba(32,24,17,.88); --glass-hi:rgba(44,33,23,.95); --line:rgba(231,224,211,.16); --mute:rgba(231,224,211,.62);
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#1b140e;color:var(--sand);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#stage{position:fixed;inset:0}
#stage canvas{display:block}
#labels{position:fixed;inset:0;pointer-events:none;direction:ltr}
#labels .lbl{left:0;top:0;direction:rtl}
.lbl{pointer-events:auto;cursor:pointer;padding:3px 9px 4px;border-radius:999px;background:rgba(27,20,14,.86);border:1px solid rgba(231,224,211,.22);
  white-space:nowrap;font-size:12.5px;font-weight:500;line-height:1.25;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.28);transition:opacity .25s,background .2s,border-color .2s;}
.lbl small{display:block;font-family:Marcellus,serif;font-size:9.5px;letter-spacing:.08em;color:var(--mute);text-transform:uppercase}
.lbl i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-inline-end:6px;vertical-align:1px}
.lbl.off{opacity:0;pointer-events:none}
.lbl.sel{background:var(--cream);color:var(--ink);border-color:var(--cream)}
.lbl.sel small{color:var(--umber)}
.lbl.big{font-size:14px;padding:5px 12px 6px}
.lbl.x{background:rgba(43,33,23,.9);border-color:rgba(255,210,122,.75);color:#ffe2a8}
.lbl.x small{color:rgba(255,226,168,.7)}

/* top bar */
#top{position:fixed;top:0;inset-inline:0;display:flex;align-items:center;gap:14px;padding:14px 18px;pointer-events:none;
  background:linear-gradient(to bottom,rgba(20,15,10,.82),rgba(20,15,10,0));z-index:5}
#top>*{pointer-events:auto}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-family:Marcellus,serif;font-weight:400;font-size:26px;letter-spacing:.02em;color:var(--cream)}
.brand span{font-size:13px;color:var(--mute)}
#upd{margin-inline-start:auto;font-size:12px;color:var(--mute);display:flex;align-items:center;gap:7px;white-space:nowrap}
#upd i{width:7px;height:7px;border-radius:50%;background:#7fc28a;box-shadow:0 0 0 0 rgba(127,194,138,.6);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(127,194,138,.55)}70%{box-shadow:0 0 0 8px rgba(127,194,138,0)}100%{box-shadow:0 0 0 0 rgba(127,194,138,0)}}

/* tools */
#tools{position:fixed;top:72px;inset-inline-end:18px;display:flex;flex-direction:column;gap:8px;z-index:5}
.tb{width:42px;height:42px;border-radius:12px;background:var(--glass);border:1px solid var(--line);display:grid;place-items:center;transition:background .2s,border-color .2s}
.tb:hover{background:var(--glass-hi);border-color:rgba(231,224,211,.32)}
.tb.on{background:var(--cream);color:var(--ink);border-color:var(--cream)}
.tb svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tb[data-tip]{position:relative}
.tb[data-tip]:hover::after{content:attr(data-tip);position:absolute;inset-inline-end:52px;top:50%;transform:translateY(-50%);white-space:nowrap;font-size:12px;padding:4px 9px;border-radius:8px;background:var(--glass-hi);border:1px solid var(--line);color:var(--sand)}

/* compass */
#north{position:fixed;top:432px;inset-inline-end:17px;width:44px;height:44px;border-radius:50%;background:var(--glass);border:1px solid var(--line);display:grid;place-items:center;z-index:5;}
#north svg{width:30px;height:30px;transition:transform .1s linear}

/* legend */
#legend{position:fixed;bottom:0;inset-inline:0;padding:14px 18px calc(14px + env(safe-area-inset-bottom));display:flex;gap:8px;overflow-x:auto;z-index:5;
  background:linear-gradient(to top,rgba(20,15,10,.86),rgba(20,15,10,0));scrollbar-width:none}
#legend::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;background:var(--glass);border:1px solid var(--line);font-size:12.5px;white-space:nowrap;transition:opacity .2s,border-color .2s}
.chip i{width:10px;height:10px;border-radius:3px}
.chip.off{opacity:.38}
.chip:hover{border-color:rgba(231,224,211,.35)}

/* side panel */
#panel{position:fixed;top:72px;bottom:80px;inset-inline-start:18px;width:360px;max-width:calc(100vw - 36px);display:flex;flex-direction:column;border-radius:18px;
  background:rgba(244,239,230,.94);color:var(--ink);box-shadow:0 18px 50px rgba(0,0,0,.35);z-index:6;overflow:hidden;
  transform:translateX(calc(100% + 40px));transition:transform .45s cubic-bezier(.2,.8,.2,1)}
#panel.open{transform:none!important}
#panel header{padding:18px 20px 10px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(93,75,53,.14)}
#panel header h2{font-size:15px;font-weight:600}
#panel header .x{margin-inline-start:auto;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--umber)}
#panel header .x:hover{background:rgba(93,75,53,.1)}
#panel header .x svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none}
#pbody{overflow-y:auto;padding:16px 20px 22px;flex:1}
.cat{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:500;padding:4px 10px;border-radius:999px;background:rgba(93,75,53,.08);color:var(--umber)}
.cat i{width:9px;height:9px;border-radius:3px}
.zn{margin:12px 0 2px;font-size:24px;font-weight:700;line-height:1.3}
.ze{font-family:Marcellus,serif;font-size:13px;letter-spacing:.06em;color:var(--copper);text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}
.st{background:#fff;border-radius:12px;padding:10px 10px 9px;border:1px solid rgba(93,75,53,.1)}
.st b{display:block;font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;direction:ltr;text-align:right}
.st span{font-size:11px;color:#7a6650}
.sec{margin-top:16px}
.sec h3{font-size:11.5px;font-weight:600;letter-spacing:.04em;color:var(--copper);margin-bottom:6px}
.sec p{font-size:14px;line-height:1.75;color:#3a2e22}
.film{background:var(--ink);color:var(--sand);border-radius:12px;padding:12px 14px}
.film h3{color:var(--camel)}
.film p{color:var(--sand)}
.go{display:inline-block;margin-top:4px;padding:10px 14px;border-radius:10px;background:var(--ink);color:var(--cream);text-decoration:none;font-weight:600;font-size:14px}
.go:hover{background:#3d2f21}
.src{margin-top:18px;font-size:11px;color:#8b7860;line-height:1.6}
/* index list */
.idx h4{font-size:11.5px;font-weight:600;color:var(--copper);margin:16px 0 6px;display:flex;align-items:center;gap:7px}
.idx h4 i{width:9px;height:9px;border-radius:3px}
.idx button{display:flex;width:100%;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;text-align:start;font-size:14px}
.idx button:hover{background:rgba(93,75,53,.08)}
.idx button em{margin-inline-start:auto;font-style:normal;font-size:12px;color:#8b7860;font-variant-numeric:tabular-nums;direction:ltr}
.search{width:100%;padding:10px 12px;border-radius:10px;border:1px solid rgba(93,75,53,.2);background:#fff;font:inherit;font-size:14px;color:var(--ink);outline:none}
.search:focus{border-color:var(--copper)}
.totals{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}

/* loader / gate */
#veil{position:fixed;inset:0;display:grid;place-items:center;background:#1b140e;z-index:20;transition:opacity .6s}
#veil.gone{opacity:0;pointer-events:none}
#veil .in{text-align:center;padding:24px;max-width:360px}
#veil b{font-family:Marcellus,serif;font-weight:400;font-size:44px;color:var(--cream);display:block}
#veil p{font-size:14px;color:var(--mute);margin-top:8px}
#veil .bar{width:180px;height:2px;margin:18px auto 0;background:rgba(231,224,211,.14);overflow:hidden;border-radius:2px}
#veil .bar i{display:block;height:100%;width:40%;background:var(--camel);animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-120%)}100%{transform:translateX(280%)}}
#gate{display:none;margin-top:18px}
#gate input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(231,224,211,.25);background:rgba(255,255,255,.06);color:var(--cream);font:inherit;font-size:15px;text-align:center;letter-spacing:.12em;outline:none}
#gate button{margin-top:10px;width:100%;padding:11px;border-radius:12px;background:var(--cream);color:var(--ink);font-weight:600}
#gate .err{color:#e59a83;font-size:13px;margin-top:8px;min-height:18px}
#hint{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);font-size:12.5px;color:var(--mute);background:var(--glass);padding:7px 14px;border-radius:999px;border:1px solid var(--line);z-index:4;transition:opacity .6s;white-space:nowrap}
#hint.gone{opacity:0}
@media (max-width:640px){
  .brand span{display:none}
  #upd span{display:none}
  #panel{top:auto;bottom:0;inset-inline:0;width:auto;max-width:none;height:62vh;border-radius:18px 18px 0 0;transform:translateY(105%)!important}
  #panel.open{transform:none!important}
  #tools{top:64px;inset-inline-end:12px}
  .tb{width:38px;height:38px}
  #north{top:390px;inset-inline-end:9px}
  #hint{bottom:74px}
}
@media (prefers-reduced-motion:reduce){#upd i{animation:none}#panel{transition:none}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="labels"></div>

<div id="top">
  <div class="brand"><b>nevera</b><span>المخطط التفاعلي · 3D Masterplan</span></div>
  <div id="upd"><i></i><span>آخر تحديث</span> <time id="updt">—</time></div>
</div>

<div id="tools">
  <button class="tb" id="bIndex" data-tip="كل المناطق"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
  <button class="tb" id="bWide" data-tip="المشروع والأهرامات"><svg viewBox="0 0 24 24"><path d="M2 20h20M5 20l5-9 4 6M11 20l6-11 5 11"/></svg></button>
  <button class="tb" id="bReset" data-tip="الرجوع للمنظر العام"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
  <button class="tb" id="bTop" data-tip="منظر من فوق (2D)"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 12h16M12 4v16"/></svg></button>
  <button class="tb on" id="bLabels" data-tip="الأسماء"><svg viewBox="0 0 24 24"><path d="M4 7V5h16v2M12 5v14M9 19h6"/></svg></button>
  <button class="tb" id="bAnim" data-tip="القطورات (أنيميشن)"><svg viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="14" rx="4"/><path d="M6 11h12M9 21l-2 0M15 21h2M9 17l-2 4M15 17l2 4"/><circle cx="9" cy="14" r=".6"/><circle cx="15" cy="14" r=".6"/></svg></button>
  <button class="tb" id="bSpin" data-tip="لفّ تلقائي"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg></button>
</div>

<div id="north" title="الشمال"><svg viewBox="0 0 30 30"><path d="M15 3l5 12h-10z" fill="#e7e0d3"/><path d="M15 27l-5-12h10z" fill="rgba(231,224,211,.3)"/><text x="15" y="12.5" font-size="6" text-anchor="middle" fill="#2b2117" font-family="Marcellus">N</text></svg></div>

<aside id="panel" aria-live="polite">
  <header><h2 id="ptitle">المنطقة</h2><button class="x" id="pclose" aria-label="إغلاق"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></header>
  <div id="pbody"></div>
</aside>

<div id="legend"></div>
<div id="hint">اسحب للّف · قرّب بالعجلة أو بصباعين · دوس على أي منطقة</div>

<div id="veil"><div class="in">
  <b>nevera</b>
  <p id="vmsg">بنجهّز المخطط…</p>
  <div class="bar" id="vbar"><i></i></div>
  <form id="gate" autocomplete="off">
    <input id="gkey" placeholder="مفتاح الدخول" inputmode="text" autocapitalize="characters" spellcheck="false">
    <button type="submit">افتح المخطط</button>
    <div class="err" id="gerr"></div>
  </form>
</div></div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {CSS2DRenderer, CSS2DObject} from 'three/addons/renderers/CSS2DRenderer.js';
import {mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';

const DATA_URL = (new URLSearchParams(location.search).get('data')) || './zones.json';
const BASE = DATA_URL.replace(/[^/]*$/, '');
const S = 0.1;               // 1 scene unit = 10 m
const $ = s => document.querySelector(s);
const fmt = n => Math.round(n).toLocaleString('en-US');
const FEDDAN = 4200.83;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- data ---------- */
async function getData(){
  const r = await fetch(DATA_URL + (DATA_URL.includes('?')?'&':'?') + 't=' + Date.now(), {cache:'no-store'});
  if(!r.ok) throw new Error('data ' + r.status);
  return r.json();
}

/* ---------- renderer: draws only when something changes ---------- */
const stage = $('#stage');
const mobile = matchMedia('(max-width:640px)').matches;
const renderer = new THREE.WebGLRenderer({antialias:!mobile, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, mobile ? 1.5 : 1.25));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = !mobile; renderer.shadowMap.type = THREE.PCFShadowMap; renderer.shadowMap.autoUpdate = false;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
stage.appendChild(renderer.domElement);
const lr = new CSS2DRenderer({element: $('#labels')}); lr.setSize(innerWidth, innerHeight);
let need = 2; const redraw = () => { need = 2; };

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 1, 20000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = .08; controls.maxPolarAngle = Math.PI*0.47; controls.minDistance = 25; controls.maxDistance = 6000;
controls.screenSpacePanning = false; controls.zoomToCursor = true;
controls.addEventListener('change', redraw);

{ const c = document.createElement('canvas'); c.width = 2; c.height = 256; const g = c.getContext('2d');
  const gr = g.createLinearGradient(0,0,0,256); gr.addColorStop(0,'#18120d'); gr.addColorStop(.55,'#3a2a1d'); gr.addColorStop(.8,'#8a5d3b'); gr.addColorStop(1,'#c99366');
  g.fillStyle = gr; g.fillRect(0,0,2,256); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; scene.background = t; }
scene.fog = new THREE.Fog(0x6e4c33, 2600, 9000);
scene.add(new THREE.HemisphereLight(0xffe8cc, 0x4a3524, 1.2));
const sun = new THREE.DirectionalLight(0xffd2a0, 2.2); sun.castShadow = !mobile; sun.shadow.mapSize.set(2048,2048); sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.8;
scene.add(sun, sun.target);
const world = new THREE.Group(); world.rotation.x = -Math.PI/2; scene.add(world);   // shape space: x east, y north, z up
const ground = new THREE.Mesh(new THREE.CircleGeometry(9000, 64), new THREE.MeshStandardMaterial({color:0xb39470, roughness:1}));
ground.receiveShadow = true; ground.position.z = -0.2; world.add(ground);
const VEX = 2;                       // vertical exaggeration used for terrain, buildings and landmarks

/* ---------- build ---------- */
let DATA, CATS = {}, zoneObjs = [], labelObjs = [], hidden = new Set(), selected = null, totalArea = 0;
const catMesh = {}, catRanges = {};
let phaseGroup = null, extrasGroup = null, railBed = null, railTop = null;
const HOME = {target:new THREE.Vector3(), pos:new THREE.Vector3(), radius:1000};
const WIDE = {target:new THREE.Vector3(), pos:new THREE.Vector3()};
let pyrGroup = null;

const toV = p => new THREE.Vector2(p[0]*S, p[1]*S);
function shapes(polys){ return polys.map(poly => { const sh = new THREE.Shape(poly[0].map(toV)); for(let i=1;i<poly.length;i++) sh.holes.push(new THREE.Path(poly[i].map(toV))); return sh; }); }
function centroidOf(polys){ let A=0,cx=0,cy=0;
  for(const r of polys){ const o=r[0]; for(let i=0,j=o.length-1;i<o.length;j=i++){ const f=o[j][0]*o[i][1]-o[i][0]*o[j][1]; A+=f; cx+=(o[j][0]+o[i][0])*f; cy+=(o[j][1]+o[i][1])*f; } }
  return A ? [cx/(3*A), cy/(3*A)] : polys[0][0][0]; }
function bounds(polys, h){ const b = new THREE.Box3(); for(const pl of polys) for(const p of pl[0]) b.expandByPoint(new THREE.Vector3(p[0]*S, h, -p[1]*S)); b.min.y = 0; return b; }
function ribbon(pts, w, z){   // flat strip along a polyline, w = half width in scene units
  const pos = [], idx = [];
  for(let i=0;i<pts.length;i++){
    const a = pts[Math.max(0,i-1)], c = pts[Math.min(pts.length-1,i+1)];
    let dx = c[0]-a[0], dy = c[1]-a[1]; const L = Math.hypot(dx,dy) || 1; dx/=L; dy/=L;
    const x = pts[i][0]*S, y = pts[i][1]*S; pos.push(x - dy*w, y + dx*w, z, x + dy*w, y - dx*w, z);
    if(i){ const k = (i-1)*2; idx.push(k, k+1, k+2, k+1, k+3, k+2); }
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3)); g.setIndex(idx); g.computeVertexNormals(); return g;
}
function addLabel(o, text, sub, pos, cls, onClick){
  const el = document.createElement('div'); el.className = 'lbl' + (cls ? ' ' + cls : '');
  el.innerHTML = text; el.addEventListener('click', e => { e.stopPropagation(); onClick(); });
  const lo = new CSS2DObject(el); lo.position.set(pos[0], pos[1], pos[2]); world.add(lo); return {el, lo};
}

const PLATE = 0.25;                  // ground plate under the buildings, scene units
function plateH(k, z){ const c = CATS[k] || {}; if(c.overlay || k === 'pz') return z.h ?? 0.3; return k === 'gl' ? 0.1 : k === 'pk' ? 0.28 : k === 'gf' ? 0.26 : PLATE; }
function build(){
  CATS = DATA.cats;
  // zones: one merged mesh per land use, with a face range per parcel for picking
  const byCat = {};
  for(const z of DATA.zones){ (byCat[z.cat] ||= []).push(z); }
  const edgeGeos = [];
  for(const [k, list] of Object.entries(byCat)){
    const cat = CATS[k] || {color:'#999'}; const geos = [], ranges = []; let tri = 0;
    for(const z of list){
      // parcels are thin ground plates in the land-use colour; the buildings on them come from blocks.js
      const h = plateH(k, z), top = Math.max(h, (z.h >= 1.4 ? Math.round(z.h / 1.4) : 0) * 4 * VEX * S + PLATE);
      const g = new THREE.ExtrudeGeometry(shapes(z.polys), {depth:h, bevelEnabled:false, curveSegments:2});
      const n = g.attributes.position.count / 3;
      const lp = z.label || centroidOf(z.polys);
      const obj = {z, h:top, area:z.area||0, lp:[lp[0]*S, lp[1]*S], box:bounds(z.polys, top)};
      ranges.push([tri, tri+n, obj]); tri += n; geos.push(g);
      if(!cat.overlay){ edgeGeos.push(new THREE.EdgesGeometry(g, 35)); totalArea += obj.area; }
      zoneObjs.push(obj);
    }
    const merged = mergeGeometries(geos.map(g => { g.deleteAttribute('uv'); return g; }), false); geos.forEach(g => g.dispose());
    // built parcels get a muted version of their colour so the buildings read on top; parks, lakes and golf keep theirs
    const pc = new THREE.Color(cat.color); if(!cat.overlay && !['pk','gl','gf','pz'].includes(k)) pc.lerp(new THREE.Color('#8a857d'), 0.8);   // like the slide: grey streets between white blocks, a hint of the land-use colour
    const mat = new THREE.MeshStandardMaterial({color:pc, roughness:.85, transparent:!!cat.overlay, opacity:cat.overlay?0.3:1, depthWrite:!cat.overlay});
    const mesh = new THREE.Mesh(merged, mat); mesh.castShadow = !cat.overlay; mesh.receiveShadow = true; mesh.userData.cat = k;
    world.add(mesh); catMesh[k] = mesh; catRanges[k] = ranges;

  if(X.rail && X.rail.p){

    const dense = []; for(let i=1;i<p.length;i++){ const a = p[i-1], b = p[i], n = Math.max(1, Math.ceil(Math.hypot(b[0]-a[0], b[1]-a[1]) / 60)); for(let k=0;k<n;k++) dense.push([a[0]+(b[0]-a[0])*k/n, a[1]+(b[1]-a[1])*k/n]); } dense.push(p[p.length-1]);

      g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));

/* ---------- terrain: SRTM relief + Sentinel-2 image around the site ---------- */
let TER = null;
function terrainZ(x, y){                        // x, y in metres (local grid); returns scene units
  if(!TER) return 0; const T = TER.meta;
  const fx = (x - T.X0) / T.step, fy = (T.Y1 - y) / T.step;
  if(fx < 0 || fy < 0 || fx > T.nx - 1 || fy > T.ny - 1) return 0;
  const i = Math.floor(fx), j = Math.floor(fy), u = fx - i, w = fy - j, i1 = Math.min(i+1, T.nx-1), j1 = Math.min(j+1, T.ny-1), d = TER.dm;
  const h = (d[j*T.nx+i]*(1-u) + d[j*T.nx+i1]*u)*(1-w) + (d[j1*T.nx+i]*(1-u) + d[j1*T.nx+i1]*u)*w;
  return h / 10 * VEX * S;
}
async function addTerrain(){
  const T = (DATA.extras||{}).terrain; if(!T) return;
  // terrain.bin on the hub; hosts that don't serve binary files get the same bytes as base64 text (terrain.b64.txt)
  let buf; try { const r = await fetch(BASE + T.file); if(!r.ok) throw 0; buf = await r.arrayBuffer(); }
  catch(e){ const t = await (await fetch(BASE + T.file.replace(/\.bin$/, '.b64.txt'))).text(); const b = atob(t.trim()); const u = new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i] = b.charCodeAt(i); buf = u.buffer; }
  TER = {meta:T, dm:new Int16Array(buf)};
  const Wd = (T.X1 - T.X0) * S, Ht = (T.Y1 - T.Y0) * S;
  const step = mobile ? 2 : 1, nx = Math.floor((T.nx - 1) / step), ny = Math.floor((T.ny - 1) / step);
  const g = new THREE.PlaneGeometry(Wd, Ht, nx, ny), pos = g.attributes.position;
  for(let j=0;j<=ny;j++) for(let i=0;i<=nx;i++){ const k = j*(nx+1)+i; pos.setZ(k, TER.dm[(j*step)*T.nx + i*step] / 10 * VEX * S - 0.05); }
  g.computeVertexNormals();
  const tex = new THREE.TextureLoader().load(BASE + T.img, () => { renderer.shadowMap.needsUpdate = true; redraw(); });
  tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({map:tex, roughness:1}));
  m.position.set((T.X0 + T.X1) / 2 * S, (T.Y0 + T.Y1) / 2 * S, 0); m.receiveShadow = true; world.add(m);
  ground.position.z = (20 - T.E0) * VEX * S - 1;                                   // the plain beyond the image sits at Nile level
  ground.material.color.set(0xc8ab7f);
  // the rail bed follows the ground outside the site
  if(railBed){ const P = railBed.geometry.attributes.position; for(let k=0;k<P.count;k++){ const x = P.getX(k)/S, y = P.getY(k)/S; P.setZ(k, Math.max(0.35, terrainZ(x, y) + 0.35)); } P.needsUpdate = true;
    const R = railTop.geometry.attributes.position; for(let k=0;k<R.count;k++){ const x = R.getX(k)/S, y = R.getY(k)/S; R.setZ(k, Math.max(0.45, terrainZ(x, y) + 0.45)); } R.needsUpdate = true; }
  renderer.shadowMap.needsUpdate = true; redraw();
}

/* ---------- trains: two Velaro sets on Line 1, stopping at the station, looping ---------- */
let trainLayer = null, TRAINS = [], animOn = !matchMedia('(prefers-reduced-motion: reduce)').matches;
const clock = new THREE.Clock();
async function addTrains(stopXY){
  const X = DATA.extras || {}, rail = X.rail && X.rail.p; if(!rail) return;
  const M = await import(BASE + 'train.js');
  trainLayer = new THREE.Group(); trainLayer.rotation.x = Math.PI/2; extrasGroup.add(trainLayer);   // local Y up, local Z = -north
  for(const [dir, off, phase] of [[1, -3, 0], [-1, 3, 31]]){
    const pts = (dir > 0 ? rail : rail.slice().reverse());
    const o = pts.map((q,i) => { const a = pts[Math.max(0,i-1)], c = pts[Math.min(pts.length-1,i+1)]; let dx=c[0]-a[0], dy=c[1]-a[1]; const L=Math.hypot(dx,dy)||1; return [q[0]-dy/L*off*dir, q[1]+dx/L*off*dir]; });
    const path = M.makePath(o);
    let best = 0, bd = 1e18; for(let sArc = 0; sArc < path.total; sArc += 10){ const q = path.at(sArc), d = Math.hypot(q.x - stopXY[0], q.y - stopXY[1]); if(d < bd){ bd = d; best = sArc; } }
    const t = M.buildTrain(THREE); t.cars.forEach(c => { c.scale.set(S, S*1.5, S); c.traverse(m => { if(m.isMesh){ m.castShadow = false; m.receiveShadow = true; } }); });
    trainLayer.add(t.group);
    const sch0 = M.schedule({total: path.total, stopAt: best + 100, length: t.length, vmax: 55, acc: 0.9, dwell: 16, dir: 1});
    // first train pulls in a few seconds after the page opens, the second is already standing at the platform
    const sch = M.schedule({total: path.total, stopAt: best + 100, length: t.length, vmax: 55, acc: 0.9, dwell: 16, dir: 1, phase: sch0.tStop + (dir > 0 ? -14 : 4)});
    TRAINS.push({t, path, s: sch, M});
  }
  moveTrains(0);
}
function moveTrains(tt){
  if(BLK) BLK.update(tt);
  if(STR) STR.update(tt);
  if(PLC) PLC.update(tt);
  for(const T of TRAINS) T.M.placeTrain(T.t, T.path, T.s(tt), (x, y) => [x*S, Math.max(0.45, terrainZ(x, y) + 0.45), -y*S], -1);
}

/* the October Gardens station model, placed on the rail line next to its plot */
async function addStation(){
  const X = DATA.extras || {}, d = X.station, rail = X.rail && X.rail.p; if(!d || !rail) return;
  const c = centroidOf([[d.poly]]); let best = null;
  for(let i=1;i<rail.length;i++){ const a = rail[i-1], b = rail[i], dx = b[0]-a[0], dy = b[1]-a[1], L2 = dx*dx+dy*dy || 1;
    const t = Math.max(0, Math.min(1, ((c[0]-a[0])*dx + (c[1]-a[1])*dy) / L2)), px = a[0]+t*dx, py = a[1]+t*dy, dd = Math.hypot(c[0]-px, c[1]-py);
    if(!best || dd < best.dd) best = {dd, px, py, ang: Math.atan2(dy, dx)}; }
  const {buildStation} = await import(BASE + 'station.js');
  const {group} = buildStation(THREE, {detail:true, ground:false});
  // the model is y-up in metres; the map's world group is z-up in tens of metres
  group.scale.set(S, S*2, S); group.rotation.x = Math.PI/2;
  const holder = new THREE.Group(); holder.add(group); holder.position.set(best.px*S, best.py*S, 0.2); holder.rotation.z = best.ang;
  group.traverse(m => { if(m.isMesh){ m.castShadow = true; m.receiveShadow = true; } });
  extrasGroup.add(holder);
  const o = {z:{id:'station', cat:'_x', ar:d.ar, en:d.en, desc:d.desc, film:d.film, extra:true, link: d.link ? BASE + d.link : ''}, h:7, area:0, lp:[best.px*S, best.py*S],
    box:new THREE.Box3(new THREE.Vector3(best.px*S-14, 0, -best.py*S-14), new THREE.Vector3(best.px*S+14, 7, -best.py*S+14)), mesh:group, grp:true, near:26};
  zoneObjs.push(o);
  labelObjs.push({...addLabel(o, `<i style="background:#ffd27a"></i>${esc(d.ar)}<small>${esc(d.en)}</small>`, '', [best.px*S, best.py*S, 9], 'x', () => select(o, true)), o, arr:[o], cat:'_x', pri: 9e9, w: 190});
  o.labelRef = labelObjs[labelObjs.length-1]; labelObjs.sort((a,b)=>b.pri-a.pri);
  addTrains([best.px, best.py]).catch(e => console.error(e));
  renderer.shadowMap.needsUpdate = true; lblDirty = true; redraw();
}

/* ---------- labels: priority + collision ---------- */
let showLabels = true, lblDirty = true;
const v = new THREE.Vector3();
function layoutLabels(){
  const placed = [], W = innerWidth, H = innerHeight;
  const dist = camera.position.distanceTo(controls.target);
  for(const L of labelObjs){
    const visible = showLabels && !hidden.has(L.cat);
    let ok = false;
    if(visible){
      L.lo.getWorldPosition(v); v.project(camera);
      if(v.z < 1 && Math.abs(v.x) < 1.1 && Math.abs(v.y) < 1.1){
        const x = (v.x+1)/2*W, y = (1-v.y)/2*H, r = {x0:x-L.w/2-4, x1:x+L.w/2+4, y0:y-40, y1:y+4};
        const isSel = selected && L.arr.includes(selected);
        ok = isSel || !placed.some(p => !(r.x1<p.x0||r.x0>p.x1||r.y1<p.y0||r.y0>p.y1));
        if(ok) placed.push(r);
      }
    }
    L.el.classList.toggle('off', !ok);
    L.el.classList.toggle('sel', !!(selected && L.arr.includes(selected)));
    L.lo.visible = visible;
  }
  const top = labelObjs[Math.min(5, labelObjs.length-1)].pri;
  for(const L of labelObjs) L.el.classList.toggle('big', dist < HOME.radius*0.45 && L.pri > top);
}

/* ---------- picking + highlight ---------- */
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let downAt = null, hover = null;
const hlMat = new THREE.MeshBasicMaterial({color:0xfff3dd, transparent:true, opacity:.38, depthWrite:false});
const hvMat = new THREE.MeshBasicMaterial({color:0xfff3dd, transparent:true, opacity:.18, depthWrite:false});
let hlMesh = null, hvMesh = null;
function overlay(o, mat){
  if(o.z.extra){ if(!o.mesh || o.grp || !o.mesh.geometry) return null; const m = new THREE.Mesh(o.mesh.geometry, mat); m.position.copy(o.mesh.position); m.rotation.copy(o.mesh.rotation); m.scale.set(1.02,1.02,1.06); world.add(m); return m; }
  const g = new THREE.ExtrudeGeometry(shapes(o.z.polys), {depth:o.h + 0.3, bevelEnabled:false, curveSegments:2});
  const m = new THREE.Mesh(g, mat); world.add(m); return m;
}
function clearOv(m){ if(m){ world.remove(m); if(!m.geometry.userData.shared) m.geometry !== undefined && m.material === hlMat || m.material === hvMat; } return null; }
renderer.domElement.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; stopSpin(); hideHint(); });
renderer.domElement.addEventListener('pointerup', e => {
  if(!downAt || Math.hypot(e.clientX-downAt[0], e.clientY-downAt[1]) > 6) return;
  const o = pick(e); if(o) select(o, false); else closePanel();
});
renderer.domElement.addEventListener('pointermove', e => {
  if(e.pointerType !== 'mouse' || e.buttons) return;
  const o = pick(e);
  if(o !== hover){ hover = o; if(hvMesh){ world.remove(hvMesh); if(!hvMesh.userData.keep) hvMesh.geometry.dispose(); hvMesh = null; }
    if(o && o !== selected && !o.z.extra){ hvMesh = overlay(o, hvMat); }
    renderer.domElement.style.cursor = o ? 'pointer' : ''; redraw(); }
});
function pick(e){
  ptr.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1); ray.setFromCamera(ptr, camera);
  const meshes = Object.entries(catMesh).filter(([k,m]) => m.visible && !(CATS[k]||{}).overlay).map(([,m]) => m);
  const hit = ray.intersectObjects(meshes, false)[0];
  if(hit){ const ranges = catRanges[hit.object.userData.cat]; let lo = 0, hi = ranges.length-1;
    while(lo <= hi){ const mid = (lo+hi)>>1, r = ranges[mid]; if(hit.faceIndex < r[0]) hi = mid-1; else if(hit.faceIndex >= r[1]) lo = mid+1; else return r[2]; } }
  const ex = zoneObjs.filter(o => o.mesh && o.z.extra && (o.z.cat !== '_p' || pyrGroup.visible) && (o.z.cat !== '_x' || extrasGroup.visible)), h2 = ray.intersectObjects(ex.map(o => o.mesh), true)[0];
  if(!h2) return null; let ob = h2.object; while(ob && !ex.some(o => o.mesh === ob)) ob = ob.parent; return ob ? ex.find(o => o.mesh === ob) : null;
}
function select(o, fly){
  if(hlMesh){ world.remove(hlMesh); if(!o.z.extra) hlMesh.geometry.dispose(); hlMesh = null; }
  if(hvMesh && hover === o){ world.remove(hvMesh); hvMesh.geometry.dispose(); hvMesh = null; }
  selected = o; hlMesh = overlay(o, hlMat); lblDirty = true; redraw();
  openPanel(o.z.extra ? extraHTML(o) : zoneHTML(o));
  if(fly) flyTo(o);
}

/* ---------- panel ---------- */
const panel = $('#panel'), pbody = $('#pbody');
function openPanel(html, title){ pbody.innerHTML = html; $('#ptitle').textContent = title || 'المنطقة'; panel.classList.add('open'); pbody.scrollTop = 0; shiftFor(true); }
function closePanel(){ panel.classList.remove('open'); shiftFor(false);
  if(hlMesh){ world.remove(hlMesh); if(selected && !selected.z.extra) hlMesh.geometry.dispose(); hlMesh = null; }
  if(selected){ selected = null; lblDirty = true; } redraw(); }
$('#pclose').onclick = closePanel;
function zoneHTML(o){
  const z = o.z, cat = CATS[z.cat]||{}, L = o.labelRef, area = L ? L.arr.reduce((s,a)=>s+a.area,0) : o.area;
  const pct = totalArea ? (area/totalArea*100) : 0, n = L ? L.arr.length : 1;
  return `<span class="cat"><i style="background:${cat.color}"></i>${esc(cat.ar||z.cat)}</span>
  <div class="zn">${esc(z.ar)}</div>${z.en?`<div class="ze">${esc(z.en)}</div>`:''}
  <div class="stats">
    <div class="st"><b>${area>=1e6?(area/1e6).toFixed(2)+'M':fmt(area)}</b><span>م²${n>1?' (المجموعة)':''}</span></div>
    <div class="st"><b>${fmt(area/FEDDAN)}</b><span>فدان</span></div>
    <div class="st"><b>${pct<0.1?'<0.1':pct.toFixed(1)}%</b><span>من المخطط</span></div>
  </div>
  ${(z.facts||[]).length?`<div class="sec"><h3>القطعة اللي دوست عليها${n>1?` (واحدة من ${n})`:''}</h3></div><div class="totals">${z.facts.map(f=>`<div class="st"><b>${esc(f.v)}</b><span>${esc(f.k)}</span></div>`).join('')}<div class="st"><b>${fmt(o.area)}</b><span>مساحة القطعة م²</span></div></div>`:''}
  ${z.desc?`<div class="sec"><h3>عن المنطقة</h3><p>${esc(z.desc)}</p></div>`:''}
  ${z.film?`<div class="sec film"><h3>في الفيلم</h3><p>${esc(z.film)}</p></div>`:''}
  <div class="src">المساحات من ملف الأوتوكاد (${esc(DATA.meta.source_short||'DWG')}).</div>`;
}
function extraHTML(o){
  const z = o.z;
  return `<span class="cat"><i style="background:#ffd27a"></i>${z.cat==='_p' ? 'المعالم الأثرية' : 'بنية ومعالم'}</span>
  <div class="zn">${esc(z.ar)}</div><div class="ze">${esc(z.en)}</div>
  ${z.desc?`<div class="sec"><h3>عن المكان</h3><p>${esc(z.desc)}</p></div>`:''}
  ${z.film?`<div class="sec film"><h3>في الفيلم</h3><p>${esc(z.film)}</p></div>`:''}
  ${z.link?`<div class="sec"><a class="go" href="${esc(z.link)}" target="_blank" rel="noopener">افتح موديل المحطة 3D ←</a></div>`:''}`;
}
function indexHTML(q=''){
  const m = DATA.meta, byCat = {};
  for(const L of labelObjs){ const z = L.o.z; if(q && !(z.ar.includes(q) || (z.en||'').toLowerCase().includes(q.toLowerCase()))) continue; (byCat[L.cat] ||= []).push(L); }
  const order = ['_x', '_p', ...Object.keys(CATS)].filter(k => byCat[k]);
  const head = k => k === '_x' ? `<h4><i style="background:#ffd27a"></i>بنية ومعالم</h4>` : k === '_p' ? `<h4><i style="background:#dcc79c"></i>المعالم الأثرية</h4>` : `<h4><i style="background:${CATS[k].color}"></i>${esc(CATS[k].ar)}</h4>`;
  return `${q===''?`<div class="totals">
      <div class="st"><b>${m.total_area?(m.total_area/1e6).toFixed(2)+'M':'—'}</b><span>م² إجمالي المشروع</span></div>
      <div class="st"><b>${m.total_area?fmt(m.total_area/FEDDAN):'—'}</b><span>فدان</span></div>
      ${(m.facts||[]).map(f=>`<div class="st"><b>${esc(f.v)}</b><span>${esc(f.k)}</span></div>`).join('')}
    </div>`:''}
    <input class="search" id="q" placeholder="دوّر على منطقة…" value="${esc(q)}">
    <div class="idx">${order.map(k => head(k) + byCat[k].sort((a,b)=>b.pri-a.pri).map(L => `<button data-i="${labelObjs.indexOf(L)}">${esc(L.o.z.ar)}${k[0]==='_'?'':`<em>${fmt(L.arr.reduce((s,a)=>s+a.area,0))} م²</em>`}</button>`).join('')).join('')}</div>
    <div class="src">المصدر: ${esc(m.source||'')}${m.source_date?` · ${esc(m.source_date)}`:''}. ${esc(m.height_note||'')} القطر والمحطة وورش القطار والحلبة متضافين من خريطة حدود المشروع وسلايد المخطط العام المطوّر، فمكانهم تقريبي. ${esc(m.geo_src||'')}</div>`;
}
function openIndex(q=''){
  if(hlMesh){ world.remove(hlMesh); hlMesh = null; } selected = null; lblDirty = true; redraw();
  openPanel(indexHTML(q), 'كل المناطق');
  const qi = $('#q'); qi.oninput = () => { const pos = qi.selectionStart; openIndex(qi.value); const n = $('#q'); n.focus(); n.setSelectionRange(pos,pos); };
  pbody.querySelectorAll('.idx button').forEach(b => b.onclick = () => select(labelObjs[+b.dataset.i].o, true));
}
$('#bIndex').onclick = () => openIndex();

/* ---------- camera ---------- */
let anim = null;
function tweenTo(pos, target, ms=1400){
  const p0 = camera.position.clone(), t0 = controls.target.clone(), st = performance.now();
  anim = now => { let k = Math.min(1, (now-st)/ms); k = k<.5 ? 4*k*k*k : 1-Math.pow(-2*k+2,3)/2;
    camera.position.lerpVectors(p0, pos, k); controls.target.lerpVectors(t0, target, k); lblDirty = true; if(k>=1) anim = null; };
}
function flyTo(o){
  const L = o.labelRef, arr = L ? L.arr : [o], box = new THREE.Box3(); for(const a of arr) box.union(a.box);
  const c = box.getCenter(new THREE.Vector3()), r = o.near || Math.min(Math.max(box.getSize(new THREE.Vector3()).length(), 60), HOME.radius*0.9);
  const dir = camera.position.clone().sub(controls.target).normalize(); dir.y = Math.max(dir.y, .55); dir.normalize();
  tweenTo(c.clone().add(dir.multiplyScalar(r*1.7)), c.clone());
}
function goHome(ms){ tweenTo(HOME.pos.clone(), HOME.target.clone(), ms); }
$('#bWide').onclick = () => { $('#bTop').classList.remove('on'); tweenTo(WIDE.pos.clone(), WIDE.target.clone(), 1800); };
$('#bAnim').classList.toggle('on', animOn);
$('#bAnim').onclick = () => { animOn = !animOn; $('#bAnim').classList.toggle('on', animOn); redraw(); };
$('#bReset').onclick = () => { $('#bTop').classList.remove('on'); goHome(); };
$('#bTop').onclick = () => {
  const on = !$('#bTop').classList.contains('on'); $('#bTop').classList.toggle('on', on);
  if(on){ const t = controls.target.clone(); const d = Math.max(camera.position.distanceTo(t), HOME.radius*0.4); tweenTo(t.clone().add(new THREE.Vector3(0.001, d*1.15, 0.001)), t); }
  else goHome();
};
$('#bLabels').onclick = () => { showLabels = !showLabels; $('#bLabels').classList.toggle('on', showLabels); lblDirty = true; redraw(); };
let spinning = false;
function stopSpin(){ spinning = false; controls.autoRotate = false; $('#bSpin').classList.remove('on'); }
$('#bSpin').onclick = () => { spinning = !spinning; controls.autoRotate = spinning; controls.autoRotateSpeed = .45; $('#bSpin').classList.toggle('on', spinning); redraw(); };
function hideHint(){ $('#hint').classList.add('gone'); }
setTimeout(hideHint, 9000);

/* ---------- legend ---------- */
function buildLegend(){
  const used = new Set(DATA.zones.map(z => z.cat)), lg = $('#legend'); lg.innerHTML = '';
  const chip = (html, off, fn) => { const b = document.createElement('button'); b.className = 'chip' + (off ? ' off' : ''); b.innerHTML = html; b.onclick = () => { fn(b); redraw(); }; lg.appendChild(b); };
  if(extrasGroup) chip('<i style="background:#ffd27a;border-radius:50%"></i>القطر والحلبة', false, b => { extrasGroup.visible = !extrasGroup.visible; b.classList.toggle('off', !extrasGroup.visible);
    if(extrasGroup.visible) hidden.delete('_x'); else hidden.add('_x'); lblDirty = true; });
  if(pyrGroup) chip('<i style="background:#dcc79c;border-radius:2px;transform:rotate(45deg)"></i>الأهرامات والمعالم', false, b => { pyrGroup.visible = !pyrGroup.visible; b.classList.toggle('off', !pyrGroup.visible);
    if(pyrGroup.visible) hidden.delete('_p'); else hidden.add('_p'); lblDirty = true; renderer.shadowMap.needsUpdate = true; });
  if((DATA.phase||[]).length) chip('<i style="background:#ffd27a;border-radius:50%"></i>المرحلة الأولى 1A', true, b => { phaseGroup.visible = !phaseGroup.visible; b.classList.toggle('off', !phaseGroup.visible); });
  for(const [k, c] of Object.entries(CATS)){ if(!used.has(k)) continue;
    chip(`<i style="background:${c.color}"></i>${esc(c.ar)}`, false, b => { const off = !hidden.has(k); off ? hidden.add(k) : hidden.delete(k); b.classList.toggle('off', off);
      if(catMesh[k]) catMesh[k].visible = !off; if(BLK && BLK.byCat[k]) BLK.byCat[k].visible = !off; lblDirty = true; renderer.shadowMap.needsUpdate = true; }); }
}

/* ---------- "last updated" ---------- */
function paintUpd(){ if(!DATA) return; const d = new Date(DATA.meta.updated), s = (Date.now()-d)/1000;
  const r = s < 90 ? 'دلوقتي' : s < 3600 ? `من ${Math.round(s/60)} دقيقة` : s < 86400 ? `من ${Math.round(s/3600)} ساعة` : `من ${Math.round(s/86400)} يوم`;
  const t = $('#updt'); t.textContent = r; t.title = d.toLocaleString('ar-EG-u-nu-latn', {day:'numeric', month:'short', hour:'numeric', minute:'2-digit', timeZone:'Africa/Cairo'}) + ' (القاهرة)'; t.dateTime = DATA.meta.updated; }
setInterval(paintUpd, 30000);

/* keep the picture centred in the part of the screen the panel leaves free */
const shift = {x:0, y:0, tx:0, ty:0};
function shiftFor(open){ const m = innerWidth < 640; shift.tx = open && !m ? (panel.offsetWidth + 18) / 2 : 0; shift.ty = open && m ? panel.offsetHeight * 0.42 : 0; }
function applyShift(){
  shift.x += (shift.tx - shift.x) * .14; shift.y += (shift.ty - shift.y) * .14;
  if(Math.abs(shift.tx - shift.x) < .5) shift.x = shift.tx; if(Math.abs(shift.ty - shift.y) < .5) shift.y = shift.ty;
  if(!shift.x && !shift.y) camera.clearViewOffset(); else camera.setViewOffset(innerWidth, innerHeight, shift.x, shift.y, innerWidth, innerHeight);
  lblDirty = true;
}

/* ---------- loop: renders only while something moves ---------- */
addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight;
  if(shift.x||shift.y){ shiftFor(panel.classList.contains('open')); shift.x=shift.tx; shift.y=shift.ty; if(shift.x||shift.y) camera.setViewOffset(innerWidth, innerHeight, shift.x, shift.y, innerWidth, innerHeight); else camera.clearViewOffset(); }
  camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); lr.setSize(innerWidth, innerHeight); lblDirty = true; redraw(); });
window.__nv = {camera, controls, redraw: () => redraw(), data: () => DATA, S};   // handle for scripted camera moves (film previs, tests)
const az = new THREE.Spherical(); let lastLbl = 0;
function loop(now){
  requestAnimationFrame(loop);
  if(anim){ anim(now); need = 2; }
  if(shift.x !== shift.tx || shift.y !== shift.ty){ applyShift(); need = 2; }
  if(controls.update()) need = 2;
  if(spinning) need = 2;
  const moving = animOn && TRAINS.length && !document.hidden;
  if(!need && !moving) return;
  if(moving) moveTrains(clock.getElapsedTime());
  if(need){ need--;
    if(lblDirty && now - lastLbl > 100){ layoutLabels(); lblDirty = false; lastLbl = now; }
    else if(lblDirty) need = Math.max(need, 1);
    az.setFromVector3(camera.position.clone().sub(controls.target));
    $('#north svg').style.transform = `rotate(${-az.theta*180/Math.PI}deg)`;
    lr.render(scene, camera); }
  renderer.render(scene, camera);
}

/* ---------- go ---------- */
(async () => {
  try{
    DATA = await getData();
    build(); buildLegend(); paintUpd(); addStation().catch(e => console.error(e));
    const pT = addTerrain().then(() => { settleOnTerrain(); return addLandmarks(); }).catch(e => console.error(e));
    requestAnimationFrame(() => setTimeout(() => { addStreets().catch(e => console.error(e));
      const pB = addBlocks().catch(e => console.error(e)); Promise.all([pT, pB]).then(() => addPlaces()).catch(e => console.error(e)); }, 30));
    camera.position.copy(HOME.pos).add(new THREE.Vector3(HOME.radius*0.4, HOME.radius*0.5, HOME.radius*0.4)); controls.target.copy(HOME.target);
    requestAnimationFrame(loop);
    $('#veil').classList.add('gone'); goHome(2400);
    const want = new URLSearchParams(location.search).get('z');
    if(want){ const L = labelObjs.find(L => L.o.z.id === want); if(L) setTimeout(() => select(L.o, true), 2500); }
  }catch(e){
    console.error(e); $('#vbar').style.display='none'; $('#vmsg').textContent = 'المخطط مش راضي يحمّل. جرّب تعمل refresh.';
  }
})();
</script>

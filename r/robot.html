<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<meta name="robots" content="noindex,nofollow">
<title>Aroma Doorman · Build</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Chakra+Petch:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#0b0908;--ink:#f3ece6;--dim:rgba(243,236,230,.56);--faint:rgba(243,236,230,.09);--line:rgba(243,236,230,.12);--red:#e2300f;--org:#ef6a3c;--teal:#4fb3b0;--glass:rgba(16,12,11,.78);
--display:"Michroma","Eurostile","Arial Black",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;--ar:"IBM Plex Sans Arabic","Chakra Petch",Tahoma,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ar);-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow:hidden}
#sheet{position:fixed;inset:0;pointer-events:none;background:
 linear-gradient(var(--faint) 1px,transparent 1px) 0 0/48px 48px,
 linear-gradient(90deg,var(--faint) 1px,transparent 1px) 0 0/48px 48px,
 radial-gradient(1200px 700px at 50% 55%,rgba(226,48,15,.10),transparent 70%),var(--bg);opacity:.9}
#stage{position:fixed;inset:0}
#c{display:block;width:100%;height:100%;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none}
.lbl{font:500 11px/1.2 var(--ar);color:var(--ink);background:rgba(11,9,8,.82);border:1px solid var(--line);border-inline-start:2px solid var(--org);padding:4px 7px;white-space:nowrap;transform:translateY(-14px)}
.lbl b{font:600 9px var(--mono);color:var(--org);letter-spacing:.08em;margin-inline-end:5px}
header{position:fixed;top:0;inset-inline:0;height:64px;display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid var(--line);background:linear-gradient(rgba(11,9,8,.92),rgba(11,9,8,.6));z-index:5;direction:ltr}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:44px;height:20px}
.brand .w{font:13px var(--display);letter-spacing:.32em}
.brand .s{font:500 10px var(--mono);color:var(--dim);letter-spacing:.2em;border-left:1px solid var(--line);padding-left:12px}
.live{margin-left:auto;display:flex;align-items:center;gap:10px;font:500 11px var(--mono);letter-spacing:.14em;color:var(--dim)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 rgba(226,48,15,.7);animation:pulse 1.6s infinite}
.live .ar{font:500 13px var(--ar);letter-spacing:0;color:var(--ink);direction:rtl}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(226,48,15,.7)}70%{box-shadow:0 0 0 9px rgba(226,48,15,0)}100%{box-shadow:0 0 0 0 rgba(226,48,15,0)}}
#steps{position:fixed;top:80px;right:16px;bottom:16px;width:290px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;flex-direction:column;z-index:4}
#steps h3{margin:0;padding:14px 16px 10px;font:600 11px var(--mono);letter-spacing:.2em;color:var(--dim);border-bottom:1px solid var(--line);direction:ltr;text-align:left}
#list{overflow:auto;flex:1;padding:6px 0}
.st{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:8px;padding:9px 14px;cursor:pointer;border-inline-start:3px solid transparent;transition:background .2s}
.st:hover{background:rgba(243,236,230,.04)}
.st .n{font:600 11px var(--mono);color:var(--dim);direction:ltr}
.st .t{font:500 13.5px var(--ar)}
.st .p{font:500 10px var(--ar);padding:2px 7px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.st.ok .p{color:var(--teal);border-color:rgba(79,179,176,.45)}
.st.soon{opacity:.5}
.st.on{background:rgba(226,48,15,.10);border-inline-start-color:var(--red)}
.st.on .n{color:var(--org)}
#log{border-top:1px solid var(--line);padding:10px 16px 12px;font:12px/1.55 var(--ar);color:var(--dim);max-height:132px;overflow:auto}
#log b{font:600 10px var(--mono);color:var(--org);letter-spacing:.08em;margin-inline-end:6px;direction:ltr;display:inline-block}
#card{position:fixed;left:16px;bottom:16px;width:min(560px,calc(100vw - 340px));max-height:min(48vh,520px);display:flex;flex-direction:column;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:4}
#card .hd{display:flex;align-items:baseline;gap:12px;padding:14px 18px 8px}
#card .hd .num{font:16px var(--display);color:var(--org);direction:ltr}
#card .hd h2{margin:0;font:700 19px var(--ar)}
#card .bd{overflow:auto;padding:0 18px 12px;font:14.5px/1.75 var(--ar)}
#card ul{margin:6px 0 8px;padding-inline-start:18px}
#card li{margin:3px 0}
#card .chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.chip{font:500 12px var(--ar);padding:3px 9px;border:1px solid var(--line);background:rgba(243,236,230,.03);cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--org)}
.chip.buy{border-inline-start:3px solid var(--teal)}
.chip.print{border-inline-start:3px solid var(--red)}
.meta{display:flex;flex-wrap:wrap;gap:14px;font:500 12.5px var(--ar);color:var(--dim);margin:2px 0 6px}
.warn{border:1px solid rgba(239,106,60,.45);background:rgba(239,106,60,.08);padding:8px 12px;margin:8px 0;font-size:13.5px}
#card .ft{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
button{font:600 13px var(--ar);color:var(--ink);background:rgba(243,236,230,.05);border:1px solid var(--line);padding:8px 14px;cursor:pointer;transition:background .2s,border-color .2s}
button:hover{border-color:var(--org);background:rgba(239,106,60,.12)}
button.pri{background:var(--red);border-color:var(--red)}
button.pri:hover{background:#f04420}
button:disabled{opacity:.35;cursor:default}
.ft .sp{flex:1}
#tools{position:fixed;left:16px;top:80px;display:flex;flex-direction:column;gap:8px;z-index:4;width:250px}
.tool{background:var(--glass);border:1px solid var(--line);padding:10px 12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.tool label{display:flex;justify-content:space-between;font:500 12.5px var(--ar);color:var(--dim);margin-bottom:6px}
.tool input[type=range]{width:100%;accent-color:var(--red)}
.tog{display:flex;gap:6px}
.tog button{flex:1;padding:7px 8px;font-size:12px}
.tog button.on{border-color:var(--teal);color:var(--teal)}
#pcard{position:fixed;left:16px;top:212px;width:250px;background:var(--glass);border:1px solid var(--line);border-top:2px solid var(--org);padding:12px 14px;z-index:4;display:none;font:13px/1.6 var(--ar);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#pcard h4{margin:0 0 2px;font:700 15px var(--ar)}
#pcard .en{font:500 11px var(--mono);color:var(--dim);direction:ltr;text-align:right;margin-bottom:8px}
#pcard .row{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:5px 0}
#pcard .row span:first-child{color:var(--dim)}
#pcard .x{position:absolute;top:6px;left:8px;background:none;border:0;padding:2px 6px;color:var(--dim)}
#tip{position:fixed;pointer-events:none;z-index:6;font:500 12px var(--ar);background:#f3ece6;color:#180703;padding:4px 9px;display:none;white-space:nowrap}
table.bom{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0}
table.bom th{font:600 10.5px var(--mono);letter-spacing:.1em;color:var(--dim);text-align:start;padding:5px 6px;border-bottom:1px solid var(--line)}
table.bom td{padding:5px 6px;border-bottom:1px solid var(--faint);vertical-align:top}
table.bom td.n{font-family:var(--mono);direction:ltr;text-align:left;white-space:nowrap}
table.bom tr:hover td{background:rgba(243,236,230,.03);cursor:pointer}
table.bom tfoot td{font-weight:700;color:var(--org);border-top:1px solid var(--line)}
.soonbox{padding:18px 0 8px;color:var(--dim)}
.soonbox b{color:var(--ink)}
#nogl{display:none;position:fixed;inset:0;place-items:center;text-align:center;z-index:9;padding:30px}
@media (max-width:860px){
 body{overflow:auto}
 header{height:56px;padding:0 12px}.brand .s{display:none}
 #stage{position:sticky;top:0;height:54svh;z-index:1}
 #wrap{position:relative;z-index:2;background:var(--bg)}
 #steps,#card,#tools,#pcard{position:static;width:auto;max-height:none;margin:10px 12px}
 #steps{height:auto}#list{display:flex;overflow-x:auto;padding:6px}
 .st{grid-template-columns:auto;min-width:118px;border-inline-start:0;border-bottom:3px solid transparent;gap:3px}
 .st.on{border-bottom-color:var(--red)}
 #log{max-height:none}
 #tools{flex-direction:row;flex-wrap:wrap}.tool{flex:1;min-width:150px}
 #pcard{margin-top:0}
 #card .bd{overflow:visible}
}
</style>

<body>
<div id="sheet"></div>
<header>
 <div class="brand"><svg viewBox="0 0 44 20"><path d="M0 0H44V20H8L0 12Z" fill="#e2300f"/></svg><span class="w">AROMA</span><span class="s">DOORMAN · BUILD SIM</span></div>
 <div class="live"><i></i><span>LIVE</span><span class="ar" id="liveTxt"></span></div>
</header>
<div id="stage"><canvas id="c"></canvas><div id="labels"></div></div>
<div id="wrap">
<div id="tools">
 <div class="tool" id="tExplode"><label><span>فكّ المجسم</span><span id="exV">0%</span></label><input type="range" dir="ltr" id="ex" min="0" max="100" value="0"></div>
 <div class="tool tog"><button id="bX">شفاف</button><button id="bAlive" class="on">حيّ</button><button id="bSpin">لف</button></div>
 <div class="tool tog"><button id="bFold">ضم الإيدين</button><button id="bWave">سلّم</button></div>
</div>
<aside id="steps"><h3>BUILD STEPS · خطوات التجميع</h3><div id="list"></div><div id="log"></div></aside>
<section id="card"><div class="hd"><span class="num" id="cNum"></span><h2 id="cTitle"></h2></div><div class="bd" id="cBody"></div>
 <div class="ft"><button id="bPrev">→ السابق</button><button id="bOut">فكّ</button><button id="bIn" class="pri">ركّب</button><span class="sp"></span><button id="bNext">التالي ←</button></div></section>
<div id="pcard"><button class="x" id="pX">✕</button><div id="pBody"></div></div>
</div>
<div id="tip"></div>
<div id="nogl"><div><h2>المتصفح ده مش بيدعم 3D</h2><p>افتح الصفحة من كروم أو سفاري على جهاز أحدث.</p></div></div>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {CSS2DRenderer,CSS2DObject} from 'three/addons/renderers/CSS2DRenderer.js';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';

const $=s=>document.querySelector(s);
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ───────── live status (updated with every upload) ───────── */
const LOG=[
 ['04:48','نزلت أول نسخة: الشكل النهائي للبوّاب + فكّ المجسم. الخطوات جاية واحدة واحدة.'],
 ['04:59','رجّعت الشكل زي ماسكوت الهب بالظبط: الشاشة بحافة اللوجو 64×27 من غير إطار، والإيدين بقوا مرايات بتتضم وتتفتح على مفصلة في الودن.'],
];

/* ───────── renderer / scene ───────── */
const canvas=$('#c');
let renderer;
try{ renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,powerPreference:'high-performance'}); }
catch(e){ $('#nogl').style.display='grid'; throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.0;
const scene=new THREE.Scene();
const pm=new THREE.PMREMGenerator(renderer);
scene.environment=pm.fromScene(new RoomEnvironment(renderer),0.04).texture;
scene.add(new THREE.HemisphereLight(0xfff0e0,0x1a0c08,.35));
const key=new THREE.DirectionalLight(0xffe2c8,1.5); key.position.set(500,800,700); scene.add(key);
const rim=new THREE.DirectionalLight(0x4fb3b0,1.6); rim.position.set(-700,300,-600); scene.add(rim);
const camera=new THREE.PerspectiveCamera(30,1,5,9000);
camera.position.set(700,470,1060);
const controls=new OrbitControls(camera,canvas);
controls.enableDamping=true; controls.dampingFactor=.08; controls.target.set(0,190,0);
controls.minDistance=180; controls.maxDistance=2600; controls.maxPolarAngle=Math.PI*.92;
const labelR=new CSS2DRenderer({element:$('#labels')});

/* ───────── materials ───────── */
const MAT={
 red:()=>new THREE.MeshPhysicalMaterial({color:0xe2300f,roughness:.34,clearcoat:.8,clearcoatRoughness:.2}),
 orange:()=>new THREE.MeshPhysicalMaterial({color:0xef6a3c,roughness:.38,clearcoat:.5}),
 black:()=>new THREE.MeshStandardMaterial({color:0x1b1918,roughness:.68,metalness:.05}),
 dark:()=>new THREE.MeshPhysicalMaterial({color:0x1d1816,roughness:.38,metalness:.5,clearcoat:.6}),
 grey:()=>new THREE.MeshStandardMaterial({color:0x6b6661,roughness:.72}),
 teal:()=>new THREE.MeshPhysicalMaterial({color:0x4fb3b0,emissive:0x2c9893,emissiveIntensity:.9,roughness:.3}),
 pcbK:()=>new THREE.MeshStandardMaterial({color:0x121316,roughness:.45,metalness:.15}),
 metal:()=>new THREE.MeshStandardMaterial({color:0xd0d2d6,roughness:.28,metalness:1}),
 steel:()=>new THREE.MeshStandardMaterial({color:0x6f7378,roughness:.45,metalness:.85}),
 plastic:()=>new THREE.MeshStandardMaterial({color:0x111112,roughness:.55}),
 rubber:()=>new THREE.MeshStandardMaterial({color:0x2a2a2a,roughness:.95}),
 clear:()=>new THREE.MeshPhysicalMaterial({color:0xeaf6f6,roughness:.04,metalness:0,clearcoat:1,transparent:true,opacity:.22,depthWrite:false,side:THREE.DoubleSide}),
 gloss:()=>new THREE.MeshPhysicalMaterial({color:0x000000,roughness:.06,clearcoat:1,clearcoatRoughness:.05,transparent:true,opacity:.16,depthWrite:false}),
 smoke:()=>new THREE.MeshPhysicalMaterial({color:0x0a0807,roughness:.05,clearcoat:1,transparent:true,opacity:.38,depthWrite:false}),
};

/* ───────── geometry helpers (mm) ───────── */
const mesh=(g,m)=>new THREE.Mesh(g,m);
const box=(w,h,d,m,r)=>mesh(r?new RoundedBoxGeometry(w,h,d,3,r):new THREE.BoxGeometry(w,h,d),m);
const cyl=(r,h,m,seg=48,r2)=>mesh(new THREE.CylinderGeometry(r,r2??r,h,seg),m);
function ringGeo(ro,ri,h,seg=72){ const s=new THREE.Shape(); s.absarc(0,0,ro,0,Math.PI*2,false); const p=new THREE.Path(); p.absarc(0,0,ri,0,Math.PI*2,true); s.holes.push(p);
 const g=new THREE.ExtrudeGeometry(s,{depth:h,bevelEnabled:false,curveSegments:seg}); g.rotateX(-Math.PI/2); g.translate(0,-h/2,0); return g; }
const shapeOf=pts=>{ const s=new THREE.Shape(); pts.forEach((p,i)=>i?s.lineTo(p[0],p[1]):s.moveTo(p[0],p[1])); s.closePath(); return s; };
const pathOf=pts=>{ const s=new THREE.Path(); pts.forEach((p,i)=>i?s.lineTo(p[0],p[1]):s.moveTo(p[0],p[1])); s.closePath(); return s; };
function offsetPoly(pts,d){ // miter offset of a convex polygon, d>0 = outward
 const n=pts.length; let a=0; for(let i=0;i<n;i++){const p=pts[i],q=pts[(i+1)%n]; a+=p[0]*q[1]-q[0]*p[1];}
 const s=a>0?1:-1, L=[];
 for(let i=0;i<n;i++){ const p=pts[i],q=pts[(i+1)%n], dx=q[0]-p[0], dy=q[1]-p[1], l=Math.hypot(dx,dy), nx=s*dy/l, ny=-s*dx/l; L.push([p[0]+nx*d,p[1]+ny*d,dx,dy]); }
 return pts.map((_,i)=>{ const A=L[(i-1+n)%n],B=L[i], den=A[2]*B[3]-A[3]*B[2], t=((B[0]-A[0])*B[3]-(B[1]-A[1])*B[2])/den; return [A[0]+A[2]*t,A[1]+A[3]*t]; });
}

/* ───────── the mascot's numbers, in millimetres (same proportions as the hub mascot) ───────── */
const U=108, LOGO=[[-1.1,.5],[1.1,.5],[1.1,-.5],[-.7,-.5],[-1.1,-.12]];
const HEAD=LOGO.map(p=>[p[0]*U,p[1]*U]);                // 237.6 × 108, rounded by .075u → 253.8 × 124.2
const WIN=LOGO.map(p=>[p[0]*U*.94,p[1]*U*.88]);         // the screen: the logo's own shape, cut corner and all
const HD=.86*U, HB=.075*U, HZ=HD/2+HB;                  // depth 92.9, rounding 8.1, front face at z=54.5
const HCY=276, TILT_Y=232;                              // head centre height, tilt axis height
const HL=HCY-TILT_Y;                                    // head centre in the tilt group
const EARX=1.24*U, EARY=.02*U;                          // ears, exactly where the hub mascot has them
const HS=.26*U, HBV=.035*U, HDP=.16*U;                  // screen hands: 56.2 square + 3.8 rounding, 17.3 deep
const PIV=[EARX+.08*U+4, EARY, 14];                      // mirror hinge: outer-front corner of the ear
const HOFF=[HS+HBV+8, 0, 13];                           // hand centre from the hinge (open)

/* ───────── LED screens — the hub mascot's face, pixel for pixel ───────── */
function led(cols,rows,px){ const cv=document.createElement('canvas'); cv.width=cols*px; cv.height=rows*px; const cx=cv.getContext('2d');
 const tex=new THREE.CanvasTexture(cv); tex.colorSpace=THREE.SRGBColorSpace; tex.anisotropy=4; tex.magFilter=THREE.NearestFilter; return {cv,cx,tex,cols,rows,px}; }
const FACE=led(64,27,10);
let ox=0,oy=0;
function px(c,r,col){ c+=ox; r+=oy; if(c<0||r<0||c>=64||r>=27) return; const x=FACE.cx; x.fillStyle=col; x.fillRect(c*10+1,r*10+1,8,8); }
const F={'0':'111101101101111','1':'010110010010111','2':'111001111100111','3':'111001111001111','4':'101101111001001','5':'111100111001111','6':'111100111101111','7':'111001010010010','8':'111101111101111','9':'111101111001111',':':'000010000010000','%':'101001010100101',
 A:'010101111101101',B:'110101110101110',C:'111100100100111',D:'110101101101110',E:'111100110100111',F:'111100110100100',G:'111100101101111',H:'101101111101101',I:'111010010010111',J:'001001001101111',K:'101110100110101',L:'100100100100111',M:'101111111101101',N:'111101101101101',O:'111101101101111',P:'111101111100100',Q:'111101101111001',R:'110101110101101',S:'111100111001111',T:'111010010010010',U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',Y:'101101010010010',Z:'111001010100111',' ':'000000000000000'};
function text(s,c0,r0,col){ for(let i=0;i<s.length;i++){ const g=F[s[i]]||F[' ']; for(let k=0;k<15;k++) if(g[k]==='1') px(c0+i*4+k%3,r0+Math.floor(k/3),col); } }
function eyeOpen(c0,lx,ly,col,h,w){ w=w||8; const top=4+Math.floor((8-h)/2); for(let r=0;r<h;r++) for(let c=0;c<w;c++){ if(h>=6&&(r===0||r===h-1)&&(c===0||c===w-1)) continue; px(c0+c,top+r,col); }
 if(h>=6){ const pc=c0+3+lx, pr=top+Math.floor(h/2)-1+ly; FACE.cx.fillStyle='#050302'; FACE.cx.fillRect((pc+ox)*10,(pr+oy)*10,20,20); px(pc+1,pr,'rgba(255,255,255,.5)'); } }
function eyeLine(c0,col){ for(let c=0;c<8;c++) px(c0+c,8,col); }
function eyeHappy(c0,col){ for(let c=0;c<8;c++){ const r=9-Math.min(c,7-c); px(c0+c,r,col); px(c0+c,r+1,col); } }
function mouth(kind,col){ let c;
 if(kind==='smile'){ px(19,15,col); px(26,15,col); for(c=20;c<=25;c++) px(c,16,col); }
 else if(kind==='big'){ px(17,14,col); px(28,14,col); px(18,15,col); px(27,15,col); for(c=19;c<=26;c++){ px(c,16,col); px(c,15,col); } for(c=21;c<=24;c++) px(c,17,col); }
 else if(kind==='flat'){ for(c=20;c<=25;c++) px(c,16,col); }
 else if(kind==='o'){ for(c=21;c<=24;c++){ px(c,14,col); px(c,17,col); } px(21,15,col); px(21,16,col); px(24,15,col); px(24,16,col); } }
const COL={happy:'#9ff5d0',wow:'#ffe6cf',sleepy:'#7fa9d6'}, WORD={idle:'HELLO',happy:'NICE',wow:'WOW',sleepy:'ZZZ',talk:'HI',off:''};
let faceSig='';
function drawFace(mood,lx,ly,blink,tick,pct){

 const s=[mood,lx,ly,blink,clk,pct,(mood==='sleepy'||mood==='talk')?tick:''].join('|'); if(s===faceSig) return; faceSig=s; ox=0; oy=0;

 const tg=new THREE.ExtrudeGeometry(shapeOf(pts),{depth:HDP,bevelEnabled:true,bevelThickness:HBV,bevelSize:HBV,bevelSegments:3,curveSegments:2}); tg.translate(0,0,-HDP/2);

 const L=side<0?HANDL:HANDR, sc=mesh(sg,ledMat(L,[1/(2*HS*K),1/(2*HS*K)],[.5,.5])); sc.position.z=HDP/2+HBV+.3; tile.add(sc);

 HAND[side<0?'l':'r']={pivot,tile}; return pivot; }; }

function frame(){

 foldV+=(FOLD_TO-foldV)*Math.min(1,dt*3.2); let f=foldV;

  lx=Math.max(-2,Math.min(2,Math.round(tx*2.4))); ly=Math.max(-1,Math.min(1,Math.round(-ty*1.6)));

  if(t>moodUntil&&wave<=0){ const r=Math.random(); mood=r<.25?'talk':r<.45?'happy':'idle'; moodUntil=t+2.5+Math.random()*2.5;
   if(FOLD_TO>.5){ drawHand(HANDL,'z','#7fa9d6',true); drawHand(HANDR,'z','#7fa9d6',false); }
   else if(mood==='happy'){ drawHand(HANDL,'thumb','#9ff5d0',true); drawHand(HANDR,'heart','#ff5a7a',false); } else { drawHand(HANDL,'open','#ffe6cf',true); drawHand(HANDR,'open','#ffe6cf',false); } } }
 panG.rotation.y+=(pan-panG.rotation.y)*.06; tiltG.rotation.x+=(tilt-tiltG.rotation.x)*.06;
 drawFace(ALIVE?(FOLD_TO>.5&&wave<=0?'sleepy':mood):'idle',lx,ly,blink>0?1:0,Math.floor(t*4),(Math.sin(t*.25)+1)/2);
 controls.update(); renderer.render(scene,camera); labelR.render(scene,camera);
 requestAnimationFrame(frame);
}
renderList(); go(0); frame();
</script>

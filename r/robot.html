<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Chakra+Petch:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#0b0908;--ink:#f3ece6;--dim:rgba(243,236,230,.56);--faint:rgba(243,236,230,.09);--line:rgba(243,236,230,.12);--red:#e2300f;--org:#ef6a3c;--teal:#4fb3b0;--glass:rgba(16,12,11,.78);
--display:"Michroma","Eurostile","Arial Black",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;--ar:"IBM Plex Sans Arabic","Chakra Petch",Tahoma,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ar);-webkit-font-smoothing:antialiased}
body{min-height:100vh;overflow:hidden}
#sheet{position:fixed;inset:0;pointer-events:none;background:
 linear-gradient(var(--faint) 1px,transparent 1px) 0 0/48px 48px,
 linear-gradient(90deg,var(--faint) 1px,transparent 1px) 0 0/48px 48px,
 radial-gradient(1200px 700px at 50% 55%,rgba(226,48,15,.10),transparent 70%),var(--bg);opacity:.9}
#stage{position:fixed;inset:0}
#c{display:block;width:100%;height:100%;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;direction:ltr}
#labels>div{left:0;top:0}
#labels .lbl{direction:rtl}
.lbl{font:500 11.5px/1.2 var(--ar);color:var(--ink);background:rgba(11,9,8,.82);border:1px solid var(--line);border-inline-start:2px solid var(--org);padding:4px 7px;white-space:nowrap;transform:translateY(-14px)}
.lbl b{font:600 9px var(--mono);color:var(--org);letter-spacing:.08em;margin-inline-end:5px}
header{position:fixed;top:0;inset-inline:0;height:64px;display:flex;align-items:center;gap:14px;padding:0 20px;border-bottom:1px solid var(--line);background:linear-gradient(rgba(11,9,8,.92),rgba(11,9,8,.6));z-index:5;direction:ltr}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:44px;height:20px}
.brand .w{font:13px var(--display);letter-spacing:.32em}
.brand .s{font:500 10px var(--mono);color:var(--dim);letter-spacing:.2em;border-left:1px solid var(--line);padding-left:12px}
.live{margin-left:auto;display:flex;align-items:center;gap:10px;font:500 11px var(--mono);letter-spacing:.14em;color:var(--dim)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 rgba(226,48,15,.7);animation:pulse 1.6s infinite}
.live .ar{font:500 13px var(--ar);letter-spacing:0;color:var(--ink);direction:rtl}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(226,48,15,.7)}70%{box-shadow:0 0 0 9px rgba(226,48,15,0)}100%{box-shadow:0 0 0 0 rgba(226,48,15,0)}}
#steps{position:fixed;top:80px;right:16px;bottom:16px;width:290px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;flex-direction:column;z-index:4}
#steps h3{margin:0;padding:14px 16px 10px;font:600 11px var(--mono);letter-spacing:.2em;color:var(--dim);border-bottom:1px solid var(--line);direction:ltr;text-align:left}
#list{overflow:auto;flex:1;padding:6px 0}
.st{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:8px;padding:9px 14px;cursor:pointer;border-inline-start:3px solid transparent;transition:background .2s}
.st:hover{background:rgba(243,236,230,.04)}
.st .n{font:600 11px var(--mono);color:var(--dim);direction:ltr}
.st .t{font:500 13.5px var(--ar)}
.st .p{font:500 10px var(--ar);padding:2px 7px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
.st.ok .p{color:var(--teal);border-color:rgba(79,179,176,.45)}
.st.soon{opacity:.5}
.st.on{background:rgba(226,48,15,.10);border-inline-start-color:var(--red)}
.st.on .n{color:var(--org)}
#log{border-top:1px solid var(--line);padding:10px 16px 12px;font:12px/1.55 var(--ar);color:var(--dim);max-height:132px;overflow:auto}
#log b{font:600 10px var(--mono);color:var(--org);letter-spacing:.08em;margin-inline-end:6px;direction:ltr;display:inline-block}
#card{position:fixed;left:16px;bottom:16px;width:min(540px,calc(100vw - 340px));max-height:min(44vh,500px);display:flex;flex-direction:column;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:4}
#card .hd{display:flex;align-items:baseline;gap:12px;padding:14px 18px 8px}
#card .hd .num{font:16px var(--display);color:var(--org);direction:ltr}
#card .hd h2{margin:0;font:700 19px var(--ar)}
#card .bd{overflow:auto;padding:0 18px 12px;font:14.5px/1.75 var(--ar)}
#card ul{margin:6px 0 8px;padding-inline-start:18px}
#card li{margin:3px 0}
#card .chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.chip{font:500 12px var(--ar);padding:3px 9px;border:1px solid var(--line);background:rgba(243,236,230,.03);cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--org)}
.chip.buy{border-inline-start:3px solid var(--teal)}
.chip.print{border-inline-start:3px solid var(--red)}
.meta{display:flex;flex-wrap:wrap;gap:14px;font:500 12.5px var(--ar);color:var(--dim);margin:2px 0 6px}
.warn{border:1px solid rgba(239,106,60,.45);background:rgba(239,106,60,.08);padding:8px 12px;margin:8px 0;font-size:13.5px}
#card .ft{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
button{font:600 13px var(--ar);color:var(--ink);background:rgba(243,236,230,.05);border:1px solid var(--line);padding:8px 14px;cursor:pointer;transition:background .2s,border-color .2s}
button:hover{border-color:var(--org);background:rgba(239,106,60,.12)}
button.pri{background:var(--red);border-color:var(--red)}
button.pri:hover{background:#f04420}
button:disabled{opacity:.35;cursor:default}
.ft .sp{flex:1}
#tools{position:fixed;left:16px;top:80px;display:flex;flex-direction:column;gap:8px;z-index:4;width:250px}
.tool{background:var(--glass);border:1px solid var(--line);padding:10px 12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.tool label{display:flex;justify-content:space-between;font:500 12.5px var(--ar);color:var(--dim);margin-bottom:6px}
.tool input[type=range]{width:100%;accent-color:var(--red)}
.tog{display:flex;gap:6px}
.tog button{flex:1;padding:7px 8px;font-size:12px}
.tog button.on{border-color:var(--teal);color:var(--teal)}
#pcard{position:fixed;left:16px;top:212px;width:250px;background:var(--glass);border:1px solid var(--line);border-top:2px solid var(--org);padding:12px 14px;z-index:4;display:none;font:13px/1.6 var(--ar);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#pcard h4{margin:0 0 2px;font:700 15px var(--ar)}
#pcard .en{font:500 11px var(--mono);color:var(--dim);direction:ltr;text-align:right;margin-bottom:8px}
#pcard .row{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:5px 0}
#pcard .row span:first-child{color:var(--dim)}
#pcard .x{position:absolute;top:6px;left:8px;background:none;border:0;padding:2px 6px;color:var(--dim)}
#tip{position:fixed;pointer-events:none;z-index:6;font:500 12px var(--ar);background:#f3ece6;color:#180703;padding:4px 9px;display:none;white-space:nowrap}
table.bom{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0}
table.bom th{font:600 10.5px var(--mono);letter-spacing:.1em;color:var(--dim);text-align:start;padding:5px 6px;border-bottom:1px solid var(--line)}
table.bom td{padding:5px 6px;border-bottom:1px solid var(--faint);vertical-align:top}
table.bom td.n{font-family:var(--mono);direction:ltr;text-align:left;white-space:nowrap}
table.bom tr:hover td{background:rgba(243,236,230,.03);cursor:pointer}
table.bom tfoot td{font-weight:700;color:var(--org);border-top:1px solid var(--line)}
.soonbox{padding:18px 0 8px;color:var(--dim)}
.soonbox b{color:var(--ink)}

/* blueprint look — a clean drawing: flat paper, thin lines, few numbers */
#bpTitle{display:none}
body.bp{--bg:#0c3a68;--glass:rgba(9,45,82,.9);--line:rgba(234,244,255,.22);--faint:rgba(234,244,255,.05);--dim:rgba(234,244,255,.62)}
body.bp #sheet{background:
 linear-gradient(rgba(234,244,255,.07) 1px,transparent 1px) 0 0/100px 100px,
 linear-gradient(90deg,rgba(234,244,255,.07) 1px,transparent 1px) 0 0/100px 100px,
 linear-gradient(rgba(234,244,255,.028) 1px,transparent 1px) 0 0/20px 20px,
 linear-gradient(90deg,rgba(234,244,255,.028) 1px,transparent 1px) 0 0/20px 20px,#0c3a68;opacity:1}
body.bp header{background:#0c3a68}
body.bp .st.on{background:rgba(234,244,255,.08)}
body.bp #labels .lbl{display:none}
body.bp #bpTitle{display:flex;position:absolute;bottom:16px;left:572px;right:322px;justify-content:center;pointer-events:none;z-index:3;direction:ltr}
body.bp #bpTitle>*{flex:none;padding:5px 12px;border:1px solid rgba(234,244,255,.45);border-left-width:0;font:500 10px var(--mono);letter-spacing:.14em;color:rgba(234,244,255,.85);white-space:nowrap}
body.bp #bpTitle>*:first-child{border-left-width:1px}
body.bp #bpTitle span:nth-child(3){font:500 11.5px var(--ar);letter-spacing:0}
.dim{font:500 11px/1 var(--mono);color:#f2f8ff;background:#0c3a68;padding:1px 4px;white-space:nowrap;direction:ltr;letter-spacing:.02em}
.bpb{width:100%;border-color:rgba(79,179,176,.5)}
body.bp .bpb{background:#eaf4ff;color:#0c3a68;border-color:#eaf4ff}
.bpsizes h5{margin:14px 0 4px;font:700 13px var(--ar)}
.bpsizes h5 span{font:400 11.5px var(--ar);color:var(--dim);margin-inline-start:8px}
.bpsizes tr{cursor:pointer}
.mono{font-family:var(--mono);direction:ltr}
@media (max-width:860px){ body.bp #bpTitle{top:8px;bottom:auto;left:8px;right:8px} body.bp #bpTitle span:nth-child(4){display:none} }
#nogl{display:none;position:fixed;inset:0;place-items:center;text-align:center;z-index:9;padding:30px}
@media (max-width:860px){
 body{overflow:auto}
 header{height:56px;padding:0 12px}.brand .s{display:none}
 #stage{position:sticky;top:0;height:54svh;z-index:1}
 #wrap{position:relative;z-index:2;background:var(--bg)}
 #steps,#card,#tools,#pcard{position:static;width:auto;max-height:none;margin:10px 12px}
 #steps{height:auto}#list{display:flex;overflow-x:auto;padding:6px}
 .st{grid-template-columns:auto;min-width:118px;border-inline-start:0;border-bottom:3px solid transparent;gap:3px}
 .st.on{border-bottom-color:var(--red)}
 #log{max-height:none}
 #tools{flex-direction:row;flex-wrap:wrap}.tool{flex:1;min-width:150px}
 #pcard{margin-top:0}
 #card .bd{overflow:visible}
}
</style>

<body>
<div id="sheet"></div>
<header>
 <div class="brand"><svg viewBox="0 0 44 20"><path d="M0 0H44V20H8L0 12Z" fill="#e2300f"/></svg><span class="w">AROMA</span><span class="s">DOORMAN · BUILD SIM</span></div>
 <div class="live"><i></i><span>LIVE</span><span class="ar" id="liveTxt"></span></div>
</header>
<div id="stage"><canvas id="c"></canvas><div id="labels"></div><div id="bpTitle"></div></div>
<div id="wrap">
<div id="tools">
 <div class="tool" id="tExplode"><label><span>فكّ المجسم</span><span id="exV">0%</span></label><input type="range" dir="ltr" id="ex" min="0" max="100" value="0"></div>
 <div class="tool tog"><button id="bBP" class="bpb">📐 بلو برينت + المقاسات</button></div>
 <div class="tool tog"><button id="bX">شفاف</button><button id="bAlive" class="on">حيّ</button><button id="bSpin">لف</button></div>
 <div class="tool tog"><button id="bFold">ضم الإيدين</button><button id="bWave">سلّم</button></div>
</div>
<aside id="steps"><h3>BUILD STEPS · خطوات التجميع</h3><div id="list"></div><div id="log"></div></aside>
<section id="card"><div class="hd"><span class="num" id="cNum"></span><h2 id="cTitle"></h2></div><div class="bd" id="cBody"></div>
 <div class="ft"><button id="bPrev">→ السابق</button><button id="bOut">فكّ</button><button id="bIn" class="pri">ركّب</button><span class="sp"></span><button id="bNext">التالي ←</button></div></section>
<div id="pcard"><button class="x" id="pX">✕</button><div id="pBody"></div></div>
</div>
<div id="tip"></div>
<div id="nogl"><div><h2>المتصفح ده مش بيدعم 3D</h2><p>افتح الصفحة من كروم أو سفاري على جهاز أحدث.</p></div></div>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {CSS2DRenderer,CSS2DObject} from 'three/addons/renderers/CSS2DRenderer.js';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';

const $=s=>document.querySelector(s);
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ───────── live status (one line per upload) ───────── */
const LOG=[
 ['04:48','نزلت أول نسخة: الشكل النهائي للبوّاب + فكّ المجسم.'],
 ['04:59','رجّعت الشكل زي ماسكوت الهب بالظبط: الشاشة بحافة اللوجو 64×27، والإيدين مرايات بتتضم وتتفتح.'],
 ['05:18','نزلت كل القطع الداخلية بمقاساتها الحقيقية + خطوات ٠١ لـ ٠٤ (العدة، الطباعة والبوردات، القاعدة، سيرفو اللف).'],
 ['05:31','نزلت كل الخطوات من ٠٥ لـ ٢٠: البيرينج، العمود، الراس من جوه (الوش والكاميرا، السيرفوهات، الـ Pi، المايك، السماعة، الودان، الكهربا)، تركيب الراس، الغطا، الزجاج، الإيدين، أول تشغيل، والدماغ.'],
 ['10:21','نزل لوك «بلو برينت»: كل حاجة مرسومة خطوط على أزرق، ومقاسات كل قطعة بالمللي في كل خطوة، ولكل سلك طوله. والمقاس بقى ظاهر في كارت أي قطعة تدوس عليها.'],
 ['10:42','٣ تعديلات: (١) البلو برينت اتعمل من جديد: رسم خطوط نضيف، واجهة أمامية بخمس مقاسات، ومقاسات قطعة واحدة في كل مرة. (٢) الحتة المايلة: الشاسيه اتقص بميل اللوجو، وعمود الوش وبورد السيرفوهات دخلوا جوه، واختبار أوتوماتيك أكد إن صفر قطع طالعة برا القشرة. (٣) مفصل الميل بقى باين: مهد أسود فيه السيرفو + كوبري U ماسك الراس من الناحيتين + لفّة كابلات ورا الرقبة.'],

];

/* ───────── renderer / scene ───────── */
const canvas=$('#c');
let renderer;
try{ renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,powerPreference:'high-performance'}); }
catch(e){ $('#nogl').style.display='grid'; throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.0;
const scene=new THREE.Scene();
const pm=new THREE.PMREMGenerator(renderer);
scene.environment=pm.fromScene(new RoomEnvironment(renderer),0.04).texture;
scene.add(new THREE.HemisphereLight(0xfff0e0,0x1a0c08,.35));
const key=new THREE.DirectionalLight(0xffe2c8,1.5); key.position.set(500,800,700); scene.add(key);
const rim=new THREE.DirectionalLight(0x4fb3b0,1.6); rim.position.set(-700,300,-600); scene.add(rim);
const camera=new THREE.PerspectiveCamera(30,1,5,60000);
camera.position.set(700,470,1060);
const controls=new OrbitControls(camera,canvas);
controls.enableDamping=true; controls.dampingFactor=.08; controls.target.set(0,200,0);
controls.minDistance=120; controls.maxDistance=30000; controls.maxPolarAngle=Math.PI*.95;
const labelR=new CSS2DRenderer({element:$('#labels')});

/* ───────── materials ───────── */
const MAT={
 red:()=>new THREE.MeshPhysicalMaterial({color:0xe2300f,roughness:.34,clearcoat:.8,clearcoatRoughness:.2}),
 black:()=>new THREE.MeshStandardMaterial({color:0x1b1918,roughness:.68,metalness:.05}),
 dark:()=>new THREE.MeshPhysicalMaterial({color:0x1d1816,roughness:.38,metalness:.5,clearcoat:.6}),
 grey:()=>new THREE.MeshStandardMaterial({color:0x6b6661,roughness:.72}),
 teal:()=>new THREE.MeshPhysicalMaterial({color:0x4fb3b0,emissive:0x2c9893,emissiveIntensity:.9,roughness:.3}),
 pcbG:()=>new THREE.MeshStandardMaterial({color:0x17633a,roughness:.45,metalness:.1}),
 pcbK:()=>new THREE.MeshStandardMaterial({color:0x121316,roughness:.45,metalness:.15}),
 pcbB:()=>new THREE.MeshStandardMaterial({color:0x1f3f7a,roughness:.45,metalness:.1}),
 chip:()=>new THREE.MeshStandardMaterial({color:0x0d0d0f,roughness:.35,metalness:.3}),
 metal:()=>new THREE.MeshStandardMaterial({color:0xd0d2d6,roughness:.28,metalness:1}),
 alu:()=>new THREE.MeshStandardMaterial({color:0x9aa0a8,roughness:.4,metalness:.9}),
 steel:()=>new THREE.MeshStandardMaterial({color:0x6f7378,roughness:.45,metalness:.85}),
 gold:()=>new THREE.MeshStandardMaterial({color:0xd8ad55,roughness:.3,metalness:1}),
 plastic:()=>new THREE.MeshStandardMaterial({color:0x111112,roughness:.55}),
 white:()=>new THREE.MeshStandardMaterial({color:0xe9e6e0,roughness:.5}),
 rubber:()=>new THREE.MeshStandardMaterial({color:0x2a2a2a,roughness:.95}),
 clear:()=>new THREE.MeshPhysicalMaterial({color:0xeaf6f6,roughness:.04,metalness:0,clearcoat:1,transparent:true,opacity:.22,depthWrite:false,side:THREE.DoubleSide}),
 gloss:()=>new THREE.MeshPhysicalMaterial({color:0x000000,roughness:.06,clearcoat:1,clearcoatRoughness:.05,transparent:true,opacity:.16,depthWrite:false}),
 smoke:()=>new THREE.MeshPhysicalMaterial({color:0x0a0807,roughness:.05,clearcoat:1,transparent:true,opacity:.5,depthWrite:false}),
 wire:c=>new THREE.MeshStandardMaterial({color:c,roughness:.5}),
};

/* ───────── geometry helpers (mm) ───────── */
const mesh=(g,m)=>new THREE.Mesh(g,m);
const box=(w,h,d,m,r)=>{ const g=r?new RoundedBoxGeometry(w,h,d,3,Math.min(r,w/2-.01,h/2-.01,d/2-.01)):new THREE.BoxGeometry(w,h,d); g.userData.box=[w,h,d]; return mesh(g,m); };
const cyl=(r,h,m,seg=48,r2)=>mesh(new THREE.CylinderGeometry(r,r2??r,h,seg),m);
const at=(o,x,y,z)=>{ o.position.set(x,y,z); return o; };
const rx=(o,a)=>{ o.rotation.x=a; return o; };
function ringGeo(ro,ri,h,seg=72){ const s=new THREE.Shape(); s.absarc(0,0,ro,0,Math.PI*2,false); if(ri>0){ const p=new THREE.Path(); p.absarc(0,0,ri,0,Math.PI*2,true); s.holes.push(p); }
 const g=new THREE.ExtrudeGeometry(s,{depth:h,bevelEnabled:false,curveSegments:seg}); g.rotateX(-Math.PI/2); g.translate(0,-h/2,0); g.userData.cyl={r:ro,h}; return g; }
function discHoles(ro,holes,h){ const s=new THREE.Shape(); s.absarc(0,0,ro,0,Math.PI*2,false); holes.forEach(([x,z,r])=>{ const p=new THREE.Path(); p.absarc(x,-z,r,0,Math.PI*2,true); s.holes.push(p); });
 const g=new THREE.ExtrudeGeometry(s,{depth:h,bevelEnabled:false,curveSegments:64}); g.rotateX(-Math.PI/2); g.translate(0,-h/2,0); g.userData.cyl={r:ro,h}; return g; }
const shapeOf=pts=>{ const s=new THREE.Shape(); pts.forEach((p,i)=>i?s.lineTo(p[0],p[1]):s.moveTo(p[0],p[1])); s.closePath(); return s; };
const pathOf=pts=>{ const s=new THREE.Path(); pts.forEach((p,i)=>i?s.lineTo(p[0],p[1]):s.moveTo(p[0],p[1])); s.closePath(); return s; };
function offsetPoly(pts,d){ const n=pts.length; let a=0; for(let i=0;i<n;i++){const p=pts[i],q=pts[(i+1)%n]; a+=p[0]*q[1]-q[0]*p[1];}
 const s=a>0?1:-1, L=[];
 for(let i=0;i<n;i++){ const p=pts[i],q=pts[(i+1)%n], dx=q[0]-p[0], dy=q[1]-p[1], l=Math.hypot(dx,dy), nx=s*dy/l, ny=-s*dx/l; L.push([p[0]+nx*d,p[1]+ny*d,dx,dy]); }

function mirrorHand(side){ return ()=>{
 const pivot=new THREE.Group();
 pivot.add(at(cyl(4.5,10,MAT.dark(),24),0,0,0));                                           // hinge hub on the motor shaft
 pivot.add(at(box(6,8,12,MAT.dark(),1.5),0,0,6));                                          // arm forward out of the ear

 const tile=new THREE.Group(); tile.position.set(side*HOFF[0],HOFF[1],HOFF[2]); pivot.add(tile);
 const pts=rect(2*HS,2*HS);
 const tg=new THREE.ExtrudeGeometry(shapeOf(pts),{depth:HDP,bevelEnabled:true,bevelThickness:HBV,bevelSize:HBV,bevelSegments:3,curveSegments:2}); tg.translate(0,0,-HDP/2);
 tile.add(mesh(tg,MAT.red()));
 const K=.84, sg=new THREE.ShapeGeometry(shapeOf(pts.map(p=>[p[0]*K,p[1]*K])));
 const L=side<0?HANDL:HANDR; tile.add(at(mesh(sg,ledMat(L,[1/(2*HS*K),1/(2*HS*K)],[.5,.5])),0,0,HDP/2+HBV+.3));

 HAND[side<0?'l':'r']={pivot,tile}; return pivot; }; }

<tfoot><tr><td>الإجمالي التقريبي</td><td></td><td class="n">${fmt(BOMLO)}–${fmt(BOMHI)}</td><td></td></tr></tfoot></table>`;

<tfoot><tr><td>المجموع</td><td></td><td class="n">≈ ${PRINTS.reduce((a,p)=>a+p.g,0)}</td><td class="n">≈ ${Math.round(PRINTS.reduce((a,p)=>a+p.h,0))}</td></tr></tfoot></table>`;

 {n:'00',t:'الشكل النهائي',ok:true,body:()=>`<div class="meta"><span>📏 الطول ≈ ٣٥ سم</span><span>↔️ الراس ٢٥٫٤ سم · الإيدين مفتوحة ≈ ٤٤ سم</span><span>⚖️ ≈ ١٫٥ كجم</span></div>
<ul><li>ده "البوّاب" بنفس شكل ماسكوت الهب بالظبط: بلوك اللوجو بالحتة المقطوعة، الودان، والأنتينا التيل.</li>

<li><b>الإيدين شاشتين 18×18 على مفصلة بموتور جوه الودن:</b> بيتضمّوا على جنب الراس ويتفتحوا زي مرايات العربية. جرّب زرار "ضم الإيدين" و"سلّم".</li>

<li>اسحب <b>فكّ المجسم</b>، أو دوس على أي قطعة عشان تعرف هي إيه.</li></ul>`},
 {n:'01',t:'العدة: كل القطع',ok:true,body:()=>`${meta('طلب القطع: ١–٣ أسابيع (البوردات وAliExpress أبطأ حاجة)')}
<p>كل القطع متفرّشة قدامك: <b>اللي بيتطبع ورا</b> و<b>اللي بيتشري قدام</b>. دوس على أي سطر في الجدول عشان القطعة تنوّر.</p>
${bomTable()}
<div class="warn">💡 الأسعار تقريبية بالدرهم، وهنثبّتها وقت الشراء لأن أسعار الـ Pi زادت كذا مرة السنة دي. أنا بجهّزلك لينكات الشراء، وانت بس بتدفع.</div>
<p>🧰 <b>العدة اللي هتحتاجها:</b> مفك صليبة صغير، مفاتيح ألن M2/M2.5/M3، كاوية عادية عشان الصواميل الحرارية (مش لحام إلكترونيات)، قطّاعة سلك، رباطات بلاستيك.</p>`},
 {n:'02',t:'التصنيع: طباعة 3D + بوردات LED',ok:true,body:()=>`${meta('طباعة ≈ ٤٠ ساعة على Bambu A1 · البوردات ≈ ١٠ أيام لحد ما توصل')}
<p><b>🖨️ الطباعة:</b> الجدول ده كل اللي بيتطبع. الملفات (STL/3MF) أنا بطلّعها بالمقاسات المظبوطة.</p>
${printTable()}
<ul><li>القشرة مقاسها ٢٥٣٫٨ مم، يعني <b>داخلة في سرير ٢٥٦ بالعافية</b>. بتتطبع ضهرها على السرير ووشها لفوق (Ironing عشان الوش ييجي ناعم). لو السرير مش مظبوط هقسمهالك نصّين بتعشيق.</li>
<li>القاعدة والرقبة PETG عشان شايلين الوزن، والباقي PLA. الإعدادات: طبقة 0.2، ٣ جدران، Infill ‏15–20% Gyroid.</li>
<li>الأحمر: أقرب فتلة لـ <b>#E2300F</b>. هنطبع عينة مكعب الأول ونقارنها باللوجو.</li></ul>
<p><b>🟥 بوردات الـ LED (من JLCPCB):</b></p>
<ul><li><b>بوردة الوش:</b> 64×27 لمبة WS2812B-2020 بخطوة ٣٫٥ مم، مقصوصة بشكل اللوجو بالحافة المقطوعة. فيها خرم Ø8 للكاميرا بين البكسلات، فوق في النص بين كلمة HELLO والساعة.</li>
<li><b>بوردتين للإيدين:</b> 18×18 لمبة لكل إيد، بنفس شبكة إيدين الهب.</li>
<li>أنا بعمل ملفات الـ PCB كاملة (Gerber + BOM + أماكن اللمبات)، وانت بترفعهم على JLCPCB وتختار "PCB Assembly". بيوصلوا متركّب عليهم كل اللمبات.</li></ul>
<div class="warn">⚡ الوش فيه ≈ ١٧٠٠ لمبة. لو اتشغّلوا كلهم أبيض على الآخر هيسحبوا كهربا كتير جدًا، فالسوفتوير بتاعي بيحدّد السطوع (أقصى ٣ أمبير). متغيّرش الحد ده.</div>`},
 {n:'03',t:'القاعدة: الأرجل والأوزان والكهربا',ok:true,view:[.9,1.05,1.25],pad:1.7,body:()=>`${meta('١٥ دقيقة','مفك + غراء سيليكون')}
${chips(['base_shell','feet','weights','dc_jack','w_jack'])}
<ul><li>لزّق <b>٤ رجول الكاوتش</b> تحت القاعدة في الدواير المحفورة.</li>
<li>حط <b>الـ ٤ أوزان الحديد</b> في أماكنهم جوه وثبّتهم بنقطة سيليكون. دول اللي بيمنعوا الروبوت إنه يقع لما الراس تلف بسرعة.</li>
<li>دخّل <b>جاك الكهربا</b> في الخرم اللي ورا واربط الصامولة من جوه.</li>
<li>وصّل سلكين الكهربا: <b>الأحمر على +</b> و<b>الأسود على −</b>، وسيبهم طوال ٤٠ سم لأنهم طالعين لحد الراس.</li></ul>
<div class="warn">⚠️ قبل ما تكمّل: قيس الجاك بالشاحن والملتيميتر. لازم يطلع 5V بالظبط، وعلامته تبقى صح (+ في النص).</div>`},
 {n:'04',t:'سيرفو اللف + غطا القاعدة',ok:true,xray:true,main:'pan_servo',view:[.85,1.15,1.15],pad:1.7,body:()=>`${meta('٢٠ دقيقة','مفك M2.5 + اللابتوب')}

<li>اربط السيرفو في العمودين اللي تحت الغطا بمسمارين M2.5، والشافت يبقى طالع من الخرم اللي في النص بالظبط.</li>

 {n:'05',t:'البيرينج + الطبق الدوّار',ok:true,xray:true,view:[1,1,1.3],pad:1.6,body:()=>`${meta('١٥ دقيقة','مفك M3 + M2.5')}
${chips(['bearing','turntable'])}

 {n:'06',t:'العمود الشفاف + مهد سيرفو الميل',ok:true,xray:true,main:'neck',view:[1.1,.45,1.3],pad:1.5,body:()=>`${meta('٢٥ دقيقة','مفك M2.5 + M4 + غراء UV')}

 {n:'10',t:'Raspberry Pi 5 + التبريد',ok:true,xray:true,view:[.9,.45,-1.4],pad:1.35,frame:['head_shell'],body:()=>`${meta('١٥ دقيقة','مفك M2.5')}

function kitLayout(list,z0,maxW){ const out=new Map(); let x=0,z=z0,rowD=0,row=[]; const gap=26;

  if(x+w>maxW&&row.length) flush(); row.push({p,w,d}); x+=w+gap; rowD=Math.max(rowD,d); });

   const c=g.type==='CylinderGeometry'?{rt:g.parameters.radiusTop,rb:g.parameters.radiusBottom,h:g.parameters.height}:g.userData.cyl?{rt:g.userData.cyl.r,rb:g.userData.cyl.r,h:g.userData.cyl.h}:null;
   if(c&&c.h>.8){ const s=new THREE.LineSegments(new THREE.BufferGeometry().setAttribute('position',new THREE.Float32BufferAttribute(new Float32Array(12),3)),lm); s.userData.bpOnly=true; s.visible=false; s.frustumCulled=false; s.raycast=()=>{}; m.add(s); p.bpEdges.push(s); SIL.push({m,s,...c}); } });
 }); }

function updateSil(){ for(const q of SIL){ if(!q.s.visible) continue; let vis=true; q.m.traverseAncestors(a=>{ if(!a.visible) vis=false; }); if(!vis) continue;
 q.m.worldToLocal(_c.copy(camera.position)); const rho=Math.hypot(_c.x,_c.z), r=Math.max(q.rt,q.rb); if(rho<=r) continue;
 const phi=Math.atan2(_c.z,_c.x), a=Math.acos(Math.min(1,r/rho)), P=q.s.geometry.attributes.position.array, h=q.h/2;
 [phi+a,phi-a].forEach((t,i)=>{ const c=Math.cos(t), s=Math.sin(t), k=i*6; P[k]=q.rb*c; P[k+1]=-h; P[k+2]=q.rb*s; P[k+3]=q.rt*c; P[k+4]=h; P[k+5]=q.rt*s; });
 q.s.geometry.attributes.position.needsUpdate=true; } }
/* a dimension, drawing-office style: gap, extension lines, arrows, the number breaking the line */

function dimension(a,b,off,label,parent){
 const g=new THREE.Group(), dir=b.clone().sub(a), L=dir.length(); g.userData.labels=[]; if(L<2){ parent.add(g); return g; } dir.normalize();

 const pts=[a.clone().add(gap),a2.clone().add(over), b.clone().add(gap),b2.clone().add(over), a2,b2,
  a2,a2.clone().addScaledVector(dir,ah).addScaledVector(on,aw), a2,a2.clone().addScaledVector(dir,ah).addScaledVector(on,-aw),
  b2,b2.clone().addScaledVector(dir,-ah).addScaledVector(on,aw), b2,b2.clone().addScaledVector(dir,-ah).addScaledVector(on,-aw)];
 const ls=new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts),DIMM); ls.renderOrder=20; ls.raycast=()=>{}; g.add(ls);
 const d=document.createElement('div'); d.className='dim'; d.textContent=label; const c=new CSS2DObject(d); c.position.copy(a2).add(b2).multiplyScalar(.5); g.add(c); g.userData.labels.push(c);

 if(mode==='overview') frameOverview(900); else if(lastFrame) frameCam(...lastFrame);
 renderCard(); applyLook(); }

function frameCam(list,dir,pad=1.18,dur=1100,which='both'){ lastFrame=[list,dir,pad,dur,which];
 const bb=new THREE.Box3(); root.updateMatrixWorld(true);
 list.forEach(p=>{ const keep=p.o.position.clone(); (which==='kit'?[p.kitTarget]:which==='home'?[p.home]:[p.home,exPos(p)]).forEach(v=>{ if(!v) return; p.o.position.copy(v); p.o.updateMatrixWorld(true); bb.expandByObject(p.o); }); p.o.position.copy(keep); p.o.updateMatrixWorld(true); });
 if(bb.isEmpty()) return; const s=bb.getBoundingSphere(new THREE.Sphere());
 const d=new THREE.Vector3(...(dir||[1,.55,1.4])).normalize(), dist=Math.max(260,s.radius*pad/Math.sin(THREE.MathUtils.degToRad(camera.fov/2))*(camera.aspect<1?1.5:1));
 camTw={p0:camera.position.clone(),t0:controls.target.clone(),p1:s.center.clone().addScaledVector(d,dist),t1:s.center.clone(),s:performance.now(),dur}; }
let camTw=null;
function setVisibleUpTo(k){ LIST.forEach(p=>{ p.o.visible=!p.kitOnly&&p.step<=k; }); }
function go(i){ _go(i); applyLook(); }
function cardParts(){ if(cur===1) return LIST.filter(p=>p.kind!=='cable'); if(cur===2) return LIST.filter(p=>p.kind==='print'); if(cur===0||cur===20) return LIST.filter(p=>!p.kitOnly&&p.kind!=='cable'); return stepParts(cur); }
function renderCard(){ const S=STEPS[cur];
 $('#cBody').innerHTML=S.ok?S.body()+(BP&&cardParts().length?sizesTable(cardParts()):''):`<div class="soonbox">🛠️ <b>الخطوة دي قيد التجهيز.</b><br>بتتعمل دلوقتي وهتنزل هنا لايف أول ما تخلص — اعمل ريفرش كل شوية.</div>`;
 document.querySelectorAll('#cBody [data-p]').forEach(el=>el.onclick=()=>{ const p=PARTS[el.dataset.p]; if(p){ showPart(p); flash(p); } });
 document.querySelectorAll('#cBody [data-sel]').forEach(el=>el.onclick=()=>{ const p=PARTS[el.dataset.sel]; if(p){ SEL=p; showPart(p); refreshDims(); } }); }
function _go(i){ cur=Math.max(0,Math.min(STEPS.length-1,i)); const S=STEPS[cur]; if(ALLOK) S.ok=true; renderList(); clearLabels();
 $('#cNum').textContent=S.n; $('#cTitle').textContent=S.t;
 SEL=null; renderCard();
 $('#bPrev').disabled=cur===0; $('#bNext').disabled=cur===STEPS.length-1;
 const build=S.ok&&cur>=3&&cur<=18; $('#bIn').disabled=$('#bOut').disabled=!build;
 $('#tExplode').style.display=cur===0?'':'none';
 const el=document.querySelector('.st.on'); if(el) el.scrollIntoView({block:'nearest',inline:'nearest'});
 bootT=-1; LIST.forEach(p=>{ p.tw=null; p.kitTarget=null; }); if(cur>0){ panG.rotation.y=0; tiltG.rotation.x=0; }
 if(!S.ok){ return; }
 if(cur===0||cur===20){ mode='overview'; LEDS_ON=true; benchTw=null; BENCH=BENCH_TO=0; tiltG.position.y=TILT_Y; setVisibleUpTo(99); LIST.forEach(p=>{ p.cur.copy(p.home); }); setXray(XRAY_USER); FOLD_TO=0; frameOverview(1100); return; }
 if(cur===1||cur===2){ mode='kit'; LEDS_ON=true; benchTw=null; BENCH=BENCH_TO=0; tiltG.position.y=TILT_Y; setXray(false); FOLD_TO=0; foldV=0;
  const list=LIST.filter(p=>p.kind!=='cable'&&(cur===1||p.kind==='print')); const T=kitTargets(list);
  LIST.forEach(p=>{ p.o.visible=list.includes(p); });
  list.forEach((p,i)=>{ p.kitTarget=T.get(p); moveTo(p,p.kitTarget,120+i*25,1000); });
  frameCam(list,[0,1.25,1],BP?1.25:.95,1300,'kit'); return; }
 mode='build'; LEDS_ON=cur>=19; setVisibleUpTo(cur);
 benchTw=null; BENCH_TO=(cur>=7&&cur<=15)?190:0; BENCH=BENCH_TO; tiltG.position.y=TILT_Y+BENCH;
 setXray(XRAY_USER||!!S.xray); FOLD_TO=cur>=18&&cur!==18?0:1; if(cur===18) FOLD_TO=1;
 LIST.forEach(p=>{ if(p.step<cur){ p.cur.copy(p.home); } });
 const sp=stepParts(cur); sp.forEach((p,i)=>{ p.cur.copy(exPos(p)); addLabel(p,i); });
 if(cur===19){ bootT=performance.now(); }
 setTimeout(()=>{ if(STEPS[cur]===S) assemble(); },650);
 frameCam(S.frame?S.frame.map(id=>PARTS[id]):(sp.length?sp:LIST.filter(p=>!p.kitOnly&&p.kind!=='cable')),S.view,S.pad||1.15,1100,S.frame||!sp.length?'home':'both');
}
function benchTo(v,delay=0,dur=1600){ benchTw={from:BENCH,to:v,t0:performance.now()+delay,dur}; BENCH_TO=v; }
function assemble(){ const sp=stepParts(cur); sp.forEach((p,i)=>moveTo(p,p.home,i*260,950)); if(cur===15) benchTo(0,sp.length*260+300); if(cur===18) setTimeout(()=>{ if(cur===18) FOLD_TO=0; },sp.length*260+1000); }
function disassemble(){ const sp=stepParts(cur); sp.slice().reverse().forEach((p,i)=>moveTo(p,exPos(p),i*200,850)); if(cur===15) benchTo(190); if(cur===18) FOLD_TO=1; }
$('#bIn').onclick=assemble; $('#bOut').onclick=disassemble;
function flash(p){ const t0=performance.now(); p.o.traverse(m=>{ if(m.isMesh&&m.material.emissive&&!m.material.emissiveMap){ m.userData.e0=m.userData.e0??m.material.emissive.getHex(); } }); p.flash=t0; }

/* ───────── list + log ───────── */
const ready=STEPS.filter(s=>s.ok).length;
$('#liveTxt').textContent='جاهز '+ready+' من '+STEPS.length+' · آخر تحديث '+LOG[LOG.length-1][0];
$('#log').innerHTML=LOG.slice().reverse().map(l=>'<div><b>'+l[0]+'</b>'+l[1]+'</div>').join('');
function renderList(){ $('#list').innerHTML=STEPS.map((s,i)=>`<div class="st ${s.ok?'ok':'soon'} ${i===cur?'on':''}" data-i="${i}"><span class="n">${s.n}</span><span class="t">${s.t}</span><span class="p">${s.ok?'جاهز':'قيد التجهيز'}</span></div>`).join('');
 document.querySelectorAll('.st').forEach(el=>el.onclick=()=>go(+el.dataset.i)); }
$('#bPrev').onclick=()=>go(cur-1); $('#bNext').onclick=()=>go(cur+1);
addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT') return; if(e.key==='ArrowLeft') go(cur+1); if(e.key==='ArrowRight') go(cur-1); });

/* ───────── tools ───────── */
$('#ex').oninput=e=>{ const was=EXP>.05; EXP=e.target.value/100; $('#exV').textContent=e.target.value+'%'; if(BP&&was!==(EXP>.05)) refreshDims(); };
$('#bBP').onclick=()=>setBlueprint(!BP);
const bAlive=$('#bAlive'); bAlive.classList.toggle('on',ALIVE);
$('#bX').onclick=e=>{ XRAY_USER=!XRAY_USER; e.target.classList.toggle('on',XRAY_USER); setXray(XRAY_USER||!!(STEPS[cur].xray&&mode==='build')); };
bAlive.onclick=e=>{ ALIVE=!ALIVE; e.target.classList.toggle('on',ALIVE); };
$('#bSpin').onclick=e=>{ controls.autoRotate=!controls.autoRotate; e.target.classList.toggle('on',controls.autoRotate); };
controls.autoRotateSpeed=1.2;
let FOLD_TO=1, foldV=1, wave=0;
const bFold=$('#bFold');
bFold.onclick=()=>{ FOLD_TO=FOLD_TO>.5?0:1; bFold.textContent=FOLD_TO>.5?'افتح الإيدين':'ضم الإيدين'; bFold.classList.toggle('on',FOLD_TO>.5); };
$('#bWave').onclick=()=>{ FOLD_TO=0; bFold.textContent='ضم الإيدين'; bFold.classList.remove('on'); wave=2.4; mood='happy'; moodUntil=clock.elapsedTime+2.6; hands('open','#ffe6cf','heart','#ff5a7a'); };

/* ───────── picking ───────── */
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2(); const mouse={x:0,y:0,in:false};
function visibleDeep(m){ let v=true; m.traverseAncestors(a=>{ if(!a.visible) v=false; }); return v&&m.visible; }
function pick(e){ const r=canvas.getBoundingClientRect(); ndc.set(((e.clientX-r.left)/r.width)*2-1,-((e.clientY-r.top)/r.height)*2+1); ray.setFromCamera(ndc,camera);
 const hits=ray.intersectObjects(pickables.filter(visibleDeep),false); const h=hits.find(h=>!(XRAYED.includes(h.object.userData.pid)&&h.object.material.opacity<.5))||hits[0]; return h?PARTS[h.object.userData.pid]:null; }
const tip=$('#tip');
canvas.addEventListener('pointermove',e=>{ const r=canvas.getBoundingClientRect(); mouse.x=((e.clientX-r.left)/r.width)*2-1; mouse.y=-((e.clientY-r.top)/r.height)*2+1; mouse.in=true;
 if(e.pointerType==='mouse'&&!e.buttons){ const p=pick(e); if(p){ tip.style.display='block'; tip.textContent=p.ar; tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY+12)+'px'; canvas.style.cursor='pointer'; } else { tip.style.display='none'; canvas.style.cursor=''; } } });
canvas.addEventListener('pointerleave',()=>{ mouse.in=false; tip.style.display='none'; });
let downAt=null; canvas.addEventListener('pointerdown',e=>downAt=[e.clientX,e.clientY]);
canvas.addEventListener('pointerup',e=>{ if(!downAt||Math.hypot(e.clientX-downAt[0],e.clientY-downAt[1])>5) return; const p=pick(e); if(p){ showPart(p); flash(p); } if(BP){ SEL=p&&p.kind!=='cable'?p:null; refreshDims(); } });
const KIND={buy:'🛒 بتتشري',print:'🖨️ بتتطبع 3D',cable:'🔌 سلك / كابل'};
function showPart(p){ const b=BOM.find(x=>x[4]===p.id), S=STEPS[p.step];
 $('#pBody').innerHTML=`<h4>${p.ar}</h4><div class="en">${p.en}</div>
 <div class="row"><span>النوع</span><span>${KIND[p.kind]}</span></div>
 <div class="row"><span>${p.kind==='cable'?'الطول':'المقاس'}</span><span class="mono">${sizeTxt(p)}</span></div>
 ${p.mat?`<div class="row"><span>الطباعة</span><span>${p.mat} · ${p.g} جم · ${p.h} س</span></div>`:''}
 ${b?`<div class="row"><span>السعر</span><span>${fmt(b[2][0])}–${fmt(b[2][1])} درهم</span></div><div class="row"><span>منين</span><span>${b[3]}</span></div>`:''}
 <div class="row"><span>الخطوة</span><span>${S?S.n+' · '+S.t:'—'}</span></div>`; $('#pcard').style.display='block'; }
$('#pX').onclick=()=>$('#pcard').style.display='none';

/* ───────── loop ───────── */
function resize(){ const s=$('#stage'), w=s.clientWidth, h=s.clientHeight; renderer.setSize(w,h,false); labelR.setSize(w,h); camera.aspect=w/h; camera.updateProjectionMatrix();
 const wide=w>860; camera.setViewOffset(w,h,wide?-Math.round(w*.03):0,wide?Math.round(h*.13):0,w,h); }
addEventListener('resize',resize); resize();
let blink=0, nextBlink=2, mood='idle', moodUntil=0;
const clock=new THREE.Clock();
hands('open','#ffe6cf');
for(const id in PARTS){ PARTS[id].cur.copy(PARTS[id].home); }
setTimeout(()=>{ if(cur===0) FOLD_TO=0; },900);
function frame(){
 const dt=Math.min(clock.getDelta(),.05), t=clock.elapsedTime, now=performance.now();
 // parts: tweens, or the explode slider on the overview
 for(const p of LIST){
  if(p.tw){ const k=Math.min(1,Math.max(0,(now-p.tw.t0)/p.tw.dur)); p.cur.lerpVectors(p.tw.from,p.tw.to,ease(k)); if(k>=1) p.tw=null; }
  p.o.position.copy(p.cur); if(mode==='overview'&&!p.tw) p.o.position.addScaledVector(p.ex,EXP*.9);
  if(p.flash){ const k=(now-p.flash)/1400; p.o.traverse(m=>{ if(m.isMesh&&m.userData.e0!=null&&m.material.emissive) m.material.emissive.setHex(k<1&&Math.floor(k*6)%2===0?0x8a2a10:m.userData.e0); }); if(k>=1) p.flash=0; }
 }
 // the head waits on the bench above the neck while it is being built
 if(benchTw){ const k=Math.min(1,Math.max(0,(now-benchTw.t0)/benchTw.dur)); BENCH=benchTw.from+(benchTw.to-benchTw.from)*ease(k); if(k>=1) benchTw=null; } tiltG.position.y=TILT_Y+BENCH;
 // mirror hands
 foldV+=(FOLD_TO-foldV)*Math.min(1,dt*3.2); let f=foldV;
 if(wave>0){ wave-=dt; f=Math.max(0,.18+.16*Math.sin(t*9)); if(wave<=0) hands('open','#ffe6cf'); }
 HAND.r.pivot.rotation.y=f*Math.PI/2; HAND.l.pivot.rotation.y=-(wave>0?Math.max(0,foldV):f)*Math.PI/2;
 // face
 let lx=0, ly=0, pan=0, tilt=0, faceMood='idle', word='';
 const live=mode==='overview'&&ALIVE;
 if(live){ const tx=mouse.in?mouse.x:Math.sin(t*.4)*.6, ty=mouse.in?mouse.y:Math.sin(t*.3)*.3;
  lx=Math.max(-2,Math.min(2,Math.round(tx*2.4))); ly=Math.max(-1,Math.min(1,Math.round(-ty*1.6)));
  pan=tx*.45; tilt=-ty*.12;
  nextBlink-=dt; if(nextBlink<0){ blink=.12; nextBlink=2.5+Math.random()*3; } if(blink>0) blink-=dt;
  if(t>moodUntil&&wave<=0){ const r=Math.random(); mood=r<.25?'talk':r<.45?'happy':'idle'; moodUntil=t+2.5+Math.random()*2.5;
   if(FOLD_TO>.5) hands('z','#7fa9d6'); else if(mood==='happy') hands('thumb','#9ff5d0','heart','#ff5a7a'); else hands('open','#ffe6cf'); }
  faceMood=FOLD_TO>.5&&wave<=0?'sleepy':mood; }
 if(bootT>0){ const s=(now-bootT)/1000;                                                   // step 19: first power-on
  if(s<1.2){ faceMood='off'; hands('off','#000'); } else if(s<4){ faceMood='boot'; } else { faceMood=s<6.5?'happy':'idle'; hands(s<6.5?'thumb':'open',s<6.5?'#9ff5d0':'#ffe6cf',s<6.5?'heart':'open',s<6.5?'#ff5a7a':'#ffe6cf'); }
  if(s>4&&s<9){ pan=Math.sin((s-4)*2.2)*.5; tilt=Math.sin((s-4)*3.1)*.15; }
  if(s>4.6&&s<5.2) FOLD_TO=0; }
 else if(!LEDS_ON&&mode==='build'){ faceMood='off'; hands('off','#000'); }
 else if(!live&&mode!=='overview'){ hands('open','#ffe6cf'); }
 if(BP&&bootT<0){ pan=0; tilt=0; }
 if(BP) updateSil();
 panG.rotation.y+=(pan-panG.rotation.y)*.06; tiltG.rotation.x+=(tilt-tiltG.rotation.x)*.06;
 drawFace(faceMood,lx,ly,blink>0?1:0,Math.floor(t*(bootT>0?9:4)),(Math.sin(t*.25)+1)/2,word);
 PARTS.antenna.o.children[1].material.emissiveIntensity=(LEDS_ON||bootT>0)?(.7+.5*Math.max(0,Math.sin(t*3))*(faceMood==='talk'?1:0)):.05;
 if(camTw){ const k=Math.min(1,(now-camTw.s)/camTw.dur), e=ease(k); camera.position.lerpVectors(camTw.p0,camTw.p1,e); controls.target.lerpVectors(camTw.t0,camTw.t1,e); if(k>=1) camTw=null; }
 controls.update(); renderer.render(scene,camera); labelR.render(scene,camera);
 requestAnimationFrame(frame);
}
window.__dbg={THREE,LIST,panG,HEAD,HD,HB,HZ,HCY,TILT_Y,offsetPoly,HAND,camera,controls,PARTS,go,tiltG,get bench(){return [BENCH,BENCH_TO,benchTw];}};
renderList(); go(0); frame();
let startBP=/look=blue/.test(location.search); try{ startBP=startBP||localStorage.getItem('aroma-robot-look')==='bp'; }catch(e){}
if(startBP) setBlueprint(true);
</script>
</body>
